# GitHub Pages (Jekyll) serves only the public portal.
# Source code for the admin, tooling, tests and docs stay in the repo but are
# not published to the website.
exclude:
  - apps-script
  - tools
  - tests
  - docs
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - node_modules
  - worker
  # «خبزنا اليومي» P3: P2's registry (the D1 seed) has the owner's file names and research notes; the site reads
  # daily-bread/data/saints.json (published from the admin) instead
  - daily-bread/saints
