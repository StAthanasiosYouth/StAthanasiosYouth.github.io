<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة لوحة التحكم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: the preview chrome is a thin dashed strip; under it, the admin app in a device frame
   (auto / phone / tablet / desktop). The app lays itself out by its own width (container queries),
   so the phone frame on a computer behaves exactly like a real phone. */
:root {
  --pv-bg: #e7ebf1;
  --pv-fg: #0b1a2e;
  --pv-mute: #56667d;
  --pv-line: rgba(11, 26, 46, .16);
  --pv-chip: #ffffff;
  --pv-acc: #855b10;
  --f-ui: "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  --f-display: "Aref Ruqaa", "Cairo", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pv-bg: #010409; --pv-fg: #dfe6f0; --pv-mute: #8b9ab0; --pv-line: rgba(255, 255, 255, .12); --pv-chip: #0a1422; --pv-acc: #e2bc6c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pv-bg: #010409; --pv-fg: #dfe6f0; --pv-mute: #8b9ab0; --pv-line: rgba(255, 255, 255, .12); --pv-chip: #0a1422; --pv-acc: #e2bc6c;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--pv-bg); color: var(--pv-fg); font-family: var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-text, var(--pv-acc)); outline-offset: 2px; }

/* ---------- preview chrome (not part of the design) ---------- */
.stage { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.pvbar {
  display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none;
  padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px dashed var(--pv-line); font-size: 13px; white-space: nowrap;
}
.pvbar::-webkit-scrollbar { display: none; }
.pvbar__tag { font-weight: 800; color: var(--pv-acc); display: inline-flex; gap: 6px; align-items: center; }
.pvbar__tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--pv-acc); display: inline-block; }
.pvbar label { color: var(--pv-mute); display: inline-flex; gap: 6px; align-items: center; }
.pvbar select { background: var(--pv-chip); border: 1px solid var(--pv-line); border-radius: 999px; padding: 4px 10px; }
.pvseg { display: inline-flex; border: 1px solid var(--pv-line); border-radius: 999px; padding: 2px; background: var(--pv-chip); }
.pvseg button, .pvbtn { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.pvseg button[aria-pressed="true"] { background: var(--pv-fg); color: var(--pv-bg); }
.pvbtn { border: 1px solid var(--pv-line); background: var(--pv-chip); }
.pvbar__note { color: var(--pv-mute); margin-inline-start: auto; }
.device-wrap { min-height: 0; display: grid; place-items: center; overflow: hidden; }
.device { width: 100%; height: 100%; position: relative; transform: translateZ(0); overflow: hidden; }
.stage[data-device="phone"] .device { width: min(390px, 100%); height: min(844px, calc(100% - 28px)); border-radius: 46px; border: 11px solid #090d14; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06); }
.stage[data-device="tablet"] .device { width: min(820px, 100%); height: min(1060px, calc(100% - 28px)); border-radius: 30px; border: 12px solid #090d14; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .6); }

/* ---------- the admin app: tokens ---------- */
.app {
  --bg: #030b18; --bg-2: #04101f; --surface: #071a33; --surface-2: #0a2140; --raised: #0d2849; --hover: rgba(255, 255, 255, .045);
  --line: rgba(242, 210, 139, .13); --line-2: rgba(255, 255, 255, .07); --line-3: rgba(255, 255, 255, .13);
  --text: #f3f6fb; --text-2: #b9c5d6; --text-3: #8b9cb2;
  --ok: #5ad7a0; --ok-bg: rgba(90, 215, 160, .12); --warn: #f5c56b; --warn-bg: rgba(245, 197, 107, .12);
  --danger: #ff8a7d; --danger-bg: rgba(200, 67, 58, .18); --danger-solid: #c8433a; --danger-ink: #fff;
  --info: #8fc6ff; --info-bg: rgba(143, 198, 255, .12);
  --shadow: inset 0 1px 0 rgba(255, 255, 255, .035), 0 14px 34px -18px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .8);
  --scrim: rgba(1, 5, 12, .62);
  --glow-a: rgba(215, 170, 80, .10); --glow-b: rgba(76, 195, 203, .05);
  --r-lg: 20px; --r: 14px; --r-sm: 10px;
  --pad: 20px; --gap: 16px; --row: 56px; --fs: 15px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001);
  --acc: #d7aa50; --acc-hi: #f2d28b; --acc-ink: #1b1306; --acc-text: #f2d28b; --acc-soft: rgba(215, 170, 80, .14); --acc-line: rgba(215, 170, 80, .42);
  color-scheme: dark;
  container: app / inline-size;
  height: 100%; position: relative; overflow: hidden;
  background: var(--bg); color: var(--text); font-size: var(--fs); line-height: 1.6;
}
.app[data-mode="light"] {
  --bg: #edf1f6; --bg-2: #e4e9f1; --surface: #ffffff; --surface-2: #f5f7fb; --raised: #ffffff; --hover: rgba(11, 42, 76, .05);
  --line: rgba(11, 42, 76, .12); --line-2: rgba(11, 42, 76, .08); --line-3: rgba(11, 42, 76, .17);
  --text: #0a1a30; --text-2: #364962; --text-3: #586a84;
  --ok: #0d7149; --ok-bg: rgba(13, 113, 73, .1); --warn: #865600; --warn-bg: rgba(201, 140, 20, .14);
  --danger: #b3261e; --danger-bg: rgba(179, 38, 30, .09); --danger-solid: #b3261e;
  --info: #1d5aa6; --info-bg: rgba(29, 90, 166, .09);
  --shadow: 0 1px 2px rgba(10, 26, 48, .06), 0 10px 26px -16px rgba(10, 26, 48, .22);
  --shadow-lg: 0 30px 70px -24px rgba(10, 26, 48, .38);
  --scrim: rgba(10, 26, 48, .36);
  --glow-a: rgba(201, 151, 62, .10); --glow-b: rgba(14, 124, 132, .05);
  color-scheme: light;
}
.app[data-density="compact"] { --pad: 14px; --gap: 10px; --row: 46px; --fs: 14px; }
.app::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 40% at 85% 0%, var(--glow-a), transparent 70%), radial-gradient(50% 40% at 0% 100%, var(--glow-b), transparent 70%); }

/* ---------- shell ---------- */
.shell { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.rail {
  width: 268px; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px 14px;
  background: color-mix(in srgb, var(--bg-2) 82%, transparent); border-inline-end: 1px solid var(--line-2);
  transition: width .35s var(--ease); overflow: hidden; position: relative; z-index: 2;
}
.rail[data-collapsed="true"] { width: 84px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 14px; border-bottom: 1px solid var(--line-2); margin-bottom: 8px; min-height: 62px; }
.brand__logo { width: 44px; height: 44px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--acc-line), 0 0 22px -4px var(--acc-soft); }
.brand__text { min-width: 0; transition: opacity .2s; }
.brand__title { margin: 0; font-family: var(--f-display); font-size: 21px; line-height: 1.2; color: var(--acc-text); }
.brand__sub { margin: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.rail[data-collapsed="true"] .brand__text, .rail[data-collapsed="true"] .nav__label, .rail[data-collapsed="true"] .nav__badge, .rail[data-collapsed="true"] .rail__group, .rail[data-collapsed="true"] .me__text { opacity: 0; pointer-events: none; }
.rail__nav { position: relative; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; flex: 1; scrollbar-width: thin; }
.rail__group { font-size: 11px; font-weight: 700; color: var(--text-3); padding: 12px 14px 4px; letter-spacing: .02em; white-space: nowrap; transition: opacity .2s; }
.nav { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 15px; border-radius: 13px; border: 0; background: none; color: var(--text-2); font-weight: 600; cursor: pointer; text-align: start; white-space: nowrap; transition: color .2s, background-color .2s; }
.nav:hover { background: var(--hover); color: var(--text); }
.nav[aria-current="page"] { color: var(--acc-text); }
.rail__foot .nav[aria-current="page"] { background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc-line); }
.nav .ico { flex: none; }
.nav__label { flex: 1; transition: opacity .2s; }
.nav__badge { font-size: 11px; font-weight: 800; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--acc); color: var(--acc-ink); transition: opacity .2s; }
.nav__badge--soon { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--line-3); }
.rail__ind { position: absolute; inset-inline: 0; height: 46px; border-radius: 13px; background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc-line); transition: transform .45s var(--spring), opacity .2s; z-index: 0; pointer-events: none; }
.rail__ind::after { content: ""; position: absolute; inset-inline-start: -14px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--acc); }
.rail__foot { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; }
.me__text { min-width: 0; transition: opacity .2s; }
.me__name { margin: 0; font-weight: 700; font-size: 14px; white-space: nowrap; }
.me__role { margin: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; }

.col { position: relative; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.top { display: flex; align-items: center; gap: 10px; min-height: 68px; padding-block: 10px; padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px)); padding-inline: var(--pad); border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); position: relative; z-index: 3; }
.top__logo { display: none; width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 1px var(--acc-line); }
.top__title { min-width: 0; flex: 1; }
.top__crumb { margin: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top__h { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { display: flex; align-items: center; gap: 10px; height: 42px; width: clamp(220px, 26cqi, 360px); padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--surface); color: var(--text-3); cursor: pointer; }
.search span { flex: 1; text-align: start; }
.kbd { font-size: 11px; font-family: ui-monospace, Consolas, monospace; border: 1px solid var(--line-3); border-radius: 6px; padding: 1px 6px; direction: ltr; }
.icon-btn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid transparent; background: none; color: var(--text-2); cursor: pointer; transition: background-color .2s, color .2s, transform .35s var(--spring); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn:active { transform: scale(.92); transition-duration: .08s; }
.icon-btn .dot { position: absolute; top: 7px; inset-inline-end: 7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--danger-solid); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.top__search-icon { display: none; }

.stack { display: flex; align-items: center; padding-inline-start: 8px; border: 0; background: none; cursor: pointer; height: 44px; }
.stack .av { margin-inline-start: -8px; box-shadow: 0 0 0 2px var(--bg); }
.stack__more { margin-inline-start: -8px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--surface-2); color: var(--text-2); box-shadow: 0 0 0 2px var(--bg); }

.tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 0; padding-inline: var(--pad); border-bottom: 1px solid var(--line-2); z-index: 2; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 13px; color: var(--text-3); font-weight: 700; cursor: pointer; white-space: nowrap; transition: color .2s; }
.tab[aria-selected="true"] { color: var(--text); }
.tab:hover { color: var(--text); }
.tabs__ind { position: absolute; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--acc); transition: transform .45s var(--spring), width .45s var(--spring); left: 0; }

.scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; scroll-behavior: smooth; overscroll-behavior: contain; }
.view { max-width: 1560px; margin: 0 auto; padding-block: var(--pad) calc(var(--pad) + 24px); padding-inline: max(var(--pad), env(safe-area-inset-right, 0px)) max(var(--pad), env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: var(--gap); }

.dock { display: none; position: absolute; inset-inline: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 6; height: 66px; padding: 6px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(18px) saturate(1.2); border: 1px solid var(--line-3); box-shadow: var(--shadow-lg); justify-content: space-around; }
.dock__item { position: relative; z-index: 1; flex: 1; min-width: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 16px; transition: color .2s; }
.dock__item[aria-current="page"] { color: var(--acc-text); }
.dock__item span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock__item .nav__badge { position: absolute; top: 2px; inset-inline-end: calc(50% - 22px); min-width: 18px; height: 17px; font-size: 10px; }
.dock__ind { position: absolute; top: 6px; bottom: 6px; left: 0; border-radius: 16px; background: var(--acc-soft); transition: transform .45s var(--spring), width .3s var(--ease); pointer-events: none; }

/* ---------- primitives ---------- */
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico--sm { width: 18px; height: 18px; }
.ico--lg { width: 28px; height: 28px; }
[dir="rtl"] .ico--flip { transform: scaleX(-1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--surface-2); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: transform .4s var(--spring), background-color .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: var(--acc-line); }
.btn:active { transform: scale(.955); transition-duration: .08s; }
.btn--primary { background: var(--acc); border-color: transparent; color: var(--acc-ink); box-shadow: 0 8px 22px -10px var(--acc); }
.btn--primary:hover { border-color: transparent; filter: brightness(1.06); }
.btn--ghost { background: none; }
.btn--quiet { background: none; border-color: transparent; color: var(--text-2); }
.btn--quiet:hover { background: var(--hover); border-color: transparent; }
.btn--danger { background: none; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn--danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn--danger-solid { background: var(--danger-solid); color: var(--danger-ink); border-color: transparent; }
.btn--sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn .ico { width: 19px; height: 19px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-2); white-space: nowrap; border: 1px solid transparent; }
.chip--ok { background: var(--ok-bg); color: var(--ok); }
.chip--warn { background: var(--warn-bg); color: var(--warn); }
.chip--danger { background: var(--danger-bg); color: var(--danger); }
.chip--info { background: var(--info-bg); color: var(--info); }
.chip--acc { background: var(--acc-soft); color: var(--acc-text); }
.chip--test { background: none; border: 1px dashed var(--line-3); color: var(--text-3); }
.chip .ico { width: 14px; height: 14px; }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: var(--pad); box-shadow: var(--shadow); min-width: 0; }
.card__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card__title { margin: 0; font-size: 16px; font-weight: 800; flex: 1; text-wrap: balance; }
.card__hint { margin: 2px 0 0; font-size: 13px; color: var(--text-3); }
.muted { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.h-section { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.h-section h2 { margin: 0; font-size: 22px; font-weight: 800; text-wrap: balance; }
.h-section p { margin: 2px 0 0; color: var(--text-3); font-size: 14px; }
.h-section > div:first-child { flex: 1; min-width: 220px; }
.input { height: 44px; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--surface); color: var(--text); }
.input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.input--search { padding-inline-start: 42px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--text-2); }
.search-box { position: relative; flex: 1; min-width: 220px; }
.search-box .ico { position: absolute; inset-inline-start: 13px; top: 11px; color: var(--text-3); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.fchip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-3); background: none; color: var(--text-2); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s, color .2s, border-color .2s, transform .35s var(--spring); }
.fchip:active { transform: scale(.95); }
.fchip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: transparent; }
.fchip b { font-weight: 800; opacity: .7; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.switch { position: relative; width: 50px; height: 30px; flex: none; border-radius: 999px; border: 0; background: var(--line-3); cursor: pointer; transition: background-color .25s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform .45s var(--spring); }
.switch[aria-checked="true"] { background: var(--acc); }
.switch[aria-checked="true"]::after { transform: translateX(-20px); }
.trow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.trow:last-child { border-bottom: 0; }
.trow__text { flex: 1; min-width: 0; }
.trow__text b { display: block; font-size: 15px; }
.trow__text small { color: var(--text-3); font-size: 13px; }
.empty { text-align: center; padding: 34px 16px; color: var(--text-3); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--info-bg); color: var(--text-2); font-size: 13px; }
.note .ico { color: var(--info); width: 19px; height: 19px; margin-top: 2px; }
.note--warn { background: var(--warn-bg); }
.note--warn .ico { color: var(--warn); }
.note--danger { background: var(--danger-bg); }
.note--danger .ico { color: var(--danger); }
.skel { border-radius: var(--r-lg); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* avatars: the arch from the family identity */
.av { position: relative; flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; color: var(--acc-text); background: var(--surface-2); overflow: visible; }
.av img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
.av[data-state]::after { content: ""; position: absolute; bottom: -1px; inset-inline-end: -1px; width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); }
.av[data-state="online"]::after { background: var(--ok); }
.av[data-state="idle"]::after { background: var(--warn); }
.av[data-state="editing"]::after { background: var(--acc); }
.av[data-state="offline"]::after { background: var(--text-3); }
.av[data-state="editing"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc-line); }
.arch { position: relative; flex: none; width: 64px; height: 76px; border-radius: 999px 999px 14px 14px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(180deg, var(--surface-2), var(--raised)); box-shadow: inset 0 0 0 1px var(--acc-line); font-family: var(--f-display); font-size: 30px; color: var(--acc-text); }
.arch img { width: 100%; height: 100%; object-fit: cover; }
.arch::after { content: ""; position: absolute; inset: 3px; border-radius: inherit; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 30%, transparent); pointer-events: none; }
.arch--lg { width: 112px; height: 134px; font-size: 52px; border-radius: 999px 999px 20px 20px; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: var(--gap); align-items: start; }
.home__main, .home__side { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.hello { position: relative; overflow: hidden; padding: 24px var(--pad); border-radius: var(--r-lg); background: radial-gradient(90% 140% at 100% 0%, var(--acc-soft), transparent 60%), var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.hello__date { margin: 0; font-size: 13px; color: var(--text-3); }
.hello__name { margin: 2px 0 4px; font-size: 26px; font-weight: 800; line-height: 1.35; text-wrap: balance; }
.hello__name em { font-style: normal; font-family: var(--f-display); color: var(--acc-text); font-size: 1.12em; }
.hello__sub { margin: 0; color: var(--text-2); }
.hello__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hello > div:first-child { flex: 1; min-width: 240px; }
.queue { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.qcard { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); text-align: start; cursor: pointer; color: inherit; box-shadow: var(--shadow); transition: transform .45s var(--spring), border-color .2s; }
.qcard:hover { transform: translateY(-2px); border-color: var(--acc-line); }
.qcard:active { transform: scale(.97); }
.qcard__ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-text); }
.qcard__n { font-size: 30px; font-weight: 800; line-height: 1; }
.qcard__t { font-size: 13px; color: var(--text-2); font-weight: 600; }
.qcard__go { position: absolute; top: 16px; inset-inline-end: 14px; color: var(--text-3); }
.qcard[data-tone="warn"] .qcard__ico { background: var(--warn-bg); color: var(--warn); }
.qcard[data-tone="info"] .qcard__ico { background: var(--info-bg); color: var(--info); }
.qcard[data-tone="ok"] .qcard__ico { background: var(--ok-bg); color: var(--ok); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.kpi { padding: 18px var(--pad); border-inline-start: 1px solid var(--line-2); min-width: 0; }
.kpi:first-child { border-inline-start: 0; }
.kpi__label { font-size: 13px; color: var(--text-3); font-weight: 600; margin: 0; }
.kpi__value { font-size: 26px; font-weight: 800; margin: 4px 0 2px; line-height: 1.2; }
.kpi__delta { font-size: 12px; font-weight: 700; color: var(--ok); }
.kpi svg { display: block; width: 100%; height: 34px; margin-top: 8px; }
.duo { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--gap); }
.meet { display: flex; gap: 16px; align-items: center; }
.meet__day { width: 74px; flex: none; text-align: center; border-radius: 16px; padding: 10px 0; background: var(--acc-soft); box-shadow: inset 0 0 0 1px var(--acc-line); }
.meet__day b { display: block; font-size: 30px; line-height: 1.1; color: var(--acc-text); }
.meet__day span { font-size: 12px; color: var(--text-2); font-weight: 700; }
.meet h3 { margin: 0; font-family: var(--f-display); font-size: 22px; color: var(--acc-text); font-weight: 700; line-height: 1.4; }
.feed { display: flex; flex-direction: column; }
.feed__item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-2); align-items: flex-start; }
.feed__item:last-child { border-bottom: 0; }
.feed__ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--text-2); }
.feed__ico .ico { width: 18px; height: 18px; }
.feed__ico[data-tone="ok"] { background: var(--ok-bg); color: var(--ok); }
.feed__ico[data-tone="danger"] { background: var(--danger-bg); color: var(--danger); }
.feed__ico[data-tone="gold"] { background: var(--acc-soft); color: var(--acc-text); }
.feed__ico[data-tone="info"] { background: var(--info-bg); color: var(--info); }
.feed__ico[data-tone="warn"] { background: var(--warn-bg); color: var(--warn); }
.feed__text { flex: 1; min-width: 0; font-size: 14px; }
.feed__text b { font-weight: 700; }
.feed__text small { display: block; color: var(--text-3); font-size: 12px; }
.feed__time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.who { display: flex; flex-direction: column; }
.who__item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.who__item:last-child { border-bottom: 0; }
.who__item .av { width: 40px; height: 40px; font-size: 18px; }
.who__text { flex: 1; min-width: 0; }
.who__text b { display: block; font-size: 14px; }
.who__text small { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who__text small.editing { color: var(--acc-text); }
.who__sum { display: flex; gap: 14px; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.who__sum span { display: inline-flex; align-items: center; gap: 5px; }
.who__sum i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pulse { position: relative; }
.pulse::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--acc); opacity: 0; animation: ring 2.4s var(--ease) infinite; }
@keyframes ring { 0% { opacity: .7; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
.strip { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); cursor: pointer; text-align: start; color: inherit; width: 100%; }
.strip .stack { padding: 0; height: auto; }
.strip__text { flex: 1; min-width: 0; font-size: 13px; color: var(--text-2); }
.strip__text b { color: var(--text); }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.quick .btn { justify-content: flex-start; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--acc); transform-origin: right; animation: grow .9s var(--ease) both; }
.bar i[data-tone="warn"] { background: var(--warn); }
@keyframes grow { from { transform: scaleX(0); } }
.cap { display: flex; flex-direction: column; gap: 14px; }
.cap__row { display: flex; flex-direction: column; gap: 6px; }
.cap__row div:first-child { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.cap__row b { font-weight: 700; }

/* ---------- lists / cards ---------- */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: var(--gap); }
.person { position: relative; display: flex; gap: 14px; align-items: flex-start; text-align: start; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; color: inherit; transition: transform .45s var(--spring), border-color .2s; min-width: 0; }
.person:hover { transform: translateY(-2px); border-color: var(--acc-line); }
.person:active { transform: scale(.98); }
.person__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.person__name { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
.person__line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); min-width: 0; }
.person__line .ico { width: 16px; height: 16px; color: var(--text-3); }
.person__line .ltr { overflow-wrap: anywhere; min-width: 0; font-size: 13.5px; }
.copy { margin-inline-start: auto; width: 32px; height: 32px; flex: none; border-radius: 9px; border: 0; background: none; color: var(--text-3); cursor: pointer; display: grid; place-items: center; transition: background-color .2s, color .2s, transform .35s var(--spring); }
.copy:hover { background: var(--hover); color: var(--text); }
.copy:active { transform: scale(.88); }
.copy .ico { width: 16px; height: 16px; }
.copy.is-done { color: var(--ok); }
.person__chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.person__new { position: absolute; top: 12px; inset-inline-end: 12px; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; min-height: var(--row); border-bottom: 1px solid var(--line-2); }
.item:last-child { border-bottom: 0; }
.item__ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--text-2); }
.item__main { flex: 1; min-width: 0; }
.item__main b { display: block; font-weight: 700; overflow-wrap: anywhere; }
.item__main small { display: block; color: var(--text-3); font-size: 13px; }
.item__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.comp { display: flex; flex-direction: column; gap: 14px; }
.comp__top { display: flex; gap: 12px; align-items: flex-start; }
.comp__top h3 { margin: 0; font-size: 17px; font-weight: 800; flex: 1; line-height: 1.45; text-wrap: balance; }
.comp__stats { display: flex; gap: 18px; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
.comp__stats b { display: block; font-size: 20px; color: var(--text); font-weight: 800; }
.ring { width: 58px; height: 58px; flex: none; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--acc); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1s var(--ease); }
.ring text { fill: var(--text); font: 800 14px var(--f-ui); }
.answer { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); transition: opacity .3s, transform .4s var(--ease); }
.answer.is-out { opacity: 0; transform: translateX(-30px) scale(.98); }
.answer__q { font-size: 13px; color: var(--text-3); margin: 0; }
.answer__a { margin: 0; font-size: 16px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.answer__acts { display: flex; gap: 8px; }
.answer__acts .btn { flex: 1; }
.btn--ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: none; }
.btn--ok:hover { background: var(--ok-bg); border-color: var(--ok); }
.lead { display: flex; flex-direction: column; gap: 4px; }
.lead__row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.lead__pos { width: 26px; text-align: center; font-weight: 800; color: var(--text-3); }
.lead__row:nth-child(1) .lead__pos { color: var(--acc-text); }
.lead__row b { flex: 1; font-weight: 700; font-size: 14px; }
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: start; font-size: 12px; color: var(--text-3); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line-2); white-space: nowrap; background: var(--surface-2); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background-color .2s; }
tbody tr:hover { background: var(--hover); }
.bcards { display: none; flex-direction: column; gap: 10px; }
.bcard { padding: 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.bcard__top { display: flex; gap: 10px; align-items: flex-start; }
.bcard__top div { flex: 1; min-width: 0; }
.bcard__top b { display: block; }
.bcard__top small { color: var(--text-3); }
.money { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.mtile { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; transition: transform .45s var(--spring); text-align: start; color: inherit; padding: 0; }
.mtile:hover { transform: translateY(-2px); }
.mtile__img { aspect-ratio: 4 / 3; max-width: 100%; display: block; width: 100%; }
.mtile__cap { padding: 10px 12px; }
.mtile__cap b { display: block; font-size: 13px; }
.mtile__cap small { color: var(--text-3); font-size: 12px; }
.day { font-size: 12px; font-weight: 800; color: var(--text-3); padding: 14px 0 4px; letter-spacing: .02em; }

/* ---------- games ---------- */
.ghero { position: relative; overflow: hidden; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 22px var(--pad); border-radius: var(--r-lg); border: 1px solid var(--line); background: radial-gradient(70% 120% at 0% 0%, rgba(140, 110, 255, .18), transparent 60%), radial-gradient(60% 120% at 100% 100%, var(--acc-soft), transparent 60%), var(--surface); box-shadow: var(--shadow); }
.ghero img { width: 210px; max-width: 100%; height: auto; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .35)); }
.ghero > div { flex: 1; min-width: 240px; }
.ghero h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
.ghero p { margin: 0; color: var(--text-2); }
.phase10 { display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--acc-line); color: var(--acc-text); font-size: 13px; font-weight: 700; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--gap); }
.game { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; text-align: start; color: inherit; overflow: hidden; transition: transform .45s var(--spring), border-color .2s; }
.game:hover { transform: translateY(-3px); border-color: var(--g); }
.game::before { content: ""; position: absolute; inset: 0 0 auto; height: 90px; background: radial-gradient(80% 100% at 85% 0%, color-mix(in srgb, var(--g) 26%, transparent), transparent 70%); pointer-events: none; }
.game__ico { position: relative; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--g) 20%, transparent); color: var(--g); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--g) 45%, transparent); }
.game__ico .ico { width: 28px; height: 28px; }
.game h3 { margin: 0; font-size: 18px; font-weight: 800; }
.game p { margin: 0; font-size: 14px; color: var(--text-2); }
.game__foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.session { display: flex; flex-direction: column; gap: 16px; }
.session__live { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.qr { width: 132px; height: 132px; padding: 8px; border-radius: 14px; background: #fff; }
.qr svg { width: 100%; height: 100%; display: block; }
.code { font-size: 34px; font-weight: 800; letter-spacing: .12em; direction: ltr; unicode-bidi: isolate; color: var(--acc-text); font-variant-numeric: tabular-nums; }
.phases { display: flex; gap: 6px; flex-wrap: wrap; }
.phases span { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-3); }
.phases span.is-on { background: var(--acc); color: var(--acc-ink); }
.phases span.is-done { color: var(--text-2); }
.livedot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger-solid); display: inline-block; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.players { display: flex; flex-wrap: wrap; gap: 6px; }
.players span { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; }

/* ---------- settings ---------- */
.set-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: var(--gap); align-items: start; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; position: relative; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); transition: transform .4s var(--spring); }
.swatch:hover { transform: scale(1.08); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--sw); }
.swatch[aria-pressed="true"]::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 8px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: translateY(-2px) rotate(-45deg); }
.swatch-l { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); font-weight: 700; }
.mini { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-3); background: var(--bg); }
.mini__top { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line-2); }
.mini__body { display: grid; grid-template-columns: 64px 1fr; min-height: 170px; }
.mini__rail { border-inline-end: 1px solid var(--line-2); padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.mini__rail i { height: 10px; border-radius: 5px; background: var(--line-3); }
.mini__rail i:first-child { background: var(--acc); }
.mini__main { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mini__card { height: 46px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); }
.mini__btn { width: 90px; height: 26px; border-radius: 8px; background: var(--acc); }
.perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.perm { padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2); }
.perm b { display: block; font-size: 14px; margin-bottom: 6px; }
.perm .row { gap: 6px; }
.check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-3); flex: none; display: grid; place-items: center; background: none; cursor: pointer; transition: background-color .2s, border-color .2s, transform .35s var(--spring); }
.check[aria-checked="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.check .ico { width: 15px; height: 15px; stroke-width: 3; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s var(--spring); }
.check[aria-checked="true"] .ico { opacity: 1; transform: none; }
.check[disabled] { opacity: .4; cursor: not-allowed; }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat3 > div { padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.stat3 small { display: block; font-size: 12px; color: var(--text-3); font-weight: 600; }
.stat3 b { font-size: 18px; font-weight: 800; }

/* ---------- denied ---------- */
.denied { display: grid; place-items: center; text-align: center; padding: 50px 16px; gap: 12px; }
.denied__ico { width: 86px; height: 86px; border-radius: 28px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); box-shadow: inset 0 0 0 1px var(--line-3); }
.denied__ico .ico { width: 40px; height: 40px; }
.denied h2 { margin: 6px 0 0; font-size: 22px; }
.denied p { margin: 0; color: var(--text-2); max-width: 46ch; }

/* ---------- layer: sheets, dialogs, menus, palette ---------- */
.layer { position: absolute; inset: 0; z-index: 40; display: grid; pointer-events: none; }
.layer:empty { display: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); pointer-events: auto; animation: fade .25s var(--ease) both; }
.scrim.is-out { animation: fade .2s var(--ease) reverse both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: var(--surface); color: var(--text); border: 1px solid var(--line-3); box-shadow: var(--shadow-lg); max-height: calc(100% - 40px); overflow: hidden; }
.sheet[data-kind="dialog"] { inset: 0; margin: auto; width: min(560px, calc(100% - 32px)); height: fit-content; border-radius: 22px; animation: pop .42s var(--spring) both; }
.sheet[data-kind="side"] { top: 0; bottom: 0; inset-inline-end: 0; width: min(520px, 100%); max-height: none; border-radius: 0; border-block: 0; border-inline-end: 0; animation: side .45s var(--ease) both; }
.sheet[data-kind="palette"] { top: 72px; inset-inline: 0; margin: 0 auto; width: min(640px, calc(100% - 32px)); border-radius: 18px; max-height: min(520px, calc(100% - 100px)); animation: pop .35s var(--spring) both; }
.sheet.is-out { animation: out .2s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes side { from { transform: translateX(-100%); } }
@keyframes out { to { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes up { from { transform: translateY(100%); } }
.sheet__head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line-2); }
.sheet__head h2 { margin: 0; font-size: 18px; font-weight: 800; flex: 1; text-wrap: balance; }
.sheet__handle { display: none; width: 44px; height: 5px; border-radius: 5px; background: var(--line-3); margin: 8px auto 0; flex: none; }
.sheet__body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.sheet__foot { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.sheet__foot .btn { flex: 1; }
.menu { position: absolute; pointer-events: auto; min-width: 210px; padding: 6px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line-3); box-shadow: var(--shadow-lg); animation: pop .3s var(--spring) both; z-index: 2; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; border: 0; background: none; color: var(--text); font-weight: 600; cursor: pointer; text-align: start; }
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--danger); }
.menu button[disabled] { opacity: .5; cursor: not-allowed; }
.menu small { display: block; font-size: 11px; color: var(--text-3); font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 6px; }
.pal__in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.pal__in input { flex: 1; border: 0; background: none; height: 34px; font-size: 16px; outline: none; }
.pal__list { overflow-y: auto; padding: 6px; }
.pal__group { font-size: 11px; font-weight: 800; color: var(--text-3); padding: 10px 12px 4px; }
.pal__item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: start; color: var(--text); }
.pal__item[aria-selected="true"] { background: var(--acc-soft); }
.pal__item small { color: var(--text-3); margin-inline-start: auto; font-size: 12px; }
.steps { display: flex; gap: 8px; align-items: center; }
.steps span { flex: 1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.steps span i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .6s var(--ease); }
.confirm-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--danger-bg); color: var(--danger); }
.confirm-ico[data-tone="warn"] { background: var(--warn-bg); color: var(--warn); }
.confirm-ico[data-tone="gold"] { background: var(--acc-soft); color: var(--acc-text); }
.gone { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; max-height: 160px; overflow-y: auto; }
.shake { animation: shake .4s var(--ease); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.toasts { position: absolute; z-index: 60; bottom: 20px; inset-inline-start: 50%; transform: translateX(50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(460px, calc(100% - 24px)); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px; box-shadow: var(--shadow-lg); animation: toast .45s var(--spring) both; width: 100%; }
.toast.is-out { animation: out .2s var(--ease) both; }
.toast .ico { width: 20px; height: 20px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 4px 6px; }
@keyframes toast { from { opacity: 0; transform: translateY(20px) scale(.95); } }

/* ---------- intro: a welcome state inside the shell (rail and top bar stay, the content area greets) ---------- */
.intro { position: absolute; inset-inline: 0; bottom: 0; z-index: 5; display: grid; place-items: center; padding: 32px 24px; color: var(--text); cursor: pointer; }
.intro__bg { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(46% 40% at 50% 44%, var(--acc-soft), transparent 72%), var(--bg); }
.intro__rays { position: absolute; left: 50%; top: 40%; width: 160cqmax; height: 160cqmax; margin: -80cqmax 0 0 -80cqmax; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--acc) 7%, transparent) 0deg 2deg, transparent 2deg 18deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 26%); mask: radial-gradient(circle, #000 0, transparent 26%); opacity: 0; }
.intro__dust { position: absolute; inset: 0; width: 100%; height: 100%; }
.intro__core { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; max-width: 100%; }
.intro__mark { position: relative; width: clamp(96px, 16cqi, 128px); aspect-ratio: 1; }
.intro__halo { position: absolute; inset: -70%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 30%, transparent) 0%, color-mix(in srgb, var(--acc) 8%, transparent) 38%, transparent 66%); opacity: 0; pointer-events: none; }
.intro__ring { position: absolute; inset: -10px; border-radius: 50%; border: 1px solid var(--acc-line); opacity: 0; }
.intro__logo { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; display: block; opacity: 0; box-shadow: 0 0 0 1px var(--acc-line), 0 22px 50px -24px rgba(0, 0, 0, .55), 0 0 60px -18px var(--acc); transform-origin: center; }
.intro__sweep { position: absolute; z-index: 2; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; }
.intro__sweep i { position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 246, 220, .7), transparent); transform: skewX(-18deg); }
.intro__text { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: min(560px, 100%); }
.intro__title { margin: 0; padding: 0 .2em; font-family: var(--f-display); font-weight: 700; font-size: clamp(42px, 7cqi, 60px); line-height: 1.75; color: var(--acc-text); opacity: 0; }
.intro__sub { margin: -4px 0 0; font-size: clamp(14px, 1.7cqi, 16px); line-height: 1.8; color: var(--text-2); opacity: 0; }
.intro__load { display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; }
.intro__progress { width: 150px; height: 3px; border-radius: 3px; background: var(--line-3); overflow: hidden; }
.intro__progress i { display: block; height: 100%; border-radius: inherit; background: var(--acc); transform-origin: right; transform: scaleX(0); }
.intro__status { font-size: 12px; line-height: 1.6; color: var(--text-3); }
.intro__skip { position: absolute; top: 16px; inset-inline-end: 16px; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-3); background: var(--surface); color: var(--text-2); font-weight: 700; font-size: 13px; cursor: pointer; opacity: 0; }
.intro__skip:hover { color: var(--text); border-color: var(--acc-line); }
.app.is-intro .brand__logo, .app.is-intro .top__logo { opacity: 0; transition: none; }
.app.is-entering .rail { animation: enter-rail .7s var(--ease) both; }
.app.is-entering .top { animation: enter-top .6s var(--ease) .1s both; }
.app.is-entering .dock { animation: enter-dock .7s var(--spring) .2s both; }
@keyframes enter-rail { from { transform: translateX(30px); opacity: 0; } }
@keyframes enter-top { from { transform: translateY(-14px); opacity: 0; } }
@keyframes enter-dock { from { transform: translateY(40px); opacity: 0; } }
@keyframes rise { from { transform: translateY(16px) scale(.985); opacity: 0; } }
.view.is-swap > * { animation: rise .5s var(--ease) both; }
.view.is-swap[data-dir="fwd"] > * { animation-name: slide-f; }
.view.is-swap[data-dir="back"] > * { animation-name: slide-b; }
@keyframes slide-f { from { opacity: 0; transform: translateX(-26px); } }
@keyframes slide-b { from { opacity: 0; transform: translateX(26px); } }

/* ---------- interaction states ---------- */
.btn, .nav, .dock__item, .qcard, .fchip, .tab, .game, .icon-btn, .pal__item, .menu button, .acct { position: relative; overflow: hidden; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .22; transform: scale(0); animation: ripple .6s var(--ease) forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.btn:hover:not([disabled]), .btn.is-hover { transform: translateY(-1px); border-color: var(--acc-line); }
.btn--primary:hover:not([disabled]), .btn--primary.is-hover { box-shadow: 0 14px 28px -12px var(--acc); filter: brightness(1.07); }
.btn--quiet.is-hover { background: var(--hover); border-color: transparent; }
.btn--danger.is-hover { background: var(--danger-bg); border-color: var(--danger); }
.btn:active:not([disabled]), .btn.is-press { transform: scale(.955); transition-duration: .08s; filter: brightness(.95); }
.btn.is-active, .btn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--acc-soft), inset 0 0 0 1px var(--acc); }
.btn.is-loading, .btn.is-success { opacity: 1; cursor: default; }
.btn.is-success { background: var(--ok); color: var(--bg); border-color: transparent; box-shadow: 0 10px 24px -12px var(--ok); }
.btn.is-error { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; display: inline-block; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.draw path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .5s var(--ease) .05s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.nav.is-hover { background: var(--hover); color: var(--text); }
.nav.is-active-demo { background: var(--acc-soft); color: var(--acc-text); box-shadow: inset 0 0 0 1px var(--acc-line); }
.comp { cursor: pointer; transition: transform .45s var(--spring), border-color .2s; }
.comp:hover { transform: translateY(-2px); border-color: var(--acc-line); }
.comp:active { transform: scale(.985); }
.scrim--clear { background: none; backdrop-filter: none; }
.layer--top { z-index: 45; }
.menu button { position: relative; }
.menu--sheet { position: static; box-shadow: none; border: 0; background: none; padding: 0; animation: none; min-width: 0; }
.menu--sheet button { min-height: 50px; }
.menu__head { display: flex; gap: 10px; align-items: center; padding: 10px 12px 8px; }
.menu__head b { display: block; font-size: 14px; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 16px; }
.form__sec { margin: 8px 0 -4px; font-size: 13px; font-weight: 800; color: var(--acc-text); scroll-margin-top: 12px; }
.form__sec:first-child { margin-top: 0; }
.field > label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.field { scroll-margin: 90px 0; }
.req { color: var(--danger); }
.trow.field { flex-direction: row; padding: 10px 0; }
textarea.input { height: auto; min-height: 104px; padding: 10px 14px; resize: vertical; line-height: 1.7; }
select.input { cursor: pointer; }
.input.ltr { text-align: left; }
.input.is-focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.input[disabled] { opacity: .55; cursor: not-allowed; background: var(--surface-2); }
.field.is-invalid .input { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-bg); }
.field.is-valid .input { border-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.field__msg { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--danger); font-weight: 600; }
.field__msg .ico { width: 15px; height: 15px; }
.field__hint { font-size: 12px; color: var(--text-3); }
.field__ok { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ok); font-weight: 600; }
.field__ok .ico { width: 15px; height: 15px; }
.sheet__foot .savebar__msg { flex: 1 1 100%; font-size: 13px; font-weight: 700; color: var(--text-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet__foot .savebar__msg:empty { display: none; }
.savebar__msg.is-bad { color: var(--danger); }
.savebar__msg.is-dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.savebar__msg button { border: 0; background: none; color: inherit; text-decoration: underline; font-weight: 800; cursor: pointer; padding: 2px 4px; }
.sheet[data-kind="full"] { inset: 0; width: 100%; max-height: none; border-radius: 0; border: 0; animation: pop .4s var(--ease) both; }
.sheet[data-kind="full"] .sheet__body { padding-inline: max(18px, calc((100% - 980px) / 2)); }
.sheet[data-kind="full"] .sheet__foot { padding-inline: max(18px, calc((100% - 980px) / 2)); }
.editor { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
.editor__index { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; }
.editor__index a { padding: 9px 12px; border-radius: 10px; color: var(--text-2); text-decoration: none; font-weight: 700; font-size: 14px; transition: background-color .2s, color .2s; }
.editor__index a:hover { background: var(--hover); }
.editor__index a.is-on { background: var(--acc-soft); color: var(--acc-text); }

/* ---------- password ---------- */
.pw { display: flex; align-items: center; gap: 6px; padding-block: 6px; padding-inline: 14px 6px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-3); flex-wrap: wrap; }
.pw__val { flex: 1; min-width: 140px; font-family: ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: .06em; direction: ltr; text-align: left; overflow-wrap: anywhere; transition: color .2s; }
.pw__val.is-hidden { letter-spacing: .3em; color: var(--text-3); }
.pw__timer { font-size: 12px; color: var(--warn); font-weight: 700; white-space: nowrap; }
.pw-meter { display: flex; gap: 4px; }
.pw-meter i { flex: 1; height: 5px; border-radius: 5px; background: var(--line-3); transition: background-color .3s; }
.pw-meter[data-s="1"] i:nth-child(-n+1) { background: var(--danger); }
.pw-meter[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
.pw-meter[data-s="3"] i:nth-child(-n+3) { background: var(--ok); }
.pw-meter[data-s="4"] i { background: var(--ok); }
.big-pw { font-family: ui-monospace, Consolas, monospace; font-size: clamp(20px, 5cqi, 28px); font-weight: 800; text-align: center; direction: ltr; padding: 16px; border-radius: 16px; background: var(--acc-soft); color: var(--acc-text); box-shadow: inset 0 0 0 1px var(--acc-line); letter-spacing: .05em; overflow-wrap: anywhere; }
.success-mark { width: 66px; height: 66px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto; animation: pop .5s var(--spring) both; }
.success-mark .ico { width: 34px; height: 34px; stroke-width: 2.4; }

/* ---------- account + sign out ---------- */
.acct { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 12px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--surface); cursor: pointer; color: var(--text); flex: none; transition: border-color .2s; }
.acct:hover { border-color: var(--acc-line); }
.acct .av { width: 32px; height: 32px; }
.acct__name { font-size: 13px; font-weight: 700; white-space: nowrap; }
.nav--logout { color: var(--danger); }
.nav--logout:hover { background: var(--danger-bg); color: var(--danger); }
.app.is-leaving .shell { animation: leave .5s var(--ease) both; }
@keyframes leave { to { transform: scale(.95); opacity: 0; filter: blur(5px); } }
.gate { position: absolute; inset: 0; z-index: 75; display: grid; place-items: center; padding: 24px; text-align: center; color: #f3f6fb; background: radial-gradient(70% 60% at 50% 38%, #0b2647, #020914 72%); animation: fade .5s var(--ease) both; }
.gate.is-out { animation: fade .3s var(--ease) reverse both; }
.gate__card { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 380px; }
.gate__card img { width: 104px; height: 104px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(242, 210, 139, .5), 0 0 60px -10px rgba(242, 210, 139, .55); }
.gate h2 { margin: 0; font-family: var(--f-display); font-size: 38px; color: #f2d28b; font-weight: 700; }
.gate p { margin: -8px 0 6px; color: #b9c5d6; }
.gate__ok { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: rgba(90, 215, 160, .12); color: #5ad7a0; font-weight: 700; font-size: 13px; }
.gate__btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 250px; height: 52px; padding: 0 22px; border-radius: 14px; border: 0; background: #fff; color: #172033; font-weight: 800; font-size: 15px; cursor: pointer; transition: transform .4s var(--spring), box-shadow .2s; }
.gate__btn:hover { box-shadow: 0 12px 30px -10px rgba(242, 210, 139, .55); }
.gate__btn:active { transform: scale(.96); }
.gate__btn[disabled] { opacity: .85; cursor: default; }

/* ---------- guided scenarios ---------- */
.coach { position: absolute; inset: 0; z-index: 90; pointer-events: none; }
.coach__ring { position: absolute; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(1, 5, 12, .58), 0 0 0 3px var(--acc), 0 0 26px 6px var(--acc-soft); transition: top .45s var(--ease), left .45s var(--ease), width .45s var(--ease), height .45s var(--ease), opacity .2s; pointer-events: none; }
.coach__ring.is-none { box-shadow: 0 0 0 9999px rgba(1, 5, 12, .58); width: 0 !important; height: 0 !important; }
.coach__tip { position: absolute; pointer-events: auto; width: min(330px, calc(100% - 24px)); padding: 14px 16px; border-radius: 16px; background: var(--raised); border: 1px solid var(--acc-line); box-shadow: var(--shadow-lg); color: var(--text); transition: top .45s var(--ease), left .45s var(--ease); }
.coach.is-moving .coach__tip, .coach.is-moving .coach__ring { opacity: 0; pointer-events: none; }
.coach__tip small { display: block; color: var(--acc-text); font-weight: 800; font-size: 12px; margin-bottom: 4px; }
.coach__tip p { margin: 0 0 12px; font-size: 14px; line-height: 1.7; }
.coach__tip .row { justify-content: space-between; flex-wrap: nowrap; }

/* ---------- the states page ---------- */
.states-wrap { overflow-x: auto; padding-bottom: 6px; }
.states { display: grid; grid-template-columns: 70px repeat(8, minmax(118px, 1fr)); gap: 10px; align-items: center; min-width: 1110px; }
.states .lab { font-size: 12px; color: var(--text-3); font-weight: 800; text-align: center; }
.states .lab:nth-child(9n+1) { text-align: start; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.demo { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line-2); }
.demo small { color: var(--text-3); font-size: 12px; font-weight: 600; min-height: 2.6em; }
.ui-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; }
.ui-nav { display: flex; flex-direction: column; gap: 4px; max-width: 290px; }
.note--ok { background: var(--ok-bg); }
.note--ok .ico { color: var(--ok); }

/* ---------- motion settings ---------- */
.app[data-motion="off"] *, .app[data-motion="off"] *::before, .app[data-motion="off"] *::after { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
.app[data-motion="lite"] .view.is-swap > *, .app[data-motion="lite"].is-entering .view > * { animation-name: fade; }
.app[data-motion="lite"] .scrim { backdrop-filter: none; }
@media (prefers-reduced-motion: reduce) {
  .app *, .app *::before, .app *::after { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; scroll-behavior: auto !important; }
}

/* ---------- responsive: by the app's own width ---------- */
@container app (max-width: 1279px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .home__side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container app (max-width: 1099px) {
  .rail { width: 84px; }
  .rail .brand__text, .rail .nav__label, .rail .nav__badge, .rail .rail__group, .rail .me__text, .rail .rail__collapse { opacity: 0; pointer-events: none; }
  .queue { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .set-grid { grid-template-columns: minmax(0, 1fr); }
}
@container app (max-width: 1000px) {
  .search { display: none; }
  .top__search-icon { display: grid; }
}
@container app (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-inline-start: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line-2); }
  .duo { grid-template-columns: minmax(0, 1fr); }
  .home__side { grid-template-columns: minmax(0, 1fr); }
}
@container app (max-width: 699px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .dock { display: flex; }
  .top { min-height: 60px; gap: 6px; }

    if (d === 'modal') confirmBox({ tone: 'gold', icon: 'send', title: 'تنشر ٣ تعديلات؟', message: 'هتبان على الموقع على طول.', ok: 'انشر' }).then(function (ok) { if (ok) toast('اتنشر'); });
    if (d === 'drawer') editPerson(PEOPLE[2]);
    if (d === 'full') FORMS.news();
    if (d === 'dropdown') openMenu(t, [{ icon: 'edit', label: 'تعديل' }, { icon: 'copy', label: 'نسخة منها' }, { icon: 'archive', label: 'أرشفة' }, '-', { icon: 'trash', label: 'امسح', danger: true }]);
    if (d === 'typed') confirmBox({ title: 'تمسح العنصر ده؟', message: 'المسح مش بيرجع.', typed: 'امسح', ok: 'امسح' });
    if (d === 'toast') toast('اتأرشف', { icon: 'archive', undo: function () {} });
    if (d === 'logout') logout();
  },
  'flip-check': function (t) { t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); Snd.play('pop'); },
  seg: function (t) { $$('button', t.parentNode).forEach(function (b) { b.setAttribute('aria-pressed', b === t); }); Snd.play('tap'); },
  tourpick: function (t) {
    openMenu(t, [['edit', 'تعديل حساب', 'edit'], ['password', 'تغيير باسورد', 'key'], ['logout', 'تسجيل خروج', 'logout'], ['details', 'فتح تفاصيل عنصر', 'eye'], ['nav', 'التنقل بين الأقسام', 'layout']].map(function (x) { return { icon: x[2], label: x[1], run: function () { tour(x[0]); } }; }));
  }
});
function exportRun(t) {
  btnState(t, 'loading', 'بنجهّز…');
  setTimeout(function () { btnState(t, 'success', 'جاهز'); toast('اتنزل: shabab-2026-11-03.xlsx', { icon: 'download' }); setTimeout(function () { if (t.isConnected) btnState(t, 'idle'); }, 1400); }, 1100);
}

/* ================= boot: the panel loads underneath the intro ================= */
function boot() {
  applyPrefs();
  S.area = ROLES[S.role].home;
  renderRail(); renderTop(); renderTabs(); renderDock();
  $('#view').innerHTML = '<div class="skel" style="height:140px"></div><div class="skel" style="height:110px"></div><div class="skel" style="height:220px"></div>';
  playIntro(false);
  // the bootstrap reply (simulated): the screen is usable the moment it lands, intro or not
  setTimeout(function () { S.booted = true; renderView(false); }, 450);
}

/* ================= preview chrome ================= */
var stage = document.getElementById('stage');
document.getElementById('pv-role').addEventListener('change', function (e) {
  S.role = e.target.value; S.person = null; closeLayer(true); endTour();
  var gt = $('.gate'); if (gt) gt.remove();
  S.area = ROLES[S.role].home;
  renderAll(true);
  toast('دلوقتي إنت: ' + me().name + ' · ' + ROLES[S.role].label, { icon: 'shield' });
});
$$('#pv-device button', document).forEach(function (b) {
  b.addEventListener('click', function () {
    S.device = b.dataset.dev; stage.dataset.device = S.device;
    $$('#pv-device button', document).forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  });
});
document.getElementById('pv-intro').addEventListener('click', function () { endTour(); playIntro(true); });
document.getElementById('pv-tour').addEventListener('change', function (e) { var v = e.target.value; e.target.value = ''; if (v) tour(v); });
document.getElementById('pv-ui').addEventListener('click', function () { endTour(); closeLayer(true); var g = $('.gate'); if (g) g.remove(); go('ui'); });
document.getElementById('pv-denied').addEventListener('click', function () {
  var target = ['bookings', 'comps', 'content', 'games', 'activity', 'youth'].filter(function (k) { return !allowed(k); })[0];
  if (!target) { toast('الأدمن الأساسي عنده كل حاجة. غيّر الدور الأول من «الدور».', { icon: 'shield' }); return; }
  S.area = target; S.person = null; closeLayer(true);
  renderAll(true);
});

boot();
})();
</script>
