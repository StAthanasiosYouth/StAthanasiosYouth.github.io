<title>معاينة الموقع العام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* One dark world on purpose (DESIGN.md: navy carries the surface, gold is the identity accent).
   Layout: the preview strip on top; under it the site in a device frame. The site lays itself out
   by its own width (container queries), so the phone frame on a computer behaves like a phone. */
:root {
  --pv-bg: #01050b; --pv-fg: #dfe6f0; --pv-mute: #8b9ab0; --pv-line: rgba(255, 255, 255, .12); --pv-chip: #0a1422; --pv-acc: #e2bc6c;
  --ink: #020914; --bg: #030b18; --navy-950: #041124; --navy-900: #061a31; --navy-800: #0b2a4c; --navy-700: #12385f;
  --gold: #d7aa50; --gold-hi: #f2d28b; --gold-ink: #1b1306; --gold-soft: rgba(215, 170, 80, .14); --gold-line: rgba(242, 210, 139, .2);
  --text: #f5f7fb; --text-2: #b9c5d6; --text-3: #8d9db3; --sea: #4cc3cb; --carmine: #c8433a; --ok: #5ad7a0;
  --line-2: rgba(255, 255, 255, .08);
  --f-ui: "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  --f-display: "Aref Ruqaa", "Cairo", "Times New Roman", serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--pv-bg); color: var(--pv-fg); font-family: var(--f-ui); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
a { color: inherit; }

/* ---------- preview chrome ---------- */
.stage { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.pvbar { display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px dashed var(--pv-line); font-size: 13px; white-space: nowrap; }
.pvbar::-webkit-scrollbar { display: none; }
.pvbar__tag { font-weight: 800; color: var(--pv-acc); display: inline-flex; gap: 6px; align-items: center; }
.pvbar__tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--pv-acc); display: inline-block; }
.pvbar label { color: var(--pv-mute); display: inline-flex; gap: 6px; align-items: center; }
.pvseg { display: inline-flex; border: 1px solid var(--pv-line); border-radius: 999px; padding: 2px; background: var(--pv-chip); }
.pvseg button, .pvbtn { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.pvseg button[aria-pressed="true"] { background: var(--pv-fg); color: var(--pv-bg); }
.pvbtn { border: 1px solid var(--pv-line); background: var(--pv-chip); text-decoration: none; display: inline-block; }
.pvbar__note { color: var(--pv-mute); margin-inline-start: auto; }
.device-wrap { min-height: 0; display: grid; place-items: center; overflow: hidden; }
.device { width: 100%; height: 100%; position: relative; transform: translateZ(0); overflow: hidden; }
.stage[data-device="phone"] .device { width: min(390px, 100%); height: min(844px, calc(100% - 28px)); border-radius: 46px; border: 11px solid #090d14; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06); }

/* ---------- the site ---------- */
.site { container: site / inline-size; position: relative; height: 100%; background: var(--ink); color: var(--text); font-size: 16px; line-height: 1.75; overflow: hidden; }
.site__scroll { height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scroll-behavior: auto; }
.site::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 40% at 50% 0%, rgba(215, 170, 80, .08), transparent 70%); z-index: 0; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico--sm { width: 18px; height: 18px; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

/* top bar: the same on every page */
.bar { position: sticky; top: 0; z-index: 20; height: 60px; }
.bar__in { height: 100%; display: flex; align-items: center; gap: 10px; }
.bar::before { content: ""; position: absolute; inset: 0 0 -26px; background: linear-gradient(180deg, rgba(2, 9, 20, .94) 0%, rgba(2, 9, 20, .78) 60%, transparent); backdrop-filter: blur(10px); -webkit-mask: linear-gradient(180deg, #000 70%, transparent); mask: linear-gradient(180deg, #000 70%, transparent); opacity: var(--bar-o, 0); transition: opacity .25s; pointer-events: none; }
.bar > * { position: relative; }
.home-link { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 4px 6px 4px 10px; border-radius: 14px; min-width: 0; }
.home-link img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 1px var(--gold-line); flex: none; }
.home-link b { font-family: var(--f-display); font-size: 19px; color: var(--gold-hi); white-space: nowrap; font-weight: 700; line-height: 1.4; }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid var(--gold-line); background: rgba(6, 26, 49, .7); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: transform .35s var(--spring), background-color .2s; }
.back:hover { background: var(--navy-800); }
.back:active { transform: scale(.95); }
.bar__title { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s var(--ease); }
.bar.is-folded .bar__title { opacity: 1; transform: none; }
.bar__spacer { flex: 1; }
.ibtn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(6, 26, 49, .6); display: grid; place-items: center; cursor: pointer; color: var(--text-2); flex: none; transition: transform .35s var(--spring), color .2s; }
.ibtn:hover { color: var(--text); }
.ibtn:active { transform: scale(.92); }
.ibtn .dot { position: absolute; top: 6px; inset-inline-end: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--carmine); box-shadow: 0 0 0 2px var(--ink); }
.door { width: 30px; height: 34px; border-radius: 999px 999px 7px 7px; border: 1.5px solid var(--gold); display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; color: var(--gold-hi); }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-3); padding: 2px 0 10px; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; color: var(--text-2); cursor: pointer; padding: 0; font-weight: 600; }
.crumbs button:hover { color: var(--gold-hi); text-decoration: underline; }
.crumbs b { color: var(--text); font-weight: 700; }

/* bottom nav (phone, proposal) */
.tabbar { position: absolute; inset-inline: 0; bottom: 0; z-index: 25; display: none; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(0deg, rgba(2, 9, 20, .98), rgba(2, 9, 20, .86)); backdrop-filter: blur(12px); border-top: 1px solid var(--line-2); }
.tabbar__in { display: flex; justify-content: space-around; }
.tab { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-3); font-size: 11px; font-weight: 700; padding: 6px 0; cursor: pointer; border-radius: 14px; transition: color .2s; }
.tab[aria-current="page"] { color: var(--gold-hi); }
.tab[aria-current="page"] .ico { filter: drop-shadow(0 0 8px rgba(242, 210, 139, .5)); }

/* pages and their transitions */
.page { position: relative; z-index: 1; min-height: 100%; padding-bottom: 40px; }
.page.in-fwd { animation: in-fwd .5s var(--ease) both; }
.page.in-back { animation: in-back .45s var(--ease) both; }
.page.in-fade { animation: in-fade .5s var(--ease) both; }
@keyframes in-fwd { from { opacity: 0; transform: translateX(-28px); } }
@keyframes in-back { from { opacity: 0; transform: translateX(28px); } }
@keyframes in-fade { from { opacity: 0; } }
.fly { position: absolute; z-index: 40; object-fit: cover; pointer-events: none; }

/* shared pieces */
.widget { position: relative; background: linear-gradient(180deg, rgba(18, 56, 95, .35), rgba(6, 26, 49, .9)); border: 1px solid var(--gold-line); border-radius: 24px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); padding: 20px; min-width: 0; }
.sec { margin-top: 34px; }
.sec__head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
.sec__head h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; line-height: 1.5; text-wrap: balance; }
.more { border: 0; background: none; color: var(--gold-hi); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 2px; align-items: center; padding: 6px 4px; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 15px; cursor: pointer; white-space: nowrap; transition: transform .4s var(--spring), filter .2s, box-shadow .2s; box-shadow: 0 10px 26px -12px var(--gold); text-decoration: none; }
.pill:hover { filter: brightness(1.06); }
.pill:active { transform: scale(.955); }
.pill--ghost { background: rgba(6, 26, 49, .7); color: var(--text); border: 1px solid var(--gold-line); box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(255, 255, 255, .06); color: var(--text-2); white-space: nowrap; }
.chip--gold { background: var(--gold-soft); color: var(--gold-hi); }
.chip--sea { background: rgba(76, 195, 203, .12); color: var(--sea); }
.chip--live { background: rgba(200, 67, 58, .16); color: #ff9c92; }
.ex { font-size: 11px; font-weight: 700; color: var(--text-3); border: 1px dashed rgba(255, 255, 255, .2); border-radius: 999px; padding: 1px 8px; }
.ruqaa { font-family: var(--f-display); font-weight: 700; color: var(--gold-hi); line-height: 1.6; }
.muted { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* cards that open pages */
.card { position: relative; display: flex; flex-direction: column; text-align: start; padding: 0; border: 1px solid var(--gold-line); border-radius: 22px; overflow: hidden; background: var(--navy-900); cursor: pointer; color: inherit; transition: transform .45s var(--spring), border-color .2s, box-shadow .3s; min-width: 0; }
.card:hover { transform: translateY(-3px); border-color: rgba(242, 210, 139, .45); box-shadow: 0 18px 40px -22px rgba(215, 170, 80, .45); }
.card:active { transform: scale(.98); }
.card__img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; max-width: 100%; background: var(--navy-800); }
.card__body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card__body h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.5; }
.card__body p { margin: 0; font-size: 14px; color: var(--text-2); line-height: 1.7; }
.card__kind { position: absolute; top: 12px; inset-inline-start: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }

/* ---------- home A: the widget hub, evolved ---------- */
.heroA { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding: 26px 0 8px; }
.heroA__id { display: flex; gap: 22px; align-items: center; }
.arch-logo { position: relative; flex: none; width: 128px; height: 154px; border-radius: 999px 999px 22px 22px; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, rgba(242, 210, 139, .22), transparent 62%), var(--navy-900); box-shadow: inset 0 0 0 1px var(--gold-line), 0 0 0 5px rgba(2, 9, 20, .9), 0 0 0 6px rgba(242, 210, 139, .25); }
.arch-logo img { width: 96px; height: 96px; border-radius: 50%; }
.arch-logo::before { content: ""; position: absolute; top: -16px; left: 50%; width: 2px; height: 12px; background: var(--gold); box-shadow: -5px 4px 0 -0px transparent; transform: translateX(-50%); }
.arch-logo::after { content: ""; position: absolute; top: -12px; left: 50%; width: 10px; height: 2px; background: var(--gold); transform: translateX(-50%); }
.heroA__name { margin: 0; font-family: var(--f-display); font-size: clamp(32px, 5cqi, 48px); line-height: 1.5; color: var(--gold-hi); font-weight: 700; }
.heroA__sub { margin: 0; color: var(--text-2); font-size: 15px; }
.heroA__tag { margin: 6px 0 0; color: var(--text); font-weight: 700; }
.meet { display: flex; flex-direction: column; gap: 14px; }
.meet__top { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 14px; font-weight: 700; }
.meet__big { margin: 0; font-family: var(--f-display); font-size: clamp(34px, 5cqi, 46px); color: var(--gold-hi); line-height: 1.45; font-weight: 700; }
.meet__when { margin: -6px 0 0; font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.week span { text-align: center; padding: 6px 0; border-radius: 12px; font-size: 11px; color: var(--text-3); line-height: 1.4; }
.week span b { display: block; font-size: 15px; color: var(--text-2); }
.week span.is-today { background: rgba(255, 255, 255, .06); color: var(--text); }
.week span.is-meet { background: var(--gold); color: var(--gold-ink); }
.week span.is-meet b { color: var(--gold-ink); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.qa { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 20px; border: 1px solid var(--line-2); background: rgba(6, 26, 49, .6); cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text-2); transition: transform .4s var(--spring), border-color .2s, color .2s; }
.qa:hover { border-color: var(--gold-line); color: var(--text); }
.qa:active { transform: scale(.95); }
.qa span { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(180deg, var(--navy-700), var(--navy-800)); color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold-line); }
.qa span.sea { color: var(--sea); }
.feat { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); padding: 0; overflow: hidden; }
.feat img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 200px; max-width: 100%; }
.feat__body { padding: 22px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.feat__body h3 { margin: 0; font-size: 22px; font-weight: 800; }
.feat__body p { margin: 0; color: var(--text-2); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.news { display: flex; flex-direction: column; }
.news__item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2); text-align: start; border-inline: 0; border-top: 0; background: none; cursor: pointer; color: inherit; align-items: center; }
.news__item:last-child { border-bottom: 0; }
.news__item i { width: 64px; height: 64px; border-radius: 16px; flex: none; display: grid; place-items: center; background: linear-gradient(160deg, var(--navy-700), var(--navy-900)); color: var(--gold-hi); font-style: normal; box-shadow: inset 0 0 0 1px var(--gold-line); }
.news__item b { display: block; font-size: 15px; line-height: 1.6; }
.news__item small { color: var(--text-3); font-size: 13px; }
.mapart { width: 100%; height: 140px; border-radius: 16px; display: block; }
.contact { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.contact:last-of-type { border-bottom: 0; }
.contact__av { width: 46px; height: 54px; border-radius: 999px 999px 12px 12px; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--gold-hi); background: var(--navy-800); box-shadow: inset 0 0 0 1px var(--gold-line); }
.contact div { flex: 1; min-width: 0; }
.contact b { display: block; }
.contact small { color: var(--text-3); }
.socials { display: flex; gap: 12px; flex-wrap: wrap; }
.social { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-weight: 700; border: 0; background: none; cursor: pointer; }
.social span { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
.foot { margin-top: 44px; padding: 22px 0 10px; border-top: 1px solid var(--line-2); text-align: center; color: var(--text-3); font-size: 13px; }
.foot b { color: var(--text-2); }

/* ---------- home B: a platform direction ---------- */
.heroB { position: relative; height: min(76cqi, 560px); min-height: 380px; margin-top: -60px; overflow: hidden; }
.heroB__slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s var(--ease); }
.heroB__slide.is-on { opacity: 1; }
.heroB__slide img, .heroB__slide svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 7s linear; }
.heroB__slide.is-on img, .heroB__slide.is-on svg { transform: scale(1); }
.heroB__shade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--ink) 4%, rgba(2, 9, 20, .55) 45%, rgba(2, 9, 20, .25) 70%, rgba(2, 9, 20, .7) 100%), linear-gradient(270deg, rgba(2, 9, 20, .75), transparent 60%); }
.heroB__text { position: absolute; inset-inline: 0; bottom: 34px; }
.heroB__text h2 { margin: 6px 0 4px; font-family: var(--f-display); font-size: clamp(36px, 7cqi, 64px); color: var(--gold-hi); line-height: 1.4; font-weight: 700; max-width: 14ch; }
.heroB__text p { margin: 0 0 16px; color: var(--text); max-width: 46ch; font-size: 16px; }
.dots { display: flex; gap: 6px; margin-top: 16px; }
.dots button { width: 26px; height: 4px; border-radius: 4px; border: 0; background: rgba(255, 255, 255, .25); cursor: pointer; padding: 0; transition: width .3s var(--ease), background-color .3s; }
.dots button[aria-pressed="true"] { width: 44px; background: var(--gold); }
.today { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 20px; background: rgba(6, 26, 49, .85); border: 1px solid var(--gold-line); margin-top: 6px; flex-wrap: wrap; }
.today__day { flex: none; padding-inline: 4px; font-family: var(--f-display); font-size: 26px; color: var(--gold-hi); line-height: 1.4; }
.today div { flex: 1; min-width: 180px; }
.today b { display: block; }
.poster { position: relative; display: block; text-align: start; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: var(--navy-900); cursor: pointer; color: inherit; aspect-ratio: 3 / 4; transition: transform .45s var(--spring); }
.poster:hover { transform: scale(1.03); }
.poster img, .poster svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(2, 9, 20, .95), transparent 55%); }
.poster__t { position: absolute; z-index: 1; inset-inline: 12px; bottom: 12px; }
.poster__t b { display: block; font-size: 16px; line-height: 1.5; }
.poster__t small { color: var(--text-2); font-size: 12px; }
.railB { grid-auto-columns: minmax(170px, 210px); }
.railB--wide { grid-auto-columns: minmax(260px, 340px); }
.railB--wide .poster { aspect-ratio: 16 / 9; }
.infoB { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* ---------- inner pages ---------- */
.hero { position: relative; margin-top: -60px; height: min(58cqi, 460px); min-height: 300px; overflow: hidden; }
.hero img, .hero svg.hero__art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--ink) 2%, rgba(2, 9, 20, .5) 50%, rgba(2, 9, 20, .55) 100%); }
.head { position: relative; z-index: 1; margin-top: -110px; }
.head h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 7cqi, 62px); line-height: 1.45; color: var(--gold-hi); text-wrap: balance; }
.head__tag { margin: 4px 0 14px; font-size: 17px; color: var(--text); }
.toc { position: sticky; top: 60px; z-index: 15; margin-top: 22px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; background: linear-gradient(180deg, rgba(2, 9, 20, .96), rgba(2, 9, 20, .9)); border-bottom: 1px solid var(--line-2); }
.toc::-webkit-scrollbar { display: none; }
.toc button { border: 0; background: none; height: 36px; padding: 0 14px; border-radius: 999px; color: var(--text-3); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background-color .2s, color .2s; }
.toc button[aria-current="true"] { background: var(--gold-soft); color: var(--gold-hi); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }

    '<section class="sec anchor widget" id="e-bring"><h2 style="font-size:18px;margin:0 0 8px">هات معاك</h2><p class="muted" style="margin:0">بطاقة أو شهادة ميلاد · مية · كاب · حذاء مريح</p></section>' +
    '<section class="sec anchor faq" id="e-faq"><details><summary>أقدر أدفع على مرتين؟</summary><p>أيوه، تدفع جزء دلوقتي والباقي قبل الرحلة بأسبوع. حسابك بيقولك فاضل كام.</p></details><details><summary>لو اعتذرت الفلوس بترجع؟</summary><p>لحد قبل الرحلة بـ ٣ أيام، كلم أمين الخدمة.</p></details></section></div>' +
    '<aside class="aside"><div class="widget"><small class="muted">الاشتراك</small><p style="margin:0;font-size:26px;font-weight:800">' + e.price + '</p><p class="muted" style="margin:0 0 14px">فاضل ' + left + ' مكان من ' + ar(e.seats[1]) + '</p><button class="pill" type="button" data-act="book" style="width:100%">' + ico('ticket', 'ico--sm') + 'احجز مكانك</button><p class="muted" style="margin:10px 0 0;font-size:13px">InstaPay أو محفظة أو كاش مع الخادم.</p></div>' +
    '<button class="pill pill--ghost" type="button" data-act="share">' + ico('share', 'ico--sm') + 'شارك الفعالية</button></aside></div></div>' +
    '<div class="sticky-cta"><div class="wrap"><div><b>' + e.price + '</b><br><small class="muted">فاضل ' + left + ' مكان</small></div><button class="pill" type="button" data-act="book">' + ico('ticket', 'ico--sm') + 'احجز مكانك</button></div></div>' +
    '<div class="wrap">' + foot() + '</div>';
};
VIEW.article = function (id) {
  var n = NEWS.filter(function (x) { return x.id === id; })[0] || NEWS[0];
  return '<div class="wrap" style="padding-top:12px"><article class="article">' + crumbs() + '<span class="row"><span class="chip chip--gold">جديد الأسرة</span><span class="muted" style="font-size:13px">' + n.date + '</span><span class="ex">مثال</span></span><h1 class="ruqaa" style="font-size:clamp(32px,6cqi,48px);margin:8px 0 14px;line-height:1.5">' + n.title + '</h1>' +
    '<img class="cover" src="' + IMG.voice + '" alt=""><div class="prose sec"><p>' + n.text + '</p><p>تقدر تتابع كل الجديد من الجرس فوق، أو من صفحة الفعاليات.</p></div>' +
    '<div class="row sec"><button class="pill" type="button" data-act="go" data-p="event" data-arg="conf">صفحة المؤتمر</button><button class="pill pill--ghost" type="button" data-act="share">' + ico('share', 'ico--sm') + 'شارك</button></div></article>' + foot() + '</div>';
};
VIEW.points = function () { return '<div class="wrap" style="padding-top:12px">' + crumbs() + '<h1 class="ruqaa" style="font-size:clamp(34px,6cqi,52px);margin:0">نقاطي والمسابقات</h1><p class="muted">نفس النظام: نفس الشريط فوق، ونفس الرجوع. (الصفحة الحالية موجودة، هنا مكانها في التنقل بس.)</p><div class="grid3 is-list"><div class="widget"><small class="muted">نقاطك</small><p style="margin:0;font-size:34px;font-weight:800" class="num">٢٤٠</p></div><div class="widget"><small class="muted">مسابقات مفتوحة</small><p style="margin:0;font-size:34px;font-weight:800">٢</p></div></div>' + foot() + '</div>'; };
VIEW.account = function () { return '<div class="wrap" style="padding-top:12px">' + crumbs() + '<h1 class="ruqaa" style="font-size:clamp(34px,6cqi,52px);margin:0">حسابي</h1><p class="muted">صفحة «العتبة» الحالية (DESIGN.md) بتدخل نفس النظام: الشريط فوق ثابت، والرجوع بيرجعك مكانك.</p>' + foot() + '</div>'; };

/* ================= sheets ================= */
function sheet(html) {
  var L = $('#layer');
  L.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet__handle"></div>' + html + '</div>';
}
function book(step) {
  var e = EVENTS.filter(function (x) { return x.id === S.arg; })[0] || EVENTS[0];
  var body = step === 1
    ? '<h3>احجز: ' + e.title + '</h3><p class="muted" style="margin:0">خطوة ١ من ٣ · مين جاي؟</p><div class="stepper"><i class="on"></i><i></i><i></i></div><div class="count"><span>كبار</span><div><button type="button" data-act="cnt" data-d="-1">−</button><b class="num" id="cnt">١</b><button type="button" data-act="cnt" data-d="1">+</button></div></div><div class="row" style="margin-top:18px"><button class="pill" type="button" data-act="book2" style="flex:1">التالي</button></div>'
    : step === 2
      ? '<h3>الدفع</h3><p class="muted" style="margin:0">خطوة ٢ من ٣</p><div class="stepper"><i class="on"></i><i class="on"></i><i></i></div><div class="widget" style="padding:14px"><b>InstaPay</b><p class="muted" style="margin:4px 0 0">حوّل ' + e.price + ' وارفع صورة التحويل.</p></div><div class="row" style="margin-top:18px"><button class="pill" type="button" data-act="book3" style="flex:1">ابعت الحجز</button></div>'
      : '<div style="text-align:center;padding:10px 0"><div style="width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:rgba(90,215,160,.14);color:var(--ok)">' + ico('check') + '</div><h3>اتسجل حجزك</h3><p class="muted">هيوصلك إيميل لما الدفع يتراجع. تقدر تتابعه من «حسابي».</p><div class="stepper"><i class="on"></i><i class="on"></i><i class="on"></i></div><button class="pill" type="button" data-act="close" style="width:100%">تمام</button></div>';
  sheet(body);
}

/* ================= actions ================= */
var ACT = {
  go: function (t) { go(t.dataset.p, t.dataset.arg || null, t.closest('.card, .poster, .media-card') ? t : null); },
  tab: function (t) { go(t.dataset.p, null, null, 'tab'); },
  back: back,
  toast: function (t) { toast(t.dataset.m); },
  slide: function (t) { setSlide(+t.dataset.i); },
  toc: function (t) { var a = $('#' + t.dataset.to); scroller.scrollTo({ top: scroller.scrollTop + a.getBoundingClientRect().top - site.getBoundingClientRect().top - 118, behavior: reduced() ? 'auto' : 'smooth' }); },
  filter: function (t) { $$('[data-act="filter"]').forEach(function (b) { b.setAttribute('aria-pressed', b === t); }); },
  video: function (t) { sheet('<h3>' + t.dataset.t + '</h3><p class="muted" style="margin:0 0 12px">المقطع بيشتغل هنا بالصوت، وتحته «شاهد المسرحية كاملة».</p><img src="' + t.querySelector('img').src + '" alt="" style="width:100%;border-radius:16px;display:block"><div class="row" style="margin-top:14px"><button class="pill" type="button" data-act="toast" data-m="بيفتح فيسبوك">شاهد المسرحية كاملة</button><button class="pill pill--ghost" type="button" data-act="close">اقفل</button></div>'); },
  share: function () { sheet('<h3>شارك</h3><p class="muted">ابعت اللينك لصحابك، أو خلّيهم يصوّروا الكود.</p><div class="row"><button class="pill" type="button" data-act="toast" data-m="اتنسخ اللينك">انسخ اللينك</button><button class="pill pill--ghost" type="button" data-act="close">اقفل</button></div>'); },
  book: function () { book(1); }, book2: function () { book(2); }, book3: function () { book(3); },
  cnt: function (t) { var c = $('#cnt'), n = Math.max(1, Math.min(6, ('٠١٢٣٤٥٦٧٨٩'.indexOf(c.textContent)) + (+t.dataset.d))); c.textContent = '٠١٢٣٤٥٦٧٨٩'[n]; },
  close: function () { $('#layer').innerHTML = ''; }
};
function wire() { if (S.page === 'home' && S.dir === 'B') slideText(); }
site.addEventListener('click', function (e) { var t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#layer').firstChild) ACT.close(); else if (S.page !== 'home') back(); } });

/* ================= preview chrome ================= */
var stage = document.getElementById('stage');
function seg(id, fn) { Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b, i, all) { b.addEventListener('click', function () { Array.prototype.forEach.call(all, function (x) { x.setAttribute('aria-pressed', x === b); }); fn(b.dataset.v || b.dataset.dev); }); }); }
seg('pv-dir', function (v) { S.dir = v; site.dataset.dir = v; if (v === 'B' && !S.tabbarTouched) setTab(true); if (v === 'A' && !S.tabbarTouched) setTab(false); S.stack = []; show('home', null, 'in-fade', 0); });
seg('pv-device', function (v) { stage.dataset.device = v; });
function setTab(on) { S.tabbar = on; Array.prototype.forEach.call(document.querySelectorAll('#pv-tabbar button'), function (x) { x.setAttribute('aria-pressed', (x.dataset.v === 'on') === on); }); renderTabbar(); }
Array.prototype.forEach.call(document.querySelectorAll('#pv-tabbar button'), function (b) { b.addEventListener('click', function () { S.tabbarTouched = true; setTab(b.dataset.v === 'on'); }); });
document.getElementById('pv-go').addEventListener('change', function (e) { var v = e.target.value; e.target.value = ''; if (!v) return; if (v === 'home') { S.stack = []; show('home', null, 'in-fade', 0); } else go(v, v === 'event' ? 'trip' : v === 'article' ? 'n1' : null); });

show('home', null, 'in-fade', 0);
})();
</script>
