<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموقع العام — معرض التصميم (منفصل عن الأدمن)</title>
<style>
  /* the gallery page itself (not part of the site design): the public site's own gold-on-navy identity */
  @font-face { font-family: "Cairo"; src: url("../../assets/fonts/cairo-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFF; font-weight: 200 1000; }
  @font-face { font-family: "Cairo"; src: url("../../assets/fonts/cairo-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; font-weight: 200 1000; }
  :root { --gold: #d7aa50; --gold-hi: #f2d28b; --bg: #020a16; --card: #071a33; --line: rgb(242 210 139 / .16); --t2: #b9c6d6; --t3: #7d8ea3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Cairo", system-ui, sans-serif; background: radial-gradient(60% 40% at 50% -10%, #0d2b4f, transparent 70%), var(--bg); color: #eef3f9; }
  .gal { max-width: 1500px; margin: 0 auto; padding: 28px 22px 80px; }
  h1 { margin: 0; font-size: 26px; color: var(--gold-hi); } .lead { color: var(--t2); margin: 6px 0 22px; line-height: 1.8; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .toc a { color: var(--t2); text-decoration: none; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
  .round { margin: 40px 0 16px; font-size: 22px; color: var(--gold-hi); }
  .shot { margin-bottom: 34px; padding: 20px; border-radius: 24px; border: 1px solid var(--line); background: linear-gradient(180deg, rgb(13 40 73 / .5), rgb(7 26 51 / .8)); }
  .shot h2 { margin: 0 0 6px; font-size: 19px; } .shot p { margin: 0 0 12px; color: var(--t2); font-size: 13.5px; line-height: 1.8; }
  .inv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .inv div { padding: 12px 14px; border-radius: 14px; background: rgb(2 12 24 / .5); border: 1px solid rgb(255 255 255 / .07); font-size: 13px; line-height: 1.8; color: var(--t2); }
  .inv b { display: block; color: var(--gold-hi); font-size: 12.5px; margin-bottom: 4px; }
  .pair { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
  .pair .col { max-height: 820px; overflow: auto; border-radius: 14px; border: 1px solid rgb(255 255 255 / .12); }
  .pair img { width: 100%; display: block; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: rgb(215 170 80 / .15); color: var(--gold-hi); margin-inline-start: 8px; vertical-align: middle; }
  .tag--live { background: rgb(79 214 156 / .14); color: #4fd69c; }
  .live { display: inline-block; margin-top: 8px; font-size: 12.5px; color: var(--gold-hi); }
  .frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .frames img { width: 100%; border-radius: 10px; border: 1px solid rgb(255 255 255 / .12); display: block; }
  .frames small { display: block; text-align: center; color: var(--t3); margin-top: 4px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } td, th { padding: 8px 10px; border-bottom: 1px solid rgb(255 255 255 / .07); text-align: start; vertical-align: top; } th { color: var(--gold-hi); font-size: 12px; }
  @media (max-width: 900px) { .pair, .inv { grid-template-columns: 1fr; } .frames { grid-template-columns: 1fr 1fr; } }
</style>
<body>
<div class="gal">
  <h1>الموقع العام — معرض التصميم</h1>
  <p class="lead">معرض مستقل عن الأدمن (<code>docs/phase8b/</code>). الهوية بتاعة الموقع نفسه (الدهبي على الكحلي، وخطوط الموقع). كل شاشة: كمبيوتر (1440) وجنبها موبايل (390). <b>تصميم ومراجعة بس، مفيش تنفيذ ولا نشر.</b></p>
  <nav class="toc" id="toc"></nav>
  <div id="list"></div>
</div>
<script>

CUR.forEach(function (c) {
