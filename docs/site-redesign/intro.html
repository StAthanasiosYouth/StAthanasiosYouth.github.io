<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الموقع العام — الانترو المقترح (S1 · نسخة ٢)</title>
<!--
  S1 v2 (owner notes 2026-11-05): clean solid text with nothing behind it, a calm single card turn (ease-in-out),
  the phone arrives with a clean screen and the QR shows only when its camera scans, no crosses/ornaments,
  a softer gold logo, and sound cues for every stage (synthesised here; real SFX files at build time).
  ?v=first (default) | ?v=member · ?freeze=<ms> pauses at that moment · «اعرض بالصوت» replays with sound.
-->
<style>
  @font-face { font-family: "Cairo"; src: url("../../assets/fonts/cairo-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFF; font-weight: 200 1000; }
  @font-face { font-family: "Cairo"; src: url("../../assets/fonts/cairo-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; font-weight: 200 1000; }
  @font-face { font-family: "Aref Ruqaa"; src: url("../../assets/fonts/aref-ruqaa-arabic.woff2") format("woff2"); font-weight: 400 700; }
  :root { --champagne: #e3cf9f; --champagne-2: #c9ad74; --ink: #eef2f7; --ink-2: #b7c3d3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020814; font-family: "Cairo", system-ui, sans-serif; color: var(--ink); }
  .stage { position: fixed; inset: 0; overflow: hidden; perspective: 1600px; display: grid; place-items: center; cursor: pointer; }
  .room { position: absolute; inset: 0; background: radial-gradient(55% 50% at 50% 46%, #0c2546 0%, #061630 52%, #020814 100%); opacity: 0; }
  .dust { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
  .site { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 40%, #0e2a50 0%, #071b38 45%, #030b1a 100%); opacity: 0; }
  .glow { position: absolute; left: 50%; top: 40%; width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border-radius: 50%; background: radial-gradient(circle, rgb(227 207 159 / .12), transparent 65%); opacity: 0; }
  .card { position: absolute; width: min(74vw, 600px); aspect-ratio: 1134 / 543; transform-style: preserve-3d; opacity: 0; will-change: transform; }
  .card__face { position: absolute; inset: 0; border-radius: 4.2%/8.8%; overflow: hidden; box-shadow: 0 36px 80px -34px rgb(0 0 0 / .95), 0 0 0 1px rgb(227 207 159 / .28); }
  .card__face img { width: 100%; height: 100%; display: block; }
  .card__face--qr { transform: rotateY(180deg); opacity: 0; }
  .card__sheen { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgb(255 248 230 / .16) 50%, transparent 65%); transform: translateX(-130%); }
  .shadow { position: absolute; width: min(60vw, 480px); height: 40px; margin-top: min(36vw, 300px); border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / .55), transparent); opacity: 0; filter: blur(6px); }
  .qrmark { position: absolute; right: 15.2%; top: 25%; width: 22.6%; height: 46.6%; border-radius: 10px; box-shadow: 0 0 0 2px var(--champagne), 0 0 22px 2px rgb(227 207 159 / .45); opacity: 0; transform: rotateY(180deg) translateZ(2px); }
  .phone { position: absolute; width: min(28vw, 220px); aspect-ratio: 9 / 19; border-radius: 34px; background: linear-gradient(160deg, #1a2231, #0a0e15); padding: 8px; box-shadow: 0 0 0 1.5px #2c3647, 0 40px 80px -28px #000; opacity: 0; will-change: transform; }
  .phone__screen { position: relative; width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: linear-gradient(170deg, #10233f, #050b16 70%); }
  .phone__island { position: absolute; top: 9px; left: 50%; width: 30%; height: 17px; margin-left: -15%; border-radius: 12px; background: #000; z-index: 5; }
  .phone__idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink-2); font-size: 12px; font-weight: 700; }
  .phone__idle i { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgb(255 255 255 / .07); border: 1px solid rgb(255 255 255 / .12); }
  .phone__idle svg { width: 22px; height: 22px; fill: none; stroke: var(--champagne); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .phone__cam { position: absolute; inset: 0; background-image: url(assets/card-front.png); background-size: 470% auto; background-position: 20% 50%; opacity: 0; filter: brightness(.92); }
  .phone__ui { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
  .finder { position: relative; width: 66%; aspect-ratio: 1; }
  .finder i { position: absolute; width: 24%; height: 24%; border: 3px solid rgb(255 255 255 / .92); }
  .finder i:nth-child(1) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .finder i:nth-child(2) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .finder i:nth-child(3) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .finder i:nth-child(4) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .scanline { position: absolute; left: 6%; right: 6%; top: 6%; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--champagne), transparent); box-shadow: 0 0 10px 1px rgb(227 207 159 / .6); opacity: 0; }
  .phone__ok { position: absolute; bottom: 9%; left: 8%; right: 8%; display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 15px; background: rgb(8 22 44 / .92); border: 1px solid rgb(227 207 159 / .3); font-size: 11.5px; font-weight: 700; color: var(--ink); opacity: 0; }
  .phone__ok b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--champagne); color: #1b1407; font-size: 12px; flex: none; }
  .brand { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -54%); display: flex; flex-direction: column; align-items: center; text-align: center; width: min(92vw, 720px); }
  .logo { position: relative; width: clamp(112px, 18vmin, 168px); aspect-ratio: 1; opacity: 0; }
  .logo img { width: 100%; height: 100%; border-radius: 50%; display: block; filter: saturate(.72) brightness(.9) contrast(1.02); box-shadow: 0 0 0 1px rgb(227 207 159 / .35), 0 24px 50px -26px #000; }
  .logo__ring { position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgb(227 207 159 / .22); opacity: 0; }
  .name { margin: 26px 0 0; font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: clamp(34px, 6.6vmin, 58px); line-height: 1.35; color: var(--champagne); opacity: 0; }
  .sub { margin: 4px 0 0; font-family: "Aref Ruqaa", serif; font-size: clamp(16px, 2.7vmin, 22px); color: var(--champagne-2); opacity: 0; }
  .line { width: 64px; height: 1px; margin: 22px 0 0; background: rgb(227 207 159 / .45); transform: scaleX(0); }
  .slogan { margin: 20px 0 0; font-size: clamp(17px, 2.9vmin, 23px); font-weight: 700; color: var(--ink); opacity: 0; }
  .welcome { margin: 10px 0 0; max-width: 560px; font-size: clamp(14px, 2.2vmin, 17px); line-height: 1.9; color: var(--ink-2); opacity: 0; }
  .welcome b { color: var(--champagne); font-weight: 700; }
  .bar { position: absolute; bottom: 0; left: 0; height: 2px; width: 100%; background: rgb(227 207 159 / .55); transform-origin: right; transform: scaleX(0); }
  .ui { position: fixed; top: 14px; left: 14px; z-index: 9; display: flex; gap: 8px; }
  .ui button { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid rgb(227 207 159 / .35); background: rgb(4 14 30 / .85); color: var(--champagne); font: 700 13px Cairo, sans-serif; cursor: pointer; }
  .stagename { position: fixed; top: 14px; right: 14px; z-index: 9; padding: 6px 12px; border-radius: 999px; background: rgb(0 0 0 / .45); font-size: 12px; color: rgb(255 255 255 / .7); }
  @media (max-width: 700px) { .card { width: 86vw; } .phone { width: 34vw; } .shadow { margin-top: 44vw; width: 70vw; } .stagename { top: auto; bottom: 14px; right: 50%; transform: translateX(50%); white-space: nowrap; } }
</style>
<body>
<div class="ui"><button type="button" id="replay">↻ اعرض تاني</button><button type="button" id="sound">🔊 اعرض بالصوت</button></div>
<span class="stagename" id="stagename"></span>
<div class="stage" id="stage">
  <div class="room"></div>
  <canvas class="dust"></canvas>
  <div class="site"></div><div class="glow"></div>
  <span class="shadow"></span>
  <div class="card" id="card">
    <div class="card__face card__face--logo"><img src="assets/card-back.png" alt=""><span class="card__sheen"></span></div>
    <div class="card__face card__face--qr"><img src="assets/card-front.png" alt=""><span class="card__sheen"></span></div>
    <span class="qrmark"></span>
  </div>
  <div class="phone" id="phone"><div class="phone__screen"><span class="phone__island"></span>
    <div class="phone__idle"><i><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg></i>وجّه الكاميرا للكود</div>
    <div class="phone__cam"></div>
    <div class="phone__ui"><div class="finder"><i></i><i></i><i></i><i></i><span class="scanline"></span></div></div>
    <div class="phone__ok"><b>✓</b>بنفتح موقع الأسرة…</div></div></div>
  <div class="brand">
    <div class="logo"><span class="logo__ring"></span><img src="../../assets/img/logo-512.png" alt=""></div>
    <p class="name">أسرة البابا أثناسيوس</p>
    <p class="sub">لخدمة شعب كنيستها الحبيبة في سفاجا</p>
    <span class="line"></span>
    <p class="slogan">كل اللي يخص اجتماعنا… في مكان واحد</p>
    <p class="welcome" id="welcome">مرحبًا بك في تطبيق <b>أسرة البابا أثناسيوس</b> لخدمة شعب سفاجا</p>
  </div>
  <span class="bar"></span>
</div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var V = Q.get('v') === 'member' ? 'member' : 'first';
  var FREEZE = Q.get('freeze') != null ? Number(Q.get('freeze')) : null;
  var $ = function (s) { return document.querySelector(s); };
  var SOFT = 'cubic-bezier(.22,.61,.36,1)', INOUT = 'cubic-bezier(.65,0,.35,1)', OUT = 'cubic-bezier(.16,1,.3,1)';
  var anims = [], cues = [], timers = [], STAGES = [];
  function A(sel, kf, o) { var n = typeof sel === 'string' ? $(sel) : sel; var a = n.animate(kf, Object.assign({ fill: 'both', easing: SOFT }, o)); anims.push(a); return a; }
  function fade(sel, at, dur, from) { return A(sel, [{ opacity: 0, transform: from || 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: dur, delay: at }); }
  function stage(at, name) { STAGES.push([at, name]); }
  function cue(at, name) { cues.push([at, name]); }

  /* sound: a small synthesised set so cues and timing can be judged now (real SFX files at build time) */
  var AC = null, master = null;
  function tone(type, f1, f2, at, dur, vol) { var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + at; o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.08, dur / 4)); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05); }
  function noise(at, dur, f1, f2, vol) { var b = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate), d = b.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + at; s.buffer = b; f.type = 'bandpass'; f.Q.value = .8; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .45); g.gain.linearRampToValueAtTime(0, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); }
  var SFX = {
    open: function () { tone('sine', 110, 0, 0, 2.6, .05); tone('sine', 220, 0, .1, 2.2, .025); },
    card: function () { tone('sine', 660, 0, 0, 1.2, .025); tone('sine', 990, 0, .12, 1, .015); },
    turn: function () { noise(0, 1.6, 400, 2400, .06); },
    phone: function () { tone('sine', 1180, 0, 0, .14, .035); tone('sine', 1560, 0, .07, .12, .02); },
    scan: function () { noise(0, .7, 1800, 3200, .03); },
    ok: function () { tone('sine', 880, 0, 0, .35, .05); tone('sine', 1318.5, 0, .12, .5, .05); },
    morph: function () { noise(0, 1.3, 300, 1200, .05); tone('sine', 147, 294, 0, 1.4, .035); },
    brand: function () { [392, 493.9, 587.3, 784].forEach(function (f, i) { tone('sine', f, 0, i * .08, 2.2, .028); }); }
  };

  var cv = $('.dust'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), ps = [];
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (var i = 0; i < 46; i++) ps.push({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.4, v: .012 + Math.random() * .03, a: Math.random() * 6.28 });
  function drawDust(t) { ctx.clearRect(0, 0, innerWidth, innerHeight); ps.forEach(function (p) { var y = (p.y - p.v * t / 1000 + 2) % 1, tw = .5 + .5 * Math.sin(p.a * 3 + t / 500); ctx.beginPath(); ctx.fillStyle = 'rgba(227,207,159,' + (.05 + .22 * tw).toFixed(3) + ')'; ctx.arc((p.x + Math.sin(p.a + t / 1400) * .008) * innerWidth, y * innerHeight, p.r, 0, 6.283); ctx.fill(); }); }

  var T;
  function build() {
    anims.forEach(function (a) { a.cancel(); }); anims = []; cues = []; STAGES = [];
    if (V === 'first') {
      T = 11000;
      var w = $('#card').offsetWidth, QX = -0.26 * w, PY = 0.04 * w;
      stage(0, '١ الدخلة'); cue(0, 'open');
      A('.room', [{ opacity: 0 }, { opacity: 1 }], { duration: 1200 });
      stage(500, '٢ الكارت بيظهر'); cue(500, 'card');
      A('#card', [{ opacity: 0, transform: 'translateY(26px) rotateX(10deg) scale(.94)' }, { opacity: 1, transform: 'translateY(0) rotateX(4deg) scale(1)' }], { duration: 1300, delay: 400, easing: OUT });
      A('.shadow', [{ opacity: 0 }, { opacity: 1 }], { duration: 1200, delay: 500 });
      A('.card__face--logo .card__sheen', [{ transform: 'translateX(-130%)' }, { transform: 'translateX(130%)' }], { duration: 1400, delay: 1100, easing: 'ease-in-out' });
      stage(2100, '٣ الكارت بيلف (نص لفة)'); cue(2100, 'turn');
      A('#card', [{ transform: 'rotateX(4deg) rotateY(0deg)' }, { transform: 'rotateX(6deg) rotateY(90deg) scale(.97)', offset: .5 }, { transform: 'rotateX(0deg) rotateY(180deg) scale(1)' }], { duration: 2000, delay: 2100, easing: INOUT, fill: 'forwards' });
      A('.card__face--logo', [{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0, offset: .5 }, { opacity: 0 }], { duration: 2000, delay: 2100, easing: INOUT });
      A('.card__face--qr', [{ opacity: 0 }, { opacity: 0, offset: .5 }, { opacity: 1, offset: .5 }, { opacity: 1 }], { duration: 2000, delay: 2100, easing: INOUT });
      A('.card__face--qr .card__sheen', [{ transform: 'translateX(-130%)' }, { transform: 'translateX(130%)' }], { duration: 1200, delay: 3700, easing: 'ease-in-out' });
      stage(4400, '٤ الموبايل بيظهر (شاشة نضيفة)'); cue(4900, 'phone');
      A('#phone', [{ opacity: 0, transform: 'translate(' + (QX - 60) + 'px, 140px) rotate(-8deg) scale(.96)' }, { opacity: 1, transform: 'translate(' + QX + 'px, ' + PY + 'px) rotate(-4deg) scale(1)' }], { duration: 1100, delay: 4300, easing: OUT });
      stage(5600, '٥ الكاميرا بتشتغل');
      A('.phone__idle', [{ opacity: 1 }, { opacity: 0 }], { duration: 400, delay: 5500 });
      A('.phone__cam', [{ opacity: 0, transform: 'scale(1.08)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 5600 });
      A('.phone__ui', [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 5800 });
      stage(6200, '٦ الـScan'); cue(6200, 'scan');
      A('.scanline', [{ opacity: 0, top: '6%' }, { opacity: 1, top: '8%', offset: .1 }, { opacity: 1, top: '90%', offset: .9 }, { opacity: 0, top: '92%' }], { duration: 900, delay: 6200, easing: 'ease-in-out' });
      A('.qrmark', [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 6900 });
      A('.phone__ok', [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 7000 });
      stage(7000, '٧ اتعمل Scan ✓'); cue(7000, 'ok');
      stage(7800, '٨ التحول للموقع'); cue(7800, 'morph');
      A('#phone', [{ opacity: 1, transform: 'translate(' + QX + 'px, ' + PY + 'px) rotate(-4deg) scale(1)' }, { opacity: 0, transform: 'translate(' + QX + 'px, ' + (PY + 40) + 'px) rotate(-4deg) scale(.94)' }], { duration: 600, delay: 7700, easing: 'ease-in', fill: 'forwards' });
      A('#card', [{ opacity: 1, transform: 'rotateY(180deg) scale(1)', filter: 'blur(0)' }, { opacity: 0, transform: 'rotateY(180deg) scale(1.35)', filter: 'blur(10px)' }], { duration: 1100, delay: 7800, easing: INOUT, fill: 'forwards' });
      A('.shadow', [{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 7800, fill: 'forwards' });
      A('.site', [{ opacity: 0 }, { opacity: 1 }], { duration: 1100, delay: 7900 });
      A('.glow', [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 1600, delay: 8200 });
      stage(8600, '٩ اللوجو والاسم'); cue(8600, 'brand');
      fade('.logo', 8500, 900, 'scale(.94)');
      A('.logo__ring', [{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 8800 });
      fade('.name', 9000, 800); fade('.sub', 9300, 700, 'translateY(6px)');
      A('.line', [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 600, delay: 9600 });
      stage(9800, '١٠ السلوجان'); fade('.slogan', 9800, 700);
      stage(10400, '١١ الترحيب'); fade('.welcome', 10300, 700, 'translateY(6px)');
    } else {
      T = 4200;
      ['#card', '#phone', '.room', '.shadow'].forEach(function (s) { $(s).style.display = 'none'; });
      $('#welcome').innerHTML = 'أهلًا يا <b>مينا</b> · فاضل ٣ أيام على اجتماع الشباب';
      $('.slogan').parentNode.insertBefore($('.welcome'), $('.slogan'));
      stage(0, '١ الدخلة'); cue(0, 'open');
      A('.site', [{ opacity: 0 }, { opacity: 1 }], { duration: 700 });
      A('.glow', [{ opacity: 0 }, { opacity: 1 }], { duration: 1200, delay: 200 });
      stage(400, '٢ اللوجو والاسم'); cue(400, 'brand');
      fade('.logo', 300, 800, 'scale(.95)'); A('.logo__ring', [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 600 });
      fade('.name', 700, 700); fade('.sub', 1000, 600, 'translateY(6px)');
      A('.line', [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 500, delay: 1300 });
      stage(1500, '٣ أهلًا بالاسم'); fade('.welcome', 1500, 600, 'translateY(6px)'); fade('.slogan', 1800, 600);
    }
    A('.bar', [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: T, easing: 'linear' });
  }

  function label(t) { var n = ''; STAGES.forEach(function (s) { if (t >= s[0]) n = s[1]; }); $('#stagename').textContent = (V === 'first' ? 'أول مرة · ' : 'بعد الحساب · ') + n; }
  function run(withSound) {
    timers.forEach(clearTimeout); timers = [];
    build();
    if (FREEZE != null) { anims.forEach(function (a) { a.pause(); a.currentTime = FREEZE; }); drawDust(FREEZE); label(FREEZE); return; }
    if (withSound) {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
      cues.forEach(function (c) { timers.push(setTimeout(function () { SFX[c[1]](); }, c[0])); });
    }
    var start = performance.now();
    (function tick(now) { var t = now - start; drawDust(t); label(t); if (t < T + 1500) requestAnimationFrame(tick); })(start);
  }
  run(false);
  $('#replay').addEventListener('click', function (e) { e.stopPropagation(); run(false); });
  $('#sound').addEventListener('click', function (e) { e.stopPropagation(); run(true); });
  $('#stage').addEventListener('click', function () { timers.forEach(clearTimeout); anims.forEach(function (a) { try { a.finish(); } catch (err) {} }); });
})();
</script>
</body>
</html>
