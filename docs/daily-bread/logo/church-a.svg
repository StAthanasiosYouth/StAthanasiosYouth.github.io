  .ruqaa { font-family: 'Aref Ruqaa', serif; font-weight: 700; }
  .cairo { font-family: 'Cairo', sans-serif; }</style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2a4c"/><stop offset=".42" stop-color="#3c4f7a"/><stop offset=".66" stop-color="#c98a5a"/><stop offset=".8" stop-color="#f2c47a"/><stop offset="1" stop-color="#f7dc9b"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe8"/><stop offset=".25" stop-color="#ffe7a6" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
