    <text id="ring-credit" class="cairo" font-size="33" font-weight="700" fill="#f2d28b"><textPath href="#ringTop" startOffset="50%" text-anchor="middle"><tspan font-weight="500" fill="#d7aa50">إعداد وإشراف</tspan>  أسرة البابا أثناسيوس الرسولي للشباب</textPath></text>
    <text id="ring-church" class="cairo" font-size="37" font-weight="700" fill="#f2d28b"><textPath href="#ringBottom" startOffset="50%" text-anchor="middle">كنيسة أبي سيفين بسفاجا</textPath></text>
