<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>خبزنا اليومي — العلامة</title>
  <rect id="tile" width="512" height="512" rx="112" fill="#0b2a4c"/><g id="mark" transform="translate(256 256) scale(1.16) translate(-256 -280)">
    <defs>
      <linearGradient id="mSky" x1="0" y1="112" x2="0" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0b2a4c"/><stop offset=".42" stop-color="#3c4f7a"/><stop offset=".68" stop-color="#c98a5a"/><stop offset=".84" stop-color="#f2c47a"/><stop offset="1" stop-color="#f7dc9b"/></linearGradient>
      <radialGradient id="mSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe8"/><stop offset=".25" stop-color="#ffe7a6" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <linearGradient id="mGilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d28b"/><stop offset="1" stop-color="#8c6423"/></linearGradient>
      <linearGradient id="mRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2d28b"/><stop offset=".5" stop-color="#d7aa50"/><stop offset="1" stop-color="#8c6423"/></linearGradient>
      <linearGradient id="mGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a5c"/><stop offset="1" stop-color="#8a6236"/></linearGradient>
      <clipPath id="mWindow"><path d="M140,448 V240 A116,116 0 0 1 372,240 V448 Z"/></clipPath>
    </defs>
    <g id="window" clip-path="url(#mWindow)">
