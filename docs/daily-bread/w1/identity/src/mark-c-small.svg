      <circle id="sun-disc" cx="256" cy="336" r="96" fill="url(#mSun)"/>
      <path id="hills" d="M100,352 C150,334 200,340 236,348 C290,330 340,334 412,350 V460 H100 Z" fill="#5d5a73" opacity=".55"/>
      <path id="table" d="M100,404 C180,394 332,394 412,404 V460 H100 Z" fill="url(#mGround)"/>
    </g>
    <g id="arch" fill="none" stroke-linejoin="round">
      <path d="M128,448 V240 A128,128 0 0 1 384,240 V448" stroke="url(#mRing)" stroke-width="20"/>
      
    </g>
    <g fill="#f2d28b" id="cross"><path d="M238.1,144 H273.9 V182.1 H312 V217.9 H273.9 V256 H238.1 V217.9 H200 V182.1 H238.1 Z"/><circle cx="239" cy="144" r="9.5"/><circle cx="256" cy="135.4" r="9.5"/><circle cx="273" cy="144" r="9.5"/><circle cx="312" cy="183" r="9.5"/><circle cx="320.6" cy="200" r="9.5"/><circle cx="312" cy="217" r="9.5"/><circle cx="273" cy="256" r="9.5"/><circle cx="256" cy="264.6" r="9.5"/><circle cx="239" cy="256" r="9.5"/><circle cx="200" cy="217" r="9.5"/><circle cx="191.4" cy="200" r="9.5"/><circle cx="200" cy="183" r="9.5"/></g>
    <g id="book" transform="translate(56 98) scale(.4)">
    <path id="book-cover" d="M500,668 C420,630 300,628 214,652 L200,790 C300,770 420,778 500,812 C580,778 700,770 800,790 L786,652 C700,628 580,630 500,668 Z" fill="#6e1f24"/>
    <path id="book-gilt" d="M500,652 C424,616 312,612 228,636 L216,774 C312,754 424,760 500,796 C576,760 688,754 784,774 L772,636 C688,612 576,616 500,652 Z" fill="url(#mGilt)"/>
    <path id="page-left" d="M500,640 C426,600 320,596 240,620 L230,758 C320,738 426,744 500,782 Z" fill="#fbf3e2"/>
    <path id="page-right" d="M500,640 C574,600 680,596 760,620 L770,758 C680,738 574,744 500,782 Z" fill="#fbf3e2"/>
    <path id="page-shade" d="M500,640 C490,700 492,740 500,782 C508,740 510,700 500,640 Z" fill="#000" opacity=".14"/>
    
    <path id="ribbon" d="M506,650 L520,842 L510,830 L498,846 L494,652 Z" fill="#c8433a"/></g></g>
