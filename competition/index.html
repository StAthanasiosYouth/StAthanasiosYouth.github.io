<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <!-- pinch-zoom stays enabled on purpose (accessibility) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- CSP: the same policy as the site (index.html). The competition API is the Apps Script deployment (connect-src script.google.com); the published comp.json may come from the Worker (assets/js/content-source.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://athanasios-api.menazak-lab.workers.dev https://athanasios-api-staging.menazak-lab.workers.dev; frame-src https://www.google.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!--
    THE ONE COMPETITION ENGINE SHELL (docs/COMPETITIONS.md §4.3, §13).
    Published competitions get a stub at competition/<slug>/index.html made
    from this file: their own title, description, canonical and Open Graph
    tags, data-slug="<slug>" on the html element, and every relative URL one level deeper
    (="../ → ="../../). Here: competition/?s=<slug>, or ?preview (the admin).
  -->
  <title>مسابقات أسرة البابا أثناسيوس</title>

  <meta name="description" content="مسابقات أسرة البابا أثناسيوس لخدمة شعب كنيستها الحبيبة في سفاجا.">

  <meta name="theme-color" content="#020914">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">

  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="أسرة البابا أثناسيوس - سفاجا">

  <link rel="preload" href="../assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../assets/css/comp.css">

  <link rel="modulepreload" href="../assets/js/comp/flow.js">
  <link rel="modulepreload" href="../assets/js/comp/view.js">
  <link rel="modulepreload" href="../assets/js/schedule.js">
  <link rel="modulepreload" href="../assets/js/words.js">
  <script type="module" src="../assets/js/comp/main.js"></script>

</head>

<body>

  <a class="skip-link" href="#comp-main">انتقل للمسابقة</a>

  <header class="cbar">
    <a class="cbar__brand" href="../">
      <img src="../assets/img/logo-128.webp" width="34" height="34" alt="">
      <span class="cbar__name">أسرة البابا أثناسيوس</span>
      <span class="visually-hidden">— الصفحة الرئيسية</span>
    </a>
    <p class="cbar__timer" id="comp-timer" hidden></p>
  </header>

  <main id="comp-main" class="comp" data-state="loading" tabindex="-1">
    <noscript>
      <p class="card noscript">المسابقة محتاجة جافاسكريبت يكون شغال في المتصفح. شغّله وافتح الصفحة تاني.</p>
    </noscript>
  </main>

  <p class="netbar" id="comp-net" role="status" hidden></p>

  <p class="visually-hidden" id="comp-live" aria-live="polite"></p>

</body>

</html>
