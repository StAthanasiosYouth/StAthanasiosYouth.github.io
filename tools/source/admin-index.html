<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    /admin/ — THE ADMIN PANEL, served by GitHub Pages. You stay on this URL.

    {{GENERATED}}

    The panel itself is the same code as the Apps Script admin
    (apps-script/Admin*.html → admin-app.js, admin.css). Sign-in is "Sign in
    with Google" (boot.js); every call goes to the Apps Script API (doPost)
    with the Google ID token, which the server verifies and checks against
    the allowlist. Nothing secret is in these files: the API URL and the
    OAuth client ID are public by design (config.js).

    Security policy: our own files, Google's sign-in script, frame and style,
    and the Apps Script API. No inline code or styles, no eval. The preview
    frame (srcdoc) inherits this policy and runs the site's own files.
    GitHub Pages can't send headers: frame-ancestors is enforced by boot.js
    (it leaves any frame and refuses to start inside one).
  -->

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#020914">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <title>لوحة التحكم · أسرة البابا أثناسيوس</title>

  <link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32">
  <link rel="preload" href="../assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="gate.css">

  <script src="config.js" defer></script>
  <script src="admin-app.js" defer></script>
  <script src="boot.js" defer></script>
  <script src="layout-check.js" defer></script>

</head>

<body class="is-gated">

  <!-- before the panel: sign in, not configured, not allowed (boot.js) -->
  <main class="gate" id="gate">

    <div class="gate__glow" aria-hidden="true"></div>

    <div class="gate__arch" aria-hidden="true">
      <span class="gate__cross"></span>
      <span class="gate__ring"></span>
      <img class="gate__logo" src="../assets/img/logo-256.webp" width="128" height="128" alt="">
    </div>

    <h1 class="gate__title">لوحة التحكم</h1>
    <p class="gate__sub">أسرة البابا أثناسيوس – سفاجا</p>

    <section class="gate__panel" id="gate-panel" aria-live="polite">
      <p class="gate__status" role="status">
        <span class="gate__line" aria-hidden="true"><i></i></span>
        <span>بنجهز لوحة التحكم…</span>
      </p>
      <noscript><p class="gate__note">لوحة التحكم محتاجة JavaScript. شغّله في المتصفح وافتح الصفحة تاني.</p></noscript>
    </section>

    <p class="gate__fallback" id="gate-fallback" hidden>
      مشكلة في الدخول؟ <a id="fallback-link" href="#" rel="noreferrer">لوحة الطوارئ (Apps Script)</a>
    </p>

  </main>

  <!-- the panel (shown after sign-in) -->
  <div class="shell" id="shell" hidden>
{{SHELL}}
  </div>

</body>

</html>
