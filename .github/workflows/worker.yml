# The API Worker (worker/): test on every change; on main, deploy
# staging → smoke test → production → smoke test. Content publishes from the
# admin never touch worker/, so they never trigger this.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (worker/README.md, "Automatic deployment"). Without them the deploy job is
# skipped with a warning; tests still run.
name: Worker (API)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare credentials present?
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - name: Staging — migrations + deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply athanasios-staging --remote --env staging && npx wrangler deploy --env staging
      - name: Staging — smoke test
        if: steps.creds.outputs.ok == 'true'
        run: sleep 5 && node scripts/smoke.mjs staging
      - name: Production — migrations + deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply athanasios-prod --remote && npx wrangler deploy
      - name: "Production — smoke test (on failure, see worker/README.md: Rollback)"
        if: steps.creds.outputs.ok == 'true'
        run: sleep 5 && node scripts/smoke.mjs production
