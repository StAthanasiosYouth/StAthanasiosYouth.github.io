<script>
/*
 * Admin views for the page itself: links, location, contacts, settings.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;
  var bool = A.bool;

  A.ICON_LABELS = {
    voice: 'رسالة / صوتك يهمنا', facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك',
    youtube: 'يوتيوب', whatsapp: 'واتساب', telegram: 'تيليجرام', spotify: 'سبوتيفاي',
    form: 'استمارة', calendar: 'تقويم', ticket: 'تذكرة / حجز', bus: 'رحلة', book: 'كتاب مقدس',
    music: 'ترانيم', photos: 'صور', video: 'فيديو', church: 'كنيسة', cross: 'صليب', heart: 'قلب',
    star: 'نجمة', megaphone: 'إعلان', gift: 'هدية', users: 'ناس / أسرة', map: 'مكان', info: 'معلومة', link: 'لينك',
    trophy: 'كأس / مسابقة', theatre: 'مسرح',
    messenger: 'ماسنجر', discord: 'ديسكورد', x: 'إكس (تويتر)', threads: 'ثريدز', snapchat: 'سناب شات',
    mail: 'إيميل', phone: 'تليفون'
  };


  /* =======================================================
     LINKS
  ======================================================= */

  A.views.links = function () {

    var links = A.byOrder(A.state.draft.links);
    // link groups only (the page's other sections live in «ترتيب الصفحة»)
    var sections = A.byOrder(A.state.draft.sections).filter(function (s) { return !s.kind || s.kind === 'links'; });
    var sectionKeys = sections.map(function (s) { return s.key; });
    var out = [];

    out.push(A.card('الروابط', 'بتظهر في الصفحة بنفس الترتيب ده. أي تعديل بيتحفظ كمسودة لحد ما تدوس "راجع وانشر".',
      el('div', { class: 'actions' },
        el('button', { class: 'btn btn--primary', type: 'button', onclick: function () { editLink(null); } }, icon('plus'), 'رابط جديد'),
        el('button', { class: 'btn', type: 'button', onclick: function () { editSection(null); } }, icon('plus'), 'قسم روابط جديد')
      )
    ));

    out.push(linkGroup('مميز — بيظهر كبير فوق', 'زي صوتك يهمنا', null, links.filter(function (l) { return bool(l.featured); })));

    sections.forEach(function (section, index) {
      out.push(linkGroup(section.title, null, { section: section, first: index === 0, last: index === sections.length - 1 },
        links.filter(function (l) { return !bool(l.featured) && l.section === section.key; })));
    });

    var orphans = links.filter(function (l) { return !bool(l.featured) && sectionKeys.indexOf(l.section) === -1; });

    if (orphans.length) {
      out.push(linkGroup('روابط من غير قسم', 'مش هتظهر في الصفحة لحد ما تختارلها قسم', null, orphans));
    }

    return out;

  };

  function linkGroup(title, hint, sectionInfo, links) {

    var section = sectionInfo && sectionInfo.section;

    var head = el('div', { class: 'card__head' },
      el('div', {},
        el('h2', { class: 'group-title' }, title, section && !bool(section.enabled) ? A.chip('القسم مخفي', 'off') : null),
        hint ? el('p', { class: 'card__hint', text: hint }) : null,
        section ? A.chip(section.key, 'ltr') : null
      ),
      section ? el('div', { class: 'actions' },
        A.editButton('القسم', function () { editSection(section); }),
        A.deleteButton('القسم', function (e) { removeSection(section, e.currentTarget); })
      ) : null
    );

    return el('section', { class: 'card' },
      head,
      links.length
        ? el('ul', { class: 'list' }, links.map(function (link, index) { return linkItem(link, index === 0, index === links.length - 1); }))
        : el('p', { class: 'empty', text: 'مفيش روابط هنا لسه' })
    );

  }

  function linkItem(link, first, last) {

    var enabled = bool(link.enabled);
    var chips = [];

    chips.push(A.visibilityChip(enabled, link.startAt, link.endAt));
    if (!bool(link.featured)) chips.push(A.chip(link.style === 'tile' ? 'مربع' : 'صف'));
    if (link.badge) chips.push(A.chip(link.badge, 'gold'));

    // which scene it opens (the same resolution as the publisher)
    var scene = link.experience === 'none' ? '' : link.experience || (window.adminResolveExperience ? window.adminResolveExperience({ icon: link.icon, url: link.url }) : '');
    if (scene) chips.push(A.chip('مشهد: ' + experienceLabel(scene)));

    var toggle = A.switchInput('ظاهر', enabled, function (checked) {
      A.dirty = false;
      // shown at once; the server's answer (or its refusal) follows (A.draftChange)
      A.draftChange({
        apply: function (state) {
          state.draft.links.forEach(function (row) { if (row.id === link.id) row.enabled = checked; });
        },
        run: function () { return A.call('apiSetLinkEnabled', link.id, checked); },
        done: function () { A.toast(checked ? 'الرابط هيظهر بعد النشر' : 'الرابط هيستخبى بعد النشر'); }
      });
    });

    var item = A.listItem({
      icon: link.icon,
      title: link.title,
      off: !enabled,
      chips: chips,
      controls: [
        toggle.node,
        el('span', { class: 'spacer' }),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لفوق', disabled: first, onclick: function (e) { A.move('apiMoveLink', link.id, -1, e.currentTarget); } }, icon('chevron-up')),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لتحت', disabled: last, onclick: function (e) { A.move('apiMoveLink', link.id, 1, e.currentTarget); } }, icon('chevron')),
        A.editButton(link.title, function () { editLink(link); }),
        A.deleteButton(link.title, function (e) { removeLink(link, e.currentTarget); })
      ]
    });

    // URLs read left to right
    item.querySelector('.item__main').insertBefore(
      el('span', { class: 'item__sub', text: A.shortUrl(link.url) }),
      item.querySelector('.item__meta')
    );

    return item;

  }

  function removeLink(link, button) {

    A.confirmDelete(link.title).then(function (ok) {
      if (!ok) return;
      A.withBusy(button, A.call('apiDeleteLink', link.id))
        .then(function (next) { A.applyState(next); A.toast('اتمسح — هيختفي من الموقع بعد النشر'); })
        .catch(function (error) { A.fail(error); });
    });

  }

  function removeSection(section, button) {

    A.confirmDelete('قسم ' + section.title).then(function (ok) {
      if (!ok) return;
      A.withBusy(button, A.call('apiDeleteSection', section.key))
        .then(function (next) { A.applyState(next); A.toast('القسم اتمسح'); })
        .catch(function (error) { A.fail(error); });
    });

  }

  /*
   * «التجربة قبل اللينك»: the choices come from the registry
   * (assets/js/platforms.js → AdminPlatforms.html, generated), grouped by
   * kind of scene. Below it, what the link will really open, worked out
   * with the registry's own resolveExperience (the same as the publisher).
   * current() → { icon, url } of the editor right now.
   */
  var EXPERIENCE_GROUPS = [
    { label: 'خدماتنا', scenes: ['voice'] },
    { label: 'سوشيال ميديا', scenes: ['facebook', 'instagram', 'tiktok', 'feed', 'vertical', 'stories'] },
    { label: 'رسايل وجروبات', scenes: ['whatsapp', 'chat'] },
    { label: 'فيديو وصوت', scenes: ['player', 'music'] },
    { label: 'مكان وتواصل', scenes: ['map', 'call', 'mail'] }
  ];

  function experienceLabel(key) {

    var platforms = window.ADMIN_PLATFORMS || {};
    if (!key) return '';
    if (key === 'web') return 'مشهد عام';
    return platforms[key] && platforms[key].label ? platforms[key].label : key + ' (مشهد عام)';

  }

  function experiencePicker(selected, current) {

    var platforms = window.ADMIN_PLATFORMS || {};
    var keys = Object.keys(platforms);
    var used = [];

    function option(value, label) {
      used.push(value);
      return el('option', { value: value, selected: value === selected ? 'selected' : null, text: label });
    }

    var groups = EXPERIENCE_GROUPS.map(function (group) {
      var members = keys.filter(function (key) { return key !== 'web' && group.scenes.indexOf(platforms[key].scene) !== -1; });
      return members.length ? el('optgroup', { label: group.label }, members.map(function (key) { return option(key, platforms[key].label); })) : null;
    });

    // anything the groups don't cover (a platform added later) still shows
    var rest = keys.filter(function (key) { return key !== 'web' && used.indexOf(key) === -1; });

    var select = el('select', { class: 'input', 'aria-describedby': null, onchange: A.markDirty },
      option('', 'تلقائي (حسب الأيقونة أو الرابط)'),
      option('none', 'من غير — يفتح على طول'),
      groups,
      rest.length ? el('optgroup', { label: 'تانية' }, rest.map(function (key) { return option(key, platforms[key].label || key); })) : null,
      option('web', 'مشهد عام (أي موقع)'),
      selected && used.indexOf(selected) === -1 ? option(selected, experienceLabel(selected)) : null
    );

    var said = el('p', { class: 'experience-said', 'aria-live': 'polite' });

    var shown = '';

    /* shows what the link opens; returns true when that is a scene */
    function update() {

      var now = current();
      var chosen = select.value;
      var resolve = window.adminResolveExperience || function () { return ''; };
      var key = chosen === 'none' ? '' : chosen || resolve({ experience: '', icon: now.icon, url: now.url });
      var why = '';

      if (!chosen && key) {
        why = resolve({ experience: '', icon: now.icon, url: '' }) === key ? ' (من الأيقونة)' : ' (من اللينك)';
      }

      var platform = platforms[key];
      shown = key;

      A.fill(said,
        A.icon(key ? (platform && platform.icon) || 'sparkle' : 'external'),
        key
          ? el('span', {}, chosen ? 'هيفتح مشهد ' : 'تلقائي هنا = مشهد ', el('b', { text: experienceLabel(key) }), why, ' — وبعده زرار للينك نفسه')
          : el('span', { text: chosen === 'none' ? 'من غير مشهد: اللينك هيفتح على طول.' : 'تلقائي هنا = من غير مشهد: ده موقع عادي، هيفتح على طول.' })
      );

      return !!key;

    }

    return {
      node: A.field('التجربة قبل اللينك', el('div', {}, select, said), 'مشهد قصير يعرّف الزائر بالمكان اللي رايحله، وبعدين زرار يودّيه للينك نفسه'),
      select: select,
      update: update,
      /* the scene family it opens (platforms.js `scene`), '' = none */
      scene: function () { return (platforms[shown] && platforms[shown].scene) || ''; },
      value: function () { return select.value; }
    };

  }

  A.experienceLabel = experienceLabel;

  function editLink(link) {

    var isNew = !link;
    // new links default to a general section rather than the social one
    var sections = A.byOrder(A.state.draft.sections).filter(function (s) { return !s.kind || s.kind === 'links'; });
    var defaultSection = sections.filter(function (s) { return s.key !== 'social'; })[0] || sections[0] || {};
    link = link || { enabled: true, featured: false, style: 'card', icon: 'link', section: defaultSection.key || '' };

    var featured = bool(link.featured);
    var box = A.errorBox();
    var limits = A.state.meta.limits;

    var title = A.counted('العنوان', link.title, limits.title, null, { required: true });
    var subtitle = A.counted('وصف قصير', link.subtitle, limits.subtitle, 'اختياري');
    var urlInput = A.textInput(link.url, { ltr: true, type: 'url', placeholder: 'https://', inputmode: 'url', required: true });

    var sectionSelect = el('select', { class: 'input', onchange: A.markDirty }, sections.map(function (s) {
      return el('option', { value: s.key, selected: s.key === link.section ? 'selected' : null, text: s.title + (bool(s.enabled) ? '' : ' (مخفي)') });
    }));
    var sectionField = A.field('القسم', sectionSelect);

    var style = A.choices('style', [
      { value: 'card', label: 'صف عريض' },
      { value: 'tile', label: 'مربع زي التطبيقات' }
    ], link.style === 'tile' ? 'tile' : 'card');
    var styleField = A.field('الشكل', style.node, 'المربع مناسب للسوشيال ميديا، والصف مناسب للينكات اللي محتاجة وصف');

    var cta = A.counted('نص الزرار', link.cta, limits.cta, 'مثلاً: ابعت دلوقتي');

    function syncFeatured(on) {
      sectionField.hidden = on;
      styleField.hidden = on;
      cta.node.hidden = !on;
    }

    var featuredSwitch = A.switchInput('رابط مميز (يظهر كبير فوق)', featured, syncFeatured);
    var icons = A.iconPicker(link.icon || 'link');

    var badge = A.textInput(link.badge, { max: limits.badge, placeholder: 'مثلاً: جديد' });
    var badgeField = A.field('شارة', el('div', { class: 'actions' },
      badge,
      el('button', { class: 'btn', type: 'button', onclick: function () { badge.value = 'جديد'; A.markDirty(); } }, 'جديد'),
      el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { badge.value = ''; A.markDirty(); } }, 'من غير')
    ), 'اختياري');

    var start = A.dateTimeInput(link.startAt, { presets: [A.PRESETS.now, A.PRESETS.thursday8] });
    var end = A.dateTimeInput(link.endAt, { presets: [A.PRESETS.sunday10] });
    var enabled = A.switchInput('ظاهر', link.enabled === undefined ? true : bool(link.enabled));

    syncFeatured(featured);

    var experience = experiencePicker(link.experience || '', function () {
      return { icon: icons.value(), url: urlInput.value.trim() };
    });
    var gallery = A.galleryPicker(link.gallery || '', {
      max: limits.gallery || 12,
      label: 'محتوى المشهد',
      scene: experience.scene,
      hint: 'اختياري — لحد ١٢ عنصر بيظهروا جوه المشهد بالترتيب ده: صور وفيديوهات من المكتبة بالكلام اللي معاها، ورسايل أو منشورات نصية في فيسبوك وX وThreads وواتساب وتليجرام وماسنجر وديسكورد. الفيديو: «من» و«لحد» (مثلاً 0:37 و0:43)؛ لو سبتهم فاضيين بيشتغل أول ٦ ثواني. من غير محتوى بيظهر المحتوى الجاهز للمشهد.'
    });

    // the content only matters when the link opens a scene (and what it can show depends on which)
    // (the picker first drew before the scene was known: '' = that first drawing)
    var lastScene = '';
    function syncExperience() {
      gallery.node.hidden = !experience.update();
      if (lastScene !== experience.scene()) gallery.redraw();
      lastScene = experience.scene();
    }

    experience.select.addEventListener('change', syncExperience);
    icons.node.addEventListener('change', syncExperience);
    urlInput.addEventListener('input', syncExperience);
    syncExperience();

    var save = el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

    save.addEventListener('click', function () {
      box.hidden = true;
      // a video's «من» / «لحد» that don't make sense: the message is next to them
      var clipProblem = gallery.check();
      if (clipProblem) {
        A.fail(new Error(clipProblem), box);
        return;
      }
      A.withBusy(save, A.call('apiSaveLink', {
        experience: experience.value(),
        gallery: gallery.value(),
        id: link.id || '',
        title: title.input.value,
        subtitle: subtitle.input.value,
        url: urlInput.value.trim(),
        featured: featuredSwitch.input.checked,
        section: sectionSelect.value,
        style: style.value(),
        cta: cta.input.value,
        icon: icons.value(),
        badge: badge.value,
        startAt: start.value(),
        endAt: end.value(),
        enabled: enabled.input.checked
      }))
        .then(function (next) {
          A.dirty = false;
          document.getElementById('sheet').close();
          A.applyState(next);
          A.toast(isNew ? 'الرابط اتضاف ✓ — لسه محتاج نشر' : 'اتحفظ ✓ — لسه محتاج نشر');
        })
        .catch(function (error) { A.fail(error, box); });
    });

    A.dirty = false;

    A.openSheet(isNew ? 'رابط جديد' : 'تعديل: ' + link.title, [
      box,
      el('div', { class: 'form' },
        title.node,
        subtitle.node,
        A.field('اللينك', urlInput, 'لازم يبدأ بـ https://'),
        featuredSwitch.node,
        sectionField,
        styleField,
        cta.node,
        A.field('الأيقونة', icons.node),
        experience.node,
        gallery.node,
        badgeField,
        A.field('يبدأ يظهر من', start.node, 'اختياري — سيبه فاضي لو هيظهر على طول'),
        A.field('آخر ظهور', end.node, 'اختياري — مناسب للمؤتمرات والرحلات والتسجيل'),
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('links', isNew ? '' : link.id),
      lock: isNew ? null : A.editLock('links', link.id, 'رابط «' + (link.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.links, 'id', link.id); if (fresh) editLink(fresh); else A.closeSheet(); })
    });

  }

  /* any page section: link groups (new or existing) and the built-in ones */
  function editSection(section) {

    var isNew = !section;
    section = section || { key: '', title: '', kind: 'links', enabled: true };

    // the layout row carries the resolved values (works for every kind)
    var row = (A.state.layout || []).filter(function (s) { return s.key === section.key; })[0] || section;
    var kind = row.kind || 'links';
    var info = KIND_INFO[kind] || KIND_INFO.links;
    var box = A.errorBox();
    var key = A.textInput(section.key, { ltr: true, placeholder: 'events', max: 31 });

    if (!isNew) {
      key.readOnly = true;
    }

    var limits = A.state.meta.limits;
    var title = A.counted('عنوان القسم', row.title, limits.sectionTitle, info.titleHint, { required: kind === 'links' });
    var subtitle = A.counted('سطر تحت العنوان', row.subtitle, limits.subtitle, 'اختياري', {});
    var from = A.dateTimeInput(row.visibleFrom, { emptyText: 'يظهر على طول', presets: [A.PRESETS.now, A.PRESETS.thursday8, A.PRESETS.friday] });
    var until = A.dateTimeInput(row.visibleUntil, { emptyText: 'مبيختفيش لوحده', presets: [A.PRESETS.sunday10] });
    var enabled = A.switchInput('القسم ظاهر', isNew ? true : bool(row.enabled));
    // every kind of section can have a banner (no exceptions)
    var banner = A.imagePicker(row.banner || '', { label: 'بانر القسم (اختياري)', hint: info.bannerHint || 'بيظهر فوق القسم في الموقع، بعرض القسم' });
    var theme = A.themePicker(row.theme || '');
    // «شكل الخلفية»: the cards' background in this section, any kind of section
    var surface = A.choices(A.uid('surface'), SURFACES, row.surface || '');
    var surfaceMobile = A.choices(A.uid('surface-mobile'), [{ value: '', label: 'زي الكمبيوتر' }].concat(SURFACES.slice(1)), row.surfaceMobile || '');
    var save = el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

    save.addEventListener('click', function () {
      box.hidden = true;
      A.withBusy(save, A.call('apiSaveSection', {
        key: key.value.trim(),
        title: title.input.value,
        subtitle: subtitle.input.value,
        visibleFrom: from.value(),
        visibleUntil: until.value(),
        theme: theme.value(),
        banner: banner.value(),
        surface: surface.value(),
        surfaceMobile: surfaceMobile.value(),
        icon: row.icon || '',
        enabled: enabled.input.checked
      }, isNew))
        .then(function (next) {
          A.dirty = false;
          document.getElementById('sheet').close();
          A.applyState(next);
          A.toast('اتحفظ ✓ — لسه محتاج نشر');
        })
        .catch(function (error) { A.fail(error, box); });
    });

    A.dirty = false;

    A.openSheet(isNew ? 'قسم روابط جديد' : 'تعديل: ' + (row.title || info.label), [
      box,
      el('div', { class: 'form' },
        isNew || kind === 'links' ? A.field('مفتاح القسم', key, isNew ? 'بالإنجليزي الصغير ومن غير مسافات، مثلاً events. مش هيظهر للناس' : 'المفتاح مبيتغيرش بعد الإضافة') : null,
        title.node,
        info.publicTitle ? subtitle.node : null,
        el('div', { class: 'form-group' },
          el('p', { class: 'section-label', text: 'الشكل' }),
          info.publicTitle ? A.field('لون القسم', theme.node, 'بيغيّر لمسة اللون والإضاءة بتاعة القسم بس') : null,
          banner.node,
          A.field('شكل الخلفية', surface.node, 'خلفية الكروت اللي في القسم ده. «تلقائي» = زي ما الموقع شايف أحسن'),
          A.field('على الموبايل', surfaceMobile.node, 'لو عايز شكل تاني على الموبايل بس')
        ),
        el('div', { class: 'form-group' },
          el('p', { class: 'section-label', text: 'الظهور (بتوقيت مصر)' }),
          enabled.node,
          A.field('يظهر من', from.node, 'سيبه فاضي لو عايزه يظهر أول ما تنشر'),
          A.field('يختفي بعد', until.node, 'سيبه فاضي لو مش عايزه يختفي لوحده')
        )
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('sections', isNew ? '' : section.key),
      lock: isNew ? null : A.editLock('sections', section.key, 'قسم «' + (row.title || info.label || section.key) + '»', function () { var fresh = A.findRow(A.state.layout, 'key', section.key) || A.findRow(A.state.draft.sections, 'key', section.key); if (fresh) editSection(fresh); else A.closeSheet(); })
    });

  }

  /* «شكل الخلفية» (SECTION_SURFACES, Content.gs) */
  var SURFACES = [
    { value: '', label: 'تلقائي' },
    { value: 'glass', label: 'شفاف (Glass)' },
    { value: 'dark', label: 'داكن' },
    { value: 'filled', label: 'ممتلئ' },
    { value: 'none', label: 'بدون خلفية' }
  ];

  A.editSection = editSection;
  A.editLink = editLink;
  A.editors.sections = editSection;
  A.editors.links = editLink;


  /* =======================================================

  /* how many things a section would show (0 = it stays hidden on the site) */
  function sectionCount(s) {

    switch (s.kind) {
      case 'meeting': return A.setting('meeting.day') !== '' || (d.sessions || []).some(on) ? 1 : 0;
      case 'featured': return d.links.filter(function (l) { return bool(l.featured) && on(l); }).length;
      case 'news': return (d.news || []).filter(on).length;
      case 'games': return (d.games || []).filter(on).length;
      case 'items': return (d.activities || []).filter(function (a) {
        var type = (d.types || []).filter(function (t) { return t.key === a.type; })[0];

      }).length;
      case 'location': return A.setting('location.name') ? 1 : 0;
      case 'links': return d.links.filter(function (l) { return !bool(l.featured) && l.section === s.key && on(l); }).length;

  /* =======================================================

  var EMAIL = /^[^@\s,;<>"]+@[^@\s,;<>"]+\.[a-z]{2,}$/i;

  var PERM_MODULES = {
    content: 'المحتوى', publish: 'النشر', events: 'الفعاليات والخدام', bookings: 'الحجوزات', finance: 'الفلوس',
    exports: 'التصدير', competitions: 'المسابقات', store: 'المتجر', points: 'النقاط', participants: 'المشتركين',
    media: 'الصور والفيديو', push: 'الإشعارات', accounts: 'الحسابات والصلاحيات', activity: 'سجل النشاط',
    notifications: 'إعدادات الإشعارات', system: 'النظام'
  };
  var PERM_ACTIONS = {
    view: 'يشوف', add: 'يضيف', edit: 'يعدّل', delete: 'يمسح', approve: 'يعتمد', publish: 'ينشر',
    export: 'يصدّر', export_pii: 'يصدّر بأرقام التليفونات', manage: 'يدير', create_cash: 'يسجّل حجز كاش'

    self: 'مينفعش تشيل نفسك أو تشيل صلاحية إدارة الحسابات من نفسك.',
    last: 'لازم يفضل حد يقدر يدير الحسابات.',
    max: 'وصلت لأقصى عدد أدمنز.'
  };

  function permLabel(perm) {

    var parts = perm.split('.');
    return (PERM_ACTIONS[parts[1]] || parts[1]) + ' · ' + (PERM_MODULES[parts[0]] || parts[0]);

  }

  /* the Worker's errors in this screen's words */
  function accountsError(error) {

    if (error && error.code === 'protected' && error.reply && PROTECTED_REASONS[error.reply.reason]) {
      return new Error(PROTECTED_REASONS[error.reply.reason]);
    }
    if (error && error.code === 'denied' && error.reply && error.reply.perm) {

  }

   * An admin account in a link (never its email): the Worker's accountKey
   * (worker/src/notify/catalog.js) — two 32-bit FNV-1a hashes of the lower-case address.
   */
  A.accountKey = function (email) {

    var s = String(email || '').trim().toLowerCase();
    function fnv(seed) {
      var h = seed >>> 0;
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return ('0000000' + h.toString(16)).slice(-8);
    }
    return 'acc-' + fnv(0x811c9dc5) + fnv(0x01000193);

  };

    }

      var me = email === data.me;
      var manage = !!(acc && acc.canManage && !primary);

      var shown = (data.names && data.names[email]) || email.split('@')[0];

        el('span', { class: 'admin__main' },
          el('span', { class: 'admin__name' + (named ? '' : ' is-unnamed'), dir: 'auto', text: named ? shown : shown + ' (من غير اسم)' }),
          el('span', { class: 'admin__email ltr', text: email }),
          el('span', { class: 'admin__chips' },

        ? 'الإضافة والصلاحيات من لوحة التحكم الأساسية (stathanasiosyouth.github.io/admin).'
        : acc && !acc.canManage
          ? 'إضافة الأدمنز وتغيير صلاحياتهم للحساب الأساسي ومن معاه صلاحية «يدير · الحسابات والصلاحيات».'
          : 'كل تغيير في الحسابات والصلاحيات بيتسجل في «سجل النشاط» ويوصل للحساب الأساسي.';

    /* an email / push link to one account (#open/account/<key>, AdminActivity): that row, highlighted */
    function focusAccount(emails) {

      var key = A.accountFocus;
      if (!key) return;

      if (!email) {

      }

        if (!error || error.code !== 'google') throw error;
        return A.confirm({
          tone: 'info',
          icon: 'shield',
          title: 'محتاجين نتأكد إنه انت',
          message: 'تغيير الحسابات والصلاحيات محتاج دخول بحساب جوجل نفسه، مش الجهاز المحفوظ.',

          return W.google().then(send);
        });
      })).then(function (reply) {

      }).catch(function (error) {

      }, function () { return []; });

    /* the grants form: a preset pre-fills, the boxes decide (the server checks again) */
    function grantsForm(account) {

      var boxes = {};

      acc.perms.forEach(function (perm) {

      });

          byModule[m].map(function (perm) {

            if (acc.primaryDefault.indexOf(perm) !== -1) hint = 'صلاحية حساسة: للحساب الأساسي أساسًا.';

    );

    return card;

  }

    'pay.approve': 'اعتماد رقم دفع لخادم', 'payment.void': 'إلغاء دفعة', 'event.cancelAll': 'إلغاء كل حجوزات فعالية',
    'code.export': 'تصدير أكواد المشتركين', migrate: 'نقل البيانات', 'job.failed': 'مهمة في الخلفية فشلت',
    'notify.failed': 'إشعار أو إيميل مقدرش يتبعت', 'gmail.token': 'إرسال الإيميلات واقف',
    'booking.new': 'حجوزات جديدة من الموقع', 'booking.create': 'حجز كاش من أدمن', publish: 'نشر الموقع', push: 'إشعار للزوار',
    'import': 'استيراد', finalize: 'اعتماد نتيجة مسابقة', 'points.adjust': 'تعديل نقاط', 'redemption.status': 'طلبات المتجر',
    'booking.confirm': 'تأكيد حجز', 'booking.reject': 'رفض حجز', 'booking.cancel': 'إلغاء حجز', 'booking.reopen': 'رجوع حجز',
    'booking.update': 'تعديل حجز', 'booking.withdraw': 'زائر لغى طلبه', 'booking.remind': 'تذكير بالدفع', 'payment.add': 'دفعة اتسجلت',
    'payment.refund': 'استرداد', 'handover.add': 'تسليم فلوس للخدمة', 'handover.void': 'إلغاء تسليم فلوس', 'modules.book': 'تشغيل/قفل الحجز',
    'admin.rename': 'اسم أدمن اتغير', 'session.takeover': 'دخول من جهاز تاني'
  };
  var NT_ENTITIES = {
    sessions: 'الاجتماعات', news: 'الأخبار', games: 'الألعاب', activities: 'الكروت والفعاليات', notifications: 'إشعارات الصفحة', types: 'أنواع الكروت',
    links: 'الروابط', sections: 'الأقسام', contacts: 'أرقام التواصل', settings: 'الإعدادات', site: 'الموقع', data: 'البيانات', media: 'الصور',
    competition: 'المسابقات', participant: 'المشتركين', points: 'النقاط', shopitem: 'المتجر', redemption: 'طلبات المتجر',
    page: 'صفحات الخدمة', event: 'الفعاليات', servant: 'الخدام'
  };
  var NT_FAMILIES = { add: 'إضافة', edit: 'تعديل', remove: 'مسح' };
  var NT_LEVELS = { critical: ['مهم جدًا', 'danger'], important: ['مهم', 'gold'], routine: ['عادي', 'off'] };
  var NT_EMAIL = [{ key: 'off', label: 'من غير إيميل' }, { key: 'immediate', label: 'إيميل على طول' }, { key: 'summary', label: 'في ملخص اليوم' }];
  var NT_STATUS = { sent: 'اتبعت', queued: 'مستني', failed: 'هيتعاد', deferred: 'في الملخص', deferred_quota: 'مستني الحصة', dead: 'فشل', dismissed: 'اتشال' };

  function ntLabel(key) {

    if (NT_SPECIAL[key]) return NT_SPECIAL[key];
    var parts = key.split('.');
    return (NT_FAMILIES[parts[1]] || parts[1]) + ' · ' + (NT_ENTITIES[parts[0]] || parts[0]);

  }

  function ntSelect(options, value, label) {

    return el('select', { class: 'input', 'aria-label': label }, options.map(function (o) {
      return el('option', { value: o.key, selected: o.key === value ? 'selected' : null, text: o.label });
    }));

  }

  function ntWhen(ms) {

    if (!ms) return '—';
    var parts = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date(ms)).forEach(function (p) { parts[p.type] = p.value; });
    return A.formatWall(parts.year + '-' + parts.month + '-' + parts.day + 'T' + (parts.hour === '24' ? '00' : parts.hour) + ':' + parts.minute, true);

  }

  /* the types grouped by module, newest first: [{ module, types }] */
  function ntGroups(types) {

    var order = [];
    var by = {};
    types.forEach(function (t) {
      if (!by[t.module]) { by[t.module] = []; order.push(t.module); }
      by[t.module].push(t);
    });
    return order.map(function (m) { return { module: m, types: by[m] }; });

  }

  /* «تنبيهاتي»: my own choices, within what the Primary Admin allows */
  function myNotifyCard(W) {

    var box = A.errorBox();
    var body = el('div', { class: 'grants', 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));
    var save = el('button', { class: 'btn btn--primary', type: 'button', disabled: true }, 'احفظ اختياراتي');
    var controls = {};

    function draw(data) {

      controls = {};
      body.setAttribute('aria-busy', 'false');
      if (!data.router) {
        A.fill(body, [el('p', { class: 'note' }, 'الإشعارات الجديدة لسه متشغلتش. لحد ما الأدمن الأساسي يشغلها، بيوصلك اللي بيوصل دلوقتي.')]);
      }
      var groups = ntGroups(data.types).map(function (g) {
        return el('fieldset', { class: 'grants__group' },
          el('legend', { text: NT_MODULES[g.module] || g.module }),
          g.types.map(function (t) {
            var push = ntSelect([{ key: 'immediate', label: 'إشعار' }, { key: 'off', label: 'من غير إشعار' }], t.push, 'إشعار ' + ntLabel(t.key));
            var mail = ntSelect(NT_EMAIL, t.emailMode, 'إيميل ' + ntLabel(t.key));
            push.disabled = t.locked || !t.pushAllowed;
            mail.disabled = t.locked || !data.email;
            controls[t.key] = { push: push, email: mail, locked: t.locked };
            return el('div', { class: 'nt-row' },
              el('span', { class: 'nt-row__name' }, ntLabel(t.key), ' ', A.chip(NT_LEVELS[t.level][0], NT_LEVELS[t.level][1]), t.locked ? A.chip('إجباري', 'info') : null),
              push, mail);
          }));
      });
      if (data.router) A.fill(body, groups);
      else groups.forEach(function (g) { body.appendChild(g); });
      save.disabled = false;

    }

    function load() {

      W.call('GET', '/v1/admin/notify/me', undefined, { quiet: true }).then(draw).catch(function (error) {
        body.setAttribute('aria-busy', 'false');
        A.fail(error, box);
      });

    }

    save.addEventListener('click', function () {

      box.hidden = true;
      var prefs = {};
      Object.keys(controls).forEach(function (key) {
        var c = controls[key];
        if (c.locked) return;
        prefs[key] = { push: c.push.value, email: c.email.value };
      });
      A.withBusy(save, W.call('POST', '/v1/admin/notify/me', { prefs: prefs }))
        .then(function (data) { A.dirty = false; draw(data); A.toast('اتحفظت اختياراتك ✓'); })
        .catch(function (error) { A.fail(error, box); });

    });

    var card = A.card('تنبيهاتي', 'إيه اللي يوصلك إشعار أو إيميل. اللي عليه «إجباري» حدده الأدمن الأساسي.', box, body, el('div', { class: 'actions' }, save));
    card.classList.add('card--notify-me');
    load();
    return card;

  }

  /* «إعدادات الإشعارات»: every type, the switches, the budget (Primary Admin) */
  function notifySettingsCard(W) {

    var box = A.errorBox();
    var body = el('div', { 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));
    var save = el('button', { class: 'btn btn--primary', type: 'button', disabled: true }, 'احفظ الإعدادات');
    var data = null;
    var rows = {};
    var top = {};

    function recipientsButton(t, state) {

      var button = el('button', { class: 'btn btn--small', type: 'button' }, state.mode === 'named' ? 'ناس محددين (' + state.include.length + ')' : (state.exclude.length ? 'الكل ما عدا ' + state.exclude.length : 'كل اللي عندهم الصلاحية'));
      button.addEventListener('click', function () {
        var mode = A.choices(A.uid('rcp'), [{ value: 'all', label: 'كل اللي عندهم الصلاحية' }, { value: 'named', label: 'ناس محددين بس' }], state.mode);
        var boxes = data.admins.map(function (a) {
          var on = state.mode === 'named' ? state.include.indexOf(a.email) !== -1 : state.exclude.indexOf(a.email) === -1;
          var c = A.checkbox(a.name + (a.primary ? ' (الأساسي)' : ''), on, a.email);
          return { email: a.email, input: c.input, node: c.node };
        });
        A.modal({
          tone: 'info', icon: 'users', title: 'مين يوصله «' + ntLabel(t.key) + '»؟',
          message: 'بس اللي عنده صلاحية «' + t.perm + '» يقدر يوصله، مهما اخترت هنا.',
          body: el('div', { class: 'grants' }, mode.node, boxes.map(function (b) { return b.node; })),
          actions: [{ label: 'إلغاء', value: false, kind: 'ghost' }, { label: 'تمام', value: true, kind: 'primary' }]
        }).then(function (ok) {
          A.dirty = false;
          if (!ok) return;
          state.mode = mode.value() === 'named' ? 'named' : 'all';
          state.include = state.mode === 'named' ? boxes.filter(function (b) { return b.input.checked; }).map(function (b) { return b.email; }) : [];
          state.exclude = state.mode === 'all' ? boxes.filter(function (b) { return !b.input.checked; }).map(function (b) { return b.email; }) : [];
          state.dirty = true;
          button.textContent = state.mode === 'named' ? 'ناس محددين (' + state.include.length + ')' : (state.exclude.length ? 'الكل ما عدا ' + state.exclude.length : 'كل اللي عندهم الصلاحية');
        });
      });
      return button;

    }

    function draw(next) {

      data = next;
      rows = {};
      body.setAttribute('aria-busy', 'false');
      var manage = data.canManage;

      top.router = A.checkbox('شغّل الإشعارات الجديدة', data.router, 'إشعارات وإيميلات لكل الأقسام حسب الصلاحيات. أول ما تتشغل، النشاط القديم مش هيتبعت.');
      top.email = A.checkbox('شغّل الإيميلات', data.email, data.gmail ? 'من athanasius.youth.safaga@gmail.com' : 'محتاج موافقة جيميل الأول (مرة واحدة من صاحب الحساب).');
      top.time = A.textInput(data.summaryTime, { ltr: true, max: 5, placeholder: '21:00' });
      top.time.type = 'time';
      top.target = A.textInput(String(data.budget.target), { ltr: true, max: 3 });
      top.admin = A.textInput(String(data.budget.admin), { ltr: true, max: 3 });
      top.critical = A.textInput(String(data.budget.critical), { ltr: true, max: 3 });
      top.otp = A.textInput(String(data.budget.otp), { ltr: true, max: 3 });
      ['target', 'admin', 'critical', 'otp'].forEach(function (k) { top[k].type = 'number'; top[k].min = '0'; });

      var groups = ntGroups(data.types).map(function (g) {
        return el('fieldset', { class: 'grants__group' },
          el('legend', { text: NT_MODULES[g.module] || g.module }),
          g.types.map(function (t) {
            var state = { mode: t.mode, include: t.include.slice(), exclude: t.exclude.slice(), dirty: false };
            var push = A.checkbox('إشعار', t.push);
            var mail = ntSelect(NT_EMAIL, t.email, 'إيميل ' + ntLabel(t.key));
            var lock = A.checkbox('إجباري', t.locked);
            rows[t.key] = { t: t, push: push.input, email: mail, locked: lock.input, state: state };
            [push.input, mail, lock.input].forEach(function (c) { c.disabled = !manage; });
            return el('div', { class: 'nt-row' },
              el('span', { class: 'nt-row__name' }, ntLabel(t.key), ' ', A.chip(NT_LEVELS[t.level][0], NT_LEVELS[t.level][1])),
              push.node, mail, lock.node, manage ? recipientsButton(t, state) : null);
          }));
      });

      A.fill(body, [
        top.router.node, top.email.node,
        A.field('ميعاد ملخص اليوم', top.time, 'بتوقيت القاهرة.'),
        el('details', { class: 'nt-budget' },
          el('summary', { text: 'حصة الإيميلات اليومية' }),
          A.field('الهدف اليومي (كل الإيميلات)', top.target, 'في حدود جيميل الحقيقي (~٥٠٠ في اليوم).'),
          A.field('إيميلات الأدمنز', top.admin, ''),
          A.field('محجوز للمهم جدًا', top.critical, ''),
          A.field('محجوز لأكواد التأكيد (بعدين)', top.otp, '')
        ),
        el('div', { class: 'grants' }, groups)
      ]);
      [top.router.input, top.email.input, top.time, top.target, top.admin, top.critical, top.otp].forEach(function (c) { c.disabled = !manage; });
      save.hidden = !manage;
      save.disabled = false;

    }

    function load() {

      W.call('GET', '/v1/admin/notify/settings', undefined, { quiet: true }).then(draw).catch(function (error) {
        body.setAttribute('aria-busy', 'false');
        A.fail(error, box);
      });

    }

    save.addEventListener('click', function () {

      box.hidden = true;
      var types = {};
      Object.keys(rows).forEach(function (key) {
        var r = rows[key];
        var changed = r.push.checked !== r.t.push || r.email.value !== r.t.email || r.locked.checked !== r.t.locked || r.state.dirty;
        if (changed) types[key] = { push: r.push.checked, email: r.email.value, locked: r.locked.checked, mode: r.state.mode, include: r.state.include, exclude: r.state.exclude };
      });
      var body_ = {
        types: types, router: top.router.input.checked, email: top.email.input.checked, summaryTime: top.time.value,
        budget: { target: Number(top.target.value), admin: Number(top.admin.value), critical: Number(top.critical.value), otp: Number(top.otp.value) }
      };
      var turningOn = body_.router && !data.router;
      (turningOn ? A.confirm({
        tone: 'info', icon: 'bell', title: 'تشغّل الإشعارات الجديدة؟',
        message: 'هتوصل كل الأدمنز حسب صلاحياتهم، من دلوقتي بس (النشاط القديم مش هيتبعت). إشعارات النظام القديم هتقف علشان مفيش حاجة توصل مرتين.',
        confirmLabel: 'شغّل', cancelLabel: 'لأ، رجوع'
      }) : Promise.resolve(true)).then(function (ok) {
        if (!ok) return;
        A.withBusy(save, W.call('POST', '/v1/admin/notify/settings', body_))
          .then(function (next) { A.dirty = false; draw(next); A.toast('اتحفظت إعدادات الإشعارات ✓'); })
          .catch(function (error) { A.fail(error, box); });
      });

    });

    var card = A.card('إعدادات الإشعارات', 'إيه اللي يتبعت لمين، إشعار ولا إيميل ولا في ملخص اليوم. للأدمن الأساسي.', box, body, el('div', { class: 'actions' }, save));
    card.classList.add('card--notify-settings');
    load();
    return card;

  }

  /* «حالة النظام»: what went out, what failed, Gmail, the quota, critical waiting */
  function systemStatusCard(W) {

    var box = A.errorBox();
    var body = el('div', { 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));

    function count(day, channel, status) { return (day && day[channel] && day[channel][status]) || 0; }

    function draw(s) {

      body.setAttribute('aria-busy', 'false');
      var today = s.days[0] || null;
      var tiles = el('div', { class: 'nt-tiles' }, [
        ['إشعارات اتبعتت', count(today, 'push', 'sent')], ['إيميلات اتبعتت', count(today, 'email', 'sent')],
        ['هيتعاد', count(today, 'push', 'failed') + count(today, 'email', 'failed')], ['فشل', count(today, 'push', 'dead') + count(today, 'email', 'dead')],
        ['الإيميلات النهارده', s.quota.total + ' / ' + s.quota.target]
      ].map(function (t) { return el('div', { class: 'nt-tile' }, el('strong', { text: String(t[1]) }), el('span', { text: t[0] })); }));
      var gmail = !s.gmail.configured ? A.chip('جيميل مش متوصل', 'off') : s.gmail.ok ? A.chip('جيميل شغال', 'ok') : A.chip('جيميل واقف: محتاج موافقة تاني', 'danger');
      var critical = s.critical.length ? el('div', { class: 'nt-critical' },
        el('p', { class: 'nt-critical__title' }, icon('alert'), 'تنبيهات مهمة جدًا مستنية (' + s.critical.length + ')'),
        el('ul', {}, s.critical.map(function (c) {
          return el('li', {},
            el('span', { text: c.title + ' — ' + c.recipient + ' (' + (c.channel === 'email' ? 'إيميل' : 'إشعار') + '، ' + (NT_STATUS[c.status] || c.status) + ')' }),
            s.canManage ? el('button', { class: 'btn btn--small', type: 'button', onclick: function (event) {
              A.confirm({ tone: 'danger', icon: 'trash', title: 'تشيل التنبيه ده من القايمة؟', message: 'مش هيتبعت تاني. ده بيتسجل في «سجل النشاط».', confirmLabel: 'شيله', cancelLabel: 'لأ' })
                .then(function (ok) {
                  if (!ok) return;
                  A.withBusy(event.target, W.call('POST', '/v1/admin/notify/outbox/' + encodeURIComponent(c.id) + '/dismiss', {})).then(draw).catch(function (error) { A.fail(error, box); });
                });
            } }, 'شيله') : null);
        }))) : el('p', { class: 'note' }, 'مفيش تنبيهات مهمة مستنية.');
      A.fill(body, [
        el('p', {}, s.router ? A.chip('الإشعارات الجديدة شغالة', 'ok') : A.chip('الإشعارات الجديدة مقفولة', 'off'), ' ', s.email ? A.chip('الإيميلات شغالة', 'ok') : A.chip('الإيميلات مقفولة', 'off'), ' ', gmail),
        tiles,
        el('p', { class: 'note' }, 'آخر إشعار اتبعت: ' + ntWhen(s.lastSuccess.push) + ' · آخر إيميل: ' + ntWhen(s.lastSuccess.email)),
        critical
      ]);

    }

    W.call('GET', '/v1/admin/notify/status', undefined, { quiet: true }).then(draw).catch(function (error) {
      body.setAttribute('aria-busy', 'false');
      A.fail(error, box);
    });

    var card = A.card('حالة النظام', 'الإشعارات والإيميلات: اللي اتبعت، اللي مستني، واللي فشل.', box, body);
    card.classList.add('card--system-status');
    return card;

  }

  /* the settings page's notification cards (only with the Worker) */
  function notifyCards() {

    var W = window.AdminWorker;
    if (!W) return [];
    return [myNotifyCard(W), notifySettingsCard(W), systemStatusCard(W)];

  }

  /*
   * Home: a red banner while critical rows wait (quota, Gmail stopped, dead),
   * for whoever manages the notifications (the Primary Admin). Quiet: nothing
   * when the Worker can't be reached or nothing waits.
   */
  A.criticalBanner = function () {

    var W = window.AdminWorker;
    if (!W) return null;
    var slot = el('div', { class: 'nt-banner', hidden: true, role: 'alert' });
    W.call('GET', '/v1/admin/notify/status', undefined, { quiet: true }).then(function (s) {
      var stopped = s.email && s.gmail.configured && !s.gmail.ok;
      if (!s.canManage || (!s.critical.length && !stopped)) return;
      A.fill(slot, [
        icon('alert'),
        el('span', { text: stopped ? 'الإيميلات واقفة: صلاحية جيميل محتاجة تتجدد.' : 'فيه ' + s.critical.length + ' تنبيه مهم جدًا لسه متبعتش.' }),
        el('button', { class: 'btn btn--small', type: 'button', onclick: function () { A.go('settings'); } }, 'شوف «حالة النظام»')
      ]);
      slot.hidden = false;
    }, function () { /* quiet */ });
    return slot;

  };

})();
</script>
