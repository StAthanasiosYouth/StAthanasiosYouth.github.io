<script>
/*
 * Admin views for the page itself: links, location, contacts, settings.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;
  var bool = A.bool;

  A.ICON_LABELS = {
    voice: 'رسالة / صوتك يهمنا', facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك',
    youtube: 'يوتيوب', whatsapp: 'واتساب', telegram: 'تيليجرام', spotify: 'سبوتيفاي',
    form: 'استمارة', calendar: 'تقويم', ticket: 'تذكرة / حجز', bus: 'رحلة', book: 'كتاب مقدس',
    music: 'ترانيم', photos: 'صور', video: 'فيديو', church: 'كنيسة', cross: 'صليب', heart: 'قلب',
    star: 'نجمة', megaphone: 'إعلان', gift: 'هدية', users: 'ناس / أسرة', map: 'مكان', info: 'معلومة', link: 'لينك',
    trophy: 'كأس / مسابقة', theatre: 'مسرح',
    messenger: 'ماسنجر', discord: 'ديسكورد', x: 'إكس (تويتر)', threads: 'ثريدز', snapchat: 'سناب شات',
    mail: 'إيميل', phone: 'تليفون'
  };


  /* =======================================================
     LINKS
  ======================================================= */

  A.views.links = function () {

    var links = A.byOrder(A.state.draft.links);
    // link groups only (the page's other sections live in «ترتيب الصفحة»)
    var sections = A.byOrder(A.state.draft.sections).filter(function (s) { return !s.kind || s.kind === 'links'; });
    var sectionKeys = sections.map(function (s) { return s.key; });
    var out = [];

    out.push(A.card('الروابط', 'بتظهر في الصفحة بنفس الترتيب ده. أي تعديل بيتحفظ كمسودة لحد ما تدوس "راجع وانشر".',
      el('div', { class: 'actions' },
        el('button', { class: 'btn btn--primary', type: 'button', onclick: function () { editLink(null); } }, icon('plus'), 'رابط جديد'),
        el('button', { class: 'btn', type: 'button', onclick: function () { editSection(null); } }, icon('plus'), 'قسم روابط جديد')
      )
    ));

    out.push(linkGroup('مميز — بيظهر كبير فوق', 'زي صوتك يهمنا', null, links.filter(function (l) { return bool(l.featured); })));

    sections.forEach(function (section, index) {
      out.push(linkGroup(section.title, null, { section: section, first: index === 0, last: index === sections.length - 1 },
        links.filter(function (l) { return !bool(l.featured) && l.section === section.key; })));
    });

    var orphans = links.filter(function (l) { return !bool(l.featured) && sectionKeys.indexOf(l.section) === -1; });

    if (orphans.length) {
      out.push(linkGroup('روابط من غير قسم', 'مش هتظهر في الصفحة لحد ما تختارلها قسم', null, orphans));
    }

    return out;

  };

  function linkGroup(title, hint, sectionInfo, links) {

    var section = sectionInfo && sectionInfo.section;

    var head = el('div', { class: 'card__head' },
      el('div', {},
        el('h2', { class: 'group-title' }, title, section && !bool(section.enabled) ? A.chip('القسم مخفي', 'off') : null),
        hint ? el('p', { class: 'card__hint', text: hint }) : null,
        section ? A.chip(section.key, 'ltr') : null
      ),
      section ? el('div', { class: 'actions' },
        A.editButton('القسم', function () { editSection(section); }),
        A.deleteButton('القسم', function (e) { removeSection(section, e.currentTarget); })
      ) : null
    );

    return el('section', { class: 'card' },
      head,
      links.length
        ? el('ul', { class: 'list' }, links.map(function (link, index) { return linkItem(link, index === 0, index === links.length - 1); }))
        : el('p', { class: 'empty', text: 'مفيش روابط هنا لسه' })
    );

  }

  function linkItem(link, first, last) {

    var enabled = bool(link.enabled);
    var chips = [];

    chips.push(A.visibilityChip(enabled, link.startAt, link.endAt));
    if (!bool(link.featured)) chips.push(A.chip(link.style === 'tile' ? 'مربع' : 'صف'));
    if (link.badge) chips.push(A.chip(link.badge, 'gold'));

    // which scene it opens (the same resolution as the publisher)
    var scene = link.experience === 'none' ? '' : link.experience || (window.adminResolveExperience ? window.adminResolveExperience({ icon: link.icon, url: link.url }) : '');
    if (scene) chips.push(A.chip('مشهد: ' + experienceLabel(scene)));

    var toggle = A.switchInput('ظاهر', enabled, function (checked) {
      A.dirty = false;
      // shown at once; the server's answer (or its refusal) follows (A.draftChange)
      A.draftChange({
        apply: function (state) {
          state.draft.links.forEach(function (row) { if (row.id === link.id) row.enabled = checked; });
        },
        run: function () { return A.call('apiSetLinkEnabled', link.id, checked); },
        done: function () { A.toast(checked ? 'الرابط هيظهر بعد النشر' : 'الرابط هيستخبى بعد النشر'); }
      });
    });

    var item = A.listItem({
      icon: link.icon,
      title: link.title,
      off: !enabled,
      chips: chips,
      controls: [
        toggle.node,
        el('span', { class: 'spacer' }),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لفوق', disabled: first, onclick: function (e) { A.move('apiMoveLink', link.id, -1, e.currentTarget); } }, icon('chevron-up')),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لتحت', disabled: last, onclick: function (e) { A.move('apiMoveLink', link.id, 1, e.currentTarget); } }, icon('chevron')),
        A.editButton(link.title, function () { editLink(link); }),
        A.deleteButton(link.title, function (e) { removeLink(link, e.currentTarget); })
      ]
    });

    // URLs read left to right
    item.querySelector('.item__main').insertBefore(
      el('span', { class: 'item__sub', text: A.shortUrl(link.url) }),
      item.querySelector('.item__meta')
    );

    return item;

  }

  function removeLink(link, button) {

    A.confirmDelete(link.title).then(function (ok) {
      if (!ok) return;
      A.withBusy(button, A.call('apiDeleteLink', link.id))
        .then(function (next) { A.applyState(next); A.toast('اتمسح — هيختفي من الموقع بعد النشر'); })
        .catch(function (error) { A.fail(error); });
    });

  }

  function removeSection(section, button) {

    A.confirmDelete('قسم ' + section.title).then(function (ok) {
      if (!ok) return;
      A.withBusy(button, A.call('apiDeleteSection', section.key))
        .then(function (next) { A.applyState(next); A.toast('القسم اتمسح'); })
        .catch(function (error) { A.fail(error); });
    });

  }

  /*
   * «التجربة قبل اللينك»: the choices come from the registry
   * (assets/js/platforms.js → AdminPlatforms.html, generated), grouped by
   * kind of scene. Below it, what the link will really open, worked out
   * with the registry's own resolveExperience (the same as the publisher).
   * current() → { icon, url } of the editor right now.
   */
  var EXPERIENCE_GROUPS = [
    { label: 'خدماتنا', scenes: ['voice'] },
    { label: 'سوشيال ميديا', scenes: ['facebook', 'instagram', 'tiktok', 'feed', 'vertical', 'stories'] },
    { label: 'رسايل وجروبات', scenes: ['whatsapp', 'chat'] },
    { label: 'فيديو وصوت', scenes: ['player', 'music'] },
    { label: 'مكان وتواصل', scenes: ['map', 'call', 'mail'] }
  ];

  function experienceLabel(key) {

    var platforms = window.ADMIN_PLATFORMS || {};
    if (!key) return '';
    if (key === 'web') return 'مشهد عام';
    return platforms[key] && platforms[key].label ? platforms[key].label : key + ' (مشهد عام)';

  }

  function experiencePicker(selected, current) {

    var platforms = window.ADMIN_PLATFORMS || {};
    var keys = Object.keys(platforms);
    var used = [];

    function option(value, label) {
      used.push(value);
      return el('option', { value: value, selected: value === selected ? 'selected' : null, text: label });
    }

    var groups = EXPERIENCE_GROUPS.map(function (group) {
      var members = keys.filter(function (key) { return key !== 'web' && group.scenes.indexOf(platforms[key].scene) !== -1; });
      return members.length ? el('optgroup', { label: group.label }, members.map(function (key) { return option(key, platforms[key].label); })) : null;
    });

    // anything the groups don't cover (a platform added later) still shows
    var rest = keys.filter(function (key) { return key !== 'web' && used.indexOf(key) === -1; });

    var select = el('select', { class: 'input', 'aria-describedby': null, onchange: A.markDirty },
      option('', 'تلقائي (حسب الأيقونة أو الرابط)'),
      option('none', 'من غير — يفتح على طول'),
      groups,
      rest.length ? el('optgroup', { label: 'تانية' }, rest.map(function (key) { return option(key, platforms[key].label || key); })) : null,
      option('web', 'مشهد عام (أي موقع)'),
      selected && used.indexOf(selected) === -1 ? option(selected, experienceLabel(selected)) : null
    );

    var said = el('p', { class: 'experience-said', 'aria-live': 'polite' });

    var shown = '';

    /* shows what the link opens; returns true when that is a scene */
    function update() {

      var now = current();
      var chosen = select.value;
      var resolve = window.adminResolveExperience || function () { return ''; };
      var key = chosen === 'none' ? '' : chosen || resolve({ experience: '', icon: now.icon, url: now.url });
      var why = '';

      if (!chosen && key) {
        why = resolve({ experience: '', icon: now.icon, url: '' }) === key ? ' (من الأيقونة)' : ' (من اللينك)';
      }

      var platform = platforms[key];
      shown = key;

      A.fill(said,
        A.icon(key ? (platform && platform.icon) || 'sparkle' : 'external'),
        key
          ? el('span', {}, chosen ? 'هيفتح مشهد ' : 'تلقائي هنا = مشهد ', el('b', { text: experienceLabel(key) }), why, ' — وبعده زرار للينك نفسه')
          : el('span', { text: chosen === 'none' ? 'من غير مشهد: اللينك هيفتح على طول.' : 'تلقائي هنا = من غير مشهد: ده موقع عادي، هيفتح على طول.' })
      );

      return !!key;

    }

    return {
      node: A.field('التجربة قبل اللينك', el('div', {}, select, said), 'مشهد قصير يعرّف الزائر بالمكان اللي رايحله، وبعدين زرار يودّيه للينك نفسه'),
      select: select,
      update: update,
      /* the scene family it opens (platforms.js `scene`), '' = none */
      scene: function () { return (platforms[shown] && platforms[shown].scene) || ''; },
      value: function () { return select.value; }
    };

  }

  A.experienceLabel = experienceLabel;

  function editLink(link) {

    var isNew = !link;
    // new links default to a general section rather than the social one
    var sections = A.byOrder(A.state.draft.sections).filter(function (s) { return !s.kind || s.kind === 'links'; });
    var defaultSection = sections.filter(function (s) { return s.key !== 'social'; })[0] || sections[0] || {};
    link = link || { enabled: true, featured: false, style: 'card', icon: 'link', section: defaultSection.key || '' };

    var featured = bool(link.featured);
    var box = A.errorBox();
    var limits = A.state.meta.limits;

    var title = A.counted('العنوان', link.title, limits.title, null, { required: true });
    var subtitle = A.counted('وصف قصير', link.subtitle, limits.subtitle, 'اختياري');
    var urlInput = A.textInput(link.url, { ltr: true, type: 'url', placeholder: 'https://', inputmode: 'url', required: true });

    var sectionSelect = el('select', { class: 'input', onchange: A.markDirty }, sections.map(function (s) {
      return el('option', { value: s.key, selected: s.key === link.section ? 'selected' : null, text: s.title + (bool(s.enabled) ? '' : ' (مخفي)') });
    }));
    var sectionField = A.field('القسم', sectionSelect);

    var style = A.choices('style', [
      { value: 'card', label: 'صف عريض' },
      { value: 'tile', label: 'مربع زي التطبيقات' }
    ], link.style === 'tile' ? 'tile' : 'card');
    var styleField = A.field('الشكل', style.node, 'المربع مناسب للسوشيال ميديا، والصف مناسب للينكات اللي محتاجة وصف');

    var cta = A.counted('نص الزرار', link.cta, limits.cta, 'مثلاً: ابعت دلوقتي');

    function syncFeatured(on) {
      sectionField.hidden = on;
      styleField.hidden = on;
      cta.node.hidden = !on;
    }

    var featuredSwitch = A.switchInput('رابط مميز (يظهر كبير فوق)', featured, syncFeatured);
    var icons = A.iconPicker(link.icon || 'link');

    var badge = A.textInput(link.badge, { max: limits.badge, placeholder: 'مثلاً: جديد' });
    var badgeField = A.field('شارة', el('div', { class: 'actions' },
      badge,
      el('button', { class: 'btn', type: 'button', onclick: function () { badge.value = 'جديد'; A.markDirty(); } }, 'جديد'),
      el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { badge.value = ''; A.markDirty(); } }, 'من غير')
    ), 'اختياري');

    var start = A.dateTimeInput(link.startAt, { presets: [A.PRESETS.now, A.PRESETS.thursday8] });
    var end = A.dateTimeInput(link.endAt, { presets: [A.PRESETS.sunday10] });
    var enabled = A.switchInput('ظاهر', link.enabled === undefined ? true : bool(link.enabled));

    syncFeatured(featured);

    var experience = experiencePicker(link.experience || '', function () {
      return { icon: icons.value(), url: urlInput.value.trim() };
    });
    var gallery = A.galleryPicker(link.gallery || '', {
      max: limits.gallery || 12,
      label: 'محتوى المشهد',
      scene: experience.scene,
      hint: 'اختياري — لحد ١٢ عنصر بيظهروا جوه المشهد بالترتيب ده: صور وفيديوهات من المكتبة بالكلام اللي معاها، ورسايل أو منشورات نصية في فيسبوك وX وThreads وواتساب وتليجرام وماسنجر وديسكورد. الفيديو: «من» و«لحد» (مثلاً 0:37 و0:43)؛ لو سبتهم فاضيين بيشتغل أول ٦ ثواني. من غير محتوى بيظهر المحتوى الجاهز للمشهد.'
    });

    // the content only matters when the link opens a scene (and what it can show depends on which)
    // (the picker first drew before the scene was known: '' = that first drawing)
    var lastScene = '';
    function syncExperience() {
      gallery.node.hidden = !experience.update();
      if (lastScene !== experience.scene()) gallery.redraw();
      lastScene = experience.scene();
    }

    experience.select.addEventListener('change', syncExperience);
    icons.node.addEventListener('change', syncExperience);
    urlInput.addEventListener('input', syncExperience);
    syncExperience();

    var save = el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

    save.addEventListener('click', function () {
      box.hidden = true;
      // a video's «من» / «لحد» that don't make sense: the message is next to them
      var clipProblem = gallery.check();
      if (clipProblem) {
        A.fail(new Error(clipProblem), box);
        return;
      }
      A.withBusy(save, A.call('apiSaveLink', {
        experience: experience.value(),
        gallery: gallery.value(),
        id: link.id || '',
        title: title.input.value,
        subtitle: subtitle.input.value,
        url: urlInput.value.trim(),
        featured: featuredSwitch.input.checked,
        section: sectionSelect.value,
        style: style.value(),
        cta: cta.input.value,
        icon: icons.value(),
        badge: badge.value,
        startAt: start.value(),
        endAt: end.value(),
        enabled: enabled.input.checked
      }))
        .then(function (next) {
          A.dirty = false;
          document.getElementById('sheet').close();
          A.applyState(next);
          A.toast(isNew ? 'الرابط اتضاف ✓ — لسه محتاج نشر' : 'اتحفظ ✓ — لسه محتاج نشر');
        })
        .catch(function (error) { A.fail(error, box); });
    });

    A.dirty = false;

    A.openSheet(isNew ? 'رابط جديد' : 'تعديل: ' + link.title, [
      box,
      el('div', { class: 'form' },
        title.node,
        subtitle.node,
        A.field('اللينك', urlInput, 'لازم يبدأ بـ https://'),
        featuredSwitch.node,
        sectionField,
        styleField,
        cta.node,
        A.field('الأيقونة', icons.node),
        experience.node,
        gallery.node,
        badgeField,
        A.field('يبدأ يظهر من', start.node, 'اختياري — سيبه فاضي لو هيظهر على طول'),
        A.field('آخر ظهور', end.node, 'اختياري — مناسب للمؤتمرات والرحلات والتسجيل'),
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('links', isNew ? '' : link.id),
      lock: isNew ? null : A.editLock('links', link.id, 'رابط «' + (link.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.links, 'id', link.id); if (fresh) editLink(fresh); else A.closeSheet(); })
    });

  }

  /* any page section: link groups (new or existing) and the built-in ones */
  function editSection(section) {

    var isNew = !section;
    section = section || { key: '', title: '', kind: 'links', enabled: true };

    // the layout row carries the resolved values (works for every kind)
    var row = (A.state.layout || []).filter(function (s) { return s.key === section.key; })[0] || section;
    var kind = row.kind || 'links';
    var info = KIND_INFO[kind] || KIND_INFO.links;
    var box = A.errorBox();
    var key = A.textInput(section.key, { ltr: true, placeholder: 'events', max: 31 });

    if (!isNew) {
      key.readOnly = true;
    }

    var limits = A.state.meta.limits;
    var title = A.counted('عنوان القسم', row.title, limits.sectionTitle, info.titleHint, { required: kind === 'links' });
    var subtitle = A.counted('سطر تحت العنوان', row.subtitle, limits.subtitle, 'اختياري', {});
    var from = A.dateTimeInput(row.visibleFrom, { emptyText: 'يظهر على طول', presets: [A.PRESETS.now, A.PRESETS.thursday8, A.PRESETS.friday] });
    var until = A.dateTimeInput(row.visibleUntil, { emptyText: 'مبيختفيش لوحده', presets: [A.PRESETS.sunday10] });
    var enabled = A.switchInput('القسم ظاهر', isNew ? true : bool(row.enabled));
    // every kind of section can have a banner (no exceptions)
    var banner = A.imagePicker(row.banner || '', { label: 'بانر القسم (اختياري)', hint: info.bannerHint || 'بيظهر فوق القسم في الموقع، بعرض القسم' });
    var theme = A.themePicker(row.theme || '');
    // «شكل الخلفية»: the cards' background in this section, any kind of section
    var surface = A.choices(A.uid('surface'), SURFACES, row.surface || '');
    var surfaceMobile = A.choices(A.uid('surface-mobile'), [{ value: '', label: 'زي الكمبيوتر' }].concat(SURFACES.slice(1)), row.surfaceMobile || '');
    var save = el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

    save.addEventListener('click', function () {
      box.hidden = true;
      A.withBusy(save, A.call('apiSaveSection', {
        key: key.value.trim(),
        title: title.input.value,
        subtitle: subtitle.input.value,
        visibleFrom: from.value(),
        visibleUntil: until.value(),
        theme: theme.value(),
        banner: banner.value(),
        surface: surface.value(),
        surfaceMobile: surfaceMobile.value(),
        icon: row.icon || '',
        enabled: enabled.input.checked
      }, isNew))
        .then(function (next) {
          A.dirty = false;
          document.getElementById('sheet').close();
          A.applyState(next);
          A.toast('اتحفظ ✓ — لسه محتاج نشر');
        })
        .catch(function (error) { A.fail(error, box); });
    });

    A.dirty = false;

    A.openSheet(isNew ? 'قسم روابط جديد' : 'تعديل: ' + (row.title || info.label), [
      box,
      el('div', { class: 'form' },
        isNew || kind === 'links' ? A.field('مفتاح القسم', key, isNew ? 'بالإنجليزي الصغير ومن غير مسافات، مثلاً events. مش هيظهر للناس' : 'المفتاح مبيتغيرش بعد الإضافة') : null,
        title.node,
        info.publicTitle ? subtitle.node : null,
        el('div', { class: 'form-group' },
          el('p', { class: 'section-label', text: 'الشكل' }),
          info.publicTitle ? A.field('لون القسم', theme.node, 'بيغيّر لمسة اللون والإضاءة بتاعة القسم بس') : null,
          banner.node,
          A.field('شكل الخلفية', surface.node, 'خلفية الكروت اللي في القسم ده. «تلقائي» = زي ما الموقع شايف أحسن'),
          A.field('على الموبايل', surfaceMobile.node, 'لو عايز شكل تاني على الموبايل بس')
        ),
        el('div', { class: 'form-group' },
          el('p', { class: 'section-label', text: 'الظهور (بتوقيت مصر)' }),
          enabled.node,
          A.field('يظهر من', from.node, 'سيبه فاضي لو عايزه يظهر أول ما تنشر'),
          A.field('يختفي بعد', until.node, 'سيبه فاضي لو مش عايزه يختفي لوحده')
        )
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('sections', isNew ? '' : section.key),
      lock: isNew ? null : A.editLock('sections', section.key, 'قسم «' + (row.title || info.label || section.key) + '»', function () { var fresh = A.findRow(A.state.layout, 'key', section.key) || A.findRow(A.state.draft.sections, 'key', section.key); if (fresh) editSection(fresh); else A.closeSheet(); })
    });

  }

  /* «شكل الخلفية» (SECTION_SURFACES, Content.gs) */
  var SURFACES = [
    { value: '', label: 'تلقائي' },
    { value: 'glass', label: 'شفاف (Glass)' },
    { value: 'dark', label: 'داكن' },
    { value: 'filled', label: 'ممتلئ' },
    { value: 'none', label: 'بدون خلفية' }
  ];

  A.editSection = editSection;
  A.editLink = editLink;
  A.editors.sections = editSection;
  A.editors.links = editLink;


  /* =======================================================

      .formatToParts(new Date(ms)).forEach(function (p) { parts[p.type] = p.value; });

  }

  function ntGroups(types) {

    var order = [];

    types.forEach(function (t) {
      if (!by[t.module]) { by[t.module] = []; order.push(t.module); }
      by[t.module].push(t);
    });
    return order.map(function (m) { return { module: m, types: by[m] }; });

  }

            // the panel's status follows the Worker (WorkerSync.gs), then this list (once the page is drawn again)
            return A.call('apiPublishRefresh')
              .then(function (next) { if (A.applyState) A.applyState(next); })
              .catch(function () { /* the status catches up within 20 s */ })
              .then(function () { if (card.isConnected) load(); });
          })
          .catch(function (error) { A.fail(error, box, { fields: false }); });
      });
    }

    /* Phase 8B: grouped by day (Cairo), no commit codes: the time, who, and «ارجع للنسخة دي» */
    var SHOW = 12;
    var showAll = false;

    function cairo(ms) {
      var p = {};
      new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
        .formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
      return { day: p.year + '-' + p.month + '-' + p.day, hour: +(p.hour === '24' ? 0 : p.hour), minute: p.minute };
    }

    function clock(c) {
      var h = c.hour % 12 || 12;
      return A.digits(h + ':' + c.minute) + (c.hour < 12 ? ' ص' : ' م');
    }

    var lastData = null;

    function draw(data) {
      lastData = data;
      body.setAttribute('aria-busy', 'false');
      var names = (A.state && A.state.names) || {};
      var today = A.cairoNow().slice(0, 10);
      var jobs = showAll ? data.jobs : data.jobs.slice(0, SHOW);
      var days = [];
      jobs.forEach(function (job) {
        var c = cairo(job.at);
        var last = days[days.length - 1];
        if (!last || last.day !== c.day) days.push(last = { day: c.day, jobs: [] });
        last.jobs.push({ job: job, c: c });
      });
      var count = function (day) { return data.jobs.filter(function (j) { return cairo(j.at).day === day; }).length; };
      A.fill(body, [
        data.enabled ? null : el('p', { class: 'note' }, 'الرجوع لنسخة قديمة بيشتغل لما النشر يبقى من السيرفر الجديد. دلوقتي الموقع بيتنشر من GitHub.'),
        data.jobs.length ? el('div', { class: 'pubdays' }, days.map(function (d) {
          return el('section', { class: 'pubday' },
            el('p', { class: 'pubday__title', text: (d.day === today ? 'النهارده · ' : '') + A.formatWall(d.day, false) + ' · ' + A.digits(count(d.day)) + ' نشر' }),
            el('ul', { class: 'pubday__list' }, d.jobs.map(function (x) {
              var job = x.job;
              var who = names[job.by] || job.by || '';
              return el('li', { class: 'pubrow' + (job.live ? ' is-live' : ''), 'data-publish': job.id },
                el('span', { class: 'chipico' + (job.live ? ' chipico--ok' : ''), 'aria-hidden': 'true' }, icon(job.live ? 'check' : job.mode === 'restore' ? 'retry' : 'send')),
                el('div', { class: 'pubrow__body' },
                  el('p', { class: 'pubrow__time' }, el('b', { text: clock(x.c) }), job.live ? A.chip('الحالية · اللي على الموقع دلوقتي', 'ok') : null),
                  el('p', { class: 'pubrow__who', dir: 'auto', text: (job.mode === 'restore' ? PUBLISH_KINDS.restore + ' · ' : '') + (who ? 'نشرها ' + who : PUBLISH_KINDS[job.mode] || job.mode) })
                ),
                data.enabled && !job.live
                  ? el('button', { class: 'btn btn--small', type: 'button', onclick: function (event) { restore(job, data.live, event.currentTarget); } }, icon('retry'), 'ارجع للنسخة دي')
                  : null
              );
            })));
        }), !showAll && data.jobs.length > SHOW
          ? el('button', { class: 'btn btn--ghost btn--block pubdays__more', type: 'button', onclick: function () { showAll = true; draw(lastData); } }, 'اعرض الأقدم')
          : null) : el('p', { class: 'note' }, 'لسه مفيش نشر من السيرفر الجديد.')
      ]);
    }

    function load() {
      W.call('GET', '/v1/admin/publish/revisions', undefined, { quiet: true }).then(draw).catch(function (error) {
        // no publish permission, or the Worker away: the card stays out of the way
        if (error && (error.code === 'perm' || error.code === 'denied' || error.status === 403)) { card.hidden = true; return; }
        body.setAttribute('aria-busy', 'false');
        A.fail(error, box, { fields: false });
      });
    }

    load();
    return card;

  }

  /* the settings page's notification cards (only with the Worker) */
  function notifyCards() {

    var W = window.AdminWorker;
    if (!W) return [];
    return [myNotifyCard(W), notifySettingsCard(W), systemStatusCard(W)];

  }

  /*
   * Home: a red banner while critical rows wait (quota, Gmail stopped, dead),
   * for whoever manages the notifications (the Primary Admin). Quiet: nothing
   * when the Worker can't be reached or nothing waits.
   */
  A.criticalBanner = function () {

    var W = window.AdminWorker;
    if (!W) return null;
    var slot = el('div', { class: 'nt-banner', hidden: true, role: 'alert' });
    W.call('GET', '/v1/admin/notify/status', undefined, { quiet: true }).then(function (s) {
      var stopped = s.email && s.gmail.configured && !s.gmail.ok;
      if (!s.canManage || (!s.critical.length && !stopped)) return;
      A.fill(slot, [
        icon('alert'),
        el('span', { text: stopped ? 'الإيميلات واقفة: صلاحية جيميل محتاجة تتجدد.' : 'فيه ' + s.critical.length + ' تنبيه مهم جدًا لسه متبعتش.' }),
        el('button', { class: 'btn btn--small', type: 'button', onclick: function () { A.go('settings', 'system'); } }, 'شوف «حالة النظام»')
      ]);
      slot.hidden = false;
    }, function () { /* quiet */ });
    return slot;

  };

})();
</script>
