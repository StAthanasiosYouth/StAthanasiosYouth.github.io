  /* ---------- dates ---------- */
  function gText(iso, wd) {
    var p = iso.split('-').map(Number);

    return (wd ? WD[w] + ' ' : '') + ar(p[2]) + ' ' + GM[p[1] - 1] + ' ' + ar(p[0]);
  }
  function cText(m, d, y) { return ar(d) + ' ' + CMONTHS[m - 1] + (y ? ' ' + ar(y) : ''); }
  function addDay(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  /* the next Gregorian date of a yearly day (or a one-time date), from a day */
  function nextOf(f, from) {
    from = from || today();
    if (f.repeat === 'once') return f.date;
    if (f.gregorian) {

  /* A crop is set in the crop tool's 3:4 frame. Other frames have other shapes (the list tile is wider: its name bar

     the point is read from the 3:4 geometry, then placed for this frame's own shape (object-fit: cover, then

  var CROP_FRAME = 3 / 4;
  function cropAxis(c, s, z) {

    var v = s / z;
    return v >= 1 ? null : { v: v, centre: c / 100 * (1 - v) + v / 2 };
  }
  /* Round 2 (owner 2026-11-24, the list still cut heads): keeping the centre is not enough in a shorter frame. The

  function placeCrop(img, c) {

    var ref = fit(CROP_FRAME), here = fit(box.width / box.height);

    var refV = Math.min(1, ref.sy / c.z), refTop = refV >= 1 ? 0 : c.y / 100 * (1 - refV);
    var refX = cropAxis(c.x, ref.sx, c.z);
    var centreX = refX ? refX.centre : 0.5;
    var z = Math.max(1, Math.min(3, here.sy / refV));
    var vy = here.sy / z, vx = here.sx / z;

    var x = vx >= 1 ? 50 : Math.max(0, Math.min(100, (centreX - vx / 2) / (1 - vx) * 100));
    return { x: x, y: y, z: z };

    // a frame drawn before it has a size (a list still being laid out): place it again once it has one
    else if (!img.getBoundingClientRect().width) requestAnimationFrame(draw);
  }
  function mainOf(p) { var al = p.album || []; return al.filter(function (a) { return a.main; })[0] || al.filter(function (a) { return a.media; })[0] || null; }
  function mediaId(path) { return String(path || '').split('/').pop().replace(/\.\w+$/, ''); }
  /* an <img> that fills its frame from the picture's crop, once the library gives its address */

  /* ---------- P4: the one-time import of the approved album pictures (docs/daily-bread/saints/P4-PROGRESS.md) ----------

  var IMPORT_URL = '../media/import-p4/';

    fetch(IMPORT_URL + 'p4.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && Array.isArray(d.pictures) && d.pictures.length) { SA.imp.plan = d.pictures; if (K.onTab('breadpeople')) A.render(); }
    }).catch(function () {});

  function b64Of(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('الملف ' + url + ' مش موجود'); return r.blob(); }).then(function (blob) {
      return new Promise(function (resolve, reject) {

  function runImport() {

    var paths = {};
    var n = 0;
    SA.imp.busy = true; SA.imp.step = 'بيرفع الصور: ٠ من ' + ar(plan.length); A.render();
    var chain = Promise.resolve();
    plan.forEach(function (x) {
      chain = chain.then(function () {
        return Promise.all(['', '-480', '-160'].map(function (s) { return b64Of(IMPORT_URL + x.key + s + '.webp'); }));
      }).then(function (b) {
        // the Worker's free plan (10 ms CPU a request): a new library picture sometimes runs out and the request drops
        // ("Failed to fetch"); the same call again goes through. Up to 25 tries a picture, a little slower each time.
        var body = { mime: 'image/webp', full: b[0], thumb: b[1], tiny: b[2], tinyMime: 'image/webp', color: x.color, width: x.w, height: x.h, alt: x.alt, name: x.key };
        var tryUpload = function (n) {
          return A.call('apiUploadMedia', body).catch(function (error) {
            var code = error && (error.code || (error.parsed && error.parsed.code));
            if (n >= 25 || code === 'invalid' || code === 'denied' || code === 'auth') throw error;
            return new Promise(function (r) { setTimeout(r, Math.min(8000, 1000 + n * 400)); }).then(function () { return tryUpload(n + 1); });
          });
        };
        return tryUpload(1);
      }).then(function (res) {
        if (!res || !res.media || !res.media.path) throw new Error('الرفع رجع ناقص (' + x.key + ')');
        paths[x.key] = res.media.path;
        n++; SA.imp.step = 'بيرفع الصور: ' + ar(n) + ' من ' + ar(plan.length);
        var s = document.querySelector('[data-imp-step]'); if (s) s.textContent = SA.imp.step;
      });
    });
    return chain.then(function () { return load(true); }).then(function () {
      var ids = [];
      plan.forEach(function (x) { if (ids.indexOf(x.person) < 0) ids.push(x.person); });
      var saved = 0;
      var c2 = Promise.resolve();
      ids.forEach(function (id) {
        c2 = c2.then(function () {
          var it = itemOf('person', id);
          if (!it) return;
          var album = plan.filter(function (x) { return x.person === id; }).map(function (x) {
            var a = { media: paths[x.key], type: x.type };
            ['main', 'stage', 'occasion', 'caption'].forEach(function (k) { if (x[k] != null) a[k] = x[k]; });

  /* the occasion's form (P5): the title, the type, its day (a person's day / Coptic / Gregorian / once), what it stands

  function occModal(it) {

    var fromBox = el('div', {}, el('div', { class: 'sa-three oca-two' }, el('div', { class: 'field' }, el('span', { class: 'field__label', text: 'الشخص' }), personSel.node), field('اليوم', feastSel)),
      el('p', { class: 'sa-live' }, icon('link'), el('span', { text: 'التاريخ والمصدر من السجل. لو اليوم اتعدّل في صفحة الشخص، المناسبة بتمشي معاه. واليوم ده مبيظهرش في «نحب نفكّرك».' })));

    }
    var chosen = (o.pictures || []).slice();
    var picBox = el('div', { class: 'oca-pick' });

      covers.forEach(function (cv) { ids.push(cv.person); });
      chosen.forEach(function (c) { if (c.person) ids.push(c.person); });
      return ids.filter(function (v, i, a) { return a.indexOf(v) === i; });
    }
    function drawPics() {
      picBox.replaceChildren();
      var seen = {};
      involved().forEach(function (id) {
        var p = personOf(id); if (!p) return;

          seen[a.media] = 1;

      field('العنوان اللي بيظهر', headline, 'بيبدأ بـ«النهارده…». الكارت بيكتب تحته اسم الشخص لوحده'),

      var hl = headline.value.trim();
