<script>
/*
 * Admin views for the content center: the timeline (الجدول), meetings,
 * news, games and notifications. Saved through apiSaveItem (Items.gs).
 * All times are Cairo wall time.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;
  var bool = A.bool;

  A.editors = A.editors || {};

  var TONE_LABELS = { info: 'عادي', alert: 'تنبيه (زي إلغاء)', celebrate: 'مناسبة حلوة' };

  var TYPE_LABELS = { general: 'عام', meeting: 'اجتماع', news: 'خبر', game: 'لعبة', important: 'مهم', competition: 'مسابقة', activity: 'فعالية' };
  var TYPE_ICONS = { general: 'info', meeting: 'church', news: 'megaphone', game: 'star', important: 'alert', competition: 'trophy', activity: 'calendar' };

  var nowMinutes = function () { return A.wallMinutes(A.cairoNow()); };

  function hubLimits() { return A.state.meta.hubLimits; }

  function hasNotification(id) {

    return (A.state.draft.notifications || []).some(function (n) { return n.id === id; });

  }

  function guard(builder) {

    return function () {
      return A.state.hubReady ? builder() : [A.hubNotReady()];
    };

  }

  function addButton(label, onclick) {

    return el('button', { class: 'btn btn--primary', type: 'button', onclick: onclick }, label);

  }

  function saveButton(isNew) {

    return el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

  }

  /* the visibility pill first (مخفي / يظهر لاحقًا / ظاهر دلوقتي / انتهى) */
  function windowChips(enabled, from, until) {

    return [A.visibilityChip(enabled, from, until)];

  }


  /* =======================================================
     TIMELINE (الجدول)
  ======================================================= */

  function timelineEvents() {

    var draft = A.state.draft;
    var events = [];
    var meetingTime = A.setting('meeting.time') || '20:00';

    function push(at, kind, item, label, iconName) {
      var minutes = A.wallMinutes(at);
      if (minutes !== null) events.push({ minutes: minutes, at: at, kind: kind, item: item, label: label, icon: iconName });
    }

    (draft.sessions || []).filter(function (s) { return bool(s.enabled); }).forEach(function (s) {
      var when = s.date + ' ' + (s.time || meetingTime);
      push(when, 'sessions', s, s.status === 'cancelled' ? 'اجتماع ملغي' : 'اجتماع' + (s.topic ? ': ' + s.topic : ''), 'church');
      if (s.visibleFrom && s.topic) push(s.visibleFrom, 'sessions', s, 'يظهر موضوع الاجتماع: ' + s.topic, 'church');
    });

    (draft.news || []).filter(function (n) { return bool(n.enabled); }).forEach(function (n) {
      push(n.publishAt, 'news', n, 'خبر يتنشر: ' + n.title, 'megaphone');
      if (n.expireAt) push(n.expireAt, 'news', n, 'خبر يختفي: ' + n.title, 'megaphone');
    });

    (draft.games || []).filter(function (g) { return bool(g.enabled); }).forEach(function (g) {
      if (g.visibleFrom) push(g.visibleFrom, 'games', g, 'لعبة تظهر "قريبًا": ' + g.title, 'star');
      push(g.startAt, 'games', g, 'لعبة تبدأ: ' + g.title, 'star');
      push(g.endAt, 'games', g, 'لعبة تخلص: ' + g.title, 'star');
    });

    (draft.activities || []).filter(function (a) { return bool(a.enabled) && !bool(a.archived); }).forEach(function (a) {
      if (a.visibleFrom) push(a.visibleFrom, 'activities', a, 'يظهر: ' + a.title, 'calendar');
      if (a.startAt) push(a.startAt, 'activities', a, 'بيبدأ: ' + a.title, 'calendar');
    });

    (draft.notifications || []).filter(function (n) { return bool(n.enabled); }).forEach(function (n) {
      push(n.publishAt, 'notifications', n, 'إشعار في الجرس: ' + n.title, TYPE_ICONS[n.type] || 'bell');
    });

    return events.sort(function (a, b) { return a.minutes - b.minutes; });

  }

  A.views.schedule = function () {

    if (!A.state.hubReady) {
      return [A.hubNotReady()];
    }

    var now = nowMinutes();
    var today = Math.floor(now / 1440);


    var events = timelineEvents().filter(function (e) {
      return e.minutes >= now - 12 * 60 && e.minutes <= now + 60 * 1440;
    });

    var groups = [];
    var current = null;

    events.forEach(function (event) {
      var day = Math.floor(event.minutes / 1440);
      if (!current || current.day !== day) {
        current = { day: day, items: [] };
        groups.push(current);
      }
      current.items.push(event);
    });

    var timeline = A.card('الجدول', 'اللي جاي في الشهرين الجايين، بتوقيت مصر. دوس على أي حاجة تعدلها.',
      groups.length
        ? el('div', { class: 'timeline' }, groups.map(function (group) {
          var label = group.day === today ? 'النهارده' : group.day === today + 1 ? 'بكره' : group.day === today - 1 ? 'امبارح' : A.formatWall(A.wallFromMinutes(group.day * 1440).slice(0, 10), false);
          return el('section', { class: 'timeline__day' },
            el('h3', { class: 'timeline__date', text: label }),
            el('ol', { class: 'timeline__list' }, group.items.map(function (event) {
              var past = event.minutes < now;
              var time = A.formatWall(event.at).split('، ')[1] || '';
              return el('li', {},
                el('button', { class: 'timeline__row' + (past ? ' is-past' : ''), type: 'button', onclick: function () { A.editors[event.kind](event.item); } },
                  el('span', { class: 'timeline__time', text: time }),
                  el('span', { class: 'timeline__icon', 'aria-hidden': 'true' }, icon(event.icon)),
                  el('span', { class: 'timeline__label', text: event.label })
                )
              );
            }))
          );
        }))
        : el('p', { class: 'empty', text: 'مفيش حاجة متجدولة. ابدأ بإضافة اجتماع أو خبر.' })
    );

    var pending = A.state.schema && A.state.schema.data < A.state.schema.target ? A.upgradeNotice() : null;

    return [pending, A.dashboard(), timeline].filter(Boolean);

  };


  /* =======================================================
     MEETINGS (weekly rule + dated sessions)
  ======================================================= */

  A.views.meetings = guard(function () {

    var setting = A.setting;
    var limits = A.state.meta.limits;
    var box = A.errorBox();

    var title = A.counted('اسم الاجتماع', setting('meeting.title'), limits.title);

    var currentDay = String(setting('meeting.day'));
    var daySelect = el('select', { class: 'input', onchange: A.markDirty }, A.state.meta.days.map(function (day, index) {
      var selected = currentDay === day || currentDay === String(index) || (currentDay && day.indexOf(currentDay.replace(/^ال/, '')) !== -1);
      return el('option', { value: day, selected: selected ? 'selected' : null, text: day });
    }));

    var time = el('input', { class: 'input', type: 'time', value: setting('meeting.time'), oninput: A.markDirty });
    var duration = A.textInput(setting('meeting.durationMinutes'), { type: 'number', inputmode: 'numeric', placeholder: 'مثلاً 120' });
    var note = A.counted('ملاحظة', setting('meeting.note'), limits.note, A.settingHelp('meeting.note'));

    var weekly = A.card('الميعاد الأسبوعي', 'الأساس اللي الموقع بيعد عليه. أي أسبوع مختلف (موضوع، ساعة تانية، إلغاء) ضيفه تحت.',
      box,
      el('div', { class: 'form' },
        title.node,
        el('div', { class: 'row' }, A.field('اليوم', daySelect), A.field('الساعة', time)),
        A.field('مدة الاجتماع بالدقايق', duration, 'سيبها فاضية لو مش متأكد — ساعتها الموقع مش هيقول "شغال دلوقتي"'),
        note.node
      ),
      A.settingsSaver(function () {
        return {
          'meeting.title': title.input.value,
          'meeting.day': daySelect.value,
          'meeting.time': time.value,
          'meeting.durationMinutes': duration.value,
          'meeting.note': note.input.value
        };
      }, box)
    );

    var today = A.cairoNow().slice(0, 10);
    var sessions = (A.state.draft.sessions || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var upcoming = sessions.filter(function (s) { return s.date >= today; });
    var past = sessions.filter(function (s) { return s.date < today; }).reverse();

    var list = function (items) {
      return el('ul', { class: 'list' }, items.map(sessionItem));
    };

    var dated = A.card('الاجتماعات الجاية', 'موضوع كل أسبوع، المتكلم، البوستر، أو إلغاء أسبوع.',
      el('div', { class: 'actions' },
        addButton('+ اجتماع', function () { A.editors.sessions(null); }),
        el('button', { class: 'btn', type: 'button', onclick: function () { A.openImport(); } }, icon('calendar'), 'استيراد جدول الاجتماعات')
      ),
      upcoming.length ? list(upcoming) : el('p', { class: 'empty', text: 'مفيش اجتماعات متسجلة لسه — الموقع هيعرض الميعاد الأسبوعي بس.' }),
      past.length ? el('details', { class: 'past' }, el('summary', { text: 'اجتماعات فاتت (' + past.length + ')' }), list(past)) : null
    );

    return [meetingSectionCard(), weekly, dated];

  });

  /*
   * «إظهار ركن الاجتماع»: the whole meeting block on the site. Off, no
   * session, topic or poster can make it appear. (One week's cancellation
   * is a dated meeting below, not this.)
   */
  function meetingSectionCard() {

    var row = (A.state.layout || []).filter(function (s) { return s.key === 'meeting'; })[0] || { enabled: true };
    var upgraded = A.state.schema.data >= A.state.schema.target;
    var on = bool(row.enabled);

    var toggle = A.switchInput('إظهار ركن الاجتماع', on, function (checked) {
      A.dirty = false;
      var call = upgraded
        ? A.call('apiSetSectionEnabled', 'meeting', checked)
        : A.call('apiSaveSettings', { 'meeting.enabled': checked });
      call.then(function (next) {
        A.applyState(next);
        A.toast(checked ? 'ركن الاجتماع هيظهر بعد النشر' : 'ركن الاجتماع هيختفي بعد النشر — بكل مواضيعه');
      }).catch(function (error) { toggle.input.checked = !checked; A.fail(error); });
    });

    return el('section', { class: 'card card--switch' + (on ? '' : ' is-off') },
      el('div', { class: 'card--switch__text' },
        el('h2', { class: 'card__title', text: 'ركن الاجتماع في الموقع' }),
        el('p', { class: 'card__hint', text: on
          ? 'ظاهر: الميعاد والعد التنازلي وموضوع الأسبوع. لإلغاء أسبوع واحد بس، استخدم «ملغي الأسبوع ده» تحت.'
          : 'مخفي بالكامل: مفيش ميعاد ولا موضوع ولا بوستر هيظهر للزوار، حتى لو متسجلين تحت.' }),
        A.visibilityChip(on, row.visibleFrom, row.visibleUntil)
      ),
      toggle.node
    );

  }

  function sessionItem(session) {

    var enabled = bool(session.enabled);
    var cancelled = session.status === 'cancelled';
    var chips = [];

    if (cancelled) chips.push(A.chip('ملغي', 'danger'));
    if (session.time) chips.push(A.chip('الساعة ' + session.time));
    if (session.speaker) chips.push(A.chip(session.speaker));
    chips.unshift(A.visibilityChip(enabled, cancelled ? '' : session.visibleFrom, ''));
    if (hasNotification('notif-session-' + session.date)) chips.push(A.chip('🔔 في الجرس'));

    var toggle = A.toggleItem('sessions', session.date, enabled);

    return A.listItem({
      icon: cancelled ? 'alert' : 'church',
      image: session.image,
      title: A.formatWall(session.date, false) + (session.topic ? ' — ' + session.topic : ''),
      off: !enabled,
      chips: chips,
      controls: [
        toggle.node,
        el('span', { class: 'spacer' }),
        A.editButton('الاجتماع', function () { A.editors.sessions(session); }),
        A.deleteButton('الاجتماع', function (e) { A.deleteItem('sessions', session.date, 'اجتماع ' + session.date, e.currentTarget); })
      ]
    });

  }

  /* prefill (new only): e.g. { date } from the home page's next meeting */
  A.editors.sessions = function (session, prefill) {

    var isNew = !session;
    session = session || { enabled: true, status: 'normal', date: A.nextWeekday(dayIndex(), '20:00').slice(0, 10) };
    if (isNew && prefill) {
      Object.keys(prefill).forEach(function (key) { session[key] = prefill[key]; });
    }

    var box = A.errorBox();
    var limits = hubLimits();

    var date = A.dateTimeInput(session.date, { dateOnly: true, clearable: false, presets: [
      { label: 'الأحد الجاي', value: function () { return A.nextWeekday(dayIndex(), '20:00').slice(0, 10); } }
    ] });

    var time = el('input', { class: 'input', type: 'time', value: session.time || '', oninput: A.markDirty });
    var duration = A.textInput(session.durationMinutes, { type: 'number', inputmode: 'numeric', placeholder: A.setting('meeting.durationMinutes') ? 'المعتاد ' + A.setting('meeting.durationMinutes') : 'مثلاً 120' });
    var topic = A.counted('الموضوع', session.topic, limits.topic, 'مثلاً: حياة التسليم');
    var speaker = A.counted('الخادم / المتكلم', session.speaker, limits.speaker, 'مثلاً: أبونا أنطوني عياد');
    var description = A.counted('وصف', session.description, limits.sessionDescription, 'اختياري', { multiline: true });
    var image = A.imagePicker(session.image, { label: 'بوستر الاجتماع' });
    var note = A.counted('ملاحظة', session.note, A.state.meta.limits.note, 'مثلاً سبب الإلغاء، أو "الاجتماع في القاعة الكبيرة"');

    var status = A.choices('status', [
      { value: 'normal', label: 'عادي' },
      { value: 'cancelled', label: 'ملغي الأسبوع ده' }
    ], session.status === 'cancelled' ? 'cancelled' : 'normal', sync);

    var visibleFrom = A.dateTimeInput(session.visibleFrom, {
      emptyText: 'الموضوع يظهر على طول',
      presets: [A.PRESETS.now, A.PRESETS.thursday8, A.PRESETS.friday]
    });

    var notify = A.checkbox('اعمل إشعار بالموضوع في الجرس', isNew ? true : hasNotification('notif-session-' + session.date), 'بيظهر للناس لما الموضوع يظهر');
    var enabled = A.switchInput('ظاهر', session.enabled === undefined ? true : bool(session.enabled));

    // «برنامج الاجتماع»: its times follow this meeting's own time and length
    var program = programEditor(A.programStages(session.program), {
      date: function () { return date.value(); },
      time: function () { return time.value || A.setting('meeting.time') || ''; },
      duration: function () { return Number(duration.value || A.setting('meeting.durationMinutes')) || null; },
      exclude: isNew ? '' : session.date
    });
    time.addEventListener('input', program.refresh);
    duration.addEventListener('input', program.refresh);

    var details = el('div', { class: 'form' },
      topic.node,
      speaker.node,
      description.node,
      image.node,
      program.node,
      A.field('الموضوع يظهر في الموقع من', visibleFrom.node, 'سيبه فاضي لو عايز يظهر أول ما تنشر'),
      notify.node
    );

    function sync(value) {
      details.hidden = (value || status.value()) === 'cancelled';
    }

    sync();

    var save = saveButton(isNew);

    save.addEventListener('click', function () {
      A.saveItem('sessions', {
        originalDate: isNew ? '' : session.date,
        date: date.value(),
        time: time.value,
        durationMinutes: duration.value,
        topic: topic.input.value,
        speaker: speaker.input.value,
        description: description.input.value,
        image: image.value(),
        status: status.value(),
        note: note.input.value,
        visibleFrom: visibleFrom.value(),
        program: program.value(),
        enabled: enabled.input.checked,
        notify: { topic: notify.input.checked }
      }, box, save);
    });

    A.dirty = false;

    // during the meeting itself: which stage is on now (live.json)
    var live = !isNew && session.date === A.cairoNow().slice(0, 10) && A.programStages(session.program).length
      ? A.liveControl(session)
      : null;

    A.openSheet(isNew ? 'اجتماع جديد' : 'تعديل الاجتماع', [
      box,
      live,
      el('div', { class: 'form' },
        A.field('التاريخ', date.node),
        el('div', { class: 'row' },
          A.field('الساعة', time, 'فاضية = المعتاد (' + (A.setting('meeting.time') || '—') + ')'),
          A.field('المدة بالدقايق', duration, 'فاضية = المعتاد')
        ),
        A.field('الحالة', status.node),
        details,
        note.node,
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('sessions', isNew ? '' : session.date),
      lock: isNew ? null : A.editLock('sessions', session.date, 'اجتماع ' + A.formatWall(session.date, false), function () { var fresh = A.findRow(A.state.draft.sessions, 'date', session.date); if (fresh) A.editors.sessions(fresh); else A.closeSheet(); })
    });

  };

  function dayIndex() {

    var day = String(A.setting('meeting.day'));
    var index = A.state.meta.days.indexOf(day);
    return index === -1 ? 0 : index;

  }


  /* =======================================================
     MEETING PROGRAM «برنامج الاجتماع»
     Stages in order, each with a start time OR a length (or both: the
     time wins). The server checks and publishes (Hub.gs resolveProgram_);
     the times shown here are the same rules, for the editor's eyes only.
  ======================================================= */

  var PROGRAM_MAX = 20;

  /* Sessions.program (JSON text) → [{ title, time, minutes }] */
  A.programStages = function (value) {

    var list = value;

    if (typeof value === 'string') {
      try { list = value ? JSON.parse(value) : []; }
      catch (e) { list = []; }
    }

    return (Array.isArray(list) ? list : []).map(function (stage) {
      stage = stage && typeof stage === 'object' ? stage : {};
      var minutes = stage.minutes === '' || stage.minutes === null || stage.minutes === undefined ? '' : Number(stage.minutes);
      return { title: String(stage.title || ''), time: String(stage.time || ''), minutes: isFinite(minutes) ? minutes : '' };
    });

  };

  /* the stages' [start, end] in wall minutes (null where unknown) — same rules as Hub.gs */
  A.resolveProgram = function (stages, date, startTime, duration) {

    var meetingStart = A.wallMinutes(date + ' ' + startTime);
    var meetingEnd = meetingStart !== null && duration ? meetingStart + duration : null;
    var starts = [];

    stages.forEach(function (stage, i) {
      var start = null;
      if (meetingStart !== null && /^\d{1,2}:\d{2}$/.test(stage.time)) {
        start = A.wallMinutes(date + ' ' + stage.time);
        if (meetingEnd !== null && Math.floor(meetingEnd / 1440) > Math.floor(meetingStart / 1440) && start < meetingStart) start += 1440;
      }
      else if (i === 0) start = meetingStart;
      else if (starts[i - 1] !== null && stages[i - 1].minutes) start = starts[i - 1] + Number(stages[i - 1].minutes);
      starts.push(start);
    });

    return starts.map(function (start, i) {
      var end = i < starts.length - 1 ? starts[i + 1]
        : meetingEnd !== null ? meetingEnd
        : start !== null && stages[i].minutes ? start + Number(stages[i].minutes) : null;
      return { start: start, end: start === null ? null : end };
    });

  };

  /* "٨:٣٠ م" */
  function clock(minutes) {

    if (minutes === null || minutes === undefined) return '—';
    return (A.formatWall(A.wallFromMinutes(minutes)).split('، ')[1] || '').trim() || '—';

  }

  /*
   * context: { date(), time(), duration(), exclude: a date not to copy from }
   * → { node (a field named «برنامج الاجتماع»), value(), refresh() }
   */
  function programEditor(initial, context) {

    var stages = initial.map(function (s) { return { title: s.title, time: s.time, minutes: s.minutes }; });
    var list = el('ol', { class: 'program' });
    var empty = el('p', { class: 'program__empty', text: 'مفيش برنامج — الموقع هيعرض الاجتماع من غير فقرات.' });
    var addButtonNode = el('button', { class: 'btn', type: 'button', onclick: function () {
      stages.push({ title: '', time: '', minutes: '' });
      A.markDirty();
      draw();
      var inputs = list.querySelectorAll('.program__title');
      if (inputs.length) inputs[inputs.length - 1].focus();
    } }, icon('plus'), 'فقرة');

    // «انسخ من اجتماع تاني»
    var others = (A.state.draft.sessions || []).filter(function (s) {
      return s.date !== context.exclude && A.programStages(s.program).length;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var copySelect = others.length ? el('select', { class: 'input program__copy-select', 'aria-label': 'اجتماع تنسخ منه' },
      el('option', { value: '', text: 'انسخ من اجتماع تاني…' }),
      others.slice(0, 30).map(function (s) {
        return el('option', { value: s.date, text: A.formatWall(s.date, false) + (s.topic ? ' — ' + s.topic : '') + ' (' + A.programStages(s.program).length + ' فقرات)' });
      })
    ) : null;

    if (copySelect) {
      copySelect.addEventListener('change', function () {
        var source = A.findRow(A.state.draft.sessions, 'date', copySelect.value);
        copySelect.value = '';
        if (!source) return;
        var copy = function () {
          stages = A.programStages(source.program);
          A.markDirty();
          draw();
          A.toast('اتنسخ برنامج ' + A.formatWall(source.date, false));
        };
        if (!stages.length) { copy(); return; }
        A.confirm({ tone: 'warn', title: 'تبدّل البرنامج ده؟', message: 'الفقرات اللي هنا هتتشال، ويتحط مكانها برنامج ' + A.formatWall(source.date, false) + '.', confirmLabel: 'انسخ', cancelLabel: 'لأ' })
          .then(function (ok) { if (ok) copy(); });
      });
    }

    function move(i, by) {
      var j = i + by;
      if (j < 0 || j >= stages.length) return;
      stages.splice(j, 0, stages.splice(i, 1)[0]);
      A.markDirty();
      draw();
      var row = list.children[j];
      var again = row && row.querySelector(by < 0 ? '.program__up' : '.program__down');
      if (again && !again.disabled) again.focus();
    }

    function draw() {

      var times = A.resolveProgram(stages, context.date(), context.time(), context.duration());

      list.replaceChildren.apply(list, stages.map(function (stage, i) {

        var n = String(i + 1).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });

  /* =======================================================
     LIVE: which stage is on now (live.json, apiSetLiveStage)

  A.liveControl = function (session) {

    var node = el('section', { class: 'live-control', 'aria-label': 'الاجتماع شغال دلوقتي' });

      var stages = A.programStages(session.program);
      var live = A.state.live && A.state.live.date === session.date ? A.state.live : null;
      var manual = live && live.stage !== null && live.stage !== undefined && stages[live.stage] ? live.stage : null;
      var time = session.time || A.setting('meeting.time') || '';
      var duration = Number(session.durationMinutes || A.setting('meeting.durationMinutes')) || null;
      var times = A.resolveProgram(stages, session.date, time, duration);
      var now = A.wallMinutes(A.cairoNow());
      var auto = -1;

      times.forEach(function (span, i) {
        if (span.start !== null && now >= span.start && (span.end === null || now < span.end)) auto = i;
      });

      var mode = manual === null
        ? A.chip('تلقائي' + (auto !== -1 ? ': ' + stages[auto].title : ''), 'ok')
        : A.chip('يدوي: ' + stages[manual].title, 'gold');

      A.fill(node,
        el('div', { class: 'live-control__head' },
          el('span', { class: 'live-control__dot', 'aria-hidden': 'true' }),
          el('h3', { class: 'live-control__title', text: 'الفقرة دلوقتي' }),
          el('span', { class: 'live-control__mode' }, mode)
        ),
        el('p', { class: 'card__hint', text: 'الموقع بيتبع أوقات البرنامج لوحده. لو الاجتماع اتأخر أو اتقدم، اختار الفقرة اللي شغالة — بتظهر على الموقع خلال دقيقة، من غير نشر.' }),
        el('ol', { class: 'live-control__list' }, stages.map(function (stage, i) {
          var current = manual === null ? i === auto : i === manual;
          var button = el('button', { class: 'btn' + (current ? ' btn--primary' : ''), type: 'button', disabled: manual === i, 'aria-pressed': current ? 'true' : 'false',
            onclick: function () { set(i, button); } }, current ? 'الحالية' : 'دي الحالية دلوقتي');
          return el('li', { class: 'live-control__row' + (current ? ' is-current' : '') },
            el('span', { class: 'live-control__time', text: clock(times[i] && times[i].start) }),
            el('span', { class: 'live-control__name', text: stage.title }),
            button
          );
        })),
        manual !== null
          ? el('div', { class: 'actions' }, (function () {
            var back = el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { set(null, back); } }, icon('retry'), 'رجّع للتوقيت التلقائي');
            return back;

  var IMPORT_ACTIONS = {

  /* the template: a header and two example rows; the BOM makes Excel read the Arabic right */
  function downloadTemplate() {

    var next = A.nextWeekday(dayIndex(), '20:00').slice(0, 10);
    var after = A.wallFromMinutes(A.wallMinutes(next) + 7 * 1440).slice(0, 10);
    var dmy = function (date) { var p = date.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
    var rows = [
      ['التاريخ', 'الموضوع', 'المتكلم', 'الوصف', 'الوقت', 'ملاحظات'],
      [next, 'حياة التسليم', 'أبونا أنطوني', 'إزاي نسلّم حياتنا لربنا', '20:00', ''],
      [dmy(after), 'الصلاة', 'أ. مينا', '', '8:30 م', 'في القاعة الكبيرة']
    ];
    var csv = rows.map(function (row) {
      return row.map(function (cell) { return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell; }).join(',');
    }).join('\r\n') + '\r\n';
    var url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    var link = el('a', { href: url, download: 'جدول-الاجتماعات.csv', hidden: true });

    document.body.appendChild(link);
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); link.remove(); }, 1000);

  /* a .csv as text: UTF-8 (with or without BOM), else Arabic Windows (Excel's older "CSV") */
  function readCsv(file) {

    return file.arrayBuffer().then(function (buffer) {
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
      }
      catch (e) {
        return new TextDecoder('windows-1256').decode(buffer);
      }
    });

  }

  A.openImport = function () {

    });

    var expireAt = A.dateTimeInput(item.expireAt, { emptyText: 'مش هيختفي لوحده', presets: [A.PRESETS.sunday10] });

    var tone = A.choices('tone', ['info', 'alert', 'celebrate'].map(function (t) { return { value: t, label: TONE_LABELS[t] }; }), item.tone || 'info');
    var toneField = A.field('شكل الشريط', tone.node);

    var featured = A.switchInput('مميز (كارت كبير أول القائمة)', bool(item.featured));
    var pinned = A.switchInput('مثبت كشريط فوق في الصفحة', bool(item.pinned), function (on) { toneField.hidden = !on; });
    toneField.hidden = !bool(item.pinned);

    var notify = A.checkbox('ابعت إشعار في الجرس', isNew ? true : hasNotification('notif-' + item.id), 'بيظهر في نفس ميعاد نشر الخبر');
    var enabled = A.switchInput('ظاهر', item.enabled === undefined ? true : bool(item.enabled));

    var save = saveButton(isNew);

    save.addEventListener('click', function () {
      A.saveItem('news', {
        id: item.id || '',
        title: title.input.value,
        summary: summary.input.value,
        body: body.input.value,
        image: image.value(),
        linkUrl: linkUrl.value.trim(),
        linkLabel: linkLabel.input.value,
        badge: badge.value,
        publishAt: publishAt.value(),
        expireAt: expireAt.value(),
        featured: featured.input.checked,
        pinned: pinned.input.checked,
        tone: tone.value(),
        enabled: enabled.input.checked,
        notify: { publish: notify.input.checked }
      }, box, save);
    });

    A.dirty = false;

    A.openSheet(isNew ? 'خبر جديد' : 'تعديل: ' + item.title, [
      box,
      el('div', { class: 'form' },
        title.node,
        summary.node,
        image.node,
        body.node,
        A.field('لينك', linkUrl, 'اختياري — تسجيل، صور، تفاصيل…'),
        linkLabel.node,
        badgeField,
        A.field('يتنشر', publishAt.node),
        A.field('يختفي', expireAt.node),
        featured.node,
        pinned.node,
        toneField,
        notify.node,
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('news', isNew ? '' : item.id),
      lock: isNew ? null : A.editLock('news', item.id, 'خبر «' + (item.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.news, 'id', item.id); if (fresh) A.editors.news(fresh); else A.closeSheet(); })
    });

  };


  /* =======================================================
     GAMES
  ======================================================= */

  function gameStateLabel(game) {

    var now = nowMinutes();
    var visible = game.visibleFrom ? A.wallMinutes(game.visibleFrom) : null;
    var start = A.wallMinutes(game.startAt);
    var end = A.wallMinutes(game.endAt, true);

    if (visible !== null && now < visible) return A.chip('مستخبية لحد ' + A.formatWall(game.visibleFrom), 'off');
    if (start !== null && now < start) return A.chip('قريبًا — تبدأ ' + A.formatWall(game.startAt), 'gold');
    if (end !== null && now < end) return A.chip('🔥 شغالة دلوقتي', 'ok');
    return A.chip('انتهت', 'off');

  }

  A.views.games = guard(function () {

    var split = A.archiveSplit('games', (A.state.draft.games || []).slice().sort(function (a, b) { return (a.startAt || '') < (b.startAt || '') ? 1 : -1; }), function () { A.render(); });
    var games = split.items;

    return [A.card('تحديات وألعاب', 'زرار اللعبة بيتفتح لوحده في ميعاد البداية بتوقيت مصر.',
      el('div', { class: 'actions' }, addButton('+ لعبة', function () { A.editors.games(null); }), split.toggle),
      games.length
        ? el('ul', { class: 'list' }, games.map(function (game) {
          var enabled = bool(game.enabled);
          var chips = [enabled ? gameStateLabel(game) : A.visibilityChip(false), A.chip(A.formatWall(game.startAt) + ' ← ' + (A.formatWall(game.endAt).split('، ')[1] || ''))];
          var linked = ['soon', 'start'].filter(function (k) { return hasNotification('notif-' + game.id + '-' + k); }).length;
          if (linked) chips.push(A.chip('🔔 ' + linked));

          return A.listItem({
            icon: 'star',
            image: game.image,
            title: game.title,
            sub: A.shortUrl(game.url),
            off: !enabled,
            chips: chips,
            controls: [
              A.toggleItem('games', game.id, enabled).node,
              el('span', { class: 'spacer' }),
              A.editButton(game.title, function () { A.editors.games(game); })
            ].concat(A.archiveControls('games', game, game.title), [
              A.deleteButton(game.title, function (e) { A.deleteItem('games', game.id, game.title, e.currentTarget); })
            ])
          });
        }))
        : el('p', { class: 'empty', text: split.showing ? 'الأرشيف فاضي' : 'مفيش ألعاب لسه' })
    )];

  });

  A.editors.games = function (game) {

    var isNew = !game;
    game = game || { enabled: true, afterEnd: 'show' };

    var box = A.errorBox();
    var limits = hubLimits();

    var title = A.counted('اسم اللعبة', game.title, limits.gameTitle, 'مثلاً: رحلة الاستكشاف في الكنيسة', { required: true });
    var description = A.counted('وصف قصير', game.description, limits.gameDescription, 'اختياري', { multiline: true, rows: 3 });
    var image = A.imagePicker(game.image, { label: 'بوستر اللعبة' });
    var url = A.textInput(game.url, { ltr: true, type: 'url', placeholder: 'https://', inputmode: 'url', required: true });
    var buttonLabel = A.counted('نص الزرار', game.buttonLabel, limits.buttonLabel, 'افتراضي: ابدأ اللعب');

    var start = A.dateTimeInput(game.startAt, { clearable: false, presets: [A.PRESETS.sunday10, A.PRESETS.now] });

    var end = A.dateTimeInput(game.endAt, { clearable: false, presets: [
      { label: 'بعد البداية بساعة', value: function () { return after(60); } },
      { label: 'بعد البداية بساعة ونص', value: function () { return after(90); } }
    ] });

    function after(minutes) {
      var base = A.wallMinutes(start.value());
      return base === null ? '' : A.wallFromMinutes(base + minutes);
    }

    var visibleFrom = A.dateTimeInput(game.visibleFrom, {
      emptyText: 'تظهر "قريبًا" أول ما تنشر',
      presets: [A.PRESETS.sunday9, A.PRESETS.now]
    });

    var afterEnd = A.choices('afterEnd', [
      { value: 'show', label: 'تفضل ظاهرة "انتهت" شوية' },
      { value: 'hide', label: 'تختفي على طول' }
    ], game.afterEnd === 'hide' ? 'hide' : 'show');

    var soon = A.checkbox('تنبيه قبل البداية بـ ١٥ دقيقة', isNew ? true : hasNotification('notif-' + game.id + '-soon'), '"استعدوا 👀 تحدي جديد هيبدأ بعد ١٥ دقيقة"');
    var atStart = A.checkbox('تنبيه عند البداية', isNew ? true : hasNotification('notif-' + game.id + '-start'), '"🔥 اللعبة جاهزة! ادخل دلوقتي"');
    var enabled = A.switchInput('ظاهرة', game.enabled === undefined ? true : bool(game.enabled));

    var save = saveButton(isNew);

    save.addEventListener('click', function () {
      A.saveItem('games', {
        id: game.id || '',
        title: title.input.value,
        description: description.input.value,
        image: image.value(),
        url: url.value.trim(),
        buttonLabel: buttonLabel.input.value,
        visibleFrom: visibleFrom.value(),
        startAt: start.value(),
        endAt: end.value(),
        afterEnd: afterEnd.value(),
        enabled: enabled.input.checked,
        notify: { soon: soon.input.checked, start: atStart.input.checked }
      }, box, save);
    });

    A.dirty = false;

    A.openSheet(isNew ? 'لعبة جديدة' : 'تعديل: ' + game.title, [
      box,
      el('div', { class: 'form' },
        title.node,
        description.node,
        image.node,
        A.field('لينك اللعبة', url, 'الزرار بيتفعل في ميعاد البداية. اللينك نفسه بيبقى في ملف الموقع من وقت النشر، فلو اللعبة لازم تتقفل فعلاً خليها تتأكد من الوقت بنفسها.'),
        buttonLabel.node,
        A.field('تظهر "قريبًا" من', visibleFrom.node),
        A.field('تبدأ', start.node),
        A.field('تخلص', end.node),
        A.field('بعد ما تخلص', afterEnd.node),
        soon.node,
        atStart.node,
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('games', isNew ? '' : game.id),
      lock: isNew ? null : A.editLock('games', game.id, 'لعبة «' + (game.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.games, 'id', game.id); if (fresh) A.editors.games(fresh); else A.closeSheet(); })
    });

  };


  /* =======================================================
     NOTIFICATIONS
  ======================================================= */

  function targetLabel(target) {

    if (!target) return 'من غير لينك';
    if (target === 'meeting') return 'بيفتح: الاجتماع';

    var match = /^(news|game|activity):(.+)$/.exec(target);

    if (match) {
      var list = { news: A.state.draft.news, game: A.state.draft.games, activity: A.state.draft.activities }[match[1]];
      var found = (list || []).filter(function (x) { return x.id === match[2]; })[0];
      return 'بيفتح: ' + ({ news: 'خبر ', game: 'لعبة ', activity: 'فعالية ' })[match[1]] + (found ? found.title : '(مش موجودة)');
    }

    return 'بيفتح: ' + A.shortUrl(target);

  }

  A.views.notifications = guard(function () {

    var split = A.archiveSplit('notifications', (A.state.draft.notifications || []).slice().sort(function (a, b) { return (b.publishAt || '') < (a.publishAt || '') ? -1 : 1; }), function () { A.render(); });
    var items = split.items;
    var days = A.state.meta.historyDays;

    return [A.card('الإشعارات', 'بتظهر في جرس الموقع 🔔 في معادها، وبتفضل في السجل ' + days + ' يوم (إلا لو حددت غير كده). إشعارات الموبايل نفسها جاية في المرحلة الجاية.',
      el('div', { class: 'actions' }, addButton('+ إشعار', function () { A.editors.notifications(null); }), split.toggle),
      items.length
        ? el('ul', { class: 'list' }, items.map(function (item) {
          var enabled = bool(item.enabled);
          var until = item.expireAt || (item.publishAt ? A.wallFromMinutes(A.wallMinutes(item.publishAt) + days * 1440) : '');
          var chips = windowChips(enabled, item.publishAt, until)
            .concat(A.chip(TYPE_LABELS[item.type] || 'عام', item.type === 'important' ? 'danger' : 'gold'));
          if (/^notif-(game|news|session|act)-/.test(item.id)) chips.push(A.chip('مرتبط'));
          return A.listItem({
            icon: TYPE_ICONS[item.type] || 'info',
            image: item.image,
            title: item.title,
            sub: (item.message ? item.message + ' — ' : '') + targetLabel(item.target),
            off: !enabled,
            chips: chips,
            controls: [
              A.toggleItem('notifications', item.id, enabled).node,
              el('span', { class: 'spacer' }),
              A.editButton(item.title, function () { A.editors.notifications(item); })
            ].concat(A.archiveControls('notifications', item, item.title), [
              A.deleteButton(item.title, function (e) { A.deleteItem('notifications', item.id, item.title, e.currentTarget); })
            ])
          });
        }))
        : el('p', { class: 'empty', text: split.showing ? 'الأرشيف فاضي' : 'مفيش إشعارات لسه' })
    )];

  });

  A.editors.notifications = function (item) {

    var isNew = !item;
    item = item || { enabled: true, type: 'general', target: '' };

    var box = A.errorBox();
    var limits = hubLimits();

    var title = A.counted('العنوان', item.title, limits.notificationTitle, 'مثلاً: موضوع اجتماع الأحد الجاي', { required: true });
    var message = A.counted('الرسالة', item.message, limits.notificationMessage, 'سطر قصير', { multiline: true, rows: 2 });

    var type = A.choices('type', A.state.meta.notificationTypes.map(function (t) {
      return { value: t, label: TYPE_LABELS[t], icon: TYPE_ICONS[t] };
    }), item.type || 'general');

    /* what tapping it opens */
    var current = item.target || '';
    var options = [{ value: '', label: 'ولا حاجة' }, { value: 'meeting', label: 'الاجتماع' }]
      .concat((A.state.draft.news || []).map(function (n) { return { value: 'news:' + n.id, label: 'خبر: ' + n.title }; }))
      .concat((A.state.draft.games || []).map(function (g) { return { value: 'game:' + g.id, label: 'لعبة: ' + g.title }; }))
      .concat((A.state.draft.activities || []).map(function (a) { return { value: 'activity:' + a.id, label: 'فعالية: ' + a.title }; }))
      .concat([{ value: 'url', label: 'لينك…' }]);

    var isUrl = current && !/^(meeting|news:|game:|activity:)/.test(current);
    var targetSelect = el('select', { class: 'input', onchange: function () { A.markDirty(); urlField.hidden = targetSelect.value !== 'url'; } }, options.map(function (o) {
      var selected = isUrl ? o.value === 'url' : o.value === current;
      return el('option', { value: o.value, selected: selected ? 'selected' : null, text: o.label });
    }));
    var urlInput = A.textInput(isUrl ? current : '', { ltr: true, type: 'url', placeholder: 'https://' });
    var urlField = A.field('اللينك', urlInput);
    urlField.hidden = !isUrl;

    var image = A.imagePicker(item.image, { label: 'صورة (اختياري)' });

    var publishAt = A.dateTimeInput(item.publishAt, { emptyText: 'يظهر أول ما تنشر', presets: [A.PRESETS.now, A.PRESETS.thursday8, A.PRESETS.sunday10] });
    var expireAt = A.dateTimeInput(item.expireAt, { emptyText: 'يفضل ' + A.state.meta.historyDays + ' يوم' });
    var enabled = A.switchInput('ظاهر', item.enabled === undefined ? true : bool(item.enabled));

    var save = saveButton(isNew);

    save.addEventListener('click', function () {
      A.saveItem('notifications', {
        id: item.id || '',
        title: title.input.value,
        message: message.input.value,
        type: type.value(),
        target: targetSelect.value === 'url' ? urlInput.value.trim() : targetSelect.value,
        image: image.value(),
        publishAt: publishAt.value(),
        expireAt: expireAt.value(),
        enabled: enabled.input.checked
      }, box, save);
    });

    A.dirty = false;

    A.openSheet(isNew ? 'إشعار جديد' : 'تعديل: ' + item.title, [
      box,
      el('div', { class: 'form' },
        title.node,
        message.node,
        A.field('النوع', type.node),
        A.field('لما حد يدوس عليه يفتح', targetSelect),
        urlField,
        image.node,
        A.field('يظهر في الجرس', publishAt.node),
        A.field('يختفي من الجرس', expireAt.node),
        enabled.node
      )
    ], A.sheetFooter(save), {
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('notifications', isNew ? '' : item.id),
      lock: isNew ? null : A.editLock('notifications', item.id, 'إشعار «' + (item.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.notifications, 'id', item.id); if (fresh) A.editors.notifications(fresh); else A.closeSheet(); })
    });

  };

})();
</script>
