<script>
/*
 * Admin views for the content center: the timeline (الجدول), meetings,
 * news, games and notifications. Saved through apiSaveItem (Items.gs).
 * All times are Cairo wall time.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;
  var bool = A.bool;

  A.editors = A.editors || {};

  var TONE_LABELS = { info: 'عادي', alert: 'تنبيه (زي إلغاء)', celebrate: 'مناسبة حلوة' };

  var TYPE_LABELS = { general: 'عام', meeting: 'اجتماع', news: 'خبر', game: 'لعبة', important: 'مهم', competition: 'مسابقة', activity: 'فعالية' };
  var TYPE_ICONS = { general: 'info', meeting: 'church', news: 'megaphone', game: 'star', important: 'alert', competition: 'trophy', activity: 'calendar' };

  var nowMinutes = function () { return A.wallMinutes(A.cairoNow()); };

  function hubLimits() { return A.state.meta.hubLimits; }

  function hasNotification(id) {

    return (A.state.draft.notifications || []).some(function (n) { return n.id === id; });

  }

  function guard(builder) {

    return function () {
      return A.state.hubReady ? builder() : [A.hubNotReady()];
    };

  }

  function addButton(label, onclick) {

    return el('button', { class: 'btn btn--primary', type: 'button', onclick: onclick }, label);

  }

  function saveButton(isNew) {

    return el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });

  }

  /* the visibility pill first (مخفي / يظهر لاحقًا / ظاهر دلوقتي / انتهى) */
  function windowChips(enabled, from, until) {

    return [A.visibilityChip(enabled, from, until)];

  }


  /* =======================================================
     TIMELINE (الجدول)
  ======================================================= */

  function timelineEvents() {

    var draft = A.state.draft;
    var events = [];
    var meetingTime = A.setting('meeting.time') || '20:00';

    function push(at, kind, item, label, iconName) {
      var minutes = A.wallMinutes(at);
      if (minutes !== null) events.push({ minutes: minutes, at: at, kind: kind, item: item, label: label, icon: iconName });
    }

    (draft.sessions || []).filter(function (s) { return bool(s.enabled); }).forEach(function (s) {
      var when = s.date + ' ' + (s.time || meetingTime);
      push(when, 'sessions', s, s.status === 'cancelled' ? 'اجتماع ملغي' : 'اجتماع' + (s.topic ? ': ' + s.topic : ''), 'church');
      if (s.visibleFrom && s.topic) push(s.visibleFrom, 'sessions', s, 'يظهر موضوع الاجتماع: ' + s.topic, 'church');
    });

    (draft.news || []).filter(function (n) { return bool(n.enabled); }).forEach(function (n) {
      push(n.publishAt, 'news', n, 'خبر يتنشر: ' + n.title, 'megaphone');
      if (n.expireAt) push(n.expireAt, 'news', n, 'خبر يختفي: ' + n.title, 'megaphone');
    });

    (draft.games || []).filter(function (g) { return bool(g.enabled); }).forEach(function (g) {
      if (g.visibleFrom) push(g.visibleFrom, 'games', g, 'لعبة تظهر "قريبًا": ' + g.title, 'star');
      push(g.startAt, 'games', g, 'لعبة تبدأ: ' + g.title, 'star');
      push(g.endAt, 'games', g, 'لعبة تخلص: ' + g.title, 'star');
    });

    (draft.activities || []).filter(function (a) { return bool(a.enabled) && !bool(a.archived); }).forEach(function (a) {
      if (a.visibleFrom) push(a.visibleFrom, 'activities', a, 'يظهر: ' + a.title, 'calendar');
      if (a.startAt) push(a.startAt, 'activities', a, 'بيبدأ: ' + a.title, 'calendar');
    });

    (draft.notifications || []).filter(function (n) { return bool(n.enabled); }).forEach(function (n) {
      push(n.publishAt, 'notifications', n, 'إشعار في الجرس: ' + n.title, TYPE_ICONS[n.type] || 'bell');
    });

    return events.sort(function (a, b) { return a.minutes - b.minutes; });

  }

  A.views.schedule = function () {

    if (!A.state.hubReady) {
      return [A.hubNotReady()];
    }

    var now = nowMinutes();
    var today = Math.floor(now / 1440);


    var events = timelineEvents().filter(function (e) {
      return e.minutes >= now - 12 * 60 && e.minutes <= now + 60 * 1440;
    });

    var groups = [];
    var current = null;

    events.forEach(function (event) {
      var day = Math.floor(event.minutes / 1440);
      if (!current || current.day !== day) {
        current = { day: day, items: [] };
        groups.push(current);
      }
      current.items.push(event);
    });

    var timeline = A.card('الجدول', 'اللي جاي في الشهرين الجايين، بتوقيت مصر. دوس على أي حاجة تعدلها.',
      groups.length
        ? el('div', { class: 'timeline' }, groups.map(function (group) {
          var label = group.day === today ? 'النهارده' : group.day === today + 1 ? 'بكره' : group.day === today - 1 ? 'امبارح' : A.formatWall(A.wallFromMinutes(group.day * 1440).slice(0, 10), false);
          return el('section', { class: 'timeline__day' },
            el('h3', { class: 'timeline__date', text: label }),
            el('ol', { class: 'timeline__list' }, group.items.map(function (event) {
              var past = event.minutes < now;
              var time = A.formatWall(event.at).split('، ')[1] || '';
              return el('li', {},
                el('button', { class: 'timeline__row' + (past ? ' is-past' : ''), type: 'button', onclick: function () { A.editors[event.kind](event.item); } },
                  el('span', { class: 'timeline__time', text: time }),
                  el('span', { class: 'timeline__icon', 'aria-hidden': 'true' }, icon(event.icon)),
                  el('span', { class: 'timeline__label', text: event.label })
                )
              );
            }))
          );
        }))
        : el('p', { class: 'empty', text: 'مفيش حاجة متجدولة. ابدأ بإضافة اجتماع أو خبر.' })
    );

    var pending = A.state.schema && A.state.schema.data < A.state.schema.target ? A.upgradeNotice() : null;

    // Phase 8B: the home is exactly the approved screen; «الجدول» is not on it (A.homeTimeline keeps it reachable)
    A.homeTimeline = timeline;
    return [pending, A.dashboard()].filter(Boolean);

  };


  /* =======================================================
     MEETINGS (weekly rule + dated sessions)
  ======================================================= */

  /*
   * «الاجتماعات» (Phase 8B, meetings.png): «الميعاد الأسبوعي» as a summary (the day square, the name, the day · time ·
   * length, the note, the cancelled weeks with «+», the calendar file) with «تعديل» for its form; «الاجتماعات الجاية»: the
   * next weeks one under the other — a week without a topic says so with «ضيف الموضوع», a recorded one shows its
   * topic with «تعديل» and ⋯ (show / hide, delete). «برنامج الاجتماع» = the schedule import. «إظهار ركن الاجتماع» lives
   * in «الصفحة ← ترتيب الصفحة» (the section's switch); a draft not upgraded yet still shows its old card here.
   */
  var WEEKS_AHEAD = 5;

  function weeklyEditor() {

    var setting = A.setting;
    var limits = A.state.meta.limits;
    var box = A.errorBox();
    var title = A.counted('اسم الاجتماع', setting('meeting.title'), limits.title);
    var currentDay = String(setting('meeting.day'));
    var daySelect = el('select', { class: 'input', onchange: A.markDirty }, A.state.meta.days.map(function (day, index) {
      var selected = currentDay === day || currentDay === String(index) || (currentDay && day.indexOf(currentDay.replace(/^ال/, '')) !== -1);
      return el('option', { value: day, selected: selected ? 'selected' : null, text: day });
    }));
    var time = el('input', { class: 'input', type: 'time', value: setting('meeting.time'), oninput: A.markDirty });
    var duration = A.textInput(setting('meeting.durationMinutes'), { type: 'number', inputmode: 'numeric', placeholder: 'مثلاً 120' });
    var note = A.counted('ملاحظة', setting('meeting.note'), limits.note, A.settingHelp('meeting.note'));
    var saver = A.settingsSaver(function () {
      return {
        'meeting.title': title.input.value,
        'meeting.day': daySelect.value,
        'meeting.time': time.value,
        'meeting.durationMinutes': duration.value,
        'meeting.note': note.input.value
      };
    }, box);
    A.dirty = false;
    A.openSheet('الميعاد الأسبوعي', [
      box,
      el('div', { class: 'form' },
        title.node,
        el('div', { class: 'row' }, A.field('اليوم', daySelect), A.field('الساعة', time)),
        A.field('مدة الاجتماع بالدقايق', duration, 'سيبها فاضية لو مش متأكد — ساعتها الموقع مش هيقول "شغال دلوقتي"'),
        note.node)
    ], [saver, el('button', { class: 'btn btn--ghost', type: 'button', text: 'إلغاء', onclick: function () { A.closeSheet(); } })], { size: 'md', icon: 'church', sub: 'بيظهر في «ركن الاجتماع» وفي ملف التقويم' });

  }

  function hoursWords(minutes) {
    var m = Number(minutes) || 0;
    if (!m) return '';
    if (m === 60) return 'ساعة';
    if (m === 120) return 'ساعتين';
    if (m % 60 === 0) return A.digits(m / 60) + ' ساعات';
    return A.digits(m) + ' دقيقة';
  }

  function clock12(hhmm) {
    var p = String(hhmm || '').split(':');
    if (p.length < 2) return '';
    var h = +p[0];
    return A.digits(((h % 12) || 12) + ':' + p[1]) + (h < 12 ? ' ص' : ' م');
  }

  function weeklyCard(sessions, today) {

    var setting = A.setting;
    var day = A.state.meta.days[dayIndex()] || String(setting('meeting.day') || '');
    var facts = [day, clock12(setting('meeting.time')), hoursWords(setting('meeting.durationMinutes'))].filter(Boolean).join(' · ');
    var cancelled = sessions.filter(function (s) { return s.date >= today && s.status === 'cancelled'; });
    var site = String((A.state.config && A.state.config.siteUrl) || '').replace(/\/?$/, '/');

    function row(label, value, action) {
      return el('div', { class: 'p8-factrow' },
        el('span', { class: 'p8-factrow__label', text: label }),
        el('span', { class: 'p8-factrow__value' }, value),
        action || el('span', { class: 'p8-factrow__sp' }));
    }

    return el('section', { class: 'card p8-card p8-weekly' },
      el('div', { class: 'p8-card__head' },
        el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('church')),
        el('div', { class: 'p8-card__titles' },
          el('h2', { class: 'card__title', text: 'الميعاد الأسبوعي' }),
          el('p', { class: 'card__hint', text: 'بيظهر في «ركن الاجتماع» وفي ملف التقويم' })),
        el('div', { class: 'p8-card__acts' },
          el('button', { class: 'btn', type: 'button', onclick: weeklyEditor }, icon('edit'), 'تعديل'))),
      el('div', { class: 'p8-weekly__main' },
        el('span', { class: 'p8-weekly__day' }, icon('calendar'), el('span', { text: 'كل ' + day.replace(/^ال/, '') })),
        el('div', {},
          el('b', { class: 'p8-weekly__title', text: setting('meeting.title') || 'الاجتماع' }),
          el('small', { class: 'p8-weekly__facts', text: facts }))),
      row('ملاحظة', el('span', { text: setting('meeting.note') || 'مفيش' })),
      row('أيام مفيش فيها اجتماع', el('span', { text: cancelled.length ? cancelled.map(function (s) { return A.formatWall(s.date, false); }).join('، ') : 'مفيش' }),
        el('button', { class: 'p8-iconbtn p8-iconbtn--lg', type: 'button', 'aria-label': 'ضيف يوم مفيش فيه اجتماع', onclick: function () { A.editors.sessions(null, { status: 'cancelled' }); } }, icon('plus'))),
      row('التقويم', el('span', { class: 'mono', dir: 'ltr', text: 'meeting.ics' }),
        el('button', { class: 'p8-iconbtn p8-iconbtn--lg', type: 'button', 'aria-label': 'انسخ رابط ملف التقويم', onclick: function () {
          var url = site + 'meeting.ics';
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { A.toast('رابط التقويم اتنسخ ✓'); }, function () { A.toast(url, 'info'); });
          else A.toast(url, 'info');
        } }, icon('copy'))));

  }

  function upcomingRow(date, session, first, today) {

    var d = new Date(A.wallMinutes(date) * 60000);
    var MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    var cancelled = session && session.status === 'cancelled';
    var enabled = !session || bool(session.enabled);
    var time = (session && session.time) || A.setting('meeting.time');
    var days = Math.round((A.wallMinutes(date) - A.wallMinutes(today)) / 1440);
    var away = days === 0 ? 'النهارده' : days === 1 ? 'بكرة' : 'بعد ' + A.digits(days) + (days <= 10 ? ' أيام' : ' يوم');
    var sub = cancelled ? 'ملغي الأسبوع ده' : session && session.topic ? session.topic + (session.speaker ? ' · ' + session.speaker : '') : 'لسه مفيش موضوع';

    var tags = [];
    if (session && !enabled) tags.push(el('span', { class: 'p8-tag', text: 'مخفي' }));
    if (cancelled) tags.push(el('span', { class: 'p8-tag p8-tag--danger', text: 'ملغي' }));
    if (session && session.time) tags.push(el('span', { class: 'p8-tag', text: 'الساعة ' + clock12(session.time) }));
    if (session && hasNotification('notif-session-' + session.date)) tags.push(el('span', { class: 'p8-tag p8-tag--info', text: 'في الجرس' }));

    var acts = !session
      ? [el('button', { class: 'btn btn--sm', type: 'button', onclick: function () { A.editors.sessions(null, { date: date }); } }, icon('plus'), 'ضيف الموضوع')]
      : [
        el('button', { class: 'btn btn--sm', type: 'button', 'aria-label': 'تعديل الاجتماع', onclick: function () { A.editors.sessions(session); } }, icon('edit'), 'تعديل'),
        el('button', { class: 'p8-iconbtn', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': 'اختيارات تانية: اجتماع ' + A.formatWall(date, false), onclick: function (e) {
          if (!A.menu) return;
          A.menu(e.currentTarget, 'menu--p8', [
            A.menuItem(enabled ? 'eye-off' : 'eye', enabled ? 'اخفيه من الموقع' : 'اظهره في الموقع', function () {
              A.draftChange({
                apply: function (state) { var r = A.findRow(state.draft.sessions, 'date', session.date); if (r) r.enabled = !enabled; },
                run: function () { return A.call('apiSetItemEnabled', 'sessions', session.date, !enabled); }
              });
            }),
            el('hr', { class: 'menu__sep' }),
            A.menuItem('trash', 'امسح الاجتماع', function () { A.deleteItem('sessions', session.date, 'اجتماع ' + session.date, e.currentTarget); }, { danger: true })
          ], { align: 'start' });
        } }, icon('dots'))
      ];

    return el('li', { class: 'p8-item p8-meet' + (enabled ? '' : ' is-off'), 'data-date': date },
      el('span', { class: 'p8-meet__date', 'aria-hidden': 'true' }, el('b', { text: A.digits(d.getUTCDate()) }), el('small', { text: MONTHS_AR[d.getUTCMonth()] })),
      el('div', { class: 'p8-item__main' },
        el('b', {},
          el('span', { text: A.formatWall(date, false) + (first && time ? ' · ' + clock12(time) : '') }),
          first ? el('span', { class: 'p8-tag p8-tag--info', text: away }) : null),
        el('small', { text: sub }),
        tags.length ? el('div', { class: 'p8-item__tags' }, tags) : null),
      el('div', { class: 'p8-item__acts' }, acts));

  }

  A.views.meetings = guard(function () {

    var today = A.cairoNow().slice(0, 10);
    var sessions = (A.state.draft.sessions || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var byDate = {};
    sessions.forEach(function (s) { byDate[s.date] = s; });

    // the next weeks from the weekly day, and every recorded meeting from today on
    var dates = {};
    var next = A.nextWeekday(dayIndex(), String(A.setting('meeting.time') || '20:00')).slice(0, 10);
    for (var i = 0; i < WEEKS_AHEAD; i++) {
      dates[next] = true;
      next = A.wallFromMinutes(A.wallMinutes(next) + 7 * 1440).slice(0, 10);
    }
    sessions.forEach(function (s) { if (s.date >= today) dates[s.date] = true; });
    var upcoming = Object.keys(dates).sort();
    var past = sessions.filter(function (s) { return s.date < today; }).reverse();
    var showPast = false;
    var pastList = el('ul', { class: 'p8-list p8-past', hidden: true }, past.map(function (s) { return upcomingRow(s.date, s, false, today); }));

    var list = el('section', { class: 'card p8-card p8-meetings' },
      el('div', { class: 'p8-card__head' },
        el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('calendar')),
        el('div', { class: 'p8-card__titles' },
          el('h2', { class: 'card__title', text: 'الاجتماعات الجاية' }),
          el('p', { class: 'card__hint', text: 'كل أحد ليه كارت: حط الموضوع والمتكلم، وهيظهر للشباب في ميعاده' })),
        el('div', { class: 'p8-card__acts' },
          el('button', { class: 'btn', type: 'button', 'aria-label': 'برنامج الاجتماع: استيراد جدول الاجتماعات', onclick: function () { A.openImport(); } }, icon('upload'), 'برنامج الاجتماع'),
          el('button', { class: 'btn btn--primary', type: 'button', onclick: function () { A.editors.sessions(null); } }, icon('plus'), 'اجتماع'))),
      el('ul', { class: 'p8-list' }, upcoming.map(function (date, index) { return upcomingRow(date, byDate[date] || null, index === 0, today); })),
      past.length ? el('button', { class: 'btn btn--sm btn--ghost p8-pastbtn', type: 'button', onclick: function (e) {
        showPast = !showPast;
        pastList.hidden = !showPast;
        e.currentTarget.textContent = (showPast ? 'اخفي ' : '') + 'اجتماعات فاتت (' + A.digits(past.length) + ')';
      } }, 'اجتماعات فاتت (' + A.digits(past.length) + ')') : null,
      pastList);

    var upgraded = A.state.schema.data >= A.state.schema.target;
    return [
      upgraded ? null : meetingSectionCard(),
      el('div', { class: 'p8-cols p8-cols--meet' }, weeklyCard(sessions, today), list)
    ].filter(Boolean);

  });

  /*
   * «إظهار ركن الاجتماع»: the whole meeting block on the site. Off, no
   * session, topic or poster can make it appear. (One week's cancellation
   * is a dated meeting below, not this.)
   */
  function meetingSectionCard() {

    var row = (A.state.layout || []).filter(function (s) { return s.key === 'meeting'; })[0] || { enabled: true };
    var upgraded = A.state.schema.data >= A.state.schema.target;
    var on = bool(row.enabled);

    var toggle = A.switchInput('إظهار ركن الاجتماع', on, function (checked) {
      A.dirty = false;
      var done = function () { A.toast(checked ? 'ركن الاجتماع هيظهر بعد النشر' : 'ركن الاجتماع هيختفي بعد النشر — بكل مواضيعه'); };
      if (upgraded) {
        // shown at once; the server's answer (or its refusal) follows (A.draftChange)
        A.draftChange({
          apply: function (state) { A.sectionEnabledLocally(state, 'meeting', checked); },
          run: function () { return A.call('apiSetSectionEnabled', 'meeting', checked); },
          done: done
        });
        return;
      }
      A.call('apiSaveSettings', { 'meeting.enabled': checked }).then(function (next) {
        A.applyState(next);
        done();
      }).catch(function (error) { toggle.input.checked = !checked; A.fail(error); });
    });

    return el('section', { class: 'card card--switch' + (on ? '' : ' is-off') },
      el('div', { class: 'card--switch__text' },
        el('h2', { class: 'card__title', text: 'ركن الاجتماع في الموقع' }),
        el('p', { class: 'card__hint', text: on
          ? 'ظاهر: الميعاد والعد التنازلي وموضوع الأسبوع. لإلغاء أسبوع واحد بس، استخدم «ملغي الأسبوع ده» تحت.'
          : 'مخفي بالكامل: مفيش ميعاد ولا موضوع ولا بوستر هيظهر للزوار، حتى لو متسجلين تحت.' }),
        A.visibilityChip(on, row.visibleFrom, row.visibleUntil)
      ),
      toggle.node
    );

  }

  function sessionItem(session) {

    var enabled = bool(session.enabled);
    var cancelled = session.status === 'cancelled';
    var chips = [];

    if (cancelled) chips.push(A.chip('ملغي', 'danger'));
    if (session.time) chips.push(A.chip('الساعة ' + session.time));
    if (session.speaker) chips.push(A.chip(session.speaker));
    chips.unshift(A.visibilityChip(enabled, cancelled ? '' : session.visibleFrom, ''));
    if (hasNotification('notif-session-' + session.date)) chips.push(A.chip('🔔 في الجرس'));

    var toggle = A.toggleItem('sessions', session.date, enabled);

    return A.listItem({
      icon: cancelled ? 'alert' : 'church',
      image: session.image,
      title: A.formatWall(session.date, false) + (session.topic ? ' — ' + session.topic : ''),
      off: !enabled,
      chips: chips,
      controls: [
        toggle.node,
        el('span', { class: 'spacer' }),
        A.editButton('الاجتماع', function () { A.editors.sessions(session); }),
        A.deleteButton('الاجتماع', function (e) { A.deleteItem('sessions', session.date, 'اجتماع ' + session.date, e.currentTarget); })
      ]
    });

  }

  /* prefill (new only): e.g. { date } from the home page's next meeting.
     Phase 8B (session-edit.png, session-program.png): the big editor — «الاجتماع», «الموضوع», «البوستر»,
     «برنامج الاجتماع» (stage cards, each with its own picture), «الظهور والإشعار»; on the left how it shows in
     «ركن الاجتماع» and the program as it runs; «امسح الاجتماع» in the foot. */
  A.editors.sessions = function (session, prefill) {

    var isNew = !session;
    session = session || { enabled: true, status: 'normal', date: A.nextWeekday(dayIndex(), '20:00').slice(0, 10) };
    if (isNew && prefill) {
      Object.keys(prefill).forEach(function (key) { session[key] = prefill[key]; });

    var dmy = function (date) { var p = date.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
    var rows = [
      ['التاريخ', 'الموضوع', 'المتكلم', 'الوصف', 'الوقت', 'ملاحظات'],
      [next, 'حياة التسليم', 'أبونا أنطوني', 'إزاي نسلّم حياتنا لربنا', '20:00', ''],
      [dmy(after), 'الصلاة', 'أ. مينا', '', '8:30 م', 'في القاعة الكبيرة']
    ];

    boxes.push(fromBox, startBox, endBox);

    var afterEnd = A.segmented([
      { value: 'show', label: 'تفضل ظاهرة «انتهت» شوية' },
      { value: 'hide', label: 'تختفي على طول' }
    ], game.afterEnd === 'hide' ? 'hide' : 'show', 'بعد ما تخلص');

    var soon = A.checkbox('تنبيه قبل البداية بـ ١٥ دقيقة', isNew ? true : hasNotification('notif-' + game.id + '-soon'), '«استعدوا 👀 تحدي جديد هيبدأ بعد ١٥ دقيقة»');
    var atStart = A.checkbox('تنبيه عند البداية', isNew ? true : hasNotification('notif-' + game.id + '-start'), '«🔥 اللعبة جاهزة! ادخل دلوقتي»');
    var enabled = A.switchInput('ظاهرة', game.enabled === undefined ? true : bool(game.enabled));

    // «شكل العرض»: its card (a game that's on now: the big card)
    display = A.cardDisplay(game, {
      label: 'شكل عرض اللعبة',
      draft: function () { return { title: title.input.value, description: description.input.value, image: image.value(), url: url.value.trim(), buttonLabel: buttonLabel.input.value, startAt: start.value(), endAt: end.value() }; },
      build: function (site, d, picture, now) {
        var at = function (v) { return String(v || '').replace(' ', 'T').slice(0, 16); };
        var card = { id: game.id || 'preview', title: d.title || 'اللعبة', description: d.description || '', image: picture, url: d.url || 'https://example.org/', buttonLabel: d.buttonLabel || '', visibleFrom: '', startAt: at(d.startAt) || now, endAt: at(d.endAt) || now, afterEnd: 'show', endedUntil: '', display: d.display, displayMobile: d.displayMobile };
        var entry = site.hub.gameStates({ games: [card] }, now)[0] || { game: card, state: 'soon', minutesUntil: 60 };
        var live = entry.state === 'open';
        return {
          node: (live ? site.hub.liveGameWidget(entry, {}) : site.hub.gamesSection([entry], {})).el, card: card, image: picture, big: live,
          note: live ? 'اللعبة شغالة في الميعاد ده: بتظهر الكارت الكبير فوق.' : ''
        };
      }
    });

    var save = saveButton(isNew);
    A.fill(save, icon('check'), el('span', { text: isNew ? 'إضافة' : 'احفظ' }));

    save.addEventListener('click', function () {
      A.saveItem('games', {
        id: game.id || '',
        title: title.input.value,
        description: description.input.value,
        image: image.value(),
        // the poster is the picture now; an older icon stays until a poster replaces it
        icon: image.value() ? '' : game.icon || '',
        url: url.value.trim(),
        buttonLabel: buttonLabel.input.value,
        visibleFrom: visibleFrom.value(),
        startAt: start.value(),
        endAt: end.value(),
        afterEnd: afterEnd.value,
        display: display.value(),
        displayMobile: display.mobile(),
        enabled: enabled.input.checked,
        notify: { soon: soon.input.checked, start: atStart.input.checked }
      }, box, save);
    });

    A.dirty = false;

    // the left column: «الكارت على الموقع» — قريبًا · شغالة · انتهت (the one for now lit; a tap shows another)
    var showing = null;
    var states = [['soon', 'قريبًا'], ['live', 'شغالة'], ['ended', 'انتهت']];
    var stateSeg = el('div', { class: 'seg tlstate', role: 'group', 'aria-label': 'حالة الكارت' });
    var pImg = el('img', { alt: '', hidden: true });
    var pTitle = el('b');
    var pWhen = el('small');
    var pTag = el('span', { class: 'p8-tag' });
    var lastImage = null;
    function paintAside() {
      if (!stateSeg || !start) return;
      var now = gameState({ startAt: start.value(), endAt: end.value() });
      var s = showing || now;
      A.fill(stateSeg, states.map(function (st) {
        return el('button', { class: 'seg__btn seg__btn--text' + (st[0] === s ? ' is-on' : ''), type: 'button', 'aria-pressed': st[0] === s ? 'true' : 'false', onclick: function () { showing = st[0]; paintAside(); } }, st[1]);
      }));
      pTitle.textContent = title.input.value.trim() || 'اسم اللعبة';
      var startWords = start.value() ? A.formatWall(start.value()) : '';
      pWhen.textContent = s === 'soon' ? (startWords ? 'تبدأ ' + startWords : '') : s === 'live' ? 'شغالة دلوقتي' : 'انتهت';
      pTag.textContent = s === 'soon' ? 'قريبًا' : s === 'live' ? (buttonLabel.input.value.trim() || 'ابدأ اللعب') : 'انتهت';
      pTag.className = 'p8-tag' + (s === 'live' ? ' p8-tag--acc' : '');
      var img = image.value();
      if (img !== lastImage) {
        lastImage = img;
        pImg.hidden = true;
        if (img && A.mediaPreview) A.mediaPreview(img).then(function (src) { if (src && lastImage === img) { pImg.src = src; pImg.hidden = false; } }).catch(function () {});
      }
    }

    var form = el('div', { class: 'msecs', oninput: refresh, onchange: refresh },
      A.msec('اللعبة', 'edit', '', [
        A.col(title.node, 6), A.col(description.node, 6),
        A.col(A.field('لينك اللعبة', url, 'الزرار بيتفعل في ميعاد البداية'), 8), A.col(buttonLabel.node, 4),
        A.col(image.node, 12)
      ]),
      A.msec('المواعيد', 'clock', 'الكارت بيظهر «قريبًا»، وبعدين يبدأ، وبعدين يخلص', [
        A.col(fromBox.node, 12), A.col(startBox.node, 12), A.col(endBox.node, 12),
        A.col(A.field('بعد ما تخلص', afterEnd, 'المدة من «الإعدادات ← المحتوى والظهور»'), 12)
      ]),
      A.msec('التنبيهات', 'bell', '', [A.col(soon.node, 12), A.col(atStart.node, 12)]),
      A.msec('الشكل', 'sparkle', '', [A.col(display.node, 12), A.col(enabled.node, 12)]));

    A.openSheet(isNew ? 'لعبة جديدة' : 'تعديل: ' + game.title, [box, form], A.sheetFooter(save), {
      size: 'lg',
      icon: 'star',
      sub: 'ركن الألعاب · تحديات وألعاب',
      next: false,
      footWords: 'بيتحفظ مسودة لحد «راجع وانشر»',
      headActions: [el('button', { class: 'btn btn--sm btn--ghost', type: 'button', onclick: function () { if (A.openPreview) A.openPreview(); } }, icon('eye'), 'معاينة')],
      aside: [
        el('h5', { text: 'الكارت على الموقع' }),
        stateSeg,
        el('div', { class: 'prevcard p8-gameprev' }, pImg, el('div', {}, pTitle, pWhen, el('div', { class: 'prevcard__tags' }, pTag)))
      ],
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('games', isNew ? '' : game.id),
      lock: isNew ? null : A.editLock('games', game.id, 'لعبة «' + (game.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.games, 'id', game.id); if (fresh) A.editors.games(fresh); else A.closeSheet(); })
    });
    paintAside();

  };


  /* =======================================================
     NOTIFICATIONS
  ======================================================= */

  function targetLabel(target) {

    if (!target) return 'من غير لينك';
    if (target === 'meeting') return 'بيفتح: الاجتماع';

    var match = /^(news|game|activity):(.+)$/.exec(target);

    if (match) {
      var list = { news: A.state.draft.news, game: A.state.draft.games, activity: A.state.draft.activities }[match[1]];
      var found = (list || []).filter(function (x) { return x.id === match[2]; })[0];
      return 'بيفتح: ' + ({ news: 'خبر ', game: 'لعبة ', activity: 'فعالية ' })[match[1]] + (found ? found.title : '(مش موجودة)');
    }

    return 'بيفتح: ' + A.shortUrl(target);

  }

  /* Phase 8B (bell.png): «جرس الإشعارات» — «ظاهرة · جاية · خلصت», a row per item (its icon, title, message,
     ظاهر في الجرس / the type / from … to …), «تعديل» and ⋯ (hide, archive, use again, delete). */
  A.bellFilter = A.bellFilter || 'live';

  function bellUntil(item) {
    var days = A.state.meta.historyDays;
    return item.expireAt || (item.publishAt ? A.wallFromMinutes(A.wallMinutes(item.publishAt) + days * 1440) : '');
  }

  function bellState(item) {
    if (bool(item.archived)) return 'done';
    var v = A.visibility(true, item.publishAt, bellUntil(item));
    return v.state === 'scheduled' ? 'soon' : v.state === 'ended' ? 'done' : 'live';
  }

  A.views.notifications = guard(function () {

    var all = (A.state.draft.notifications || []).slice().sort(function (a, b) { return (b.publishAt || '') < (a.publishAt || '') ? -1 : 1; });
    var groups = { live: [], soon: [], done: [] };
    all.forEach(function (item) { groups[bellState(item)].push(item); });
    var filter = A.bellFilter;
    var name = A.uid('bellf');
    var seg = el('div', { class: 'seg p8-filter', role: 'radiogroup', 'aria-label': 'الإشعارات اللي تظهر' }, [['live', 'ظاهرة'], ['soon', 'جاية'], ['done', 'خلصت']].map(function (o) {
      return el('label', { class: 'seg__opt' },
        el('input', { type: 'radio', name: name, value: o[0], checked: filter === o[0], onchange: function () { A.bellFilter = o[0]; A.render(); } }),
        el('span', { text: o[1] + ' (' + A.digits(groups[o[0]].length) + ')' }));
    }));

    function row(item) {
      var enabled = bool(item.enabled);
      var until = bellUntil(item);
      var v = A.visibility(enabled, item.publishAt, until);
      var span = (item.publishAt ? 'من ' + A.formatWall(item.publishAt) : 'من أول ما تنشر') + (until ? ' لحد ' + A.formatWall(until, false) : '');
      var more = el('button', { class: 'p8-iconbtn', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': 'اختيارات تانية: ' + item.title, onclick: function (e) { itemMenu('notifications', item, item.title, e.currentTarget); } }, icon('dots'));
      return el('li', { class: 'p8-item item' + (enabled ? '' : ' item--off'), 'data-id': item.id },
        el('span', { class: 'chipico chipico--info p8-bellico', 'aria-hidden': 'true' }, icon(TYPE_ICONS[item.type] === 'info' ? 'bell' : TYPE_ICONS[item.type] || 'bell')),
        el('div', { class: 'p8-item__main' },
          el('b', { class: 'p8-item__line' }, el('span', { class: 'item__title', text: item.title })),
          el('small', { text: [item.message, item.target ? targetLabel(item.target) : ''].filter(Boolean).join(' · ') }),
          el('div', { class: 'p8-item__tags' },
            el('span', { class: 'p8-tag chip--state' + (v.kind === 'ok' ? ' p8-tag--ok' : v.kind === 'gold' ? ' p8-tag--warn' : ''), 'data-state': v.state, text: v.state === 'live' ? 'ظاهر في الجرس' : v.label }),
            el('span', { class: 'p8-tag' + (item.type === 'important' ? ' p8-tag--danger' : ''), text: TYPE_LABELS[item.type] || 'عام' }),
            el('span', { class: 'p8-tag', text: span }),
            /^notif-(game|news|session|act)-/.test(item.id) ? el('span', { class: 'p8-tag p8-tag--info', text: 'مرتبط' }) : null,
            bool(item.archived) ? el('span', { class: 'p8-tag', text: 'في الأرشيف' }) : null)),
        el('div', { class: 'p8-item__acts' },
          el('button', { class: 'btn btn--sm', type: 'button', 'aria-label': 'تعديل ' + item.title, onclick: function () { A.editors.notifications(item); } }, icon('edit'), 'تعديل'),
          more));
    }

    var shown = groups[filter];
    var empty = el('div', { class: 'p8-empty' },
      el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('bell')),
      el('b', { text: filter === 'live' ? 'مفيش إشعارات ظاهرة دلوقتي' : filter === 'soon' ? 'مفيش إشعارات جاية' : 'مفيش إشعارات خلصت' }),
      filter === 'live' ? el('button', { class: 'btn btn--primary', type: 'button', onclick: function () { A.editors.notifications(null); } }, icon('plus'), 'إشعار') : null);

    return [el('section', { class: 'card p8-card p8-bell' },
      el('div', { class: 'p8-card__head' },
        el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('bell')),
        el('div', { class: 'p8-card__titles' },
          el('h2', { class: 'card__title', text: 'جرس الإشعارات' }),
          el('p', { class: 'card__hint', text: 'اللي بيظهر للزوار في 🔔 على الموقع. كل إشعار ليه ميعاد يظهر ويختفي، وتقدر تبعته موبايل كمان.' })),
        el('div', { class: 'p8-card__acts' },
          A.push ? el('button', { class: 'btn', type: 'button', onclick: function () { A.push.open(); } }, icon('send'), 'إشعارات الموبايل') : null,
          el('button', { class: 'btn btn--primary', type: 'button', 'aria-label': '+ إشعار', onclick: function () { A.editors.notifications(null); } }, icon('plus'), 'إشعار'))),
      el('div', { class: 'p8-card__filters' }, seg),
      shown.length ? el('ul', { class: 'p8-list p8-events' }, shown.map(row)) : empty)];

  });

  /* Phase 8B (bell-edit.png): one window — the words, «النوع», «لما حد يدوس عليه يفتح», the two dates; on the left
     how it shows in the site's bell; the foot: «ابعته موبايل…» and «امسح». */
  A.editors.notifications = function (item) {

    var isNew = !item;
    item = item || { enabled: true, type: 'general', target: '' };

    var box = A.errorBox();
    var limits = hubLimits();
    var home = ((A.state.config && A.state.config.siteUrl) || '').replace(/\/?$/, '/');

    var title = A.counted('العنوان', item.title, limits.notificationTitle, '', { required: true, placeholder: 'مثلاً: موضوع اجتماع الأحد الجاي' });
    var message = A.counted('الرسالة', item.message, limits.notificationMessage, '', { multiline: true, rows: 3, placeholder: 'سطر قصير' });

    // «النوع»: عام · مهم · تذكير (the automatic kinds stay when an item has one)
    var typeOptions = [{ value: 'general', label: 'عام' }, { value: 'important', label: 'مهم' }, { value: 'meeting', label: 'تذكير' }];
    if (item.type && !typeOptions.some(function (o) { return o.value === item.type; })) typeOptions.push({ value: item.type, label: TYPE_LABELS[item.type] || item.type });
    var type = A.segmented(typeOptions, item.type || 'general', 'النوع', function () { paint(); });

    /* «لما حد يدوس عليه يفتح» */
    var current = item.target || '';
    var kindOf = function (t) {
      if (!t) return '';
      if (home && t === home) return 'home';
      if (t === 'meeting') return 'meeting';
      var m = /^(news|activity|game):/.exec(t);
      if (m) return m[1];
      if (/^(page|event|competition):|^points$/.test(t)) return 'keep';
      return 'url';
    };
    var kind0 = kindOf(current);
    var targets = [{ value: '', label: 'مفيش' }];
    if (home) targets.push({ value: 'home', label: 'الرئيسية' });
    targets.push({ value: 'meeting', label: 'ركن الاجتماع' }, { value: 'news', label: 'خبر' }, { value: 'activity', label: 'فعالية' });
    if (kind0 === 'game' || (A.state.draft.games || []).length) targets.push({ value: 'game', label: 'لعبة' });
    targets.push({ value: 'url', label: 'لينك' });
    if (kind0 === 'keep') targets.push({ value: 'keep', label: 'زي ما هو' });

    function pickList(list, prefix, label) {
      var s = el('select', { class: 'input', 'aria-label': label, onchange: A.markDirty }, (list || []).map(function (x) {
        return el('option', { value: prefix + x.id, selected: prefix + x.id === current ? 'selected' : null, text: x.title });
      }));
      return s;
    }
    var newsPick = pickList(A.state.draft.news, 'news:', 'الخبر');
    var actPick = pickList(A.state.draft.activities, 'activity:', 'الفعالية');
    var gamePick = pickList(A.state.draft.games, 'game:', 'اللعبة');
    var urlInput = A.textInput(kind0 === 'url' ? current : '', { ltr: true, type: 'url', placeholder: 'https://' });
    var targetSeg = A.segmented(targets, kind0, 'لما حد يدوس عليه يفتح', function () { syncTarget(); });
    var targetMore = el('div', { class: 'p8-stack' }, newsPick, actPick, gamePick, urlInput);
    function syncTarget() {
      var k = targetSeg.value;
      newsPick.hidden = k !== 'news'; actPick.hidden = k !== 'activity'; gamePick.hidden = k !== 'game'; urlInput.hidden = k !== 'url';
      targetMore.hidden = ['news', 'activity', 'game', 'url'].indexOf(k) === -1;
    }
    function targetValue() {
      var k = targetSeg.value;
      return k === 'home' ? home : k === 'meeting' ? 'meeting' : k === 'news' ? newsPick.value : k === 'activity' ? actPick.value : k === 'game' ? gamePick.value : k === 'url' ? urlInput.value.trim() : k === 'keep' ? current : '';
    }
    syncTarget();

    var image = A.imagePicker(item.image, { label: 'صورة (اختياري)' });
    var publishAt = A.dateTimeInput(item.publishAt, { emptyText: 'يظهر أول ما تنشر', presets: [A.PRESETS.now, A.PRESETS.thursday8, A.PRESETS.sunday10], onchange: function () { paint(); } });
    var expireAt = A.dateTimeInput(item.expireAt, { emptyText: 'يفضل ' + A.digits(A.state.meta.historyDays) + ' يوم', onchange: function () { paint(); } });
    var enabled = A.switchInput('ظاهر', item.enabled === undefined ? true : bool(item.enabled));

    var save = saveButton(isNew);
    A.fill(save, icon('check'), el('span', { text: isNew ? 'إضافة' : 'احفظ' }));

    save.addEventListener('click', function () {
      A.saveItem('notifications', {
        id: item.id || '',
        title: title.input.value,
        message: message.input.value,
        type: type.value,
        target: targetValue(),
        image: image.value(),
        publishAt: publishAt.value(),
        expireAt: expireAt.value(),
        enabled: enabled.input.checked
      }, box, save);
    });

    A.dirty = false;

    // in the site's bell
    var bTitle = el('b');
    var bText = el('small');
    var bIco = el('span', { class: 'chipico chipico--info', 'aria-hidden': 'true' });
    function paint() {
      bTitle.textContent = title.input.value.trim() || 'العنوان';
      bText.textContent = message.input.value.trim();
      A.fill(bIco, icon(type.value === 'important' ? 'alert' : 'bell'));
    }

    var form = el('div', { class: 'fgrid', oninput: paint },
      A.col(title.node, 12),
      A.col(message.node, 12),
      A.col(A.field('النوع', type), 12),
      A.col(A.field('لما حد يدوس عليه يفتح', el('div', { class: 'p8-stack' }, targetSeg, targetMore)), 12),
      A.col(A.field('يظهر في الجرس', publishAt.node), 6),
      A.col(A.field('يختفي من الجرس', expireAt.node), 6),
      A.col(image.node, 12),
      A.col(enabled.node, 12));

    var side = el('aside', { class: 'p8-bellside' },
      el('h5', { text: 'في الجرس على الموقع' }),
      el('div', { class: 'phone-mini' },
        el('div', { class: 'phone-mini__bar' }, icon('bell'), el('b', { text: 'الإشعارات' })),
        el('div', { class: 'phone-mini__n' }, bIco, el('div', {}, bTitle, bText))));

    var until = bellUntil(item);
    var foot = A.sheetFooter(save).concat([
      el('span', { class: 'sheet__sp', 'aria-hidden': 'true' }),
      A.push && !isNew ? el('button', { class: 'btn btn--sm', type: 'button', onclick: function () { A.closeSheet().then(function (closed) { if (closed) A.push.open(); }); } }, icon('send'), 'ابعته موبايل…') : null,
      isNew ? null : el('button', { class: 'btn btn--sm btn--danger', type: 'button', 'aria-label': 'مسح ' + item.title, onclick: function (e) { A.deleteItem('notifications', item.id, item.title, e.currentTarget); } }, icon('trash'), 'امسح')
    ]);

    A.openSheet(isNew ? 'إشعار جديد' : 'تعديل: ' + item.title, [box, el('div', { class: 'p8-bellcols' }, form, side)], foot, {
      size: 'md',
      icon: 'bell',
      sub: isNew ? 'بيظهر في 🔔 على الموقع في ميعاده' : (until ? 'ظاهر في الجرس لحد ' + A.formatWall(until, false) : 'في الجرس'),
      className: 'sheet--bell',
      // one editor per item: the official admin locks it while this is open
      draft: A.draftKey('notifications', isNew ? '' : item.id),
      lock: isNew ? null : A.editLock('notifications', item.id, 'إشعار «' + (item.title || '') + '»', function () { var fresh = A.findRow(A.state.draft.notifications, 'id', item.id); if (fresh) A.editors.notifications(fresh); else A.closeSheet(); })
    });
    paint();

  };

})();
</script>
