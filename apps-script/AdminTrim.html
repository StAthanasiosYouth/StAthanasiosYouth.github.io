<script>
/*
 * Admin: scene video clips («قصّ مقطع للمشهد»).
 *
 * The admin chooses a video on this computer (any size: a 10 GB phone or
 * camera file is fine), watches it, picks «من» / «لحد» (1–30 s) and a shape,
 * and the browser makes ONLY that short clip: H.264 MP4 with the video's own
 * sound (AAC, when it has some and the browser can encode it; else silent —
 * a service page's video card can use it, «صوت الفيديو الأصلي»; scenes on
 * the home page always play muted), 30 fps,
 * 540×960 (portrait, blurred fill) or 854×480, about 1.2 Mbps, with WebCodecs
 * through Mediabunny (admin/vendor/mediabunny.js, loaded with import() only
 * at this moment). Only the byte ranges of that part are read. The clip then
 * goes to the Media Library like any upload (Media.gs uploadVideo_); the
 * original never leaves the computer and nothing of it is kept.
 *
 * The recovery admin (Apps Script HtmlService) has no trimmer: it says to use
 * the official /admin/ (it can still choose library videos).
 *
 * A.clip: the pure parts (times, checks, framing, frame pacing, the size
 * retry). tests/final-v.test.mjs runs them in Node.
 */
(function (root) {

  'use strict';

  var A = root.A;


  /* =======================================================
     PURE
  ======================================================= */

  var CLIP = {
    minSeconds: 1,
    maxSeconds: 30,
    defaultSeconds: 6,
    fps: 30,
    bitrate: 1200000,
    minBitrate: 250000,
    maxBytes: 8 * 1024 * 1024,
    // a scene video in the gallery: «من» / «لحد» inside a library clip
    galleryMin: 0.5,
    galleryCap: 600,
    shapes: {
      tall: { width: 540, height: 960 },
      wide: { width: 854, height: 480 }
    }
  };

  /* Arabic-Indic / Persian digits and separators -> ASCII */
  function latin(text) {

    return String(text === null || text === undefined ? '' : text)
      .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x660); })
      .replace(/[\u06f0-\u06f9]/g, function (d) { return String(d.charCodeAt(0) - 0x6f0); })
      .replace(/[\u066b,]/g, '.')
      .replace(/[\u060c:\uff1a]/g, ':')
      .trim();

  }

  /* "65", "1:05", "1:05.5", "1:02:03" -> seconds (one decimal); '' -> null; nonsense -> NaN */
  function parseTime(text) {

    var value = latin(text);

    if (!value) return null;

    var parts = value.split(':');

    if (parts.length > 3) return NaN;

    var total = 0;

    for (var i = 0; i < parts.length; i++) {
      var last = i === parts.length - 1;
      if (!(last ? /^\d{1,5}(\.\d+)?$/ : /^\d{1,3}$/).test(parts[i])) return NaN;
      var n = Number(parts[i]);
      if (i > 0 && n >= 60) return NaN;
      total = total * 60 + n;
    }

    return Math.round(total * 10) / 10;

  }

  /* seconds -> "m:ss", "m:ss.s" or "h:mm:ss" */
  function formatTime(seconds) {

    var value = Math.max(0, Math.round((Number(seconds) || 0) * 10) / 10);
    var whole = Math.floor(value);
    var tenth = Math.round((value - whole) * 10);
    var h = Math.floor(whole / 3600);
    var m = Math.floor((whole % 3600) / 60);
    var s = whole % 60;
    var two = function (n) { return (n < 10 ? '0' : '') + n; };

    return (h ? h + ':' + two(m) : String(m)) + ':' + two(s) + (tenth ? '.' + tenth : '');

  }

  /*
   * '' or what is wrong with a clip. options: duration (0 = unknown),
   * min / max (its length), cap (latest end).
   */
  function checkClip(start, end, options) {

    options = options || {};

    var min = options.min || 0;
    var duration = Number(options.duration) || 0;

    if (start === null || end === null) return 'اكتب وقت «من» و«لحد» (مثلاً 1:05 أو 65)';
    if (isNaN(start) || isNaN(end)) return 'الوقت مش مفهوم — اكتبه كده: 1:05 أو 65';
    if (start < 0) return '«من» مينفعش يكون أقل من صفر';
    if (end <= start) return '«لحد» لازم يكون بعد «من»';
    if (duration && start >= duration) return 'الفيديو مدته ' + formatTime(duration) + ' بس';
    if (duration && end > duration + 0.05) return 'الفيديو بيخلص عند ' + formatTime(duration);
    if (options.cap && end > options.cap) return 'المقطع لازم يخلص قبل ' + formatTime(options.cap);
    if (end - start < min - 1e-6) return 'المقطع لازم يكون ' + (min < 1 ? 'نص ثانية' : min === 1 ? 'ثانية' : min + ' ثواني') + ' على الأقل';
    if (options.max && end - start > options.max + 1e-6) return 'المقطع لازم يكون ' + options.max + ' ثانية بالكتير';

    return '';

  }

  /* the default «لحد» for a «من»: six seconds later, inside the video */
  function defaultEnd(start, duration) {

    var end = (Number(start) || 0) + CLIP.defaultSeconds;
    if (duration > 0) end = Math.min(end, duration);
    return Math.round(end * 10) / 10;

  }

  function shapeSize(shape) {

    return CLIP.shapes[shape === 'wide' ? 'wide' : 'tall'];

  }

  /*
   * Where a sw×sh frame goes in a W×H clip: «contain» shows all of it,
   * «cover» (blurred, behind) fills the bars. Same shape (±2%): it just
   * scales, no fill.
   */
  function framing(sw, sh, W, H) {

    var rect = function (k) {
      var w = sw * k;
      var h = sh * k;
      return { x: (W - w) / 2, y: (H - h) / 2, width: w, height: h };
    };
    var cover = Math.max(W / sw, H / sh);
    var contain = Math.min(W / sw, H / sh);
    var fill = Math.abs((sw / sh) / (W / H) - 1) > 0.02;

    return { fill: fill, cover: rect(cover), contain: rect(fill ? contain : cover) };

  }

  /* frames in a clip */
  function totalFrames(start, end, fps) {

    return Math.max(1, Math.round((end - start) * fps));

  }

  /*
   * The output runs at a steady fps whatever the source's (25, 50, 60…):
   * output frame n (time start + n/fps) shows the source frame on screen
   * then. Returns how many output frames, from frame `emitted` on, this
   * source frame [sampleStart, sampleEnd) covers (0 = dropped).
   */
  function framesFor(sampleStart, sampleEnd, emitted, start, fps, total) {

    var upTo = Math.min(total, Math.ceil((sampleEnd - start) * fps - 1e-6));
    return Math.max(0, upTo - emitted);

  }

  /* 0 = the clip fits; else the lower bitrate for the one retry */
  function retryBitrate(bytes, bitrate, limit) {

    limit = limit || CLIP.maxBytes;
    if (bytes <= limit) return 0;
    return Math.max(CLIP.minBitrate, Math.floor(bitrate * (limit / bytes) * 0.85));

  }

  /* a file name -> the library item's name (no extension, no camera clutter) */
  function cleanName(name) {

    return String(name || '')
      .replace(/\.[a-z0-9]{2,5}$/i, '')
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .replace(/[_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 80);

  }

  function isVideoFile(file) {

    return !!file && (/^video\//i.test(file.type || '') || /\.(mp4|m4v|mov|webm|mkv|avi|3gp|mts|m2ts)$/i.test(file.name || ''));

  }

  A.clip = {
    CLIP: CLIP,
    parseTime: parseTime,
    formatTime: formatTime,
    checkClip: checkClip,
    defaultEnd: defaultEnd,
    shapeSize: shapeSize,
    framing: framing,
    totalFrames: totalFrames,
    framesFor: framesFor,
    retryBitrate: retryBitrate,
    cleanName: cleanName,
    isVideoFile: isVideoFile
  };

  // Node (tests): the pure parts only
  if (typeof document === 'undefined') return;


  /* =======================================================
     THE BROWSER PARTS
  ======================================================= */

  var el = A.el;
  var icon = A.icon;

  // the official admin: admin-app.js, next to vendor/ (the Apps Script admin has no src)
  var SCRIPT_SRC = (document.currentScript && document.currentScript.src) || '';

  function vendorUrl() {

    if (A.vendorUrl) return A.vendorUrl;
    return window.ADMIN_CONFIG && /\/admin-app\.js([?#]|$)/.test(SCRIPT_SRC) ? new URL('vendor/mediabunny.js', SCRIPT_SRC).href : '';

  }

  /* false in the recovery admin: no trimmer there */
  A.trimmerAvailable = function () {

    return !!vendorUrl();

  };

  function trimError(message, hint, details) {

    var error = new Error(message);
    error.parsed = { message: message, hint: hint || '', details: details || '' };
    return error;

  }

  A.trimError = trimError;

  var vendor = null;

  function loadVendor() {

    if (!vendor) {
      vendor = import(vendorUrl()).catch(function (error) {
        vendor = null;
        throw trimError('مقدرناش نحمّل أداة قص الفيديو.', 'اعمل Refresh للصفحة وجرّب تاني.', String(error));
      });
    }

    return vendor;

  }

  var CODECS = { avc: 'H.264', hevc: 'HEVC (H.265)', vp8: 'VP8', vp9: 'VP9', av1: 'AV1' };

  /* a left-to-right run inside Arabic text (LRI … PDI) */
  function ltr(text) {

    return '⁦' + text + '⁩';

  }

  /* name · size · length · size · codec, each part isolated */
  function fillFacts(node, file, opened) {

    // trim.png: name · codec · size on screen · length · bytes
    var parts = opened ? [codecLabel(opened.codec), opened.width + '×' + opened.height, formatTime(opened.duration)] : ['جاري الفتح…'];
    parts.push(A.formatBytes(file.size));
    A.fill(node, el('bdi', { text: file.name || 'فيديو' }), parts.map(function (part) { return [' · ', el('bdi', { text: part })]; }));

  }

  function codecLabel(codec) {

    return CODECS[codec] || String(codec || '').toUpperCase() || 'مش معروف';

  }

  /* opens the file (only its index and the frames asked for are read) */
  async function openSource(mb, file) {

    if (typeof VideoDecoder === 'undefined' || typeof VideoEncoder === 'undefined' || typeof OffscreenCanvas === 'undefined') {
      throw trimError('المتصفح ده مش بيعرف يقص فيديو.', 'افتح لوحة التحكم من Google Chrome (أو Edge) على الكمبيوتر.', 'WebCodecs missing');
    }

    var input = new mb.Input({ source: new mb.BlobSource(file), formats: [mb.MP4, mb.QTFF, mb.MATROSKA, mb.WEBM] });
    var track;

    try {
      track = await input.getPrimaryVideoTrack();
    }
    catch (error) {
      input.dispose();
      throw trimError('نوع الملف ده مش مدعوم.', 'ارفع فيديو MP4 أو MOV أو WebM أو MKV.', String(error));
    }

    if (!track) {
      input.dispose();
      throw trimError('الملف ده مفيهوش فيديو.', 'اختار ملف فيديو تاني.');
    }

    var codec = track.codec || '';

    if (!(await track.canDecode())) {
      input.dispose();
      throw trimError('المتصفح ده مش قادر يفتح الفيديو ده (' + codecLabel(codec) + ').',
        'افتح لوحة التحكم من Google Chrome على الكمبيوتر. فيديوهات HEVC (H.265) محتاجة كارت شاشة بيدعمها.', 'canDecode false: ' + codec);
    }

    if (!(await mb.canEncodeVideo('avc', { width: CLIP.shapes.tall.width, height: CLIP.shapes.tall.height, bitrate: CLIP.bitrate }))) {
      input.dispose();
      throw trimError('المتصفح ده مش قادر يعمل فيديو MP4 (H.264).', 'افتح لوحة التحكم من Google Chrome (أو Edge) على الكمبيوتر.', 'canEncodeVideo avc false');
    }

    return {
      input: input,
      track: track,
      audio: await soundOf(mb, input),
      codec: codec,
      duration: await input.computeDuration(),
      width: track.displayWidth,
      height: track.displayHeight
    };

  }

  /* the video's own sound, when it has some and this browser can carry it into the clip (AAC); else null */
  var SOUND_BITRATE = 96000;

  async function soundOf(mb, input) {

    try {
      if (typeof AudioDecoder === 'undefined' || typeof AudioEncoder === 'undefined' || !mb.canEncodeAudio || !mb.AudioSampleSink) return null;
      var audio = await input.getPrimaryAudioTrack();
      if (!audio || !(await audio.canDecode())) return null;
      var channels = Math.min(2, audio.numberOfChannels || 2);
      var ok = await mb.canEncodeAudio('aac', { numberOfChannels: channels, sampleRate: audio.sampleRate || 48000, bitrate: SOUND_BITRATE });
      return ok ? audio : null;
    }
    catch (error) {
      return null;
    }

  }

  function drawFrame(ctx, sample, W, H) {

    var f = framing(sample.displayWidth, sample.displayHeight, W, H);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (f.fill) {
      ctx.filter = 'blur(18px) brightness(0.8)';
      sample.draw(ctx, f.cover.x, f.cover.y, f.cover.width, f.cover.height);
      ctx.filter = 'none';
    }

    sample.draw(ctx, f.contain.x, f.contain.y, f.contain.width, f.contain.height);

  }

  function snapshot(canvas) {

    var copy = document.createElement('canvas');
    copy.width = canvas.width;
    copy.height = canvas.height;
    copy.getContext('2d').drawImage(canvas, 0, 0);
    return copy;

  }

  /* one encode: { bytes (Uint8Array), frames, poster (canvas) } or null when cancelled */
  async function encodeClip(mb, source, job, onProgress, cancelled) {

    var size = shapeSize(job.shape);
    var W = size.width;
    var H = size.height;
    var fps = CLIP.fps;
    var canvas = new OffscreenCanvas(W, H);
    var ctx = canvas.getContext('2d');
    var output = new mb.Output({ format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new mb.BufferTarget() });
    var frames = new mb.CanvasSource(canvas, { codec: 'avc', bitrate: job.bitrate, keyFrameInterval: 2 });
    var total = totalFrames(job.start, job.end, fps);
    // the poster: a frame a little into the clip
    var posterAt = Math.min(total - 1, Math.round(Math.min(1, (job.end - job.start) / 3) * fps));
    var poster = null;
    var n = 0;
    // the video's own sound (AAC), when it has some (soundOf); decoded first, then laid in with the frames
    var voice = source.audio ? new mb.AudioSampleSource({ codec: 'aac', bitrate: SOUND_BITRATE }) : null;
    var sounds = [];

    output.addVideoTrack(frames, { frameRate: fps });
    if (voice) output.addAudioTrack(voice);
    await output.start();

    async function emit(count) {
      for (var k = 0; k < count; k++) {
        if (n === posterAt) poster = snapshot(canvas);
        await frames.add(n / fps, 1 / fps);
        n++;
        await hear(n / fps);
      }
    }

    // the sound up to this moment of the clip, interleaved with the frames
    async function hear(until) {
      while (sounds.length && sounds[0].at < until) {
        var item = sounds.shift();
        try { await voice.add(item.sample); }
        finally { item.sample.close(); }
      }
    }

    try {
      if (voice) {
        var listen = new mb.AudioSampleSink(source.audio);
        var length = job.end - job.start;
        for await (var heard of listen.samples(job.start, job.end)) {
          var at = heard.timestamp - job.start;
          if (cancelled() || at >= length) { heard.close(); if (cancelled()) break; continue; }
          heard.setTimestamp(Math.max(0, at));
          sounds.push({ at: Math.max(0, at), sample: heard });
        }
      }

      var sink = new mb.VideoSampleSink(source.track);
      for await (var sample of sink.samples(job.start, job.end)) {
        try {
          if (cancelled()) break;
          var count = framesFor(sample.timestamp, sample.timestamp + (sample.duration || 1 / fps), n, job.start, fps, total);
          if (count > 0) {
            drawFrame(ctx, sample, W, H);
            await emit(count);
            onProgress(n / total);
          }
        }
        finally {
          sample.close();
        }
        if (n >= total) break;
      }

      if (cancelled()) {
        sounds.forEach(function (item) { item.sample.close(); });
        await output.cancel();
        return null;
      }

      if (!n) {
        throw trimError('مفيش صورة في الجزء ده من الفيديو.', 'جرّب وقت تاني.');
      }

      // the last frame held to the end (a source that stops a little early), then the rest of the sound
      await emit(total - n);
      if (voice) await hear(Infinity);
      await output.finalize();
    }
    catch (error) {
      sounds.forEach(function (item) { try { item.sample.close(); } catch (ignored) { /* closed */ } });
      try { await output.cancel(); } catch (ignored) { /* already closed */ }
      throw error;
    }

    return { bytes: new Uint8Array(output.target.buffer), frames: n, width: W, height: H, poster: poster || snapshot(canvas), sound: !!voice };

  }

  /*
   * The clip, ready for apiUploadMedia (the same shape A.imagePicker uploads):
   * { kind: 'video', mime, video, width, height, duration, poster, posterMime,
   *   tiny, tinyMime, color, name, previewUrl, bytesIn, bytesOut }
   */
  async function makeClip(mb, source, file, job, onProgress, cancelled) {

    var clip = await encodeClip(mb, source, job, function (f) { onProgress(f * 0.9); }, cancelled);
    if (!clip) return null;

    // too big (a busy picture): once more, at the bitrate that fits
    var lower = retryBitrate(clip.bytes.length, job.bitrate);
    if (lower) {
      clip = await encodeClip(mb, source, { start: job.start, end: job.end, shape: job.shape, bitrate: lower }, function (f) { onProgress(0.9 + f * 0.08); }, cancelled);
      if (!clip) return null;
      if (clip.bytes.length > CLIP.maxBytes) {
        throw trimError('المقطع طلع أكبر من 8 MB.', 'اختار جزء أقصر.', clip.bytes.length + ' bytes');
      }
    }

    var kit = A.imageKit;
    var thumb = await kit.encode(kit.scaled(clip.poster, kit.IMAGE.thumbSide), kit.IMAGE.thumbTarget);
    var tiny = await kit.encode(kit.scaled(clip.poster, kit.IMAGE.tinySide), kit.IMAGE.tinyTarget);

    if (!thumb || thumb.size > kit.IMAGE.thumbLimit) {
      throw trimError('مقدرناش نعمل صورة الغلاف.', 'جرّب تاني.', 'poster ' + (thumb && thumb.size));
    }

    onProgress(1);

    return {
      kind: 'video',
      mime: 'video/mp4',
      video: await kit.blobBase64(new Blob([clip.bytes], { type: 'video/mp4' })),
      width: clip.width,
      height: clip.height,
      duration: Math.round(clip.frames / CLIP.fps * 10) / 10,
      poster: await kit.blobBase64(thumb),
      posterMime: thumb.type,
      tiny: tiny ? await kit.blobBase64(tiny) : '',
      tinyMime: tiny ? tiny.type : '',
      color: kit.dominantColor(clip.poster),
      name: cleanName(file.name),
      previewUrl: URL.createObjectURL(thumb),
      bytesIn: file.size,
      bytesOut: clip.bytes.length
    };

  }


  /* =======================================================
     THE TRIMMER
  ======================================================= */

  /**
   * file (a local File or a fetched Blob with a name) -> Promise<prepared clip | null (cancelled)>
   * hooks (optional, the panel's upload list): progress(fraction) while the
   * clip is being made; idle() when that stopped or failed (the trimmer stays open)
   */
  /*
   * Phase 8B (trim.png): the approved trimmer — the video with its play button and clock, a filmstrip with the
   * part framed (drag its ends or the frame), the ruler, «من» / «لحد» with −١ −٠٫١ +٠٫١ +١ and «خد الوقت الحالي»
   * (I / O), the length with 5/10/15/30 ث, «اتفرج على الجزء» and «كرر», the shape, «إزاي تحدد الجزء», and
   * «اعمل المقطع» with the expected size. The same pieces as the library clip trimmer (AdminPages clipTrimView).
   */
  A.openTrimmer = function (file, hooks) {

    hooks = hooks || {};

    return new Promise(function (resolve) {

      var url = URL.createObjectURL(file);
      var mb = null;
      var source = null;
      var busy = false;
      var cancelled = false;
      var done = false;
      var playingPart = false;
      var loopOn = true;
      var previous = document.activeElement;

      function fmt1(sec) { sec = Math.max(0, Number(sec) || 0); var m = Math.floor(sec / 60); var s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
      function arDec(n) { return A.digits(String(Math.round(n * 10) / 10).replace('.', '٫')); }

      var titleId = A.uid('trim-title');
      var dialog = el('dialog', { class: 'modal trim trim8', 'aria-labelledby': titleId });
      var facts = el('p', { class: 'trim__facts sheet__sub' });
      var errorBox = el('div', { class: 'upload-error', role: 'alert', hidden: true });

      var video = el('video', { class: 'trim__video p8-trim__video', playsinline: '', preload: 'auto', 'aria-label': 'معاينة الفيديو' });
      // the preview plays WITH its sound (the admin's own play tap is the gesture)
      video.muted = false;
      video.volume = 1;
      var noPreview = el('p', { class: 'note', hidden: true, text: 'المعاينة مش شغالة للفيديو ده في المتصفح، بس تقدر تكتب الأوقات بالأرقام.' });
      var play = el('button', { class: 'p8-trim__play trim__play', type: 'button', 'aria-label': 'شغّل' }, icon('play'));
      var clock = el('span', { class: 'p8-trim__t mono', text: '0:00.0 / —' });

      // the filmstrip: frames of this video, drawn once it can be read
      var film = el('div', { class: 'p8-trim__film', 'aria-hidden': 'true' });
      var dimA = el('span', { class: 'p8-trim__dim' });
      var dimB = el('span', { class: 'p8-trim__dim' });
      var badge = el('em');
      var sel = el('span', { class: 'p8-trim__sel', 'data-h': 'sel' }, el('i', { class: 'p8-trim__h p8-trim__h--a', 'data-h': 'a' }), el('i', { class: 'p8-trim__h p8-trim__h--b', 'data-h': 'b' }), badge);
      var head = el('span', { class: 'p8-trim__head' });
      var line = el('div', { class: 'p8-trim__line', dir: 'ltr' }, film, dimA, dimB, sel, head);
      var ruler = el('div', { class: 'p8-trim__ruler mono', dir: 'ltr' });

      function pick(which) {
        var input = A.textInput('', { ltr: true, inputmode: 'decimal', placeholder: which === 'a' ? '0:00' : '0:06' });
        input.classList.add('mono', 'p8-trim__v');
        input.setAttribute('aria-label', which === 'a' ? 'من' : 'لحد');
        function step(label, by) {
          return el('button', { class: 'p8-step', type: 'button', 'aria-label': (which === 'a' ? 'من ' : 'لحد ') + label, onclick: function () {
            var t = times();
            var v = (which === 'a' ? t.start : t.end);
            input.value = fmt1(Math.max(0, Math.min(duration() || Infinity, (isNaN(v) || v === null ? 0 : v) + by)));
            validate();
          } }, label);
        }
        var take = el('button', { class: 'btn btn--sm btn--ghost', type: 'button', 'aria-label': 'خد الوقت الحالي في «' + (which === 'a' ? 'من' : 'لحد') + '»' }, icon('clock'), 'خد الوقت الحالي (' + (which === 'a' ? 'I' : 'O') + ')');
        var node = el('div', { class: 'p8-tpick' }, el('small', { text: which === 'a' ? 'من' : 'لحد' }),
          el('div', { class: 'p8-tpick__row' }, step('−١', -1), step('−٠٫١', -0.1), input, step('+٠٫١', 0.1), step('+١', 1)), take);
        return { input: input, take: take, node: node, steps: [].slice.call(node.querySelectorAll('.p8-step')) };
      }
      var pa = pick('a');
      var pb = pick('b');
      var startInput = pa.input;
      var endInput = pb.input;

      var len = el('b', { text: '—' });
      var quick = el('div', { class: 'seg p8-trim__quick' }, [5, 10, 15, 30].map(function (n) {
        return el('button', { class: 'seg__btn seg__btn--text', type: 'button', onclick: function () {
          var t = times();
          var a = isNaN(t.start) || t.start === null ? 0 : t.start;
          endInput.value = fmt1(Math.min(duration() || Infinity, a + n));
          validate();
        } }, A.digits(n) + ' ث');
      }));
      var watch = el('button', { class: 'btn btn--sm btn--primary', type: 'button' }, icon('play'), 'اتفرج على الجزء');
      var loop = A.switchInput('كرر', true, function (on) { loopOn = on; });
      var message = el('p', { class: 'trim__msg', role: 'status', 'aria-live': 'polite' });

      var shapeName = A.uid('trim-shape');
      var tall = el('input', { type: 'radio', name: shapeName, value: 'tall', checked: true });
      var wide = el('input', { type: 'radio', name: shapeName, value: 'wide' });
      var shapes = el('div', { class: 'field trim__shapes' },
        el('span', { class: 'field__label', text: 'الشكل' }),
        el('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'الشكل' },
          el('label', { class: 'seg__opt' }, tall, el('span', { text: 'طولي ٩:١٦ (تيك توك/ريلز)' })),
          el('label', { class: 'seg__opt' }, wide, el('span', { text: 'عرضي ١٦:٩ (يوتيوب)' }))));

      var howto = el('div', { class: 'p8-howto' },
        el('b', {}, icon('info'), 'إزاي تحدد الجزء'),
        el('ul', {},
          el('li', {}, el('b', { text: 'اسحب' }), ' طرف الإطار (يمين أو شمال) علشان تقصّر أو تطوّل، أو اسحب الإطار كله علشان تنقله.'),
          el('li', {}, el('b', { text: 'بالثانية:' }), ' اكتب الوقت في «من» و«لحد»، أو دوس ', el('b', { text: '±٠٫١' }), ' و', el('b', { text: '±١' }), '.'),
          el('li', {}, el('b', { text: 'من الفيديو:' }), ' شغّل لحد اللحظة اللي عاوزها، ودوس «خد الوقت الحالي» (أو حرف I للبداية وO للنهاية). الأسهم ← → بتحرك ٠٫١ ثانية.'),
          el('li', {}, el('b', { text: 'مدة جاهزة:' }), ' ٥ / ١٠ / ١٥ / ٣٠ ث بتمد «لحد» من «من».'),
          el('li', { text: 'من ثانية لـ٣٠ ثانية. لو حاولت تزوّد عن ٣٠ الإطار بيقف ويقولك.' })));

      var stageLabel = el('span', { class: 'upload__label' });
      var bar = el('span', { class: 'upload__bar' });
      var track = el('span', { class: 'upload__track', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-label': 'عمل المقطع' }, bar);
      var progress = el('div', { class: 'upload', hidden: true, 'aria-live': 'polite' }, el('div', { class: 'upload__row' }, stageLabel), track);

      var make = el('button', { class: 'btn btn--primary', type: 'button', disabled: true }, icon('check'), el('span', { text: 'اعمل المقطع' }));
      var cancel = el('button', { class: 'btn btn--ghost', type: 'button', text: 'إلغاء' });
      var size = el('span', { class: 'trim8__size' }, icon('info'), el('span'));

      dialog.append(
        el('div', { class: 'sheet__head trim8__head' },
          el('span', { class: 'chipico sheet__chip', 'aria-hidden': 'true' }, icon('video')),
          el('div', { class: 'sheet__titles' }, el('h2', { class: 'sheet__title modal__title', id: titleId, text: 'قصّ مقطع للمشهد' }), facts),
          A.helpButton ? A.helpButton() : null,
          el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'قفل', onclick: function () { stop(); } }, icon('close'))
        ),
        el('div', { class: 'trim8__body' },
          errorBox,
          el('div', { class: 'p8-trim' },
            el('div', { class: 'p8-trim__stage trim__stage' }, video, noPreview, play, clock),
            line, ruler,
            el('div', { class: 'p8-trim__picks trim__times' }, pa.node, pb.node),
            el('div', { class: 'p8-trim__sum' },
              el('div', {}, el('small', { text: 'المدة' }), len),
              quick, el('span', { class: 'sp' }), watch, el('div', { class: 'p8-trim__loop' }, loop.node))),
          message,
          shapes,
          howto,
          el('p', { class: 'field__hint trim8__note', text: 'الصوت بيتشال. المقطع بيتعمل على جهازك، والفيديو الأصلي مش بيترفع خالص. المقطع لازم يطلع أقل من 8 MB.' }),
          progress),
        el('div', { class: 'modal__actions sheet__foot' }, make, cancel, el('span', { class: 'sp' }), size)
      );

      function duration() {
        return source ? source.duration : (isFinite(video.duration) ? video.duration : 0);
      }

      function times() {
        return { start: parseTime(startInput.value), end: parseTime(endInput.value) };
      }

      /* the frame on the filmstrip, the clock, the length and the expected size */
      function paint() {
        var t = times();
        var total = duration() || 30;
        var a = isNaN(t.start) || t.start === null ? 0 : t.start;
        var b = isNaN(t.end) || t.end === null ? a : t.end;
        var pa0 = Math.max(0, Math.min(1, a / total)) * 100;
        var pb0 = Math.max(0, Math.min(1, b / total)) * 100;
        dimA.style.left = '0'; dimA.style.width = pa0 + '%';
        dimB.style.left = pb0 + '%'; dimB.style.right = '0';
        sel.style.left = pa0 + '%'; sel.style.width = Math.max(0, pb0 - pa0) + '%';
        var secs = Math.max(0, b - a);
        badge.textContent = arDec(secs) + ' ث';
        len.textContent = arDec(secs) + ' ثانية';
        // about the clip's bitrate plus its sound
        size.lastChild.textContent = 'حجم متوقع ~' + arDec(Math.max(0.1, secs * (CLIP.bitrate + 128000) / 8 / 1048576)) + ' MB';
        var marks = [];
        for (var i = 0; i <= 4; i++) marks.push(el('span', { text: formatTime(Math.round(total * i / 4)) }));
        A.fill(ruler, marks);
        paintHead();
      }

      function paintHead() {
        var total = duration() || 30;
        head.style.left = (Math.min(1, (video.currentTime || 0) / total) * 100) + '%';
        clock.textContent = fmt1(video.currentTime || 0) + ' / ' + (duration() ? fmt1(duration()) : '—');
      }

      /* the live check: '' = fine */
      function validate() {
        var t = times();
        var problem = source ? checkClip(t.start, t.end, { duration: duration(), min: CLIP.minSeconds, max: CLIP.maxSeconds }) : '';
        message.textContent = problem;
        message.classList.toggle('is-error', !!problem);
        startInput.toggleAttribute('aria-invalid', !!problem);
        endInput.toggleAttribute('aria-invalid', !!problem);
        // numbers isolated left-to-right inside the Arabic sentence
        if (!problem && source) message.textContent = 'المقطع ' + ltr(formatTime(t.end - t.start)) + ' — من ' + ltr(formatTime(t.start)) + ' لحد ' + ltr(formatTime(t.end));
        make.disabled = !source || !!problem || busy;
        watch.disabled = !!problem || !source;
        paint();
        return problem;
      }

      function showError(error) {
        var parsed = A.parseError(error);
        A.fill(errorBox,
          el('p', { class: 'upload-error__title' }, icon('alert'), el('span', { text: parsed.message })),
          parsed.hint ? el('p', { class: 'upload-error__hint', text: parsed.hint }) : null,
          A.technicalDetails(parsed.details)
        );
        errorBox.hidden = false;
      }

      function setProgress(fraction) {
        var value = Math.max(0, Math.min(1, fraction));
        bar.style.transform = 'scaleX(' + value.toFixed(3) + ')';
        track.setAttribute('aria-valuenow', String(Math.round(value * 100)));
        stageLabel.textContent = (cancelled ? 'جاري الإلغاء…' : 'جاري عمل المقطع… ') + (cancelled ? '' : Math.round(value * 100) + '%');
        if (busy && !cancelled && hooks.progress) hooks.progress(value);
      }

      function setBusy(on) {
        busy = on;
        [startInput, endInput, pa.take, pb.take, tall, wide, watch].concat(pa.steps, pb.steps).forEach(function (control) { control.disabled = on; });
        progress.hidden = !on;
        cancel.textContent = on ? 'وقّف' : 'إلغاء';
        validate();
      }

      /* everything goes: the preview, the object URL, the open file */
      function close(value) {
        if (done) return;
        done = true;
        video.pause();
        video.removeAttribute('src');
        video.load();
        URL.revokeObjectURL(url);
        if (source && source.input) { try { source.input.dispose(); } catch (ignored) { /* closed */ } }
        source = null;
        if (dialog.open) dialog.close();
        dialog.remove();
        if (previous && previous.isConnected) previous.focus({ preventScroll: true });
        resolve(value);
      }

      /* cancel: while working, stop the work first */
      function stop() {
        if (busy) {
          cancelled = true;
          setProgress(0);
          return;
        }
        close(null);
      }

      function take(input) {
        input.value = fmt1(video.currentTime || 0);
        if (input === startInput) {
          var t = times();
          if (t.end === null || isNaN(t.end) || t.end <= t.start || t.end - t.start > CLIP.maxSeconds) endInput.value = fmt1(defaultEnd(t.start, duration()));
        }
        validate();
      }

      function setPlayIcon() {
        A.fill(play, icon(video.paused ? 'play' : 'pause'));
        play.setAttribute('aria-label', video.paused ? 'شغّل' : 'وقّف');
        play.classList.toggle('is-playing', !video.paused);
      }

      play.addEventListener('click', function () {
        playingPart = false;
        if (video.paused) video.play().catch(function () {});
        else video.pause();
      });
      video.addEventListener('play', setPlayIcon);
      video.addEventListener('pause', setPlayIcon);
      video.addEventListener('timeupdate', function () {
        var t = times();
        if (playingPart && t.end !== null && !isNaN(t.end) && video.currentTime >= t.end) {
          if (loopOn) video.currentTime = t.start;
          else { video.pause(); playingPart = false; }
        }
        paintHead();
      });
      video.addEventListener('loadedmetadata', function () { paint(); });
      video.addEventListener('loadeddata', function () { drawFilm(); if (!video.currentTime && video.paused) video.currentTime = 0.05; }, { once: true });
      video.addEventListener('error', function () {
        noPreview.hidden = false;
        video.hidden = true;
        play.disabled = true;
      });
      pa.take.addEventListener('click', function () { take(startInput); });
      pb.take.addEventListener('click', function () { take(endInput); });
      startInput.addEventListener('input', validate);
      endInput.addEventListener('input', validate);
      watch.addEventListener('click', function () {
        if (validate()) return;
        var t = times();
        playingPart = true;
        video.currentTime = t.start;
        video.play().catch(function () {});
      });
      cancel.addEventListener('click', stop);
      dialog.addEventListener('cancel', function (event) { event.preventDefault(); stop(); });

      // I / O take the current time, ← → move it 0.1 s (not while typing)
      dialog.addEventListener('keydown', function (e) {
        if (busy || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        if (e.key === 'i' || e.key === 'I') { e.preventDefault(); take(startInput); }
        if (e.key === 'o' || e.key === 'O') { e.preventDefault(); take(endInput); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.max(0, (video.currentTime || 0) + (e.key === 'ArrowRight' ? 0.1 : -0.1)); }
      });

      // dragging an end or the whole frame (the line runs left to right: 0:00 on the left); 30 s at most
      var drag = null;
      line.addEventListener('pointerdown', function (e) {
        if (busy || !duration()) return;
        var h = e.target.closest('[data-h]');
        var rect = line.getBoundingClientRect();
        if (!h) {
          // a tap on the strip: the video goes there

        else if (drag.h === 'b') b = Math.min(total, Math.max(drag.b + d, drag.a + CLIP.minSeconds));

      line.addEventListener('pointercancel', function () { drag = null; });

      /* twelve frames along the video, from a second (silent, hidden) copy */
      function drawFilm() {
        var total = isFinite(video.duration) ? video.duration : 0;
        if (!total || !video.videoWidth) return;
        var copy = document.createElement('video');
        copy.muted = true;
        copy.preload = 'auto';
        copy.src = url;
        var canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = Math.max(1, Math.round(160 * video.videoHeight / video.videoWidth));
        var ctx = canvas.getContext('2d');

        var i = 0;
        function next() {
          if (done || i >= 12) {
            copy.removeAttribute('src');
            copy.load();
            if (!done && frames.length) A.fill(film, frames.map(function (src) { return el('img', { src: src, alt: '' }); }));
            return;

          copy.currentTime = Math.min(total - 0.05, (i + 0.5) * total / 12);

          try { ctx.drawImage(copy, 0, 0, canvas.width, canvas.height); frames.push(canvas.toDataURL('image/jpeg', 0.6)); }

          i++;
          next();
        });
        copy.addEventListener('error', function () { i = 12; next(); });
        copy.addEventListener('loadedmetadata', next, { once: true });
      }

      make.addEventListener('click', function () {
        if (busy || validate()) return;
        var t = times();
        cancelled = false;
        errorBox.hidden = true;
        video.pause();
        setBusy(true);
        setProgress(0);
        makeClip(mb, source, file, { start: t.start, end: t.end, shape: wide.checked ? 'wide' : 'tall', bitrate: CLIP.bitrate }, setProgress, function () { return cancelled; })
          .then(function (prepared) {
            if (!prepared) {
              setBusy(false);
              if (hooks.idle) hooks.idle();
              message.textContent = 'اتوقف — مفيش حاجة اترفعت.';
              return;
            }
            close(prepared);
          })
          .catch(function (error) {
            setBusy(false);
            if (hooks.idle) hooks.idle();
            showError(error);
          });
      });

      fillFacts(facts, file, null);
      video.src = url;
      document.body.appendChild(dialog);
      dialog.showModal();
      cancel.focus();
      validate();

      loadVendor()
        .then(function (module) {
          mb = module;
          return openSource(mb, file);
        })
        .then(function (opened) {
          if (done) { opened.input.dispose(); return; }
          source = opened;
          fillFacts(facts, file, opened);
          var from = Math.min(video.currentTime || 0, Math.max(0, opened.duration - CLIP.minSeconds));
          startInput.value = fmt1(from);
          endInput.value = fmt1(defaultEnd(from, opened.duration));
          // a vertical source: portrait is the natural choice anyway; a wide one too (blurred fill)
          validate();
          startInput.focus();
        })
        .catch(function (error) {
          if (done) return;
          A.fill(facts, el('bdi', { text: file.name || 'فيديو' }), ' · ', el('bdi', { text: A.formatBytes(file.size) }));
          showError(error);
          validate();
        });

    });

  };
