<script>
/*
 * «الصفحات والفعاليات» (docs/EVENTS.md §1.2, §8, §17; server: Pages.gs):
 *  - صفحات الخدمة: permanent pages at /<slug>/ (المسرح الأسود، المسرح
 *    الصامت…): hero, description, YouTube-style video cards, the team
 *  - الفعاليات: trips, conferences, fun days at /events/<slug>/: details,
 *    prices, the servants people book with (no online booking yet)
 *  - الخدام: the one registry of servants (team contacts and booking
 *    servants) and the payment methods
 *  - الحجوزات: AdminBook.html — a fourth tab and «الحجوزات (N جديد)» on
 *    each bookable event, only while the Worker's booking module is on
 * Every page / event has «الصفحة الرئيسية»: its own card on the home page
 * (show / hide, button words, shape, order) without touching the page.
 * Official admin only (/admin/): the recovery admin says so.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;

  var P = A.pages = { focusPage: '', focusEvent: '', focusClip: '', focusServant: '' };

  /*
   * «افتح» on a library item's use (AdminMedia openUse): straight to its editor.
   * pages: the page (or, for a video card's clip / cover / sound, that card's own editor);
   * events: the event; servants: the servant. → Promise<boolean>
   */
  P.openUse = function (area, key, mediaId, label) {
    if (area === 'pages') {
      P.focusPage = key;
      P.focusClip = /كارت فيديو/.test(String(label || '')) ? String(mediaId || '') : '';
      return A.go('pages', 'svcpages');
    }
    if (area === 'events') { P.focusEvent = key; return A.go('pages', 'events'); }
    if (area === 'servants') { P.focusServant = key; return A.go('pages', 'servants'); }
    return Promise.resolve(false);
  };

  var THEMES = [
    { value: '', label: 'تلقائي' }, { value: 'gold', label: 'ذهبي' }, { value: 'ember', label: 'جمري' }, { value: 'azure', label: 'أزرق' },
    { value: 'rose', label: 'وردي' }, { value: 'emerald', label: 'أخضر' }, { value: 'night', label: 'ليلي' }
  ];
  var DISPLAYS = [
    { value: '', label: 'تلقائي' }, { value: 'compact', label: 'كارت مدمج' }, { value: 'side', label: 'صورة جنب الكلام' },
    { value: 'banner', label: 'بانر عريض' }, { value: 'stack', label: 'صورة فوق والكلام تحت' }
  ];
  var DISPLAYS_MOBILE = [{ value: '', label: 'زي الكمبيوتر' }, { value: 'auto', label: 'تلقائي' }].concat(DISPLAYS.slice(1));
  var GROUPS = [{ value: 'adult', label: 'كبار' }, { value: 'child', label: 'أطفال' }, { value: 'companion', label: 'مرافقين' }];
  var DEVICE_SIZES = { phone: { width: 390, height: 780 }, desktop: { width: 1100, height: 760 } };

  function ar(n) {
    return String(n === null || n === undefined ? '' : n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }

  function official() {
    return !!window.AdminTransport;
  }

  function recoveryNotice() {
    return A.card('من لوحة التحكم الرسمية بس', 'الصفحات والفعاليات والخدام بيتعملوا من لوحة التحكم الرسمية (/admin/). افتحها من Chrome وكمّل من هناك.');
  }

  function select(options, value, label) {
    return el('select', { class: 'input', 'aria-label': label || null, onchange: A.markDirty }, options.map(function (o) {
      return el('option', { value: o.value, selected: o.value === (value || '') ? 'selected' : null, text: o.label });
    }));
  }

  function number(value, min, max, placeholder) {
    return el('input', { class: 'input comp-number', type: 'number', inputmode: 'numeric', min: String(min), max: String(max), step: '1',
      placeholder: placeholder || '', value: value === null || value === undefined ? '' : String(value), oninput: A.markDirty });
  }

  /* a gallery picker's value → stored tokens ("img-…", "vid-…@s-e") */
  function tokens(picker) {
    var value = picker.value();
    var list = Array.isArray(value) ? value : String(value || '').split(',');
    return list.map(function (v) {
      if (v && typeof v === 'object') {
        var timed = v.start !== undefined && v.start !== null && v.start !== '';
        return v.id ? v.id + (timed ? '@' + v.start + '-' + v.end : '') : '';
      }
      return String(v || '').trim();
    }).filter(Boolean);
  }

  /* the panel's own state (activities, types, sections) after a page / an event changed its card */
  function refreshState() {
    return A.call('apiState').then(function (state) { A.applyState(state); }).catch(function () {});
  }

  /*
   * A list that opens at once from its last answer (memory only, this tab)
   * and refreshes quietly behind it: one request at a time (A.latest); a
   * view drawn while one is on its way (or right after a save's reload()
   * landed: the save redraws the panel too) uses that one instead of sending
   * another; reload() after a save always asks again.
   */
  function quietList(fn) {
    var list = { last: null, target: null, reloading: false, fresh: 0 };
    var go = A.latest(function () { return A.call(fn); }, function (r) {
      list.last = r;
      list.fresh = list.reloading ? Date.now() : 0;
      list.reloading = false;
      if (list.target && list.target.body.isConnected) list.target.landed(r);
    }, function (error) {
      if (list.target && list.target.body.isConnected) list.target.failed(error);
    });
    list.load = function (target) {
      list.target = target;
      if (go.busy()) return;
      if (Date.now() - list.fresh > 5000) { go(); return; }
      list.fresh = 0;
      // a save's reload just landed: that answer is the fresh one (the view is on the page a moment later)
      setTimeout(function () {
        if (list.target === target && target.body.isConnected) target.landed(list.last);
      }, 0);
    };
    list.reload = function () { list.reloading = true; go(); };
    return list;
  }

  var pagesList = quietList('apiPages');
  var eventsList = quietList('apiEvents');

  function siteUrl(reply) {
    return String((reply && reply.siteUrl) || (A.state.config && A.state.config.siteUrl) || '').replace(/\/?$/, '/');
  }

  function liveChip(item) {
    if (item.archived) return A.chip('في الأرشيف', 'off');
    if (!item.enabled) return A.chip('مقفولة', 'off');
    return item.live ? A.chip('منشورة', 'ok') : A.chip('لسه متنشرتش', 'gold');
  }

  function cardChip(card, home) {
    if (!home || !home.show) return A.chip('مش في الصفحة الرئيسية', 'off');
    if (!card) return A.chip('الكارت هيتعمل مع الحفظ', 'info');
    return A.chip(card.show ? 'ظاهر في الرئيسية' + (card.position ? ' (رقم ' + ar(card.position) + ')' : '') : 'الكارت مخفي', card.show ? 'ok' : 'off');
  }

  function sectionTitle(key) {
    var row = (A.state.layout || []).filter(function (s) { return s.key === key; })[0] ||
      (A.state.draft.sections || []).filter(function (s) { return s.key === key; })[0];
    return row && row.title ? row.title : ({ services: 'خدماتنا', activities: 'الفعاليات' })[key] || key;
  }


  /* =======================================================
     «الصفحة الرئيسية»: the owner's card (§1.2)
  ======================================================= */

  function homePanel(home, card, options) {

    home = home || {};
    var show = A.checkbox('إظهار في الصفحة الرئيسية', !!home.show, 'كارت بالغلاف والعنوان والسطر القصير، زراره بيفتح الصفحة دي. تقدر تخفيه في أي وقت والصفحة نفسها تفضل شغالة.');
    var cta = A.textInput(home.cta, { max: 24, placeholder: options.ctaHint });
    var display = select(DISPLAYS, home.display, 'شكل الكارت');
    var mobile = select(DISPLAYS_MOBILE, home.displayMobile, 'شكل الكارت على الموبايل');
    var where = card && card.of
      ? 'الكارت ' + (card.show ? 'ظاهر' : 'مخفي') + ' في قسم «' + sectionTitle(card.section) + '»' + (card.position ? ' — رقم ' + ar(card.position) + ' من ' + ar(card.of) : '')
      : 'القسم: «' + sectionTitle(options.section) + '»';
    var order = el('button', { class: 'btn btn--small', type: 'button', onclick: function () { orderSheet(card ? card.section : options.section, card ? card.id : ''); } }, icon('layers'), 'رتّب الكروت');
    var extra = el('div', { class: 'form', hidden: !home.show }, A.field('نص الزرار', cta, 'فاضي = تلقائي: ' + options.ctaHint), A.field('شكل الكارت', display), A.field('شكل الكارت على الموبايل', mobile));

    show.input.addEventListener('change', function () { extra.hidden = !show.input.checked; });

    return {
      node: el('fieldset', { class: 'fieldset pages-home' },
        el('legend', { text: 'الصفحة الرئيسية' }),
        show.node,
        extra,
        el('div', { class: 'actions' }, el('p', { class: 'field__hint', text: where }), card ? order : null)),
      value: function () {
        return { show: show.input.checked, cta: cta.value, display: display.value, displayMobile: mobile.value };
      }
    };

  }

  /* «ترتيب الكروت في الصفحة الرئيسية»: one items section's cards, ↑ / ↓, then save */
  function orderSheet(sectionKey, focusId) {

    var types = (A.state.draft.types || []).filter(function (t) { return t.section === sectionKey; }).map(function (t) { return t.key; });
    var cards = A.byOrder((A.state.draft.activities || []).filter(function (a) { return types.indexOf(a.type) !== -1 && !A.bool(a.archived); }));
    var list = el('ol', { class: 'list pages-order' });
    var box = A.errorBox();
    var save = el('button', { class: 'btn btn--primary', type: 'button', text: 'حفظ الترتيب' });

    function draw() {
      A.fill(list, cards.map(function (card, i) {
        var linked = card.page ? 'صفحة' : card.event ? 'فعالية' : card.competition ? 'مسابقة' : '';
        var row = A.listItem({
          icon: 'grip',
          image: card.image,
          title: ar(i + 1) + '. ' + (card.title || '(من غير عنوان)'),
          sub: card.subtitle,
          off: !A.bool(card.enabled),
          chips: [A.bool(card.enabled) ? A.chip('ظاهر', 'ok') : A.chip('مخفي', 'off'), linked ? A.chip(linked, 'info') : null].filter(Boolean),
          controls: [
            el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لفوق: ' + card.title, disabled: i === 0 ? 'disabled' : null, onclick: function () { move(i, -1); } }, icon('chevron-up')),
            el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'لتحت: ' + card.title, disabled: i === cards.length - 1 ? 'disabled' : null, onclick: function () { move(i, 1); } }, icon('chevron'))
          ]
        });
        if (card.id === focusId) row.classList.add('is-focus');
        return row;
      }));
    }

    function move(i, step) {
      var j = i + step;
      if (j < 0 || j >= cards.length) return;
      var t = cards[i];
      cards[i] = cards[j];
      cards[j] = t;
      A.markDirty();
      draw();
      var buttons = list.children[j] && list.children[j].querySelectorAll('.icon-btn');
      if (buttons && buttons.length) (buttons[step < 0 ? 0 : 1].disabled ? buttons[step < 0 ? 1 : 0] : buttons[step < 0 ? 0 : 1]).focus();
    }

    save.addEventListener('click', function () {
      box.hidden = true;
      A.withBusy(save, A.call('apiHomeOrder', sectionKey, cards.map(function (c) { return c.id; }))).then(function (state) {
        A.dirty = false;
        A.applyState(state);
        A.closeSheet();
        A.toast('اتحفظ الترتيب ✓ — هيظهر في الموقع بعد ما تنشر');
        if (A.area === 'pages') A.render();
      }).catch(function (error) { A.fail(error, box); });
    });

    draw();
    A.dirty = false;
    A.openSheet('ترتيب كروت «' + sectionTitle(sectionKey) + '»', [
      box,
      el('p', { class: 'note', text: 'نفس الترتيب اللي في الصفحة الرئيسية (الأول فوق / يمين). الكروت المخفية بتفضل في مكانها لما ترجع تظهر.' }),
      cards.length ? list : el('p', { class: 'empty', text: 'مفيش كروت في القسم ده لسه.' })
    ], A.sheetFooter(save));

  }

  P.orderSheet = orderSheet;


  /* =======================================================
     PREVIEW (pages/index.html?preview, §17.10)
  ======================================================= */

  function blobUrl(src) {
    if (/^blob:/.test(src)) return src;
    var m = /^data:([^;,]+);base64,(.*)$/.exec(src || '');
    if (!m) return '';
    var binary = atob(m[2]);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: m[1] }));
  }

  function previewSheet(kind, id, title) {

    var device = matchMedia('(min-width: 900px)').matches ? 'desktop' : 'phone';
    var frame = el('iframe', { class: 'comp-preview__frame', title: 'معاينة الصفحة', src: new URL('../pages/index.html?preview', location.href).href, referrerpolicy: 'no-referrer' });
    var holder = el('div', { class: 'comp-preview__holder' }, frame);
    var stage = el('div', { class: 'comp-preview__stage', 'data-device': device }, holder);
    var status = el('p', { class: 'preview-status', role: 'status', text: 'بنجهز المعاينة…' });
    var message = null;
    var ready = false;

    function fit() {
      var size = DEVICE_SIZES[device];
      var room = Math.max(280, stage.clientWidth - 16);
      var scale = Math.min(1, room / size.width);
      stage.dataset.device = device;
      frame.style.width = size.width + 'px';
      frame.style.height = size.height + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      holder.style.width = Math.round(size.width * scale) + 'px';
      holder.style.height = Math.round(size.height * scale) + 'px';
    }

    function send() {
      if (ready && message && frame.contentWindow) frame.contentWindow.postMessage(message, location.origin);
    }

    function onMessage(event) {
      if (event.source !== frame.contentWindow || event.origin !== location.origin || !event.data) return;
      if (event.data.type === 'athanasios:page-preview-ready') { ready = true; send(); }
      if (event.data.type === 'athanasios:page-preview-shown') status.textContent = 'دي شكل الصفحة من المسودة (لسه متنشرتش).';
      if (event.data.type === 'athanasios:page-preview-error') status.textContent = event.data.message || 'المعاينة مشتغلتش.';
    }

    window.addEventListener('message', onMessage);

    A.call('apiPagePreview', kind, id).then(function (reply) {
      var images = {};
      return Promise.all((reply.media || []).filter(function (m) { return !m.published && /^img-/.test(m.id); }).map(function (m) {
        return A.mediaPreview(m.id).then(function (src) {
          var url = src ? blobUrl(src) : '';
          if (url) {
            images[m.src] = url;
            if (m.thumb) images[m.thumb] = url;
          }
        }).catch(function () {});
      })).then(function () {
        message = { type: 'athanasios:page-preview', kind: reply.kind, data: reply.data, images: images };
        send();
      });
    }).catch(function (error) { status.textContent = A.parseError(error).message; });

    var switcher = el('div', { class: 'segmented', role: 'group', 'aria-label': 'الجهاز' },
      [{ value: 'phone', label: 'موبايل', icon: 'phone' }, { value: 'desktop', label: 'كمبيوتر', icon: 'layers' }].map(function (o) {
        return el('button', { class: 'segment', type: 'button', 'aria-pressed': String(o.value === device), onclick: function (e) {
          device = o.value;
          Array.prototype.forEach.call(e.currentTarget.parentNode.children, function (b) { b.setAttribute('aria-pressed', String(b === e.currentTarget)); });
          fit();
        } }, icon(o.icon), o.label);
      }));

    A.openSheet('معاينة: ' + title, [switcher, status, stage], [el('button', { class: 'btn btn--ghost', type: 'button', text: 'قفل', onclick: function () { A.closeSheet(); } })], { wide: true });

    requestAnimationFrame(fit);
    window.addEventListener('resize', fit);

    var watch = setInterval(function () {
      if (!frame.isConnected) {
        clearInterval(watch);
        window.removeEventListener('message', onMessage);
        window.removeEventListener('resize', fit);
      }
    }, 1000);

  }


  /* =======================================================
     SERVICE PAGES
  ======================================================= */

  A.views.svcpages = function () {

    if (!official()) return [recoveryNotice()];

    var body = el('div', { 'aria-live': 'polite' });
    var box = A.errorBox();
    // the last answer draws at once (no skeleton); the fresh one replaces it (quietList)
    var reply = pagesList.last;

    function load() {
      pagesList.load({
        body: body,
        landed: function (r) {
          reply = r;
          draw(r);
          if (P.focusPage) {
            var page = r.pages.filter(function (p) { return p.id === P.focusPage; })[0];
            var clipOf = P.focusClip;
            P.focusPage = '';
            P.focusClip = '';
            if (page && clipOf) {
              // a video card: its own editor (the page's full copy has the cards)
              A.call('apiPage', page.id).then(function (full) {
                var card = (full.media || []).filter(function (m) { return [m.cover, m.clip, m.audio].some(function (v) { return String(v || '').indexOf(clipOf) >= 0; }); })[0];
                if (card) mediaEditor(full, card); else openPage(page.id);
              }).catch(function (error) { A.fail(error, box); });
            }
            else if (page) openPage(page.id);
          }
        },
        failed: function (error) {
          if (!reply) body.replaceChildren();
          A.fail(error, box);
        }
      });
    }

    function draw(r) {
      var pages = r.pages.filter(function (p) { return !p.archived || P.showArchived; });
      if (!pages.length) {
        A.fill(body, el('div', { class: 'p8-empty empty-state' },
          el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('theatre')),
          el('b', { text: 'مفيش صفحات خدمة لسه' }),
          el('small', { text: 'زوّد صفحة زي «المسرح الأسود»: غلاف، وصف، فيديوهات، وفريق الخدمة.' })));
        return;
      }
      var site = siteUrl(r);
      // Phase 8B (svcpages.png): a card per page — its cover, title and line, /slug/, its clips and partner,
      // «منشورة» / «كارت في الرئيسية», «إدارة الصفحة», «افتحها» and ⋯ («معاينة», «ترتيب الكروت»)
      A.fill(body, el('div', { class: 'p8-cgrid' }, pages.map(function (page) {
        var cover = el('div', { class: 'p8-cc__img' + (page.cover ? '' : ' is-icon'), 'aria-hidden': 'true' }, page.cover ? null : icon('theatre'));
        if (page.cover && A.mediaPreview) A.mediaPreview(page.cover).then(function (src) { if (src) cover.appendChild(el('img', { src: src, alt: '' })); }).catch(function () {});
        var live = page.live && page.enabled && !page.archived;
        var home = page.home && page.home.show && (!page.card || page.card.show);
        var more = el('button', { class: 'p8-iconbtn', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': 'اختيارات تانية: ' + page.title, onclick: function (e) {
          var look = A.menuItem('eye', 'معاينة', function () { previewSheet('page', page.id, page.title); });
          look.setAttribute('aria-label', 'معاينة: ' + page.title);
          A.menu(e.currentTarget, 'menu--p8', [look, A.menuItem('layers', 'ترتيب كروت «' + sectionTitle('services') + '»', function () { orderSheet('services', page.card ? page.card.id : ''); })], { align: 'start' });
        } }, icon('dots'));
        var card = el('article', { class: 'p8-cc item' + (page.enabled && !page.archived ? '' : ' is-off'), 'data-id': page.id },
          cover,
          el('div', { class: 'p8-cc__body' },
            el('div', { class: 'p8-cc__words' }, el('b', { class: 'item__title', text: page.title }), page.tagline ? el('small', { text: page.tagline }) : null),
            el('div', { class: 'p8-cc__facts' },
              el('span', { class: 'ltr' }, icon('link'), '/' + page.slug + '/'),
              el('span', {}, icon('video'), ar(page.mediaCount) + ' مقطع'),
              page.partner ? el('span', {}, icon('users'), 'بإشراف B.U.G') : null),
            el('div', { class: 'p8-item__tags' },
              el('span', { class: 'p8-tag ' + (live ? 'p8-tag--ok' : page.archived || !page.enabled ? '' : 'p8-tag--warn'), text: page.archived ? 'في الأرشيف' : !page.enabled ? 'مقفولة' : page.live ? 'منشورة' : 'لسه متنشرتش' }),
              home ? el('span', { class: 'p8-tag p8-tag--info', text: 'كارت في الرئيسية' }) : el('span', { class: 'p8-tag', text: page.home && page.home.show ? 'الكارت مخفي' : 'مش في الرئيسية' })),
            el('div', { class: 'p8-cc__acts' },
              el('button', { class: 'btn btn--sm btn--primary', type: 'button', 'aria-label': 'تعديل ' + page.title, onclick: function () { openPage(page.id); } }, icon('edit'), 'إدارة الصفحة'),
              page.live ? el('a', { class: 'btn btn--sm btn--ghost', href: site + page.slug + '/', target: '_blank', rel: 'noopener', 'aria-label': 'افتح الصفحة في الموقع: ' + page.title }, icon('external'), 'افتحها') : null,
              el('span', { class: 'sp' }),
              more)));
        return card;
      })));
    }

    // (these sat after the return below, so they were never set: a save never reloaded this list)
    P.openPage = openPage;
    P.reload = pagesList.reload;

    if (reply) draw(reply);
    else body.appendChild(el('div', { class: 'skeleton skeleton--line' }));
    load();

    var archivedCount = function () { return reply ? reply.pages.filter(function (p) { return p.archived; }).length : 0; };

    return [
      el('section', { class: 'card p8-card p8-cards p8-svcpages' },
        el('div', { class: 'p8-card__head' },
          el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('theatre')),
          el('div', { class: 'p8-card__titles' },
            el('h2', { class: 'card__title', text: 'صفحات الخدمة' }),
            el('p', { class: 'card__hint', text: 'صفحة كاملة لكل خدمة (الموقع/black-theatre/): غلاف، وصف، مقاطع فيديو، فريق الخدمة، وكارت في الرئيسية.' })),
          el('div', { class: 'p8-card__acts' },

      var phone = A.textInput(s.phone, { ltr: true, inputmode: 'tel', placeholder: '01012345678' });
      var role = A.counted('الدور', s.role, 40, '', { placeholder: 'اختياري، مثلاً: مسؤول الرحلة' });
      var image = A.imagePicker(s.image || '', { label: 'الصورة', hint: 'اختياري' });
      var publicWa = A.checkbox('رقمه يظهر للزوار على واتساب', !!s.publicWa, 'بموافقته بس: بيظهر زرار واتساب في صفحات الفعاليات والفرق');
      var active = A.checkbox('متاح', s.active !== false);
      var note = A.counted('ملاحظة (للأدمن بس)', s.note, 200, '', { placeholder: 'مبتظهرش في الموقع' });

      // «أرقام الدفع» (PayDest.gs): own numbers or the phone; shown to visitors only once the primary admin approves
      var payAdmin = !!(reply && reply.payAdmin);
      var instapay = A.textInput(s.instapayNumber || '', { ltr: true, inputmode: 'tel', placeholder: 'فاضي = رقم الموبايل' });
      var wallet = A.textInput(s.walletNumber || '', { ltr: true, inputmode: 'tel', placeholder: 'فاضي = رقم الموبايل' });
      var payName = A.textInput(s.payName || '', { max: 60, placeholder: 'اختياري: الاسم اللي بيظهر في التحويل' });
      [instapay, wallet, payName].forEach(function (input) {
        input.disabled = !payAdmin;
        input.addEventListener('input', function () { payBox.dataset.changed = '1'; drawPay(s.pay); });
      });
      var payBox = el('div', { class: 'pay-dests p8-paycards', 'data-pay': '1' });
      var payNote = el('p', { class: 'note' });
      var PAY_ICON = { instapay: 'swap', wallet: 'wallet' };
      var PAY_INPUT = { instapay: A.field('رقم إنستاباي', instapay), wallet: A.field('رقم المحفظة', wallet) };
      var shells = {};

      function drawPay(list) {
        var changed = payBox.dataset.changed === '1' || phone.value !== (s.phone || '');
        var seen = {};
        (list || []).concat(['instapay', 'wallet'].filter(function (k) { return !(list || []).some(function (p) { return p.method === k; }); }).map(function (k) { return { method: k, number: '' }; }))
          .forEach(function (p) {
            seen[p.method] = true;
            var label = PAY_LABELS[p.method] || p.method;
            var shell = shells[p.method];
            if (!shell) {
              shell = shells[p.method] = { head: el('div', { class: 'pay-dest__top' }), problem: el('p', { class: 'field__hint' }), acts: el('div', { class: 'actions' }) };
              shell.node = el('div', { class: 'pay-dest p8-paycard', 'data-method': p.method }, shell.head, shell.problem, PAY_INPUT[p.method] || null, shell.acts);
              payBox.appendChild(shell.node);
            }
            var line = p.number
              ? el('small', { class: 'mono' }, el('bdi', { class: 'ltr', dir: 'ltr', text: groupedNumber(p.number) }), p.source === 'phone' ? ' (من رقم الموبايل)' : '')
              : el('small', { text: 'مفيش رقم' });
            A.fill(shell.head,
              el('span', { class: 'chipico' + (p.number && !p.approved ? ' chipico--warn' : ''), 'aria-hidden': 'true' }, icon(PAY_ICON[p.method] || 'wallet')),
              el('div', { class: 'pay-dest__head' }, el('strong', { text: label }), line),
              p.approved ? el('span', { class: 'p8-tag p8-tag--ok', text: 'معتمد للزوار' }) : p.number ? el('span', { class: 'p8-tag p8-tag--warn', text: 'مش ظاهر للزوار' }) : el('span', { class: 'p8-tag', text: 'مقفول' }));
            shell.node.classList.toggle('is-wait', !!(p.number && !p.approved));
            shell.problem.textContent = p.problem || '';
            shell.problem.hidden = !p.problem;
            A.fill(shell.acts,
              !isNew && payAdmin && p.number && !p.approved
                ? el('button', { class: 'btn btn--sm btn--primary', type: 'button', 'data-act': 'pay-approve', 'data-method': p.method, disabled: changed ? 'disabled' : null, onclick: function (e) { decide(p, true, e.currentTarget); } }, icon('check'), 'اعتمد الرقم ده')
                : null,
              !isNew && payAdmin && p.approved
                ? el('button', { class: 'btn btn--sm btn--ghost', type: 'button', 'data-act': 'pay-revoke', 'data-method': p.method, onclick: function (e) { decide(p, false, e.currentTarget); } }, 'شيل الاعتماد')
                : null);
          });
        payNote.textContent = changed && payAdmin && !isNew ? 'احفظ الأول، وبعدين اعتمد الرقم الجديد.' : '';
        payNote.hidden = !payNote.textContent;
        if (!payNote.parentNode) payBox.appendChild(payNote);
        else payBox.appendChild(payNote);
      }

      function decide(p, on, button) {
        ebox.hidden = true;
        var go = function () {
          A.withBusy(button, A.call('apiServantPayApprove', s.id, p.method, p.number, on)).then(function (next) {
            reply = next;
            var fresh = (next.servants || []).filter(function (x) { return x.id === s.id; })[0];
            if (fresh) { s = fresh; drawPay(fresh.pay); }
            A.toast(on ? 'الرقم اتعتمد ✓ وبقى بيظهر للزوار في خطوة الدفع' : 'الاعتماد اتشال');
            draw(next);
          }).catch(function (error) { A.fail(error, ebox); });
        };
        if (!on) return go();
        A.confirm({
          title: 'تعتمد ' + groupedNumber(p.number) + ' رقم ' + (PAY_LABELS[p.method] || '') + ' لـ ' + s.name + '؟',
          message: 'الزوار هيحوّلوا الفلوس على الرقم ده. اتأكد بنفسك إنه بيستقبل تحويلات.',
          confirmLabel: 'اعتمد'
        }).then(function (ok) { if (ok) go(); });
      }

      drawPay(s.pay || []);

      var save = el('button', { class: 'btn btn--primary', type: 'button', text: isNew ? 'إضافة' : 'حفظ' });
      save.addEventListener('click', function () {
        ebox.hidden = true;
        var input = { name: name.input.value, phone: phone.value, role: role.input.value, image: image.value(), publicWa: publicWa.input.checked, active: active.input.checked, note: note.input.value };
        if (payAdmin) {
          input.instapayNumber = instapay.value;
          input.walletNumber = wallet.value;
          input.payName = payName.value;
        }
        A.withBusy(save, A.call('apiServantSave', isNew ? null : s.id, input))
          .then(function () { A.dirty = false; A.closeSheet(); A.toast('اتحفظ ✓'); load(); })
          .catch(function (error) { A.fail(error, ebox); });
      });
      A.dirty = false;
      A.fill(save, icon('check'), el('span', { text: isNew ? 'إضافة' : 'احفظ' }));
      A.openSheet(isNew ? 'خادم جديد' : 'تعديل: ' + s.name, [
        ebox,
        el('div', { class: 'fgrid p8-servant' },
          A.col(name.node, 6), A.col(role.node, 6),
          A.col(A.field('رقم الموبايل', phone), 6), A.col(note.node, 6),
          A.col(el('div', { class: 'hr' }), 12),
          A.col(el('div', { class: 'p8-subhead' }, el('h4', { text: 'أرقام الدفع' }), el('p', { text: payAdmin
            ? 'الرقم مبيظهرش للزوار في خطوة الدفع غير بعد ما يعتمده الأدمن الأساسي. أي تغيير محتاج اعتماد تاني.'
            : 'أرقام الدفع بيغيّرها ويعتمدها الأدمن الرئيسي بس.' })), 12),
          A.col(payBox, 12),
          A.col(A.field('اسم المستفيد', payName, 'بيظهر للزوار جنب الرقم'), 12),
          A.col(el('div', { class: 'hr' }), 12),
          A.col(publicWa.node, 6), A.col(active.node, 6),
          A.col(image.node, 12))
      ], A.sheetFooter(save).concat(isNew || !payAdmin ? [] : [
        el('span', { class: 'sheet__sp', 'aria-hidden': 'true' }),
        el('button', { class: 'btn btn--sm btn--danger', type: 'button', onclick: function () { removeServant(s); } }, icon('trash'), 'شيل الخادم…')
      ]), {
        size: 'md',
        icon: 'user',
        sub: isNew ? 'للحجز في الفعاليات وفرق الخدمة' : [s.role, s.phone].filter(Boolean).join(' · '),
        className: 'sheet--servant',
        lock: isNew ? null : A.editLock('servant', s.id, 'الخادم «' + s.name + '»', function () { A.closeSheet(); load(); })
      });
      phone.addEventListener('input', function () { drawPay(s.pay || []); });
    }

    load();

    return [
      el('section', { class: 'card p8-card' },
        el('div', { class: 'p8-card__head' },
          el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('users')),
          el('div', { class: 'p8-card__titles' },
            el('h2', { class: 'card__title', text: 'الخدام' }),
            el('p', { class: 'card__hint', text: 'قايمة واحدة للخدام المسؤولين عن الحجز في الفعاليات' })),
          el('div', { class: 'p8-card__acts' },
            el('button', { class: 'btn btn--primary', type: 'button', onclick: function () { servantEditor(null); } }, icon('plus'), 'خادم جديد'))),
        box,
        body)
    ];

  };

})();
</script>
