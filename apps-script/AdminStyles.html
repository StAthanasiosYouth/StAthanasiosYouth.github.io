  padding: 0;
  list-style: none;
}

.import__row {
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgb(var(--tint) / .03);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.import__row--error {
  box-shadow: inset 0 0 0 1px rgb(var(--danger-rgb) / .35);
}

.import__row--update {
  box-shadow: inset 0 0 0 1px var(--line-strong);
}

.import__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.import__tick,
.import__tick-space {
  flex: none;
  width: 22px;
  height: 22px;
  accent-color: var(--gold);
}

.import__date {
  font-weight: 800;
}

.import__lines {
  display: grid;
  gap: 4px;
  padding-inline-start: 32px;
  min-width: 0;
  font-size: .86rem;
}

.import__topic {
  color: var(--text-2);
  overflow-wrap: anywhere;
}

.import__change {
  overflow-wrap: anywhere;
}

.import__change del {
  color: var(--text-3);
}

.import__change ins {
  color: var(--gold-hi);
  text-decoration: none;
}

.import__error {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  color: var(--danger);
}

.import__error .icon {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 3px;
}

.import__warn {
  color: var(--warn);
}

@media (max-width: 420px) {

  .program__row {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .program__n {
    display: none;
  }

  .program__part .input {
    width: 112px;
  }

}


/* =========================================================
   MOTION
========================================================= */

.is-entering {
  animation: rise-in .6s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 55ms);
}

.icon.is-pop {
  animation: icon-pop .6s var(--spring);
}

/* each area's icon has its own small gesture on hover */
@media (hover: hover) {
  .navlink[data-area="home"]:hover .icon { transform: scale(1.1); }
  .navlink[data-area="content"]:hover .icon { transform: rotate(-12deg) scale(1.08); }
  .navlink[data-area="page"]:hover .icon { transform: translateY(-2px); }
  .navlink[data-area="settings"]:hover .icon { transform: rotate(60deg); }
  .navlink--quiet:hover .icon { transform: rotate(-20deg); }
}

@keyframes rise-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

@keyframes icon-pop {
  0% { transform: scale(1); }
  35% { transform: scale(.82); }
  100% { transform: scale(1); }
}

@keyframes shake {
  20% { transform: translateX(-4px); }
  45% { transform: translateX(3px); }
  70% { transform: translateX(-2px); }
}

@keyframes ping {
  from { transform: scale(.6); opacity: .6; }
  to { transform: scale(1.9); opacity: 0; }
}

@keyframes breathe {
  50% { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 8px rgb(var(--acc-rgb) / .08); }
}

@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes upload-sweep {
  from { transform: translateX(110%); }
  to { transform: translateX(-280%); }
}

@keyframes toast-life {
  to { transform: scaleX(0); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .upload.is-indeterminate .upload__bar {
    width: 100%;
    opacity: .5;
  }
}


/* =========================================================
   HOME DASHBOARD (AdminHome.html)
========================================================= */

.dash {
  display: grid;
  gap: 16px;
}

@media (min-width: 860px) {
  .dash {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
  }
  .dash-site,
  .dash-quick,
  .dash-card--wide {
    grid-column: 1 / -1;
  }
}

.dash-card {
  gap: 12px;
}

.dash-card__head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dash-card__head .chip {
  margin-inline-start: auto;
}

.dash-card__icon,
.dash-site__icon {
  display: grid;
  flex: none;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: var(--gold-hi);
  background: rgb(var(--acc-rgb) / .12);
  box-shadow: inset 0 0 0 1px var(--line);
}

.dash-card__icon .icon,
.dash-site__icon .icon {
  width: 20px;
  height: 20px;
}

.dash-card.is-off {
  opacity: .82;
}

/* the site: one sentence about its state */
.dash-site__main {
  display: flex;
  align-items: center;
  gap: 14px;
}

.dash-site__icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
}

.dash-site--dirty .dash-site__icon {
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
  box-shadow: 0 10px 24px -12px rgb(var(--acc-rgb) / .9);
}

.dash-site--error .dash-site__icon {
  color: var(--danger);
  background: var(--danger-bg);
}

.dash-site--clean .dash-site__icon {
  color: var(--ok);
  background: var(--ok-bg);
}

.dash-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin: 0;
}

.dash-facts > div {
  display: grid;
  gap: 2px;
}

.dash-facts dt {
  font-size: .76rem;
  color: var(--text-3);
}

.dash-facts dd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-size: .9rem;
  font-weight: 700;
}

.dash-facts__link {
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  color: var(--gold-soft);
}

/* the next meeting */
.dash-meeting {
  display: grid;
  gap: 6px;
  justify-items: start;
}

.dash-meeting__when {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  font-size: 1.05rem;
}

.dash-meeting__rel {
  font-size: .82rem;
  font-weight: 700;
  color: var(--gold-hi);
}

.dash-meeting__topic {
  font-size: 1.12rem;
  font-weight: 800;
  line-height: 1.5;
  color: var(--text);
}

.dash-meeting__topic.is-empty {
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-3);
}

.dash-meeting__cancelled {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .86rem;
  color: var(--warn);
}

.dash-meeting__cancelled .icon {
  width: 16px;
  height: 16px;
}

/* compact rows: coming up, the bell */
.dash-list {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.dash-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 6px 10px;
  border: 0;
  border-radius: 12px;
  font: inherit;
  text-align: start;
  color: var(--text);
  background: rgb(var(--tint) / .025);
  cursor: pointer;
  transition: background-color .2s;
}

.dash-row:hover {
  background: rgb(var(--tint) / .06);
}

.dash-row:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.dash-row__icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: var(--gold-hi);
  background: rgb(var(--acc-rgb) / .1);
}

.dash-row__icon .icon {
  width: 16px;
  height: 16px;
}

.dash-row__label {
  display: -webkit-box;
  overflow: hidden;
  font-size: .9rem;
  font-weight: 600;
  line-height: 1.5;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.dash-row__when {
  font-size: .76rem;
  color: var(--text-3);
  white-space: nowrap;
}

.dash-row.is-live .dash-row__icon {
  color: var(--ok);
  background: var(--ok-bg);
}

.dash-row.is-live .dash-row__when {
  font-weight: 800;
  color: var(--ok);
}

/* quick actions */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(96px, 22%), 1fr));
  gap: 8px;
}

.quick {
  display: grid;
  justify-items: center;
  gap: 6px;
  min-height: 84px;
  padding: 12px 6px;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  font: inherit;
  color: var(--text);
  background: rgb(var(--tint) / .03);
  cursor: pointer;
  transition: transform .35s var(--spring), border-color .2s, background-color .2s;
}

.quick:hover {
  border-color: var(--line-strong);
  background: rgb(var(--acc-rgb) / .07);
}

.quick:active {
  transform: scale(.96);
}

.quick:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.quick__icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
}

.quick__icon .icon {
  width: 20px;
  height: 20px;
}

.quick__label {
  max-width: 100%;
  font-size: .84rem;
  font-weight: 700;
  text-align: center;
  overflow-wrap: anywhere;
}

.quick {
  min-width: 0;
}

.quick__label::before {
  content: "+ ";
  color: var(--gold-hi);
}


/* =========================================================
   REVIEW: changes grouped, in plain words
========================================================= */

.review-groups {
  display: grid;
  gap: 14px;
}

.review-group__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: .9rem;
  font-weight: 800;
  color: var(--gold-hi);
}

.review-group__title .icon {
  width: 18px;
  height: 18px;
}

.changes li.is-add::before {
  background: var(--ok);
  box-shadow: 0 0 8px rgb(var(--ok-rgb) / .7);
}

.changes li.is-remove::before {
  background: var(--danger);
  box-shadow: 0 0 8px rgb(var(--danger-rgb) / .7);
}

.change__text {
  display: grid;
  gap: 4px;
}

.change__when {
  justify-self: start;
}

@media (prefers-reduced-motion: reduce) {
  .quick,
  .dash-row {
    transition: none;
  }
}


/* =========================================================
   PREVIEW (AdminPreview.html): the draft on the real page
========================================================= */

.sheet--preview {
  max-height: calc(100dvh - 12px);
}

@media (min-width: 760px) {
  .sheet--preview {
    max-height: calc(100dvh - 2 * var(--sheet-gap));
  }
}

@media (min-width: 900px) {
  .sheet--preview.sheet--wide {
    width: min(1220px, calc(100vw - 2 * var(--sheet-gap)));
  }
}

.preview-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.preview-tools__time {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.preview-when {
  width: auto;
  min-height: 40px;
  padding-block: 6px;
  font-size: .85rem;
}

.segmented {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: rgb(var(--tint) / .04);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.segment {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 4px 12px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: .84rem;
  font-weight: 700;
  color: var(--text-2);
  background: none;
  cursor: pointer;
}

.segment .icon {
  width: 16px;
  height: 16px;
}

.segment[aria-pressed="true"] {
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
}

.segment:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.preview-status {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 24px;
  font-size: .86rem;
  color: var(--text-2);
}

.preview-status--ok {
  color: var(--ok);
}

.preview-status--warn {
  color: var(--warn);
}

.preview-status--error {
  color: var(--danger);
}

.preview-stage {
  display: grid;
  justify-items: center;
  padding: 12px 0;
  border-radius: 18px;
  background:
    radial-gradient(60% 60% at 50% 0%, rgb(var(--acc-rgb) / .08), transparent),
    rgb(var(--shade) / calc(.25 * var(--shade-k)));
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.preview-holder {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  box-shadow: 0 0 0 1px var(--line-strong), 0 30px 60px -30px rgb(var(--shade) / calc(.9 * var(--shade-k)));
}

.preview-stage[data-device="desktop"] .preview-holder {
  border-radius: 12px;
}

.preview-frame {
  display: block;
  border: 0;
  background: var(--bg);
  transform-origin: top left;
}

[dir="rtl"] .preview-frame {
  transform-origin: top right;
}


/* =========================================================
   «صلاحيات لوحة التحكم» (AdminPage.html: the allowlist)
========================================================= */

.admins__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.admins__count {
  font-size: .8rem;
  font-weight: 700;
  color: var(--text-3);
}

.admins {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.admin {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding: 8px 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);

/* =========================================================
   SCROLLBARS — mouse and trackpad only (touch keeps the native ones).
   Same tokens as the public site. Chrome/Safari: ::-webkit-scrollbar
   (these are ignored where scrollbar-color is set, so that one is for
   Firefox only).
========================================================= */

@media (hover: hover) and (pointer: fine) {

  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  ::-webkit-scrollbar-track {
    border-radius: 999px;
    background: rgb(var(--tint) / .035);
  }

  ::-webkit-scrollbar-thumb {
    min-height: 40px;
    border: 2px solid transparent;
    border-radius: 999px;
    background-color: rgb(var(--acc-rgb) / .42);
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover,
  ::-webkit-scrollbar-thumb:active {
    background-color: rgb(var(--acc-hi-rgb) / .75);
  }

  ::-webkit-scrollbar-corner {
    background: transparent;
  }

  @supports not selector(::-webkit-scrollbar) {
    * {
      scrollbar-width: thin;
      scrollbar-color: rgb(var(--acc-rgb) / .45) transparent;
    }
  }

}

   «سجل النشاط» (AdminActivity.html): rows, filters, home card
========================================================= */

}

.act {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;

  gap: 12px;
  min-height: 58px;
  padding: 10px 12px;

/* the kind of action, as a thin edge */
.act::before {
  content: "";
  position: absolute;
  inset-block: 10px;
  inset-inline-start: -1px;
  width: 3px;
  border-radius: 3px;
  background: var(--line-strong);
  opacity: .55;
}

.act--ok::before { background: var(--ok); }
.act--danger::before { background: var(--danger); }
.act--gold::before { background: var(--gold-hi); opacity: .9; }
.act--info::before { background: var(--info); }
.act--warn::before { background: var(--warn); }

.admin.is-focus {
  border-radius: 12px;
  background: linear-gradient(90deg, rgb(var(--acc-rgb) / .1), transparent 75%);

}

/* =========================================================
   «المسابقات» (AdminComp*.html): the list, the wizard, the builder
   and its tabs, the question editor and import, submissions, review,
   results, the preview frame, the module switches
========================================================= */

/* the dock with seven areas: a little tighter, every word still fits at 360px */
.dock--dense .dockbtn {
  /* the button's own side padding (the browser's 6px) goes to the word */
  padding-inline: 1px;
  font-size: .62rem;
  letter-spacing: -.01em;
}

.dock--dense .dockbtn .icon {
  width: 21px;
  height: 21px;
}

.dockbtn__label {
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;
}

/* eight areas: closer to the screen's edges, the words a touch smaller (still ≥ 9px at 360px) */
.dock--crowded {
  inset-inline: 6px;
  padding: 5px 4px;
}

.dock--crowded::before {
  inset-inline-start: calc(4px + var(--active, 0) * (100% - 8px) / var(--count, 4));
  width: calc((100% - 8px) / var(--count, 4));
}

.dock--crowded .dockbtn {
  padding-inline: 0;
  font-size: .58rem;
  letter-spacing: -.02em;
}

.dock--crowded .dockbtn .icon {
  width: 20px;
  height: 20px;
}

.comp-steps__step.is-current {

.comp-steps__step.is-done {

.comp-steps__dot {
  display: grid;
  flex: none;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: .74rem;
  background: rgb(var(--tint) / .06);
}

.comp-steps__dot .icon {
  width: 14px;
  height: 14px;
}

.comp-presets {
  display: grid;
  gap: 8px;
}

.comp-preset {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgb(var(--tint) / .03);
  box-shadow: inset 0 0 0 1px var(--line-2);
  cursor: pointer;
  transition: box-shadow .2s, background-color .2s;
}

.comp-preset input {
  width: 20px;
  height: 20px;
  margin-top: 3px;
  accent-color: var(--gold);
}

.comp-preset:has(input:checked) {
  background: rgb(var(--acc-rgb) / .08);
  box-shadow: inset 0 0 0 1.5px var(--gold);
}

.comp-preset__body {
  display: grid;
  gap: 2px;
}

.comp-preset__body small {
  font-size: .82rem;
  line-height: 1.6;
  color: var(--text-2);
}

.comp-slug__url {
  padding: 10px 12px;
  border-radius: 12px;
  font-size: .82rem;
  color: var(--gold-soft);
  background: rgb(var(--shade) / calc(.25 * var(--shade-k)));
  overflow-wrap: anywhere;
}

.comp-slug__problem {
  color: var(--ok);
}

.comp-slug__problem.is-bad {
  color: var(--danger);
}

/* ---------- the builder: head + tabs ---------- */

.comp-head {
  gap: 10px;
}

.comp-head__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.comp-head__main {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: center;
}

.comp-head__icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 15px;
  color: var(--gold-hi);
  background: radial-gradient(circle at 50% 25%, rgb(var(--acc-hi-rgb) / .2), rgb(var(--nv-11-42-76) / .9) 75%);
  box-shadow: inset 0 0 0 1px var(--line);
}

.comp-head__icon .icon {
  width: 26px;
  height: 26px;
}

.comp-head__text {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.comp-head__title {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

/* (not sticky: the top bar already is) a phone scrolls it sideways, edge to edge */
.comp-tabs {
  display: flex;
  gap: 4px;
  margin: 0 -14px;
  padding: 6px 14px;
  overflow-x: auto;
  scrollbar-width: none;
  border-block: 1px solid var(--line-2);
  background: rgb(var(--tint) / .02);
}

.comp-tabs::-webkit-scrollbar {
  display: none;
}

.comp-tabs__tab {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 4px 13px;
  border: 0;
  border-radius: 12px;
  font-size: .86rem;
  font-weight: 700;
  color: var(--text-2);
  background: none;
  cursor: pointer;
  white-space: nowrap;
}

.comp-tabs__tab:hover {
  color: var(--text);
  background: rgb(var(--tint) / .04);
}

.comp-tabs__tab[aria-selected="true"] {
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
}

.comp-tabs__badge {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  font-size: .7rem;
  line-height: 1.7;
  text-align: center;
  color: var(--text);
  background: rgb(var(--tint) / .1);
}

.comp-tabs__tab.has-pending .comp-tabs__badge {
  color: var(--gold-ink);
  background: var(--gold-hi);
}

.comp-tabs__tab[aria-selected="true"] .comp-tabs__badge {
  color: var(--gold-hi);
  background: var(--navy-900);
}

@media (min-width: 1024px) {
  .comp-tabs {
    flex-wrap: wrap;
    margin: 0;
    padding: 6px;
    overflow: visible;
    border: 1px solid var(--line-2);
    border-radius: 16px;
  }
}

.comp-tab {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}

.comp-tab.is-readonly .card {
  opacity: .82;
}

.comp-save {
  position: sticky;
  bottom: calc(var(--dock-h) + 18px);
  justify-content: flex-start;
  padding-top: 8px;
}

@media (min-width: 1024px) {
  .comp-save {
    bottom: 12px;
  }
}

.comp-number {
  max-width: 160px;
  direction: ltr;
  text-align: right;
}

/* ---------- overview ---------- */

.comp-switches {
  display: grid;
  gap: 10px;
}

.comp-actions {
  margin-top: 4px;
}

.comp-link {
  display: grid;
  gap: 10px;
}

.comp-link__url {
  display: block;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: .86rem;
  text-decoration: none;
  background: rgb(var(--shade) / calc(.25 * var(--shade-k)));
  box-shadow: inset 0 0 0 1px var(--line-2);
  overflow-wrap: anywhere;
}

.comp-checks {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.comp-checks__item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgb(var(--tint) / .025);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.comp-checks__mark {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
}

.comp-checks__mark .icon {
  width: 16px;
  height: 16px;
}

.comp-checks__item.is-ok .comp-checks__mark {
  color: var(--ok);
  background: var(--ok-bg);
}

.comp-checks__item.is-todo .comp-checks__mark {
  color: var(--warn);
  background: var(--warn-bg);
}

.comp-checks__text {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.comp-checks__text small {
  font-size: .8rem;
  color: var(--text-3);
}

.comp-checks__list {
  margin: 2px 0 0;
  padding-inline-start: 18px;
  font-size: .8rem;
  color: var(--text-2);
}

.comp-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 8px;
}

.comp-tile {
  display: grid;
  gap: 2px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgb(var(--tint) / .03);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.comp-tile__n {
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.3;
  color: var(--text);
}

.comp-tile__label {
  font-size: .8rem;
  color: var(--text-3);
}

.comp-tile--gold .comp-tile__n {
  color: var(--gold-hi);
}

.comp-qr {
  display: grid;
  justify-items: center;
  gap: 10px;
}

.comp-qr__canvas {
  width: min(260px, 70vw);
  height: auto;
  border-radius: 14px;
  background: #fff;
}

.comp-qr__url {
  font-size: .8rem;
  color: var(--text-2);
  overflow-wrap: anywhere;
  text-align: center;
}

/* ---------- participation / result ---------- */

.comp-explain {
  display: grid;
  gap: 4px;
  margin: 4px 0 0;
  padding-inline-start: 18px;
  font-size: .86rem;
  color: var(--text-2);
}

/* ---------- questions ---------- */

.comp-type {
  display: inline-grid;
  flex: none;
  place-items: center;
  min-width: 34px;
  height: 30px;
  padding: 0 6px;
  border-radius: 10px;
  font-size: .78rem;
  font-weight: 800;
  color: var(--gold-hi);
  background: rgb(var(--acc-rgb) / .1);
  box-shadow: inset 0 0 0 1px var(--line);
}

.comp-type[data-type="info"] {
  color: var(--info);
  background: var(--info-bg);
}

.comp-type[data-type="long"],
.comp-type[data-type="short"] {
  color: var(--text);
  background: rgb(var(--tint) / .06);
}

.comp-qs__tools {
  flex-wrap: wrap;
}

.comp-qs {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.comp-q {
  position: relative;
  display: grid;
  grid-template-columns: auto auto auto minmax(0, 1fr);
  gap: 8px 10px;
  align-items: start;
  padding: 10px 10px 10px 8px;
  border-radius: 16px;
  background: rgb(var(--tint) / .028);
  box-shadow: inset 0 0 0 1px rgb(var(--tint) / .06);
  transition: box-shadow .2s, background-color .2s;
}

.comp-q.has-problem {
  box-shadow: inset 0 0 0 1px rgb(var(--danger-rgb) / .35);
}

.comp-q.is-off .comp-q__text {
  color: var(--text-3);
}

.comp-q.is-dragging {
  z-index: 3;
  background: var(--navy-800);
  box-shadow: 0 18px 40px -16px rgb(var(--shade) / calc(.9 * var(--shade-k))), inset 0 0 0 1.5px var(--gold);
  transition: none;
}

.comp-qs.is-sorting .comp-q:not(.is-dragging) {
  transition: transform .18s var(--ease);
}

.comp-q__grip {
  display: grid;
  place-items: center;
  width: 32px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  color: var(--text-3);
  background: none;
  cursor: grab;
  touch-action: none;
}

.comp-q__grip:active {
  cursor: grabbing;
}

.comp-q__grip:disabled {
  opacity: .35;
  cursor: default;
}

.comp-q__n {
  min-width: 22px;
  padding-top: 10px;
  font-size: .86rem;
  font-weight: 800;
  text-align: center;
  color: var(--gold-soft);
}

.comp-q .comp-type {
  margin-top: 6px;
}

.comp-q__main {
  display: grid;
  gap: 4px;
  min-width: 0;
  padding-top: 4px;
}

.comp-q__text {
  font-weight: 700;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.comp-q__key {
  font-size: .82rem;
  color: var(--ok);
  overflow-wrap: anywhere;
}

.comp-q__tools {
  display: flex;
  flex-wrap: wrap;
  grid-column: 1 / -1;
  justify-content: flex-end;
  gap: 2px;
}

@media (min-width: 760px) {
  .comp-q {
    grid-template-columns: auto auto auto minmax(0, 1fr) auto;
  }
  .comp-q__tools {
    grid-column: auto;
    align-self: center;
  }
}

.comp-choices {
  display: grid;
  gap: 8px;
  margin-bottom: 8px;
}

.comp-choice {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 6px;
  border-radius: 14px;
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.comp-choice.is-correct {
  background: var(--ok-bg);
  box-shadow: inset 0 0 0 1.5px rgb(var(--ok-rgb) / .45);
}

.comp-choice__mark {
  display: grid;
  justify-items: center;
  min-width: 44px;
  font-size: .7rem;
  font-weight: 800;
  color: var(--text-3);
  cursor: pointer;
}

.comp-choice__mark input {
  width: 22px;
  height: 22px;
  accent-color: var(--ok);
}

.comp-choice.is-correct .comp-choice__mark {
  color: var(--ok);
}

.comp-choice__tools {
  display: flex;
  grid-column: 1 / -1;
  justify-content: flex-end;
  gap: 2px;
}

@media (min-width: 560px) {
  .comp-choice {
    grid-template-columns: auto minmax(0, 1fr) auto;
  }
  .comp-choice__tools {
    grid-column: auto;
  }
}

.comp-import__tools {
  display: grid;
  gap: 8px;
}

.comp-import__choices {
  font-size: .82rem;
  color: var(--text-2);
  overflow-wrap: anywhere;
}

.comp-import__key {
  font-size: .82rem;
  font-weight: 700;
  color: var(--ok);
}

/* ---------- preview ---------- */

.comp-preview__tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.comp-preview__stage {
  display: grid;
  justify-items: center;
  padding: 10px 8px;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(60% 60% at 50% 0%, rgb(var(--acc-rgb) / .08), transparent),
    rgb(var(--shade) / calc(.25 * var(--shade-k)));
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.comp-preview__holder {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 0 0 1px var(--line-strong), 0 30px 60px -30px rgb(var(--shade) / calc(.9 * var(--shade-k)));
}

.comp-preview__stage[data-device="desktop"] .comp-preview__holder {
  border-radius: 12px;
}

.comp-preview__frame {
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  display: block;
  border: 0;
  background: var(--bg);
  transform-origin: top right;
}

[dir="ltr"] .comp-preview__frame {
  transform-origin: top left;
}

.comp-preview__result {
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--ok-bg);
  box-shadow: inset 0 0 0 1px rgb(var(--ok-rgb) / .3);
}

.comp-preview__result-title {
  font-weight: 800;
  color: var(--ok);
}

/* ---------- notifications, modules ---------- */

.comp-notify {
  gap: 10px;
}

.comp-notify .check {
  flex-wrap: wrap;
}

.comp-modules {
  display: grid;
  gap: 10px;
}

.comp-module {
  display: grid;
  gap: 6px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgb(var(--tint) / .025);
  box-shadow: inset 0 0 0 1px var(--line-2);
}

.comp-module.is-on {
  box-shadow: inset 0 0 0 1px rgb(var(--ok-rgb) / .35);
}

/* ---------- submissions ---------- */

.comp-subs__tools {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}

@media (min-width: 720px) {
  .comp-subs__tools {
    display: flex;
    flex-wrap: wrap;
  }

  .comp-subs__tools > * {
    flex: 1 1 150px;
    min-width: 0;
  }

  .comp-subs__tools > [type="search"] {
    flex: 2 1 260px;
  }
}

/* «تحديد»: a ticked list (export / distribute / bulk changes) */
/* a member's optional photo in the person sheet */
.youth-photo-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-block: 10px;
}

.youth-photo {
  width: 96px;
  height: 96px;
  object-fit: cover;
  border-radius: 50% 50% 14% 14% / 50% 50% 14% 14%;
  box-shadow: 0 0 0 1px var(--gold-line-strong, rgb(var(--acc-hi-rgb) / .36));
}

.comp-person--pick {
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  column-gap: 12px;
}

.comp-person--pick > :not(.import__tick) {
  grid-column: 2;
}

.comp-person--pick > .import__tick {
  grid-row: 1 / span 3;
}

.comp-select-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 14px;
  background: rgb(var(--acc-hi-rgb) / .08);
  box-shadow: inset 0 0 0 1px rgb(var(--acc-hi-rgb) / .22);
}

.comp-select-bar__n {
  font-weight: 800;
}

/* «توزيع الأكواد»: one block per servant / group */
.comp-dist__bucket + .comp-dist__bucket {
  margin-top: 14px;
}

.comp-dist__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.comp-subs {
  display: grid;
  gap: 6px;
}

.comp-sub {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 4px;
  width: 100%;
  min-height: 56px;
  padding: 10px 12px;
  border: 0;
  border-radius: 14px;
  text-align: start;
  color: inherit;
  background: rgb(var(--tint) / .028);
  box-shadow: inset 0 0 0 1px rgb(var(--tint) / .06);
  cursor: pointer;
}

.comp-sub:hover {
  box-shadow: inset 0 0 0 1px rgb(var(--acc-hi-rgb) / .25);
}

.comp-sub__who {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  min-width: 0;
}

.comp-sub__name {
  font-weight: 800;
  overflow-wrap: anywhere;
}

.comp-sub__phone {
  font-size: .82rem;
  color: var(--text-3);
}

.comp-sub__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.comp-sub__score {
  font-weight: 800;
  color: var(--gold-hi);
}

.comp-sub__when {
  font-size: .78rem;
  color: var(--text-3);
}

@media (min-width: 860px) {
  .comp-sub {
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 1fr);
    align-items: center;
  }
}

.comp-pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.comp-pager__text {
  font-size: .84rem;
  color: var(--text-3);
}

/* one submission */

.comp-sub-facts {
  padding: 12px;
  border-radius: 14px;
  background: rgb(var(--tint) / .025);
}

.comp-sub-facts__score {
  color: var(--gold-hi);
}

.comp-answers {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.comp-ans {
  display: grid;
  gap: 8px;
  padding: 12px;
  border-radius: 16px;
  background: rgb(var(--tint) / .028);
  box-shadow: inset 0 0 0 1px rgb(var(--tint) / .07);
}

.comp-ans.is-right {
  box-shadow: inset 3px 0 0 var(--ok), inset 0 0 0 1px rgb(var(--ok-rgb) / .2);
}

.comp-ans.is-wrong {
  box-shadow: inset 3px 0 0 var(--danger), inset 0 0 0 1px rgb(var(--danger-rgb) / .2);
}

.comp-ans.is-pending {
  box-shadow: inset 3px 0 0 var(--warn), inset 0 0 0 1px rgb(var(--warn-rgb) / .25);
}

.comp-ans__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}

.comp-ans__n {
  font-weight: 800;
  color: var(--gold-soft);
}

.comp-ans__q {
  flex: 1 1 200px;
  font-weight: 700;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.comp-ans__pic,
.comp-pic {
  max-width: min(100%, 320px);
  max-height: 220px;
  border-radius: 12px;
  object-fit: contain;
}

.comp-ans__body {
  display: grid;
  gap: 6px;
}

.comp-ans__choices {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.comp-ans__choice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: .9rem;
  color: var(--text-2);
  background: rgb(var(--tint) / .02);
}

.comp-ans__choice.is-right {
  color: var(--ok);
  background: var(--ok-bg);
}

.comp-ans__choice.is-mine:not(.is-right) {
  color: var(--danger);
  background: var(--danger-bg);
}

.comp-ans__mark {
  width: 16px;
  font-weight: 800;
  text-align: center;
}

.comp-ans__row {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
}

.comp-ans__label {
  font-size: .78rem;
  color: var(--text-3);
}

.comp-ans__text {
  font-weight: 700;
  overflow-wrap: anywhere;
}

.comp-ans__text.is-long {
  font-weight: 500;
  line-height: 1.75;
  white-space: pre-wrap;
}

.comp-ans__key {
  color: var(--ok);
  overflow-wrap: anywhere;
}

.comp-ans__none {
  font-size: .86rem;
  color: var(--text-3);
}

.comp-ans__explain {
  font-size: .86rem;
  color: var(--text-2);
}

.comp-grade {
  font-size: .84rem;
  white-space: nowrap;
}

.comp-grade--ok {
  color: var(--ok);
}

.comp-grade--wrong {
  color: var(--danger);
}

.comp-grade--pending {
  color: var(--warn);
}

.comp-grade__tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--line-2);
}

.comp-grade__right {
  color: var(--ok);
}

.comp-grade__wrong {
  color: var(--danger);
}

.comp-grade__partial {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.comp-grade__partial .input {
  width: 92px;
  min-height: 40px;
}

/* ---------- review ---------- */

.comp-review {
  display: grid;
  gap: 12px;
}

.comp-rq {
  display: grid;
  gap: 8px;
}

/* ---------- printing codes: an overlay on screen, A4 pages on paper ---------- */

.print-root {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  margin: 0;
  padding: 0;
  overflow: auto;
  border: 0;
  color: #111;
  background: #d9dde3;
}

.print-root::backdrop {
  background: rgb(var(--shade) / calc(.6 * var(--shade-k)));
}

.print-bar {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  color: var(--text);
  background: var(--navy-900);
}

.print-bar__text {
  font-size: .86rem;
}

.print-pages {
  display: grid;
  justify-items: center;
  gap: 16px;
  padding: 16px 8px 40px;
}

.print-page {
  box-sizing: border-box;
  width: 210mm;
  max-width: 100%;
  min-height: 297mm;
  padding: 10mm;
  background: #fff;
  box-shadow: 0 10px 30px -10px rgb(var(--shade) / calc(.4 * var(--shade-k)));
}

.print-page--cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(5, 1fr);
  gap: 4mm;
}

.print-card {
  display: grid;
  grid-template-rows: auto auto auto 1fr auto;
  gap: 1mm;
  padding: 3mm 4mm;
  border: 1px dashed #999;
  border-radius: 3mm;
  overflow: hidden;
  break-inside: avoid;
}

.print-card__top {
  display: flex;
  align-items: center;
  gap: 2mm;
}

.print-card__logo {
  width: 9mm;
  height: 9mm;
  object-fit: contain;
}

.print-card__org {
  font-size: 8pt;
  font-weight: 700;
  color: #444;
}

.print-card__name {
  font-size: 12pt;
  font-weight: 800;
  line-height: 1.3;
}

.print-card__group {
  font-size: 9pt;
  color: #555;
}

.print-card__code {
  align-self: center;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 17pt;
  font-weight: 800;
  letter-spacing: .06em;
  text-align: center;
}

.print-card__foot {
  display: flex;
  align-items: center;
  gap: 2mm;
}

.print-card__qr {
  width: 15mm;
  height: 15mm;
  image-rendering: pixelated;
}

.print-card__how {
  font-size: 7pt;
  line-height: 1.35;
  color: #444;
}

.print-list__title {
  margin-bottom: 4mm;
  font-size: 14pt;
}

.print-list {
  width: 100%;
  border-collapse: collapse;
  font-size: 10pt;
}

.print-list th,
.print-list td {
  padding: 1.6mm 2mm;
  border-bottom: 1px solid #ccc;
  text-align: start;
}

.print-list__code {
  font-family: ui-monospace, Consolas, monospace;
  font-weight: 700;
}

@media print {
  @page {
    size: A4;
    margin: 0;
  }
  html.is-printing body > :not(.print-root) {
    display: none !important;
  }
  html.is-printing body {
    background: #fff;
  }
  .print-root {
    position: static;
    overflow: visible;
    background: #fff;
  }
  .print-root::backdrop {
    display: none;
  }
  .print-bar {
    display: none;
  }
  .print-pages {
    display: block;
    padding: 0;
  }
  .print-page {
    width: 210mm;
    height: 297mm;
    min-height: 0;
    box-shadow: none;
    break-after: page;
  }
}

  /* a list whose newer answer is on its way (A.latest): a light fade, instant */
