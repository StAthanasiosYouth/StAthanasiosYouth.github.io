  .book-row__ref { font-weight: 800; font-size: .86rem; color: var(--gold-hi); unicode-bidi: isolate; }
  .book-flags { display: grid; gap: .3rem; margin: 0; padding: .6rem 1rem; padding-inline-start: 1.6rem; border-radius: var(--radius-sm); color: var(--warn); background: var(--warn-bg); font-size: .9rem; }
  .book-money { margin-block: .2rem; }
  .book-facts-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .5rem 1rem; margin: 0; }
  .book-fact { display: grid; gap: 1px; min-width: 0; }
  .book-fact dt { font-size: .76rem; color: var(--text-3); }
  .book-fact dd { margin: 0; overflow-wrap: anywhere; }
  .book-proofs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .book-proof { position: relative; display: grid; place-items: center; aspect-ratio: 3 / 4; padding: 0; overflow: hidden; border: 0; border-radius: var(--radius-sm); color: inherit; background: rgb(var(--tint) / .04); box-shadow: inset 0 0 0 1px var(--line-2); cursor: zoom-in; }
  .book-proof img { width: 100%; height: 100%; object-fit: cover; }
  .book-proof .chip { position: absolute; inset-block-end: 6px; inset-inline-start: 6px; }
  .book-proof__full { display: block; max-width: 100%; max-height: 70dvh; margin-inline: auto; border-radius: var(--radius-sm); }
  .book-pays { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .book-pay { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: rgb(var(--tint) / .028); box-shadow: inset 0 0 0 1px rgb(var(--tint) / .06); }
  .book-pay__main { display: grid; gap: 2px; min-width: 0; }
  .book-pay__amount { font-weight: 800; color: var(--text); }
  .book-pay.is-refund .book-pay__amount { color: var(--danger); }
  .book-pay__what, .book-pay__when { font-size: .82rem; color: var(--text-2); }
  .book-pay__when { color: var(--text-3); }
  .book-pay__note { font-size: .84rem; }
  .book-pay.is-void .book-pay__amount, .book-pay.is-void .book-pay__what { text-decoration: line-through; color: var(--text-3); }
  .book-pay__void { font-size: .82rem; color: var(--danger); }
  .book-history { display: grid; gap: .25rem; margin: 0; padding-inline-start: 1.2rem; font-size: .88rem; color: var(--text-2); }
  .book-warn { display: grid; gap: .6rem; padding: .9rem 1rem; border-radius: var(--radius-sm); background: var(--warn-bg); box-shadow: inset 0 0 0 1px rgb(var(--warn-rgb) / .3); }
  .book-warn__title { margin: 0; font-weight: 800; color: var(--warn); }
  .book-counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .5rem; }
  .book-count { display: grid; gap: .25rem; font-size: .88rem; color: var(--text-2); }
  .book-uploads { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; }
  .book-upload { display: inline-flex; align-items: center; gap: .4rem; padding: 4px; padding-inline-end: 8px; border-radius: 12px; background: rgb(var(--tint) / .04); font-size: .82rem; }
  .book-upload img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .book-upload.is-error { color: var(--danger); }
  .book-servants .comp-rank__row { grid-template-columns: minmax(0, 1.6fr) repeat(6, minmax(0, 1fr)); cursor: default; align-items: center; }
  .book-servants .comp-rank__row > span:first-child { display: grid; min-width: 0; }
  .book-servants small { font-size: .74rem; color: var(--text-3); }
  @media (max-width: 480px) {
    .book-servants .comp-rank__row { grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, auto)); }
    /* phone: the name, «في عهدته» and «لسه معاه»; the rest is in the per-method lines */
    .book-servants .comp-rank__row > :nth-child(2), .book-servants .comp-rank__row > :nth-child(4), .book-servants .comp-rank__row > :nth-child(5), .book-servants .comp-rank__row > :nth-child(6) { display: none; }
    .book-pay { align-items: flex-start; }
  }

  /* «الحسابات المالية للخدام»: filters, summary stats, a card per servant, methods, logs */
  .fin { display: grid; gap: 22px; margin-top: 8px; }
  .fin-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .fin-exports { display: grid; gap: 6px; padding: 12px 14px; border-radius: 16px; background: rgb(var(--tint) / .03); box-shadow: inset 0 0 0 1px var(--line-2); }
  .fin-exports .actions { margin: 0; flex-wrap: wrap; }
  .fin-hint { margin: 0; font-size: .95rem; line-height: 1.7; color: var(--text-2); }
  .fin-section { display: grid; gap: 12px; }
  .fin-h { margin: 0; font-size: 1.12rem; font-weight: 800; color: var(--gold-hi); }
  .fin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .fin-stat { display: grid; gap: 4px; align-content: start; padding: 12px 14px; border-radius: 14px; background: rgb(var(--tint) / .03); box-shadow: inset 0 0 0 1px var(--line-2); min-width: 0; }
  .fin-stat__label { font-size: .95rem; color: var(--text-2); }
  .fin-stat__value { font-size: 1.35rem; font-weight: 800; line-height: 1.3; color: var(--text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .fin-stat__hint { font-size: .85rem; color: var(--text-3); line-height: 1.5; }
  .fin-stats--main .fin-stat__value { font-size: 1.6rem; }
  .fin-stat--gold .fin-stat__value { color: var(--gold-hi); }
  .fin-stat--warn { box-shadow: inset 0 0 0 1px var(--gold); }
  .fin-stat--warn .fin-stat__value { color: var(--gold-hi); }
  .fin-stat--danger { box-shadow: inset 0 0 0 1px var(--danger); }
  .fin-stat--danger .fin-stat__value { color: var(--danger); }
  .fin-events { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .fin-event { display: grid; gap: 6px; text-align: start; padding: 12px 14px; border: 0; border-radius: 14px; background: rgb(var(--tint) / .03); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); font: inherit; cursor: pointer; }
  .fin-event:hover { box-shadow: inset 0 0 0 1px var(--gold); }
  .fin-event__title { font-weight: 800; font-size: 1.02rem; }
  .fin-event__nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .95rem; color: var(--text-2); }
  .fin-cards { display: grid; gap: 14px; }
  .fin-card { display: grid; gap: 14px; padding: 16px; border-radius: 18px; background: rgb(var(--tint) / .025); box-shadow: inset 0 0 0 1px var(--line-2); }
  .fin-card__head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; }
  .fin-card__who { display: grid; gap: 2px; min-width: 0; }
  .fin-card__name { font-size: 1.2rem; font-weight: 800; }
  .fin-card__meta { font-size: .92rem; color: var(--text-2); }
  .fin-card__due { display: grid; justify-items: end; gap: 0; }
  .fin-card__due-label { font-size: .9rem; color: var(--text-2); }
  .fin-card__due-value { font-size: 1.5rem; font-weight: 800; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
  .fin-stats--card { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .fin-stats--card .fin-stat__value { font-size: 1.15rem; }
  .fin-methods > summary { cursor: pointer; font-weight: 700; font-size: 1rem; padding: 6px 0; }
  .fin-method-list { display: grid; gap: 10px; margin-top: 8px; }
  .fin-method { display: grid; gap: 10px; padding: 12px 14px; border-radius: 14px; background: rgb(var(--nv-2-9-20) / .45); box-shadow: inset 0 0 0 1px var(--line-2); }
  .fin-method__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .fin-method__name { font-size: 1.08rem; }
  .fin-method__due { font-weight: 700; color: var(--gold-hi); }
  .fin-method__nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; margin: 0; }
  .fin-method__nums > div { display: grid; gap: 2px; }
  .fin-method__nums dt { font-size: .88rem; color: var(--text-2); }
  .fin-method__nums dd { margin: 0; font-weight: 700; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .fin-method__warn dd { color: var(--danger); }
  .fin-method > .btn { justify-self: start; }
  .fin-refs:empty { display: none; }
  .fin-refs__list, .fin-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .fin-refs__list > li { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: rgb(var(--tint) / .03); }
  .fin-refs__top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .fin-refs__nums { font-size: .95rem; }
  .fin-refs__pays { font-size: .9rem; color: var(--text-2); }
  .fin-log__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'main act' 'meta act'; align-items: center; gap: 4px 12px; padding: 12px 14px; border-radius: 14px; background: rgb(var(--tint) / .03); box-shadow: inset 0 0 0 1px var(--line-2); }
  .fin-log__main { grid-area: main; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: 1rem; }
  .fin-log__meta { grid-area: meta; font-size: .9rem; color: var(--text-2); }
  .fin-log__row > .btn, .fin-log__row > .chip, .fin-log__row > .fin-hint { grid-area: act; }
  .fin-log__row.is-void { opacity: .6; }
  .fin-avail { margin: 0; font-size: 1.02rem; }
  .fin-avail strong { color: var(--gold-hi); font-size: 1.15rem; }
  .fin-problem { margin: 0; color: var(--danger); font-weight: 700; }
  .fin-problem[hidden] { display: none; }
  @media (max-width: 560px) {
    .fin-filters { grid-template-columns: 1fr; }
    .fin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fin-stats--main .fin-stat__value { font-size: 1.3rem; }
    .fin-card { padding: 14px 12px; }
    .fin-card__head { grid-template-columns: minmax(0, 1fr) auto; }
    .fin-card__head > .btn { grid-column: 1 / -1; justify-self: stretch; }
    .fin-method__nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fin-log__row { grid-template-columns: 1fr; grid-template-areas: 'main' 'meta' 'act'; }
    .fin-log__row > .btn { justify-self: start; }
  }

/* ---------- Phase 8 A1: «المظهر» (AdminScript A.lookCard) ---------- */

.look__row {
  display: grid;
  gap: 8px;
  padding-block: 10px;
  border-top: 1px solid var(--line-2);
}

.look__row:first-of-type {
  border-top: 0;
}

.look__label {
  font-weight: 800;
  color: var(--text);
}

.look__note {
  margin-top: -2px;
  font-size: .84rem;
  color: var(--text-3);
}

.look__row--sound {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}

/* each accent's swatch, in the colours it takes in this mode */
.swatch--acc-gold { --swatch: linear-gradient(135deg, #f2d28b, #d7aa50); }
.swatch--acc-sea { --swatch: linear-gradient(135deg, #82dfe5, #4cc3cb); }
.swatch--acc-carmine { --swatch: linear-gradient(135deg, #f4a7a1, #e0736b); }
.swatch--acc-azure { --swatch: linear-gradient(135deg, #abcdff, #7fb4ff); }
.swatch--acc-emerald { --swatch: linear-gradient(135deg, #90e8c1, #5ad7a0); }
.swatch--acc-violet { --swatch: linear-gradient(135deg, #cebfff, #b39cff); }

html[data-mode="light"] .swatch--acc-gold { --swatch: linear-gradient(135deg, #c99a3e, #7d5510); }
html[data-mode="light"] .swatch--acc-sea { --swatch: linear-gradient(135deg, #0b7880, #0a6a71); }
html[data-mode="light"] .swatch--acc-carmine { --swatch: linear-gradient(135deg, #b3362e, #9b2b24); }
html[data-mode="light"] .swatch--acc-azure { --swatch: linear-gradient(135deg, #2557ae, #1f4b97); }
html[data-mode="light"] .swatch--acc-emerald { --swatch: linear-gradient(135deg, #0f7049, #0d6442); }
html[data-mode="light"] .swatch--acc-violet { --swatch: linear-gradient(135deg, #6040c2, #5534ad); }


/* =========================================================
   Phase 8 A2: THE SHELL (AdminScript «SHELL»)
========================================================= */

/* ---------- the rail: groups, one gliding light, collapse ---------- */

.rail__nav {
  position: relative;
}

.rail__group {
  margin: 14px 10px 2px;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .02em;
  white-space: nowrap;
  color: var(--text-3);
  transition: opacity .2s;
}

.rail__group:first-of-type {
  margin-top: 0;
}

/* the light under the current area: one element that glides (A2), instead of each link lighting itself */
.rail__light {
  position: absolute;
  inset-inline: 0;
  top: 0;
  z-index: 0;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(270deg, rgb(var(--acc-rgb) / .15), rgb(var(--acc-rgb) / .02));
  opacity: 0;
  pointer-events: none;
  transition: transform .45s var(--spring), height .3s var(--ease), opacity .2s;
}

.rail__light::before {
  content: "";
  position: absolute;
  inset-inline-start: -14px;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--gold);
  box-shadow: 0 0 14px 1px rgb(var(--acc-rgb) / .7);
}

.rail__light.is-on {
  opacity: 1;
}

.rail__light.is-instant {
  transition: none;
}

.rail__nav .navlink {
  z-index: 1;
}

.rail__nav .navlink[aria-current="page"] {
  background: none;
}

.rail__nav .navlink[aria-current="page"]::before {
  display: none;
}

.navlink--out {
  color: var(--danger);
}

.navlink--out .navlink__icon {
  color: var(--danger);
  background: var(--danger-bg);
}

.navlink--out:hover {
  color: var(--danger);
  background: var(--danger-bg);
}

.rail__user .acct__av {
  width: 26px;
  height: 26px;
  font-size: .8rem;
}

@media (min-width: 1024px) {

  .app {
    transition: grid-template-columns .35s var(--ease);
  }

  html[data-rail="closed"] .app {
    grid-template-columns: 84px minmax(0, 1fr);
  }

  html[data-rail="closed"] .rail {
    padding-inline: 10px;
  }

  html[data-rail="closed"] .brand__text,
  html[data-rail="closed"] .rail .navlink__label,
  html[data-rail="closed"] .rail__group,
  html[data-rail="closed"] .rail__user > span:not(.acct__av) {
    display: none;
  }

  html[data-rail="closed"] .rail .navlink {
    justify-content: center;
    padding-inline: 0;
  }

  html[data-rail="closed"] .rail .nav-badge {
    position: absolute;
    top: 4px;
    inset-inline-end: 6px;
  }

  html[data-rail="closed"] .rail__user {
    justify-content: center;
    padding-inline: 0;
  }

  html[data-rail="closed"] .brand {
    justify-content: center;
  }

}

/* ---------- the top bar's own buttons ---------- */

.topbar {
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "mark title tools acct"
    "mark status publish publish";
}

.topbar__tools {
  grid-area: tools;
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn.topbar__search,
.icon-btn.topbar__bell {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--text-2);
  background: none;
  cursor: pointer;
}

.icon-btn.topbar__search:hover,
.icon-btn.topbar__bell:hover,
.icon-btn.topbar__bell[aria-expanded="true"] {
  color: var(--text);
  background: rgb(var(--tint) / .06);
}

.topbar__search-text,
.topbar__search .kbd {
  display: none;
}

.kbd {
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  font: 600 .7rem / 1.5 ui-monospace, Consolas, monospace;
  direction: ltr;
  color: var(--text-3);
}

.topbar__dot {
  position: absolute;
  top: 2px;
  inset-inline-end: 0;
  display: grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  font-size: .64rem;
  font-weight: 800;
  color: #fff;
  background: rgb(var(--danger-solid-rgb));
  box-shadow: 0 0 0 2px var(--bg);
}

.topbar__dot[hidden] {
  display: none;
}

.acct {
  grid-area: acct;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 42px;
  padding: 0 4px;
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--text);
  background: none;
  cursor: pointer;
}

.acct:hover,
.acct[aria-expanded="true"] {
  border-color: var(--line-strong);
}

.acct__name {
  display: none;
  max-width: 9em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
}

.acct__av {
  display: grid;
  place-items: center;
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-weight: 800;
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--line-strong);
}

.acct__av--lg {
  width: 42px;
  height: 42px;
  font-size: 1.1rem;
}

.topbar .btn--publish {
  grid-area: publish;
  justify-self: end;
}

@media (min-width: 1024px) {

  .topbar {
    grid-template-columns: minmax(0, 1fr) auto auto auto auto auto;
    grid-template-areas: "title uploads status tools publish acct";
  }

  .icon-btn.topbar__search {
    display: inline-flex;
    gap: 10px;
    width: clamp(200px, 20vw, 300px);
    padding: 0 12px;
    border-color: var(--line-2);
    background: rgb(var(--tint) / .03);
    color: var(--text-3);
  }

  .topbar__search-text {
    display: block;
    flex: 1;
    text-align: start;
    font-size: .86rem;
  }

  .topbar__search .kbd {
    display: inline-block;
  }

  .acct {
    padding-inline: 4px 12px;
    border-color: var(--line-2);
  }

  .acct__name {
    display: block;
  }

}

/* ---------- menus (account, «اللي مستنيك») ---------- */

.menu {
  position: fixed;
  inset: auto;
  margin: 0;
  width: min(300px, calc(100vw - 16px));
  max-height: min(70dvh, 520px);
  overflow: auto;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: var(--navy-900);
  box-shadow: 0 30px 70px -24px rgb(var(--shade) / calc(.8 * var(--shade-k)));
}

.menu:popover-open {
  display: grid;
  gap: 2px;
  animation: menu-in .28s var(--spring) both;
}

@keyframes menu-in {
  from { opacity: 0; transform: translateY(-6px) scale(.98); }
}

.menu__me {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 8px 12px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--line-2);
}

.menu__who {
  display: grid;
  min-width: 0;
}

.menu__who b,
.menu__who small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.menu__who small {
  font-size: .76rem;
  color: var(--text-3);
}

.menu__title {
  padding: 8px 10px 6px;
  font-weight: 800;
}

.menu__item {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 6px 10px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-weight: 700;
  text-align: start;
  text-decoration: none;
  color: var(--text-2);
  background: none;
  cursor: pointer;
}

.menu__item:hover,
.menu__item:focus-visible {
  color: var(--text);
  background: rgb(var(--tint) / .06);
}

.menu__item > span {
  flex: 1;
  display: grid;
  min-width: 0;
}

.menu__item small {
  font-size: .76rem;
  font-weight: 600;
  color: var(--text-3);
}

.menu__item .icon {
  width: 20px;
  height: 20px;
  flex: none;
}

.menu__item--danger {
  color: var(--danger);
}

.menu__item--danger:hover {
  color: var(--danger);
  background: var(--danger-bg);
}

.menu__sep {
  height: 1px;
  margin: 4px 6px;
  background: var(--line-2);
}

.menu__empty {
  padding: 14px 10px;
  color: var(--text-3);
  text-align: center;
}

/* ---------- the palette (Ctrl K) ---------- */

.palette {
  width: min(620px, calc(100vw - 24px));
  max-height: min(70dvh, 560px);
  margin: 10vh auto auto;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--text);
  background: var(--navy-900);
  box-shadow: 0 40px 90px -30px rgb(var(--shade) / calc(.9 * var(--shade-k)));
}

.palette[open] {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  animation: menu-in .32s var(--spring) both;
}

.palette::backdrop {
  background: rgb(var(--nv-2-8-18) / .55);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.palette__in {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-2);
}

.palette__q {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: 1rem;
  color: var(--text);
  background: none;
}

.palette__list {
  overflow: auto;
  padding: 6px;
}

.palette__group {
  padding: 10px 10px 4px;
  font-size: .72rem;
  font-weight: 800;
  color: var(--text-3);
}

.palette__item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 44px;
  padding: 6px 10px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-weight: 700;
  text-align: start;
  color: var(--text-2);
  background: none;
  cursor: pointer;
}

.palette__item > span {
  flex: 1;
}

.palette__item small {
  font-size: .76rem;
  color: var(--text-3);
}

.palette__item[aria-selected="true"],
.palette__item:hover {
  color: var(--text);
  background: rgb(var(--acc-rgb) / .14);
}

.palette__item--danger {
  color: var(--danger);
}

/* ---------- «المزيد» (phones) ---------- */

.dockbtn--more .icon {
  transform: rotate(90deg);
}

.more {
  display: grid;
  gap: 16px;
}

.more__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 10px;
}

.more__item {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 6px;
  min-height: 84px;
  padding: 12px 8px;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  font: inherit;
  font-weight: 700;
  color: var(--text-2);
  background: rgb(var(--tint) / .03);
  cursor: pointer;
}

.more__item[aria-current="page"] {
  color: var(--gold-hi);
  border-color: var(--line-strong);
}

.more__icon {
  position: relative;
}

.more__icon .icon {
  width: 26px;
  height: 26px;
}

.more__badge {
  position: absolute;
  top: -6px;
  inset-inline-end: -10px;
}

.more__me {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 14px;
  background: rgb(var(--tint) / .03);
}

.more__out {
  width: 100%;
}

/* ---------- the welcome inside the shell (after signing in) ---------- */

.welcome {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 10px;
  text-align: center;
  background: var(--bg);
  pointer-events: none;
  animation: welcome-in .3s ease both;
}

@media (min-width: 1024px) {
  .welcome {
    inset-inline-start: auto;
    width: calc(100% - var(--rail-w, 268px));
  }

  html[data-rail="closed"] .welcome {
    --rail-w: 84px;
  }
}

.welcome__glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(40% 36% at 50% 42%, rgb(var(--acc-rgb) / .16), transparent 72%);
  pointer-events: none;
}

.welcome__logo {
  position: relative;
  width: 112px;
  height: 112px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px var(--line-strong), 0 0 60px -18px rgb(var(--acc-rgb) / .9);
  animation: welcome-logo .8s var(--ease) both;
}

.welcome__title {
  position: relative;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--gold-hi);
  animation: welcome-rise .6s .2s var(--ease) both;
}

.welcome__hello {
  position: relative;
  min-height: 1.7em;
  color: var(--text-2);
  animation: welcome-rise .6s .32s var(--ease) both;
}

.welcome.is-ready .welcome__hello {
  color: var(--text);
  font-weight: 700;
}

.welcome__line {
  position: relative;
  width: 140px;
  height: 3px;
  margin-top: 6px;
  overflow: hidden;
  border-radius: 3px;
  background: rgb(var(--tint) / .08);
}

.welcome__line i {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--gold);
  transform-origin: right;
  animation: welcome-line 1.1s var(--ease) both;
}

.welcome.is-leaving {
  animation: welcome-out .5s var(--ease) forwards;
  pointer-events: none;
}

@keyframes welcome-in { from { opacity: 0; } }
@keyframes welcome-logo { from { opacity: 0; transform: scale(.9); filter: blur(8px); } }
@keyframes welcome-rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes welcome-line { from { transform: scaleX(0); } }
@keyframes welcome-out { to { opacity: 0; transform: scale(1.02); } }

@media (prefers-reduced-motion: reduce) {
  .welcome { display: none; }
  .rail__light, .app { transition: none; }
}


/* =========================================================
   Phase 8 A3 (actions and feedback) + A5 (the form layer and its controls)
========================================================= */

/* ---------- a press leaves a ripple ---------- */

.btn,
.navlink,
.dockbtn,
.menu__item,
.palette__item,
.icon-btn,
.tab,
.more__item,
.acct,
.choice,
.swatch {
  position: relative;
  overflow: hidden;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: .16;
  transform: scale(0);
  pointer-events: none;
  animation: ripple .6s var(--ease) forwards;
}

@keyframes ripple {
  to { transform: scale(1); opacity: 0; }
}

/* ---------- a busy action ends on its button: saved, or failed ---------- */

.btn.is-done {
  animation: btn-done .9s var(--ease);
}

.btn.is-done::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ok);
  -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12.5l4.5 4.5L19 7.5'/%3E%3C/svg%3E") center / contain no-repeat;
  mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12.5l4.5 4.5L19 7.5'/%3E%3C/svg%3E") center / contain no-repeat;
  animation: btn-check .9s var(--ease) both;
  pointer-events: none;
}

.btn--primary.is-done::after {
  background: var(--gold-ink);
}

@keyframes btn-done {
  30% { box-shadow: 0 0 0 4px rgb(var(--ok-rgb) / .28); }
}

@keyframes btn-check {
  0% { opacity: 0; transform: scale(.5); }
  25% { opacity: 1; transform: scale(1.1); }
  70% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}

.btn.is-failed {
  animation: btn-shake .45s var(--ease);
  border-color: var(--danger);
}

@keyframes btn-shake {
  20%, 60% { transform: translateX(-5px); }
  40%, 80% { transform: translateX(5px); }
}

/* ---------- typed confirmation ---------- */

.modal__typed-field {
  margin-top: 4px;
}

.modal__typed {
  text-align: center;
  font-weight: 800;
}

/* ---------- the save bar: what needs fixing, and the way between them ---------- */

.fix-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  width: 100%;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--danger);
  background: var(--danger-bg);
}

.fix-nav .icon {
  width: 18px;
  height: 18px;
}

.fix-nav__count {
  flex: 1;
  font-weight: 800;
}

/* a field brought into view clears the top bar, the dock and the keyboard's room */
.field {
  scroll-margin-top: 96px;
  scroll-margin-bottom: calc(var(--dock-h) + 120px);
}

/* ---------- controls ---------- */

/* checkboxes read as toggle rows: the words, then the switch */
.check--toggle {
  position: relative;
  align-items: center;
  justify-content: space-between;
}

.check--toggle > span:first-child {
  flex: 1;
}

.check--toggle input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  margin: 0;
}

.check--toggle input:checked + .switch__track {
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
}

.check--toggle input:checked + .switch__track::after {
  transform: translateX(-20px);
}

.check--toggle input:focus-visible + .switch__track {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.check--toggle:has(input:disabled) {
  opacity: .55;
  cursor: not-allowed;
}

/* dropdowns in the panel's own look where the browser can (Chrome: base-select); the native one elsewhere */
@supports (appearance: base-select) {
  select.input {
    appearance: base-select;
    background-image: none;
    padding-left: 14px;
  }

  select.input::picker-icon {
    color: var(--gold-hi);
  }

  select.input::picker(select) {
    appearance: base-select;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    background: var(--navy-900);
    box-shadow: 0 24px 60px -24px rgb(var(--shade) / calc(.8 * var(--shade-k)));
  }

  select.input option {
    min-height: 40px;
    padding: 8px 10px;
    border-radius: 10px;
  }

  select.input option:hover,
  select.input option:focus-visible {
    background: rgb(var(--acc-rgb) / .14);
  }

  select.input option:checked {
    color: var(--gold-hi);
    font-weight: 800;
  }

  select.input option::checkmark {
    color: var(--gold);
  }
}

/* date and time fields follow the theme */
html[data-mode="light"] input[type="date"].input,
html[data-mode="light"] input[type="time"].input,
html[data-mode="light"] input[type="datetime-local"].input {
  color-scheme: light;
}

input[type="date"].input::-webkit-calendar-picker-indicator,
input[type="time"].input::-webkit-calendar-picker-indicator,
input[type="datetime-local"].input::-webkit-calendar-picker-indicator {
  opacity: .75;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .ripple, .btn.is-done, .btn.is-failed { animation: none; }
  .btn.is-done::after { animation: none; opacity: 0; }
}


/* ---------- Phase 8 A6: presence as avatars in the top bar ---------- */

.pstack {
  display: inline-flex;
  align-items: center;
  height: 42px;
  padding: 0 4px 0 10px;
  border: 0;
  border-radius: 12px;
  background: none;
  cursor: pointer;
}

.pstack[hidden] {
  display: none;
}

.pstack .pav {
  margin-inline-start: -8px;
}

.pstack .pav:first-child {
  margin-inline-start: 0;
}

.pav {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: .82rem;
  font-weight: 800;
  color: var(--text);
  background: var(--navy-700);
  box-shadow: 0 0 0 2px var(--bg);
}

.pav::after {
  content: "";
  position: absolute;
  bottom: -1px;
  inset-inline-end: -1px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-3);
  box-shadow: 0 0 0 2px var(--bg);
}

.pav--online::after { background: var(--ok); }
.pav--idle::after { background: var(--warn); }
.pav--editing::after { background: var(--gold); }

.pav--editing {
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgb(var(--acc-rgb) / .55);
}

.pav--more {
  font-size: .7rem;
  color: var(--text-2);
}

.pav--more::after {
  display: none;
}

.menu__person {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 6px 10px;
  border-radius: 10px;
}

.menu__note {
  padding: 8px 10px 4px;
  font-size: .76rem;
  color: var(--text-3);
}

/* phones: the avatars stand for the strip (a tap opens the list) */
@media (max-width: 1023px) {
  .presence {
    display: none !important;
  }
}


/* ---------- Phase 8 A6: youth accounts as cards ---------- */

.ycards {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}

@media (min-width: 760px) {
  .ycards {
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  }
}

.ycards > .note,
.ycards > .btn {
  grid-column: 1 / -1;
}

.ycard {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line-2);
  border-radius: 18px;
  background: linear-gradient(180deg, rgb(var(--nv-16-44-80) / .45), rgb(var(--nv-7-24-46) / .5));
  transition: border-color .2s, transform .35s var(--spring), box-shadow .2s;
}

.ycard:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}

.ycard.is-blocked {
  opacity: .78;
}

/* the whole card opens the account; the copy buttons sit above it */
.ycard__open {
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 0;
  border-radius: inherit;
  background: none;
  cursor: pointer;
}

.ycard__open:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.ycard__face {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 56px;
  height: 64px;
  overflow: hidden;
  border-radius: 999px 999px 12px 12px;
  background: linear-gradient(180deg, var(--navy-700), var(--navy-900));
  box-shadow: inset 0 0 0 1px var(--line-strong);
}

.ycard__letter {
  font-family: "Aref Ruqaa", "Cairo", serif;
  font-size: 1.7rem;
  line-height: 1;
  color: var(--gold-hi);
}

.ycard__photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .3s;
}

.ycard__face.has-photo .ycard__photo {
  opacity: 1;
}

.ycard__main {
  display: grid;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.ycard__name {
  font-weight: 800;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.ycard__copy {
  position: relative;
  z-index: 2;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  min-height: 32px;
  padding: 2px 8px;
  margin-inline-start: -8px;
  border: 0;
  border-radius: 8px;
  font: inherit;
  font-size: .88rem;
  color: var(--text-2);
  background: none;
  cursor: copy;
}

.ycard__copy bdi {
  overflow-wrap: anywhere;
  text-align: left;
}

.ycard__copy .icon {
  width: 15px;
  height: 15px;
  flex: none;
  opacity: .55;
}

.ycard__copy:hover {
  color: var(--text);
  background: rgb(var(--tint) / .06);
}

.ycard__phone {
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}

.ycard__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.ycard__go {
  align-self: center;
  color: var(--text-3);
}

.ycard__go .icon {
  width: 18px;
  height: 18px;
  transform: rotate(90deg);
}


/* ---------- Phase 8 A2 (§22.1 item 4): the family's logo as the mark ---------- */

.brand__mark--logo {
  overflow: hidden;
  border-radius: 50%;
  background: none;
  box-shadow: 0 0 0 1px var(--line-strong), 0 0 22px -6px rgb(var(--acc-rgb) / .6);
}

.brand__mark--logo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}


/* ---------- Phase 8 A6: «إدارة السجل» ---------- */

.logm__stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.logm__stats > div {
  display: grid;
  padding: 10px 12px;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  background: rgb(var(--tint) / .03);
}

.logm__stats small {
  font-size: .76rem;
  color: var(--text-3);
}

.logm__stats b {
  font-size: 1.15rem;
  font-variant-numeric: tabular-nums;
}

.logm__count {
  padding: 10px 12px;
  border-radius: 12px;
  font-weight: 700;
  background: rgb(var(--acc-rgb) / .08);
}

.logm__h {
  margin-top: 6px;
  font-size: 1rem;
}

.logm__archives {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.logm__archive {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line-2);
  border-radius: 12px;
}

.logm__archive > span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: .86rem;
}


/* ---------- Phase 8 A7: the games corner, locked «قريبًا» ---------- */

.nav-soon,
.soon-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 1px 8px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
  font-size: .7rem;
  font-weight: 800;
  color: var(--text-3);
}

.soon-chip {
  justify-self: start;
  padding: 4px 12px;
  font-size: .84rem;
  color: var(--gold-hi);
}

.soon-chip .icon {
  width: 16px;
  height: 16px;
}

.coming {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

@media (min-width: 760px) {
  .coming {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.coming__game {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  background: rgb(var(--tint) / .03);
  opacity: .88;
}

.coming__icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: var(--gold-hi);
  background: rgb(var(--acc-rgb) / .12);
}

.coming__text {
  display: grid;
  flex: 1;
  min-width: 0;
}

.coming__text small {
  color: var(--text-3);
  font-size: .82rem;
  line-height: 1.6;
}

html[data-rail="closed"] .nav-soon {
  display: none;
}


/* =========================================================
   Phase 8: THE APPROVED PREVIEW'S LOOK on the real panel
   (docs/phase8/admin-preview.src.html, v3). Flat, solid surfaces with fine lines,
   the accent only where it means something, Ruqaa for the greeting and the brand.
   Last in the file on purpose: it is the panel's look; the rules above keep layout.
========================================================= */

:root {
  --p-surface: #071a33;
  --p-surface-2: #0a2140;
  --p-raised: #0d2849;
  --p-hover: rgb(255 255 255 / .045);
  --p-line: rgb(242 210 139 / .13);
  --p-line-2: rgb(255 255 255 / .07);
  --p-line-3: rgb(255 255 255 / .13);
  --p-shadow: inset 0 1px 0 rgb(255 255 255 / .035), 0 14px 34px -18px rgb(0 0 0 / .7);
  --p-shadow-lg: 0 30px 70px -24px rgb(0 0 0 / .8);
  --p-acc-soft: rgb(var(--acc-rgb) / .14);
  --p-acc-line: rgb(var(--acc-rgb) / .42);
  --p-r-lg: 20px;
  --p-r: 14px;
  --p-r-sm: 10px;
  --p-pad: 20px;
  --p-gap: 16px;
  --f-display: "Aref Ruqaa", "Cairo", "Times New Roman", serif;
}

html[data-mode="light"] {
  --p-surface: #ffffff;
  --p-surface-2: #f5f7fb;
  --p-raised: #ffffff;
  --p-hover: rgb(11 42 76 / .05);
  --p-line: rgb(11 42 76 / .12);
  --p-line-2: rgb(11 42 76 / .08);
  --p-line-3: rgb(11 42 76 / .17);
  --p-shadow: 0 1px 2px rgb(10 26 48 / .06), 0 10px 26px -16px rgb(10 26 48 / .22);
  --p-shadow-lg: 0 30px 70px -24px rgb(10 26 48 / .38);
  --p-acc-soft: rgb(var(--acc-rgb) / .13);
  --p-acc-line: rgb(var(--acc-rgb) / .45);
}

html[data-density="compact"] {
  --p-pad: 14px;
  --p-gap: 10px;
}

body {
  background:
    radial-gradient(60% 40% at 85% 0%, rgb(var(--acc-rgb) / .08), transparent 70%),
    radial-gradient(50% 40% at 0% 100%, rgb(76 195 203 / .04), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}

/* ---------- the rail ---------- */

@media (min-width: 1024px) {
  .rail {
    padding: 18px 14px 14px;
    background: color-mix(in srgb, var(--bg-2) 82%, transparent);
    border-inline-end: 1px solid var(--p-line-2);
  }
}

.brand {
  padding: 0 6px 14px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--p-line-2);
  min-height: 62px;
}

/* owner 2026-11-04: «لوحة التحكم» in plain Cairo, the panel's own type (Ruqaa stays for the greeting) */
.brand__title {
  font-family: "Cairo", system-ui, sans-serif;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--gold-hi);
}

.brand__sub {
  font-size: 12px;
  white-space: nowrap;
}

.rail__nav {
  margin-top: 0;
  gap: 2px;
}

.rail__group {
  margin: 12px 14px 4px;
  font-size: 11px;
}

.navlink {
  min-height: 46px;
  gap: 12px;
  padding: 0 15px;
  border-radius: 13px;
  font-weight: 600;
  color: var(--text-2);
}

.navlink__icon {
  width: auto;
  height: auto;
  border-radius: 0;
  background: none !important;
  box-shadow: none !important;
}

.navlink .icon {
  width: 22px;
  height: 22px;
}

.navlink:hover {
  color: var(--text);
  background: var(--p-hover);
}

.navlink[aria-current="page"] {
  color: var(--gold-hi);
}

.navlink[aria-current="page"] .navlink__icon {
  color: var(--gold-hi);
}

.rail__light {
  height: 46px;
  border-radius: 13px;
  background: var(--p-acc-soft);
  box-shadow: inset 0 0 0 1px var(--p-acc-line);
}

.rail__light::before {
  box-shadow: none;
}

.rail__foot {
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid var(--p-line-2);
}

.rail__foot .navlink[aria-current="page"] {
  background: var(--p-acc-soft);
  box-shadow: inset 0 0 0 1px var(--p-acc-line);
}

.navlink--quiet {
  min-height: 42px;
  font-size: 14px;
}

/* ---------- the top bar ---------- */

.topbar {
  min-height: 68px;
  border-bottom: 1px solid var(--p-line-2);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

.topbar__crumb {
  font-size: 12px;
  color: var(--text-3);
}

.topbar__heading {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.3;
}

@media (min-width: 1024px) {
  .topbar {
    padding: 10px var(--p-pad);
  }

  .topbar__heading {
    font-size: 20px;
  }
}

.icon-btn.topbar__search {
  border-color: var(--p-line-3);
  border-radius: 12px;
  background: var(--p-surface);
}

/* ---------- the content area: the width is used ---------- */

.view {
  gap: var(--p-gap);
}

@media (min-width: 1024px) {
  .view {
    width: min(100%, 1320px);
    padding: var(--p-pad) var(--p-pad) 80px;
  }

  .tabs {
    max-width: min(100% - 2 * var(--p-pad), 1320px - 2 * var(--p-pad));
  }

  .presence {
    width: min(100% - 2 * var(--p-pad), 1280px);
  }
}

/* ---------- cards ---------- */

.card {
  gap: 14px;
  padding: var(--p-pad);
  border: 1px solid var(--p-line-2);
  border-radius: var(--p-r-lg);
  background: var(--p-surface);
  box-shadow: var(--p-shadow);
}

.card::before {
  display: none;
}

.card__title {
  font-size: 16px;
  font-weight: 800;
  text-wrap: balance;
}

.card__hint {
  font-size: 13px;
  color: var(--text-3);
}

/* ---------- buttons ---------- */

.btn {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  background: var(--p-surface-2);
  box-shadow: none;
  transition: transform .4s var(--spring), background-color .2s, border-color .2s, box-shadow .2s;
}

.btn:hover {
  border-color: var(--p-acc-line);
  background: var(--p-surface-2);
}

.btn:active {
  transform: scale(.955);
  transition-duration: .08s;
}

.btn--primary,
.btn--primary:hover {
  border-color: transparent;
  color: var(--gold-ink);
  background: rgb(var(--acc-rgb));
  box-shadow: 0 8px 22px -10px rgb(var(--acc-rgb));
}

.btn--primary:hover {
  filter: brightness(1.06);
}

.btn--ghost {
  background: none;
}

.btn--danger {
  color: var(--danger);
  background: none;
  border-color: color-mix(in srgb, var(--danger) 40%, transparent);
}

.btn--danger:hover {
  color: var(--danger);
  background: var(--danger-bg);
  border-color: var(--danger);
}

.btn--danger-solid,
.btn--danger-solid:hover {
  color: #fff;
  background: rgb(var(--danger-solid-rgb));
  border-color: transparent;
}

.btn--small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
  border-radius: 10px;
}

.btn:disabled {
  opacity: .45;
}

/* ---------- chips ---------- */

.chip {
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--p-surface-2);
  box-shadow: none;
}

.chip--ok { color: var(--ok); background: var(--ok-bg); }
.chip--danger { color: var(--danger); background: var(--danger-bg); }
.chip--info { color: var(--info); background: var(--info-bg); }
.chip--gold { color: var(--gold-hi); background: var(--p-acc-soft); }
.chip--off { color: var(--text-3); background: none; border: 1px dashed var(--p-line-3); }

/* ---------- fields ---------- */

.field__label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
}

.input {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  background: var(--p-surface);
}

textarea.input {
  padding: 10px 14px;
}

.input:hover {
  border-color: var(--p-line-3);
}

.input:focus {
  border-color: rgb(var(--acc-rgb));
  background: var(--p-surface);
  box-shadow: 0 0 0 3px var(--p-acc-soft);
}

/* ---------- sub-tabs: words with one gold line under the current one ---------- */

.tabs {
  gap: 4px;
  width: auto;
  margin: 0 auto;
  padding: 0 var(--p-pad);
  border: 0;
  border-bottom: 1px solid var(--p-line-2);
  border-radius: 0;
  background: none;
}

@media (min-width: 1024px) {
  .tabs {
    margin-top: 0;
  }
}

.tab {
  position: relative;
  min-height: 46px;
  padding: 12px 12px 13px;
  border-radius: 0;
  color: var(--text-3);
  background: none;
  box-shadow: none;
}

.tab:hover {
  color: var(--text);
}

.tab[aria-current="page"] {
  color: var(--text);
  background: none;
  box-shadow: none;
}

.tab[aria-current="page"]::after {
  content: "";
  position: absolute;
  inset-inline: 8px;
  bottom: -1px;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: rgb(var(--acc-rgb));
  animation: tab-in .35s var(--spring);
}

@keyframes tab-in {
  from { transform: scaleX(.3); opacity: 0; }
}

/* ---------- the phones' dock ---------- */

.dock {
  inset-inline: 10px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  border: 1px solid var(--p-line-3);
  border-radius: 22px;
  background: color-mix(in srgb, var(--p-surface) 86%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: var(--p-shadow-lg);
}

.dock::before {
  background: var(--p-acc-soft);
  box-shadow: none;
}

.dockbtn {
  font-size: 11px;
  color: var(--text-3);
}

.dockbtn[aria-current="page"] {
  color: var(--gold-hi);
}

/* ---------- sheets, dialogs, menus, toasts ---------- */

.sheet {
  border: 1px solid var(--p-line-3);
  background: var(--p-surface);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: var(--p-shadow-lg);
}

.sheet__head {
  border-bottom: 1px solid var(--p-line-2);
}

.sheet__title {
  font-size: 18px;
  font-weight: 800;
}

.sheet__foot {
  border-top: 1px solid var(--p-line-2);
  background: var(--p-surface);
}

.modal {
  border: 1px solid var(--p-line-3);
  border-radius: 22px;
  background: var(--p-surface);
  box-shadow: var(--p-shadow-lg);
}

.menu,
.palette {
  border: 1px solid var(--p-line-3);
  background: var(--p-raised);
  box-shadow: var(--p-shadow-lg);
}

.palette__item[aria-selected="true"],
.palette__item:hover {
  background: var(--p-acc-soft);
}

.toast {
  border: 1px solid var(--p-line-3);
  background: var(--p-raised);
  box-shadow: var(--p-shadow-lg);
}

.note {
  border-radius: var(--p-r);
}

/* ---------- the home (the preview's layout) ---------- */

.home {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--p-gap);
  align-items: start;
}

@media (min-width: 1100px) {
  .home {
    grid-template-columns: minmax(0, 1fr) 330px;
  }
}

.home__main,
.home__side {
  display: flex;
  flex-direction: column;
  gap: var(--p-gap);
  min-width: 0;
}

.hello {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 20px;
  padding: 24px var(--p-pad);
  border: 1px solid var(--p-line);
  border-radius: var(--p-r-lg);
  background: radial-gradient(90% 140% at 100% 0%, var(--p-acc-soft), transparent 60%), var(--p-surface);
  box-shadow: var(--p-shadow);
}

.hello > div:first-child {
  flex: 1;
  min-width: 240px;
}

.hello__date {
  font-size: 13px;
  color: var(--text-3);
}

.hello__name {
  margin: 2px 0 4px;
  font-size: 26px;
  font-weight: 800;
  line-height: 1.35;
  text-wrap: balance;
}

.hello__name em {
  font-style: normal;
  font-family: var(--f-display);
  font-size: 1.12em;
  color: var(--gold-hi);
}

.hello__sub {
  color: var(--text-2);
}

.hello__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.queue {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media (min-width: 760px) {
  .queue {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.qcard {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border: 1px solid var(--p-line-2);
  border-radius: var(--p-r);
  font: inherit;
  text-align: start;
  color: inherit;
  background: var(--p-surface);
  box-shadow: var(--p-shadow);
  cursor: pointer;
  transition: transform .45s var(--spring), border-color .2s;
}

.qcard:hover {
  transform: translateY(-2px);
  border-color: var(--p-acc-line);
}

.qcard:active {
  transform: scale(.97);
}

.qcard__ico {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: var(--gold-hi);
  background: var(--p-acc-soft);
}

.qcard[data-tone="warn"] .qcard__ico { color: var(--warn); background: var(--warn-bg); }
.qcard[data-tone="info"] .qcard__ico { color: var(--info); background: var(--info-bg); }
.qcard[data-tone="ok"] .qcard__ico { color: var(--ok); background: var(--ok-bg); }

.qcard__n {
  font-size: 30px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.qcard__t {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
}

.qcard__go {
  position: absolute;
  top: 16px;
  inset-inline-end: 14px;
  color: var(--text-3);
}

.qcard__go .icon {
  width: 18px;
  height: 18px;
  transform: rotate(90deg);
}

.duo {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--p-gap);
}

@media (min-width: 900px) {
  .duo {
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  }
}

/* the cards of the home: the preview's quiet heads */
.dash-card__head {
  gap: 10px;
}

.dash-card__icon,
.dash-site__icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: var(--gold-hi);
  background: var(--p-acc-soft);
  box-shadow: none;
}

.dash-site--ok .dash-site__icon { color: var(--ok); background: var(--ok-bg); }
.dash-site--error .dash-site__icon { color: var(--danger); background: var(--danger-bg); }

.meet {
  display: flex;
  align-items: center;
  gap: 16px;
}

.meet__day {
  flex: none;
  width: 74px;
  padding: 10px 0;
  border-radius: 16px;
  text-align: center;
  background: var(--p-acc-soft);
  box-shadow: inset 0 0 0 1px var(--p-acc-line);
}

.meet__day b {
  display: block;
  font-size: 30px;
  line-height: 1.1;
  color: var(--gold-hi);
}

.meet__day span {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
}

.meet__text {
  flex: 1;
  min-width: 0;
}

.dash-meeting__topic {
  font-family: var(--f-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.4;
  color: var(--gold-hi);
}

.dash-meeting__topic.is-empty {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-3);
}

/* the quick actions: two to a row, like the preview's «بسرعة» */
.quick-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.quick {
  flex-direction: row;
  justify-content: flex-start;
  min-height: 46px;
  padding: 0 14px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  background: var(--p-surface-2);
  box-shadow: none;
}

.quick__icon {
  width: auto;
  height: auto;
  background: none;
  box-shadow: none;
  color: var(--text-2);
}

.quick__label {
  font-size: 14px;
  font-weight: 700;
}

.dash-row {
  border-radius: var(--p-r-sm);
}

.dash-row:hover {
  background: var(--p-hover);
}

.dash-row__icon {
  border-radius: 10px;
  background: var(--p-surface-2);
  color: var(--text-2);
}

/* who is here */
.who__sum {
  display: flex;
  gap: 14px;
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text-3);
}

.who__sum span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.who__sum i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.who__sum i.is-ok { background: var(--ok); }
.who__sum i.is-acc { background: rgb(var(--acc-rgb)); }

.who {
  display: flex;
  flex-direction: column;
}

.who__item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--p-line-2);
}

.who__item:last-child {
  border-bottom: 0;
}

.who__item .pav {
  width: 40px;
  height: 40px;
  font-family: var(--f-display);
  font-size: 18px;
  color: var(--gold-hi);
  background: var(--p-surface-2);
}

.who__text {
  flex: 1;
  min-width: 0;
}

.who__text b {
  display: block;
  font-size: 14px;
}

.who__text small {
  display: block;
  overflow: hidden;
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--text-3);
}

.who__text small.editing {
  color: var(--gold-hi);
}

/* the activity feed */
.acts .act {
  border-bottom: 1px solid var(--p-line-2);
}

.empty {
  color: var(--text-3);
}

/* the youth cards and the presence use the same quiet surfaces */
.ycard {
  border-color: var(--p-line-2);
  background: var(--p-surface);
  box-shadow: var(--p-shadow);
}

.ycard:hover {
  border-color: var(--p-acc-line);
}

.ycard__face {
  border-radius: 999px 999px 14px 14px;
  background: linear-gradient(180deg, var(--p-surface-2), var(--p-raised));
  box-shadow: inset 0 0 0 1px var(--p-acc-line);
}

.pav {
  background: var(--p-surface-2);
  color: var(--gold-hi);
  font-family: var(--f-display);
}


/* the home's numbers (the preview's «kpis») */
.kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  padding: 0;
  overflow: hidden;
}

@media (min-width: 760px) {
  .kpis {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.kpi {
  display: grid;
  align-content: start;
  gap: 2px;
  min-width: 0;
  padding: 18px var(--p-pad);
  border: 0;
  border-inline-start: 1px solid var(--p-line-2);
  border-bottom: 1px solid var(--p-line-2);
  font: inherit;
  text-align: start;
  color: inherit;
  background: none;
  cursor: pointer;
}

.kpi:hover {
  background: var(--p-hover);
}

.kpi__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
}

.kpi__value {
  font-size: 26px;
  font-weight: 800;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.kpi__hint {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
}

.qcard__n--word {
  font-size: 22px;
  color: var(--gold-hi);
}


/* the home's pair: the meeting and «اعمل حاجة جديدة» side by side (the old dashboard grid spanned it) */
.duo > .dash-quick,
.duo > .dash-card {
  grid-column: auto;
}


/* sign-out stays red in the preview's rail too */
.navlink.navlink--out,
.navlink.navlink--out:hover,
.navlink--out .navlink__icon {
  color: var(--danger);
}


/* a past row of the timeline: quieter words, still readable (axe AA in both themes), not a faded block */
.timeline__row.is-past {
  opacity: 1;
}

.timeline__row.is-past,
.timeline__row.is-past .timeline__time {
  color: var(--text-3);
}

.timeline__row.is-past .timeline__icon {
  opacity: .6;
}


/* ---------- the media library in the preview's look (§22.1 item 7) ---------- */

.media-grid {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
  gap: 12px;
}

.media-tile {
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--p-line-2);
  border-radius: var(--p-r);
  background: var(--p-surface);
  box-shadow: none;
  transition: transform .45s var(--spring), border-color .2s;
}

.media-tile:hover {
  transform: translateY(-2px);
  border-color: var(--p-acc-line);
}

.media-tile__frame {
  aspect-ratio: 4 / 3;
  border-radius: 0;
}

.media-tile__name {
  padding: 8px 12px 0;
  font-size: 13px;
  font-weight: 700;
}

.media-tile__meta {
  padding: 2px 12px 10px;
}

.media-tile.is-picking {
  position: relative;
}

.media-tile.is-picking::after {
  content: "";
  position: absolute;
  top: 8px;
  inset-inline-start: 8px;
  width: 24px;
  height: 24px;
  border: 2px solid #fff;
  border-radius: 8px;
  background: rgb(0 0 0 / .35);
  box-shadow: 0 2px 6px rgb(0 0 0 / .3);
}

.media-tile.is-picking[aria-pressed="true"] {
  border-color: rgb(var(--acc-rgb));
  box-shadow: 0 0 0 2px rgb(var(--acc-rgb) / .5);
}

.media-tile.is-picking[aria-pressed="true"]::after {
  border-color: rgb(var(--acc-rgb));
  background: rgb(var(--acc-rgb)) url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%231b1306' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 12.5l4.5 4.5L19 7.5'/%3E%3C/svg%3E") center / 16px no-repeat;
}

.media-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.pick-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 12px;
  border: 1px solid var(--p-acc-line);
  border-radius: var(--p-r);
  background: var(--p-acc-soft);
}

.pick-bar[hidden] {
  display: none;
}

.pick-bar__n {
  flex: 1;
  font-weight: 800;
}

.pick-bar__note {
  font-size: 12px;
  color: var(--text-2);
}

.media-detail__img {
  cursor: zoom-in;
}

.lightbox {
  width: 100vw;
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  margin: 0;
  padding: 24px;
  border: 0;
  background: rgb(2 6 14 / .92);
  cursor: zoom-out;
}

.lightbox[open] {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  place-items: center;
  gap: 12px;
  animation: menu-in .3s var(--spring) both;
}

.lightbox::backdrop {
  background: transparent;
}

.lightbox__img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8);
}

.lightbox__title {
  color: #f3f6fb;
  font-weight: 700;
}

.lightbox__close {
  position: absolute;
  top: 16px;
  inset-inline-end: 16px;
  color: #fff;
  background: rgb(255 255 255 / .12);
}


/* money: the same width for every digit (finance and bookings, §22.1 item 9) */
.fin-card__due-value,
.fin-event__nums,
.fin-avail,
.book-stats,
.kpi__value,
.qcard__n {
  font-variant-numeric: tabular-nums;
}


/* ---------- payment numbers as cards (§22.1 item 8): readable names, a mark per method ---------- */

.pay-dests {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}

@media (min-width: 560px) {
  .pay-dests {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.pay-dests > .note {
  grid-column: 1 / -1;
}

.pay-dest {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 14px 14px 14px 14px;
  padding-inline-start: 64px;
  border: 1px solid var(--p-line-2);
  border-radius: var(--p-r);
  background: var(--p-surface-2);
}

.pay-dest::before {
  content: "";
  position: absolute;
  top: 14px;
  inset-inline-start: 14px;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--p-acc-soft);
}

.pay-dest::after {
  content: "";
  position: absolute;
  top: 23px;
  inset-inline-start: 23px;
  width: 20px;
  height: 20px;
  background: var(--gold-hi);
  /* a generic wallet (no brand's own logo is drawn here) */
  -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 7.5A2.5 2.5 0 0 1 6.5 5H18v4'/%3E%3Cpath d='M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5Z'/%3E%3Cpath d='M16 14h.01'/%3E%3C/svg%3E") center / contain no-repeat;
  mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 7.5A2.5 2.5 0 0 1 6.5 5H18v4'/%3E%3Cpath d='M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5Z'/%3E%3Cpath d='M16 14h.01'/%3E%3C/svg%3E") center / contain no-repeat;
}

/* InstaPay: an instant transfer mark (two arrows), in the panel's colours */
.pay-dest[data-method="instapay"]::after {
  -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 8h13l-3-3M20 16H7l3 3'/%3E%3C/svg%3E") center / contain no-repeat;
  mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 8h13l-3-3M20 16H7l3 3'/%3E%3C/svg%3E") center / contain no-repeat;
}

.pay-dest__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  font-variant-numeric: tabular-nums;
}

.pay-dest .actions {
  margin: 0;
}

.pay-dest .actions:empty {
  display: none;
}


/* ---------- «صورة أو أيقونة» (§22.1 item 11) ---------- */

.pick-either {
  gap: 10px;
}

.pick-either > .field > .field__label:first-child {
  display: none;
}

.pick-either .pick-either__mode {
  margin-bottom: 2px;
}

.pick-icon[hidden],
.pick-either > .field[hidden] {
  display: none;
}

.pick-icon {
  display: grid;
  gap: 8px;
}


.pick-icon label[hidden] {
  display: none;
}

.pick-icon__row {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* the site's branded tile, small: navy, the gold glyph, the arch's hairline */
.pick-icon__tile {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 84px;
  height: 104px;
  overflow: hidden;
  border-radius: 16px;
  color: #f2d28b;
  background:
    radial-gradient(90% 70% at 70% 20%, rgb(215 170 80 / .28), transparent 70%),
    linear-gradient(160deg, #3b3020, #041127 85%);
}

.pick-icon__tile::after {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 999px 999px 10px 10px;
  box-shadow: inset 0 0 0 1px rgb(242 210 139 / .3);
}

.pick-icon__tile .icon {
  width: 34px;
  height: 34px;
}

/* =========================================================
   PHASE 8B LAYER (docs/phase8b/PLAN.md, the approved design: docs/phase8b/gallery.html)
   Last in the file on purpose, over the Phase 8 look. Same tokens, so the light theme, the accents,
   the density and the motion tiers keep working. Revert = drop this block.
========================================================= */

:root {
  --grad: linear-gradient(135deg, var(--acc-hi), var(--acc) 55%, var(--acc-deep));
  --grad-soft: linear-gradient(135deg, rgb(var(--acc-hi-rgb) / .18), rgb(var(--acc-rgb) / .06));
  --p-modal: linear-gradient(180deg, #0a2140, #061a31 40%);
  --p-modal-side: rgb(2 12 24 / .25);
  --p-modal-foot: rgb(4 17 31 / .6);
}

html[data-mode="light"] {
  --p-modal: linear-gradient(180deg, #ffffff, #f7f9fc 40%);
  --p-modal-side: rgb(11 42 76 / .03);
  --p-modal-foot: rgb(245 247 251 / .9);
}

/* ---------- the video-guide icon (instead of «؟») ---------- */

.vhelp {
  position: relative;
  display: grid;
  flex: none;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 1px solid var(--p-acc-line);
  border-radius: 11px;
  color: var(--acc-hi);
  background: var(--grad-soft);
  transition: transform .25s var(--ease), box-shadow .25s;
}

html[data-mode="light"] .vhelp {
  color: var(--acc-deep);
}

.vhelp .icon {
  width: 18px;
  height: 18px;
}

.vhelp::after {
  content: "";
  position: absolute;
  top: -3px;
  inset-inline-end: -3px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--grad);
  box-shadow: 0 0 0 2px var(--bg);
}

.vhelp:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px -10px var(--acc);
}

.vhelp-card {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 14px 16px 0;
  padding: 14px 16px;
  border: 1px solid var(--p-acc-line);
  border-radius: 16px;
  background: var(--grad-soft);
}

.vhelp-card__play {
  display: grid;
  flex: none;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  color: var(--acc-ink);
  background: var(--grad);
  box-shadow: 0 10px 24px -12px var(--acc);
}

.vhelp-card b {
  display: block;
  font-size: 14.5px;
}

.vhelp-card small {
  color: var(--text-3);
  font-size: 12.5px;
}

/* ---------- the editor: centred, in three sizes (A.openSheet options.size) ---------- */

.sheet__head .vhelp {
  margin-inline-start: auto;
}

.sheet__nav {
  display: none;
}

.sheet__navlink {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
  padding: 0 12px;
  border: 0;
  border-radius: 11px;
  color: var(--text-2);
  background: none;
  font-weight: 700;
  font-size: 13.5px;
  text-align: start;
  transition: background .2s, color .2s;
}

.sheet__navlink:hover {
  color: var(--text);
  background: var(--p-hover);
}

.sheet__navlink.is-on {
  color: var(--acc-hi);
  background: var(--p-acc-soft);
}

html[data-mode="light"] .sheet__navlink.is-on {
  color: var(--acc-deep);
}

.sheet__navnum {
  display: grid;
  flex: none;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 1px solid var(--p-line-3);
  border-radius: 50%;
  font-size: 11px;
}

.sheet__navlink.is-on .sheet__navnum {
  border-color: transparent;
  color: var(--acc-ink);
  background: var(--grad);
}

.sheet__sec {
  scroll-margin-top: 12px;
}

/* phones: a bottom sheet as before; a big editor's sections are chips over its body */
@media (max-width: 759px) {

  .sheet--lg .sheet__nav {
    display: flex;
    flex: none;
    gap: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    border-bottom: 1px solid var(--p-line-2);
    scrollbar-width: none;
  }

  .sheet--lg .sheet__nav::-webkit-scrollbar {
    display: none;
  }

  .sheet--lg .sheet__navlink {
    flex: none;
    min-height: 36px;
    white-space: nowrap;
  }

  .sheet--lg[open] {
    height: calc(100dvh - 14px);
  }

}

@media (min-width: 760px) {

  .sheet {
    --sheet-gap: 28px;
    inset: 0;
    margin: auto;
    width: min(760px, calc(100vw - 2 * var(--sheet-gap)));
    height: fit-content;
    max-height: calc(100dvh - 2 * var(--sheet-gap));
    border: 1px solid var(--p-line-3);
    border-radius: 26px;
    background: var(--p-modal);
    box-shadow: var(--p-shadow-lg), 0 0 0 1px rgb(var(--acc-rgb) / .08);
    transform: translateY(14px) scale(.975);
    transform-origin: 50% 50%;
  }

  .sheet[open] {
    transform: none;
  }

  @starting-style {
    .sheet[open] {
      opacity: 0;
      transform: translateY(14px) scale(.975);
    }
  }

  .sheet::backdrop {
    background: rgb(var(--nv-1-6-14) / .62);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  html[data-mode="light"] .sheet::backdrop {
    background: rgb(10 26 48 / .32);
  }

  .sheet--sm {
    width: min(520px, calc(100vw - 2 * var(--sheet-gap)));
  }

  .sheet__head {
    gap: 14px;
    padding: 18px 24px;
    background: linear-gradient(90deg, transparent, rgb(var(--acc-rgb) / .05));
  }

  .sheet__title {
    font-size: 19px;
  }

  .sheet__body {
    padding: 22px 24px 26px;
  }

  .sheet__foot {
    gap: 10px;
    padding: 14px 24px;
    background: var(--p-modal-foot);
  }

  /* big: sections on the side, fields in two columns, a fixed height so the footer stays put */
  .sheet--lg {
    width: min(1120px, calc(100vw - 2 * var(--sheet-gap)));
  }

  .sheet--lg[open] {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: min(860px, calc(100dvh - 2 * var(--sheet-gap)));
  }

  .sheet--lg .sheet__grab {
    display: none;
  }

  .sheet--lg .sheet__head,
  .sheet--lg .sheet__foot,
  .sheet--lg > .lock-banner,
  .sheet--lg > .draft-note {
    grid-column: 1 / -1;
  }

  .sheet--lg .sheet__nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px 12px;
    overflow: auto;
    border-inline-end: 1px solid var(--p-line-2);
    background: var(--p-modal-side);
  }

  .sheet--lg .sheet__body {
    position: relative;
    padding: 22px 26px 30px;
  }

  .sheet--lg .sheet__body > .form {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .sheet--lg .sheet__body > .form > * {
    grid-column: 1 / -1;
  }

  .sheet--lg .sheet__body > .form > .field:not(:has(textarea, .upload, .media-pick, .pick-image, .segment, .choice, .item-preview)) {
    grid-column: auto;
  }

  .sheet--lg .form-group {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 18px;
    padding: 0 0 22px;
    border-radius: 0;
    background: none;
    box-shadow: inset 0 -1px 0 var(--p-line-2);
  }

  .sheet--lg .form-group > .section-label,
  .sheet--lg .form-group > :not(.field):not(.check--toggle):not(.date-time),
  .sheet--lg .form-group > .field:has(textarea),
  .sheet--lg .form-group > .field:has(.upload, .pick-image, .media-pick) {
    grid-column: 1 / -1;
  }

  .sheet--lg .form-group > .section-label {
    margin: 0;
    font-size: 15.5px;
    font-weight: 800;
    color: var(--text);
  }

  .sheet--lg .sheet__foot .btn--primary {
    min-width: 150px;
  }

}

/* ---------- the intro (welcome() in AdminScript: the approved preview's playIntro) ---------- */

.welcome.intro {
  position: fixed;
  inset: auto;
  bottom: 0;
  z-index: 45;
  display: grid;
  place-items: center;
  padding: 32px 24px;
  container-type: size;
  color: var(--text);
  background: none;
  cursor: default;
  opacity: 1;
  animation: none;
  /* it plays to its end, and never stands in the way: taps go through to the panel */
  pointer-events: none;
}

/* the logo's home waits for the flying logo (it takes its place when the intro ends) */
html.is-intro .rail .brand__mark,
html.is-intro .topbar__mark {
  visibility: hidden;
}

.intro__bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(46% 40% at 50% 44%, rgb(var(--acc-rgb) / .16), transparent 72%), var(--bg);
}

.intro__rays {
  position: absolute;
  left: 50%;
  top: 40%;
  width: 160cqmax;
  height: 160cqmax;
  margin: -80cqmax 0 0 -80cqmax;
  background: repeating-conic-gradient(from 0deg, rgb(var(--acc-rgb) / .07) 0deg 2deg, transparent 2deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0, transparent 26%);
  mask: radial-gradient(circle, #000 0, transparent 26%);
  opacity: 0;
}

.intro__dust {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.intro__core {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  max-width: 100%;
}

.intro__mark {
  position: relative;
  width: clamp(96px, 16cqi, 128px);
  aspect-ratio: 1;
}

.intro__halo {
  position: absolute;
  inset: -70%;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(var(--acc-rgb) / .3) 0%, rgb(var(--acc-rgb) / .08) 38%, transparent 66%);
  opacity: 0;
  pointer-events: none;
}

.intro__ring {
  position: absolute;
  inset: -10px;
  border: 1px solid var(--p-acc-line);
  border-radius: 50%;
  opacity: 0;
}

.intro__logo {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  opacity: 0;
  box-shadow: 0 0 0 1px var(--p-acc-line), 0 22px 50px -24px rgb(0 0 0 / .55), 0 0 60px -18px var(--acc);
  transform-origin: center;
}

.intro__sweep {
  position: absolute;
  z-index: 2;
  inset: 0;
  overflow: hidden;
  border-radius: 50%;
  pointer-events: none;
}

.intro__sweep i {
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: -60%;
  width: 40%;
  background: linear-gradient(100deg, transparent, rgb(255 246 220 / .7), transparent);
  transform: skewX(-18deg);
}

.intro__text {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: min(560px, 100%);
  text-align: center;
}

.intro__title {
  margin: 0;
  padding: 0 .2em;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(42px, 7cqi, 60px);
  line-height: 1.75;
  color: var(--acc-hi);
  opacity: 0;
}

html[data-mode="light"] .intro__title {
  color: var(--acc-deep);
}

.intro__sub {
  margin: -4px 0 0;
  font-size: clamp(14px, 1.7cqi, 16px);
  line-height: 1.8;
  min-height: 0;
  color: var(--text-2);
  opacity: 0;
  animation: none;
}

.intro__load {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0;
}

.intro__progress {
  width: 150px;
  height: 3px;
  overflow: hidden;
  border-radius: 3px;
  background: var(--p-line-3);
}

.intro__progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--acc);
  transform: scaleX(0);
  transform-origin: right;
}

.intro__status {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-3);
}

/* ---------- the one schedule picker (A.whenPicker) ---------- */

.datetime__pick {
  flex: none;
}

.whenpick {
  width: min(520px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px);
  padding: 0;
  overflow: auto;
  border: 1px solid var(--p-line-3);
  border-radius: 26px;
  color: var(--text);
  background: var(--p-modal);
  box-shadow: var(--p-shadow-lg);
}

.whenpick[open] {
  animation: p8b-pop .45s var(--ease) both;
}

.whenpick::backdrop {
  background: rgb(var(--nv-1-6-14) / .55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.whenpick__headrow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--p-line-2);
}

.whenpick__titles {
  flex: 1;
  min-width: 0;
}

.whenpick__titles h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
}

.whenpick__titles p {
  margin: 0;
  color: var(--text-3);
  font-size: 12.5px;
}

.chipico {
  display: grid;
  flex: none;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--p-line);
  border-radius: 12px;
  color: var(--acc-hi);
  background: var(--grad-soft);
}

html[data-mode="light"] .chipico {
  color: var(--acc-deep);
}

.whenpick__body {
  display: grid;
  gap: 16px;
  padding: 18px 22px;
}

.whenpick__cal {
  padding: 12px;
  border: 1px solid var(--p-line-3);
  border-radius: 18px;
}

.whenpick__month {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.whenpick__sp {
  flex: 1;
}

.whenpick__prev {
  display: inline-flex;
  transform: scaleX(-1);
}

.whenpick__grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}

.whenpick__head {
  padding: 4px 0;
  color: var(--text-3);
  font-size: 12px;
  font-weight: 700;
}

.whenpick__day {
  height: 34px;
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--text);
  background: none;
  font-weight: 700;
  font-size: 13.5px;
}

.whenpick__day:hover {
  background: var(--p-hover);
}

.whenpick__day.is-today {
  border-color: var(--p-acc-line);
}

.whenpick__day.is-on {
  border-color: transparent;
  color: var(--acc-ink);
  background: var(--grad);
}

.whenpick__label {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
}

.whenpick__hours .presets {
  align-items: center;
}

.whenpick__other {
  width: auto;
  min-width: 120px;
  height: 36px;
}

.whenpick .preset.is-on {
  border-color: transparent;
  color: var(--acc-ink);
  background: var(--grad);
}

.whenpick__said {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 12px 14px;
  border-radius: 12px;
  color: var(--info);
  background: var(--info-bg);
  font-size: 13px;
  font-weight: 700;
}

.whenpick__said .icon {
  width: 16px;
  height: 16px;
}

.whenpick__foot {
  display: flex;
  gap: 10px;
  padding: 14px 22px;
  border-top: 1px solid var(--p-line-2);
  background: var(--p-modal-foot);
}

@media (max-width: 759px) {
  .whenpick {
    width: 100%;
    max-width: 100%;
    margin: auto 0 0;
    border-radius: 24px 24px 0 0;
  }

  .whenpick[open] {
    animation: p8b-up .5s var(--ease) both;
  }

  .whenpick__foot {

  .whenpick__foot .btn {
