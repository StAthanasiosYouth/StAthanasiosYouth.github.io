@keyframes p8b-pop { from { opacity: 0; transform: translateY(14px) scale(.975); } }
@keyframes p8b-up { from { opacity: 0; transform: translateY(40px); } }

/* ---------- W2: review & publish ---------- */

.sheet__headacts {
  display: inline-flex;
  gap: 8px;
  margin-inline-start: auto;
}

.sheet__headacts + .vhelp {
  margin-inline-start: 0;
}

.review-group .changes {
  display: grid;
  gap: 10px;
  padding: 0;
  list-style: none;
}

.review-group .changes > li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--p-line-2);
  border-radius: 16px;
  background: var(--p-surface-2);
}

.review-group .changes > li::before {
  display: none;
}

.change__text {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-weight: 700;
}

.change__tone--add {
  color: var(--ok);
  background: var(--ok-bg);
}

.change__tone--change {
  color: var(--warn);
  background: var(--warn-bg);
}

.change__tone--remove {
  color: var(--danger);
  background: var(--danger-bg);
}

.change__diff {
  flex: none;
}

/* the approved window head: icon square, title, a line under it */
.sheet--chip .sheet__title::before {
  display: none;
}

.sheet__titles {
  flex: 1;
  min-width: 0;
}

.sheet__titles .sheet__title {
  margin: 0;
}

.sheet__sub {
  margin: 0;
  color: var(--text-3);
  font-size: 12.5px;
  font-weight: 500;
}

.sheet__chip {
  flex: none;
}

/* the approved publish stepper: chips with their number in a circle, a line between */
.stepper[data-publish] {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
}

.stepper[data-publish] .stepper__step {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 6px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 800;
  text-align: start;
}

.stepper[data-publish] .stepper__step::after {
  display: none;
}

.stepper[data-publish] .stepper__dot {
  width: 28px;
  height: 28px;
  border: 1px solid var(--p-line-3);
  color: var(--text-2);
  background: none;
  box-shadow: none;
  animation: none;
}

.stepper[data-publish] .is-current {
  border-color: var(--p-acc-line);
  color: var(--acc-hi);
}

.stepper[data-publish] .is-current .stepper__dot {
  border: 0;
  color: var(--acc-ink);
  background: var(--grad);
  box-shadow: 0 0 0 4px rgb(var(--acc-rgb) / .15);
}

.stepper[data-publish] .is-done {
  color: var(--ok);
}

.stepper[data-publish] .is-done .stepper__dot {
  border: 0;
  color: var(--ok);
  background: var(--ok-bg);
}

.stepper[data-publish] .is-failed .stepper__dot {
  border: 0;
  color: var(--danger);
  background: var(--danger-bg);
}

.stepper__bar {
  flex: 1;
  min-width: 24px;
  height: 2px;
  border-radius: 2px;
  background: var(--p-line-3);
}

.stepper__bar.is-done {
  background: var(--ok);
}

/* the changes, one card each */
.changes.review-groups {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.change-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border: 1px solid var(--p-line-2);
  border-radius: 18px;
  background: var(--p-surface-2);
}

.change-card::before {
  display: none;
}

.change-card__main {
  flex: 1;
  min-width: 0;
}

.change-card__main b {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
}

.change-card__main small {
  color: var(--text-3);
  font-size: 12.5px;
}

.change__tone {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 800;
}

/* nothing to publish */
.pubempty {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 34px 20px;
  border: 1.5px dashed var(--p-line-3);
  border-radius: 18px;
  text-align: center;
  background: rgb(2 12 24 / .3);
}

html[data-mode="light"] .pubempty {
  background: var(--p-surface-2);
}

.pubempty .chipico {
  width: 56px;
  height: 56px;
  margin-bottom: 6px;
  border-radius: 14px;
}

.pubempty .empty-state__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
}

.pubempty .empty-state__text,
.pubempty__last {
  margin: 0;
  color: var(--text-3);
  font-size: 13px;
}

@media (max-width: 759px) {
  .stepper[data-publish] .stepper__label {
    display: none;
  }

  .stepper[data-publish] .is-current .stepper__label {
    display: inline;
  }

  .change-card {
    flex-wrap: wrap;
  }

  .change-card .change__diff {
    flex: 1 0 100%;
    justify-content: center;
  }
}

/* ---------- W2: published versions, by day ---------- */

.pubdays {
  display: grid;
  gap: 18px;
}

.pubday__title {
  margin: 0 0 10px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 700;
}

.pubday__list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.pubrow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--p-line-2);
  border-radius: 16px;
  background: var(--p-surface-2);
}

.pubrow.is-live {
  border-color: rgb(var(--ok-rgb) / .35);
}

.chipico--ok {
  border-color: rgb(var(--ok-rgb) / .3);
  color: var(--ok);
  background: var(--ok-bg);
}

.pubrow__body {
  flex: 1;
  min-width: 0;
}

.pubrow__time {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 0;
}

.pubrow__time b {
  font-size: 15px;
}

.pubrow__who {
  margin: 0;
  color: var(--text-3);
  font-size: 12.5px;
}

/* ---------- W2: settings in sections ---------- */

.setpage {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}

.setpage__main,
.setsec {
  display: grid;
  gap: var(--p-gap, 16px);
  min-width: 0;
}

.setsec {
  scroll-margin-top: 90px;
}

.setnav {
  display: flex;
  gap: 6px;
  padding: 6px;
  overflow-x: auto;
  border: 1px solid var(--p-line-2);
  border-radius: 16px;
  background: var(--p-surface);

}

.setnav__head {
  display: none;
}

.setnav__link {
  display: flex;
  flex: none;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  padding: 0 12px;
  border: 0;
  border-radius: 11px;
  color: var(--text-2);
  background: none;
  font-weight: 700;
  font-size: 13.5px;
  white-space: nowrap;
}

.setnav__link .icon {
  width: 18px;
  height: 18px;
}

.setnav__link:hover {
  color: var(--text);
  background: var(--p-hover);
}

.setnav__link.is-on {
  color: var(--acc-hi);
  background: var(--p-acc-soft);
}

html[data-mode="light"] .setnav__link.is-on {
  color: var(--acc-deep);
}

@media (min-width: 1024px) {
  .setpage {
    grid-template-columns: 250px minmax(0, 1fr);

  }

  .setnav {

    padding: 12px;
    border-radius: 22px;
  }

  .setnav__head {
    display: block;
    margin: 10px 10px 2px;
    color: var(--text-3);
    font-size: 11.5px;
    font-weight: 700;
  }

  .setnav__head:first-child {
    margin-top: 2px;
  }

  .setnav__link {
    min-height: 42px;
  }
}

@media (max-width: 1023px) {
  .setnav {
    position: sticky;
    top: 60px;
    z-index: 5;
  }
}

/* ---------- W2: the settings cards (approved «settings» screen) ---------- */

.setnav__sep {
  width: 100%;
  height: 1px;
  margin: 8px 0 4px;
  border: 0;
  background: var(--p-line-2);
}

@media (max-width: 1023px) {
  .setnav__sep {
    display: none;
  }

  .setnav__head {
    display: flex;
    flex: none;
    align-items: center;
    margin: 0 8px;
    color: var(--text-3);
    font-size: 12px;
    font-weight: 700;
  }
}

.setcard {
  display: grid;
  gap: 0;
  padding: 22px 22px 8px;
  border-radius: 24px;
}

.setcard__head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.setcard__titles {
  flex: 1;
  min-width: 0;
}

.setcard__titles .card__title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
}

.setcard__titles .card__hint {
  margin: 2px 0 0;
  color: var(--text-3);
  font-size: 12.5px;
}

.setcard .chipico {
  width: 40px;
  height: 40px;
}

.setrow {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 74px;
  padding: 14px 0;
  border-top: 1px solid var(--p-line-2);
}

.setcard__head + .setrow {
  border-top: 0;
}

.setrow__text {
  flex: 1;
  min-width: 0;
  text-align: right;
}

.setrow__label[dir="auto"] {
  unicode-bidi: plaintext;
}

.setrow__label {
  display: block;
  font-size: 15px;
  font-weight: 800;
}

.setrow__hint {
  display: block;
  color: var(--text-3);
  font-size: 12.5px;
  line-height: 1.6;
}

.setrow--out .setrow__label {
  color: var(--danger);
}

.setrow__ctl {
  display: flex;
  flex: none;
  align-items: center;
  max-width: 100%;
}

.setrow__pair {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.setrow .avatar {
  display: grid;
  flex: none;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: var(--acc-ink);
  background: var(--grad);
  font-weight: 800;
}

.setcard .btn--small {
  min-height: 36px;
  border-radius: 11px;
}

.setcard .btn--danger {
  border-color: rgb(var(--danger-rgb) / .35);
  color: var(--danger);
  background: var(--danger-bg);
}

.setcard--plain {
  gap: 14px;
  padding: 22px;
}

.setcard--plain > .setcard__head {
  margin-bottom: 4px;
}

.setcard__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding-top: 16px;
}

.setcard--rows .setcard__foot {
  border-top: 1px solid var(--p-line-2);
  padding-bottom: 14px;
}

.setcard__foot .btn--primary {
  min-width: 98px;
  min-height: 42px;
  border-radius: 12px;
}

.setcard__note {
  color: var(--text-3);
  font-size: 12.5px;
}

/* «إعدادات الإشعارات» (approved): the email line, the table of switches, the quota numbers */
.ntb {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--p-line-3);
  border-radius: 18px;
  background: var(--p-surface-2);
}

.ntb.is-on {
  border-color: rgb(var(--ok-rgb) / .3);
  background: linear-gradient(90deg, transparent, rgb(var(--ok-rgb) / .06));
}

.ntb__text {
  display: grid;
  flex: 1;
  min-width: 0;
}

.ntb__text b {
  font-size: 14.5px;
  font-weight: 800;
}

.ntb__text small {
  color: var(--text-3);
  font-size: 12.5px;
}

.ntb__more {
  display: grid;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--p-line-2);
  border-radius: 16px;
}

.ntb__more[hidden] {
  display: none;
}

.ntb__budget {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.ntt,
.ntt.grants {
  display: grid;
  gap: 0;
  max-height: none;
  overflow: hidden;
  border: 1px solid var(--p-line-2);
  border-radius: 16px;
}

.ntt__head,
.ntt__row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 76px 76px 110px 120px;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
}

.ntt__head {
  color: var(--text-3);
  background: var(--p-surface-2);
  font-size: 12.5px;
  font-weight: 700;
}

.ntt__row {
  min-height: 44px;
  border-top: 1px solid var(--p-line-2);
}

.ntt__grp {
  padding: 8px 16px;
  border-top: 1px solid var(--p-line-2);
  color: var(--acc-hi);
  background: rgb(var(--acc-rgb) / .06);
  font-size: 13px;
  font-weight: 800;
}

html[data-mode="light"] .ntt__grp {
  color: var(--acc-deep);
}

.ntt__name {
  padding: 0;
  border: 0;
  color: var(--text);
  background: none;
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  text-align: start;
}

button.ntt__name {
  cursor: pointer;
}

button.ntt__name:hover {
  color: var(--acc-hi);
}

.ntt__sw {
  justify-self: start;
}

.ntt__lockcell {
  justify-self: end;
}

.ntt__lock {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  color: var(--text-3);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}

.ntt__row:hover .ntt__lock,
.ntt__lock:focus-within {
  opacity: .5;
}

.ntt__lock.is-on {
  color: var(--warn);
  background: var(--warn-bg);
  opacity: 1;
}

.ntt__lock input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.ntt__lock .icon {
  width: 14px;
  height: 14px;
}

.ntq__row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.ntq {
  padding: 18px 20px;
  border: 1px solid var(--p-line-2);
  border-radius: 18px;
  background: var(--p-surface-2);
}

.ntq small {
  display: block;
  color: var(--text-3);
  font-size: 12.5px;
  font-weight: 700;
}

.ntq b {
  display: block;
  margin: 4px 0;
  font-size: 26px;
  font-weight: 800;
}

.ntq .ntq__hint {
  font-weight: 500;
}

@media (max-width: 759px) {
  /* set-notify.png (phone): no header row; the name, then three switches each with its word above it; «إجباري» under */
  .ntt__head { display: none; }
  .ntt__row {
    grid-template-columns: minmax(0, 1fr) repeat(3, 50px);
    row-gap: 4px;
    min-width: 0;
    padding: 10px 12px;
  }
  .ntt__row > .ntt__sw { display: grid; justify-items: center; gap: 4px; }
  .ntt__row > .ntt__sw::before { color: var(--text-3); font-size: 11px; font-weight: 700; }
  .ntt__row > .ntt__sw:nth-child(2)::before { content: "إشعار"; }
  .ntt__row > .ntt__sw:nth-child(3)::before { content: "إيميل"; }
  .ntt__row > .ntt__sw:nth-child(4)::before { content: "ملخص"; }
  .ntt__row > .ntt__lockcell { grid-column: 1 / -1; justify-self: start; }
  .ntt__row .ntt__lock { opacity: 1; height: 22px; padding: 0 8px; font-size: 11px; } /* no hover on a phone: «إجباري» stays reachable */

  .ntq__row {
    grid-template-columns: 1fr;
  }

  .ntb {
    flex-wrap: wrap;
  }
}

/* «دليل الأدمن» (approved): a search, then the guides two by two */
.guide-search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;

.guide-search .icon {

}

.guide-search__input {

.guides {

}

.guide {

  align-items: center;

  padding: 16px 18px;
  border: 1px solid var(--p-line-2);

html[data-mode="light"] .guide {

.guide:hover {

.guide[hidden] {

}

.guide__text {
  display: grid;

}

.guide__text b {

}

.guide__text small {
  color: var(--text-3);

.guide__go {

}

.guide__go .icon {

@media (max-width: 759px) {

/* a number with its unit (the approved «المحتوى والظهور») */
.setnum {

.setnum .setnum__input {

.setnum__unit {

.setsplit {

.setsplit__label {

.sharecard {

.sharecard__text {

.sharecard__host {

.sharecard__name {

.sharecard__line {

/* the compact segmented control (its radios stay, hidden, for the keyboard and the tests) */
.seg {

  gap: 4px;
  max-width: 100%;
  padding: 4px;

html[data-mode="light"] .seg {

.seg__opt {
  position: relative;

  align-items: center;
  height: 34px;
  padding: 0 14px;

  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;

  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  pointer-events: none;
}

.whenpick .presets {
  gap: 8px;
}

.whenpick .presets .preset {
  min-height: 30px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--p-line-3);
  border-radius: 999px;
  color: var(--text);
  background: var(--p-surface);
  box-shadow: none;
  font-size: 13px;
  font-weight: 800;
}

.whenpick .presets .preset.is-on {
  border-color: transparent;
  color: var(--acc-ink);
  background: var(--grad);
}

.whenpick__nav {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--p-line-3);
  border-radius: 10px;
  color: var(--text-2);
  background: transparent;
  cursor: pointer;
}

.whenpick__nav:hover {
  border-color: var(--p-acc-line);
  color: var(--text);
}

.whenpick__nav .icon {
  width: 14px;
  height: 14px;
}

.whenpick__nav--prev .icon {
  transform: rotate(-90deg);
}

.whenpick__nav--next .icon {
  transform: rotate(90deg);
}

.whenpick__month b {
  font-size: 14.5px;
  font-weight: 800;
}

.whenpick__hourrow {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  background: rgb(var(--nv-2-9-20) / .5);
}

html[data-mode="light"] .whenpick__hourrow {
  background: var(--p-surface-2);
}

.whenpick__hour {
  height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  color: var(--text-2);
  background: none;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.whenpick__hour.is-on {
  color: var(--acc-hi);
  background: var(--p-raised);
  box-shadow: inset 0 0 0 1px var(--p-acc-line);
}

html[data-mode="light"] .whenpick__hour.is-on {
  color: var(--acc-deep);
}

.whenpick__other {
  margin-top: 8px;
}

.whenpick__other[hidden] {
  display: none;
}

.whenpick__said {
  color: var(--acc-hi);
}

/* ---------- Phase 8B: «الألعاب · قريبًا» (games-soon.png) ---------- */
.games-soon {
  display: grid;
  justify-items: center;
  max-width: 720px;
  margin: 30px auto;
  padding: 70px 24px;
  text-align: center;
}

.games-soon__icon {
  width: 72px;
  height: 72px;
  margin-bottom: 16px;
  border-radius: 16px;
}

.games-soon__icon .icon {
  width: 22px;
  height: 22px;
}

.games-soon__title {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 800;
}

.games-soon__text {
  margin: 0 0 6px;
  color: var(--text-3);
  font-size: 14px;
}

.games-soon__note {
  margin: 0;
  color: var(--text-3);
  font-size: 12.5px;
}

.games-soon .btn {
  margin-top: 16px;
}

@media (max-width: 759px) {
  .games-soon {
    margin: 30px 0 0;
  }
}

.games-soon {
  position: relative;
  gap: 0;
  width: 100%;
  box-sizing: border-box;
  background: linear-gradient(180deg, rgb(13 40 73 / .55), rgb(7 26 51 / .75));
}

.games-soon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(70% 90% at 100% 0%, rgb(var(--acc-rgb) / .10), transparent 60%);
}

html[data-mode="light"] .games-soon {
  background: var(--p-surface);
}

.games-soon > p.games-soon__text,
.games-soon > p.games-soon__note {
  line-height: 1.6;
}

/* the rail's «قريبًا» (approved): a small warm tag at the row's end; the row a little quieter */
.nav-soon {
  height: 20px;
  margin-inline-start: auto;
  padding: 0 8px;
  border: 0;
  color: var(--warn);
  background: var(--warn-bg);
  font-size: 10.5px;
}

.navlink:has(.nav-soon):not([aria-current="page"]):not(.is-active) {
  opacity: .7;
}

/* ---------- Phase 8B: the sub-tabs as approved (events.png): pills in a box, the chosen one filled ---------- */
#subtabs.tabs {
  display: flex;
  gap: 6px;
  width: max-content;
  max-width: calc(100% - 2 * var(--p-pad));
  margin: 22px var(--p-pad) 0;
  padding: 5px;
  overflow-x: auto;
  border: 1px solid var(--p-line-2);
  border-radius: 14px;
  background: var(--p-surface);
}

#subtabs.tabs[hidden] {
  display: none;
}

#subtabs .tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 0;
  height: 38px;
  padding: 0 18px;
  border: 0;
  border-radius: 10px;
  color: var(--text-2);
  background: none;
  font-weight: 700;
  white-space: nowrap;
}

#subtabs .tab:hover {
  color: var(--text);
}

#subtabs .tab[aria-current="page"] {
  color: var(--acc-ink);
  background: var(--grad);
  box-shadow: 0 8px 20px -10px var(--acc);
}

#subtabs .tab[aria-current="page"]::after {
  display: none;
}

@media (max-width: 759px) {
  #subtabs.tabs {
    width: auto;
    margin: 14px 16px 0;
  }

  #subtabs .tab {
    flex: 1 0 auto;
    justify-content: center;
  }
}

/* ---------- Phase 8B: a list card (events.png): head with its buttons, filters, rows ---------- */
.p8-card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.p8-card__titles {
  flex: 1;
  min-width: 220px;
}

.p8-card__titles .card__title {
  margin: 0;
  font-size: 16.5px;
  font-weight: 800;
}

.p8-card__titles .card__hint {
  margin: 0;
  color: var(--text-3);
  font-size: 12.5px;
}

.p8-card__acts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.p8-card .badge {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  color: var(--acc-ink);
  background: var(--grad);
  font-size: 11px;
  font-weight: 800;
}

.p8-card .badge[hidden] {
  display: none;
}

.p8-card__filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.p8-search {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 260px;
  max-width: 100%;
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--p-line-3);
  border-radius: 12px;
  color: var(--text-3);
  background: var(--p-surface);
}

.p8-search .icon {
  width: 16px;
  height: 16px;
  flex: none;
}

.p8-search__input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  color: var(--text);
  background: none;
  font: inherit;
  font-size: 13px;
}

.p8-list.p8-events {
  margin: 0;
  padding: 0;
  list-style: none;
}

.p8-item__thumb {
  display: grid;
  flex: none;
  place-items: center;
  width: 56px;
  height: 56px;
  overflow: hidden;
  border-radius: 14px;
  color: var(--acc-hi);
  background: var(--p-raised);
}

.p8-item__thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.p8-item__main .mono {
  font-family: ui-monospace, "Cascadia Mono", monospace;
  unicode-bidi: isolate;
}

.p8-item__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.p8-item__acts {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
}

.p8-item__acts .book-link[hidden] {
  display: none;
}

.p8-iconbtn {
  display: grid;
  flex: none;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--p-line-3);
  border-radius: 10px;
  color: var(--text-2);
  background: var(--p-surface);
  cursor: pointer;
}

.p8-iconbtn:hover,
.p8-iconbtn[aria-expanded="true"] {
  border-color: var(--acc);
  color: var(--text);
}

/* the ⋯ menu (event-menu.png) */
.menu.menu--p8 {
  width: auto;
  min-width: 220px;
  padding: 6px;
  border: 1px solid var(--p-line-3);
  border-radius: 16px;
  background: var(--p-modal, #0b2342);
  box-shadow: var(--p-shadow-lg);
}

.menu--p8 .menu__item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  color: var(--text-2);
  background: none;
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  text-align: start;
}

.menu--p8 .menu__item:hover,
.menu--p8 .menu__item:focus-visible {
  color: var(--text);
  background: var(--p-hover);
}

.menu--p8 .menu__item .icon {
  width: 18px;
  height: 18px;
}

.menu--p8 .menu__item--danger {
  color: var(--danger);
}

.menu--p8 .menu__sep {
  height: 1px;
  margin: 4px;
  border: 0;
  background: var(--p-line-2);
}

@media (max-width: 759px) {
  .p8-card__head {
    display: grid;
    grid-template-columns: 1fr;
  }

  .p8-card__head > .chipico {
    justify-self: start;
  }

  .p8-card__acts {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .p8-card__acts .btn--primary {
    grid-column: 1 / -1;
  }

  .p8-search {
    width: 100%;
  }

  .p8-events .p8-item {
    flex-wrap: wrap;
  }

  .p8-events .p8-item__main {
    flex: 1 1 60%;
  }

  .p8-events .p8-item__acts {
    width: 100%;
    flex-wrap: wrap;
  }
}

.p8-card {
  gap: 0;
  padding: 22px;
}

.p8-card .p8-card__head {
  margin-bottom: 20px;
}

.p8-card .p8-card__filters {
  margin-bottom: 16px;
}

.menu--p8 .menu__item {
  min-height: 0;
}

.menu.menu--p8:popover-open {
  gap: 0;
}

@media (max-width: 759px) {
  /* approved phones: no search box; rows a bit tighter, their buttons share the width */
  .p8-card .p8-search {
    display: none;
  }

  .p8-events .p8-item {
    padding: 12px;
  }

  .p8-events .p8-item__thumb {
    width: 48px;
    height: 48px;
  }

  .p8-events .p8-item__acts > .btn {
    flex: 1;
  }
}

html[data-mode="light"] .p8-filter .seg__opt:has(input:checked),
html[data-mode="light"] .seg--field .seg__opt:has(input:checked) {
  color: var(--text);
}

/* ---------- Phase 8B: the video-help bubble (help-pop.png) ---------- */
.menu.vpop {
  width: 280px;
  padding: 12px;
  overflow: visible;
  border: 1px solid var(--p-line-3);
  border-radius: 18px;
  background: var(--p-modal, #0b2342);
  box-shadow: var(--p-shadow-lg);
}

.menu.vpop:popover-open {
  display: block;
}

.menu.vpop::before {
  content: "";
  position: absolute;
  top: -7px;
  right: 26px;
  width: 12px;
  height: 12px;
  transform: rotate(45deg);
  border-top: 1px solid var(--p-line-3);
  border-left: 1px solid var(--p-line-3);
  background: inherit;
}

.vpop__thumb {
  position: relative;
  display: grid;
  place-items: center;
  margin-bottom: 10px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  background: radial-gradient(circle, #1b4b74, #061629);
}

.vpop__thumb img {
  grid-area: 1 / 1;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  opacity: .5;
}

.vpop__play {
  display: grid;
  grid-area: 1 / 1;
  place-items: center;
  width: 58px;
  height: 58px;
  border: 1px solid rgb(255 255 255 / .25);
  border-radius: 50%;
  color: #fff;
  background: rgb(4 17 31 / .45);
}

.vpop__play .icon {
  width: 18px;
  height: 18px;
}

.vpop__soon {
  position: absolute;
  top: 8px;
  inset-inline-start: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  color: var(--warn);
  background: var(--warn-bg);
  font-size: 11px;
  font-weight: 800;
}

.vpop__title {
  display: block;
  font-size: 14px;
}

.vpop__text {
  display: block;
  color: var(--text-3);
  font-size: 12px;
}

.vpop__more {
  display: block;
  margin-top: 8px;
  padding: 0;
  border: 0;
  color: var(--acc-hi);
  background: none;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

html[data-mode="light"] .vpop__more {
  color: var(--acc-deep);
}

@media (max-width: 759px) {
  .menu.vpop {
    left: 12px !important;
    right: 12px;
    width: auto;
  }
}

.vpop .vpop__thumb img {
  width: 64px;
  height: 64px;
  opacity: .5;
}

.vpop .vpop__play {
  position: relative;
  width: 58px;
  height: 58px;
}

.vpop .vpop__play::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  transform: translate(-35%, -50%);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 11px solid #fff;
}

/* ---------- Phase 8B: «تمسح «…»؟» (event-delete.png): two choices, the safe one first ---------- */
.sheet--danger .sheet__chip {
  border-color: rgb(var(--danger-rgb) / .3);
  color: var(--danger);
  background: var(--danger-bg);
}

.p8-choices {
  display: grid;
  gap: 12px;
}

.p8-choice {
  position: relative;
  display: block;
  padding: 16px 18px;
  border: 1px solid var(--p-line-3);
  border-radius: 18px;
  background: rgb(var(--nv-2-9-20) / .35);
  cursor: pointer;
  transition: border-color .2s, background .2s;
}

.p8-choice > input {
  position: absolute;
  opacity: 0;
}

.p8-choice:has(input:checked) {
  border-color: var(--acc);
  background: rgb(var(--acc-rgb) / .1);
}

.p8-choice:has(input:disabled) {
  cursor: not-allowed;
  opacity: .6;
}

.p8-choice:has(input:focus-visible) {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

.p8-choice__head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.p8-choice__head b {
  font-size: 15px;
  font-weight: 800;
}

.p8-choice--danger .p8-choice__head b {
  color: var(--danger);
}

.p8-choice__radio {
  display: grid;
  flex: none;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 2px solid var(--text-3);
  border-radius: 50%;
}

.p8-choice:has(input:checked) .p8-choice__radio {
  border-color: var(--acc);
}

.p8-choice:has(input:checked) .p8-choice__radio::after {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--acc);
}

.p8-choice__lines {
  margin: 8px 0 0;
  padding-inline-start: 46px;
  color: var(--text-2);
  font-size: 12.5px;
  line-height: 1.6;
}

.sheet--danger .sheet__body > .field {
  margin-top: 14px;
}

.sheet--danger .sheet__body > .field[hidden] {
  display: none;
}

.sheet--danger .sheet__head > .vhelp,
.sheet--danger .sheet__head > .icon-btn {
  display: none;
}

/* ---------- Phase 8B: «الاجتماعات» (meetings.png): the weekly summary beside the next weeks ---------- */
.p8-cols {
  display: grid;
  gap: 20px;
  align-items: start;
}

.p8-cols--meet {
  grid-template-columns: minmax(0, 424px) minmax(0, 1fr);
}

.p8-weekly__main {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 4px 0 20px;
  border-bottom: 1px solid var(--p-line-2);
}

.p8-weekly__day {
  display: grid;
  flex: none;
  place-items: center;
  align-content: center;
  gap: 6px;
  width: 76px;
  height: 76px;
  border: 1px solid var(--p-acc-line);
  border-radius: 18px;
  color: var(--text);
  background: var(--grad-soft);
  font-size: 13px;
  font-weight: 700;
}

.p8-weekly__day .icon {
  width: 18px;
  height: 18px;
  color: var(--acc-hi);
}

.p8-weekly__title {
  display: block;
  font-size: 18px;
  font-weight: 800;
}

.p8-weekly__facts {
  color: var(--text-3);
  font-size: 13px;
}

.p8-factrow {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 8px 0;
  border-bottom: 1px solid var(--p-line-2);
}

.p8-factrow__label {
  flex: 1;
  color: var(--text-3);
  font-size: 13px;
}

.p8-factrow__value {
  flex: 1;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 700;
}

.p8-factrow__sp {
  width: 46px;
}

.p8-iconbtn--lg {
  width: 46px;
  height: 34px;
}

.p8-meet {
  min-height: 90px;
}

.p8-meet.is-off .p8-item__main {
  opacity: .6;
}

.p8-meet__date {
  display: grid;
  flex: none;
  place-items: center;
  align-content: center;
  width: 62px;
  height: 62px;
  border: 1px solid var(--p-line-3);
  border-radius: 16px;
  background: var(--p-raised);
}

.p8-meet__date b {
  color: var(--acc-hi);
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
}

.p8-meet__date small {
  color: var(--text-2);
  font-size: 11px;
}

.p8-meet .p8-item__main > b {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.p8-meetings .p8-list,
.p8-past {
  margin: 0;
  padding: 0;
  list-style: none;
}

.p8-past[hidden] {
  display: none;
}

.p8-pastbtn {
  margin-top: 12px;
}

.p8-past {
  margin-top: 10px;
}

@media (max-width: 1100px) {
  .p8-cols--meet {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 759px) {
  .p8-weekly .p8-card__acts {
    display: grid;
    grid-template-columns: 1fr;
  }

  .p8-meet .p8-item__acts > .btn {
    flex: 1;
  }
}

.p8-weekly .p8-card__titles {
  min-width: 0;
}

.p8-factrow .mono,
.p8-card .mono {
  font-family: ui-monospace, "Cascadia Mono", monospace;
  unicode-bidi: isolate;
}

@media (max-width: 759px) {
  /* meetings.png (phone): the weekly card keeps its icon beside the title, «تعديل» full width under */

    display: flex;
    flex-wrap: wrap;
  }

  .p8-weekly .p8-card__titles {
    flex: 1 1 60%;
  }

  .p8-weekly .p8-card__acts {
    flex: 1 0 100%;
  }
}

/* ---------- Phase 8B: «جديد الأسرة» (news.png) ---------- */
.p8-item__line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.p8-tag .icon {
  width: 13px;
  height: 13px;
}

.p8-empty {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 44px 20px;
  border: 1.5px dashed var(--p-line-3);
  border-radius: 18px;
  text-align: center;
  background: rgb(var(--nv-2-9-20) / .3);
}

.p8-empty .chipico {
  width: 56px;
  height: 56px;
}

.p8-empty b {
  font-size: 16px;
  font-weight: 800;
}

.p8-empty small {
  color: var(--text-3);
  font-size: 12.5px;
}

.p8-empty .btn {
  margin-top: 8px;
}

.p8-stack { display: grid; gap: 8px; }
.p8-stack > [hidden] { display: none; }
.prevcard__line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.prevcard__line [hidden], .prevcard__tags [hidden] { display: none; }

/* ---------- the meeting editor (session-edit.png, session-program.png) ---------- */
.p8-endcol { display: flex; align-items: flex-end; height: 100%; }

/* «بوستر الاجتماع»: the picture, then its name, three buttons one under the other and the line */
