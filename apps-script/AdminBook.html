<script>
/*
 * «الحجوزات» (docs/EVENTS.md §4, §5, §7.2, §9, §10, §13): the booking queue
 * of an event, one booking's sheet (request, flags, proofs, payments, the
 * derived totals) and every move — confirm (with the first payment),
 * reject (with money received → refund owed), payments, refunds, voids,
 * update, cancel with a retained fee, reopen, a manual booking, cancelling
 * a whole event — plus the summary per servant and the XLSX.
 *
 * The data lives on the new backend (the Worker, worker/BOOKING-API.md),
 * reached through window.AdminWorker (admin/boot.js) with the Google ID
 * token. Shown ONLY when the Worker says the module is on
 * (GET /v1/admin/book/module → on, or env 'staging'); off, unreachable,
 * 401 or 403 → nothing appears and nothing else changes. The recovery
 * admin (Apps Script) has no AdminWorker: nothing appears there either.
 *
 * Edit locks (worker/src/book/locks.js): the open booking sheet holds its
 * booking (taken on open, renewed every ~30 s, given back on close). Held by
 * another admin: «<name> بيعدّل الحجز ده دلوقتي», read only (their moves
 * would be refused with «locked» anyway), and «افتح آخر نسخة» once free.
 *
 * Money is never optimistic: a write shows its pending button, then the
 * server's answer (the booking detail) is drawn. Every write carries a key
 * (book-kit keyKeeper): the same body sent again keeps its key. `version`
 * guards a booking: «conflict» → the booking is read again. «warn» →
 * the warnings and «سجّل برضه» (force). «needs_override» → the reason
 * and «أكّد برضه» with a reason. Pure helpers and the workbook:
 * admin/book-kit.js (loaded on demand, tests/book-kit.test.mjs).
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;

  var B = A.book = {
    on: false,            // the Worker said the module is on (or staging)
    off: false,           // … or that it is off (production today): nothing is drawn at all
    checked: false,       // asked (whatever the answer)
    needGoogle: false,    // a device session: the bookings need Google itself
    env: '',
    events: null,         // GET /v1/admin/book/events → events
    eventId: '',
    filter: 'pending',
    q: '',
    current: null,        // the open booking's detail
    lastDownload: null    // { filename, bytes } of the last XLSX (tests, console)
  };

  var K = null;           // admin/book-kit.js

  function ar(n) {
    return String(n === null || n === undefined ? '' : n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }

  function money(n) {
    return K ? K.money(n) : ar(n) + ' ج';
  }

  function W() {
    return window.AdminWorker && window.AdminWorker.available() ? window.AdminWorker : null;
  }

  function enc(value) {
    return encodeURIComponent(String(value || ''));
  }

  /* '+201012345678' → '01012345678' (what people read and dial) */
  function phoneText(phone) {
    var m = /^\+20(1\d{9})$/.exec(String(phone || ''));
    return m ? '0' + m[1] : String(phone || '');
  }

  function wallText(value) {
    return value ? A.formatWall(String(value).replace('T', ' ')) : '—';
  }

  function sheetOpen() {
    var sheet = document.getElementById('sheet');
    return !!(sheet && sheet.open);
  }


  /* =======================================================
     THE SWITCH: is the module on? (asked once a page load)
  ======================================================= */

  var kitLoading = null;

  function kit() {
    if (K) return Promise.resolve(K);
    if (!kitLoading) {
      kitLoading = import(new URL('book-kit.js', location.href).href).then(function (m) { K = m; return m; }, function (error) {
        kitLoading = null;
        throw error;
      });
    }
    return kitLoading;
  }

  var checking = null;
  var failedAt = 0;

  /*
   * The Worker's last answer about the module, remembered on this device.
   * A device session (the installed app's remembered phone) can't ask the
   * Worker at all, and a Worker hiccup can't either: the way in («الحجوزات»
   * in the menu, on each event, on the home page) then still shows unless the
   * Worker last said the module is OFF; the screen asks for Google / offers
   * «جرّب تاني» (bug B1/B2: before, nothing at all was drawn).
   */
  var KNOWN_KEY = 'athanasios.admin.book.v1';

  function knownOn() {
    try {
      var value = JSON.parse(localStorage.getItem(KNOWN_KEY) || 'null');
      return value && typeof value.on === 'boolean' ? value.on : null;
    }
    catch (ignored) {
      return null;
    }
  }

  function rememberOn(on) {
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify({ on: !!on, at: Date.now() })); }
    catch (ignored) { /* private mode: only this tab knows */ }
  }

  /*
   * The way in shows: the module is on; or this is a device session (it can
   * never ask) and the module wasn't last seen off; or the Worker didn't
   * answer and the module was last seen on. 401 / 403 (not an admin there)
   * hide it like «off».
   */
  function entryShown() {
    if (B.on) return true;
    if (B.off) return false;
    if (B.needGoogle) return knownOn() !== false;
    return !!B.failed && knownOn() === true;
  }
  B.entryShown = entryShown;

  /* resolves true when «الحجوزات» is on; anything wrong = off (but the way in may still show: entryShown) */
  B.check = function () {
    var w = W();
    if (!w) return Promise.resolve(false);
    if (B.on) return Promise.resolve(true);
    if (checking) return checking;
    // the Worker was unreachable a moment ago: not again for a minute (unless «جرّب تاني»)
    if (failedAt && Date.now() - failedAt < 60000) return Promise.resolve(false);
    checking = w.call('GET', '/v1/admin/book/module', undefined, { quiet: true }).then(function (reply) {
      B.env = String(reply && reply.env || '');
      B.checked = true;
      B.needGoogle = false;
      B.failed = null;
      if (!(reply && (reply.on === true || B.env === 'staging'))) {
        B.off = true;
        rememberOn(false);
        paintLinks();
        return false;
      }
      rememberOn(true);
      return kit().then(function () {
        B.on = true;
        addNav();
        loadEvents();
        return true;
      });
    }).catch(function (error) {
      B.checked = true;
      B.on = false;
      // a device session can't ask: Google first (the bookings screen says so); else «جرّب تاني»
      var code = error && error.code;
      B.needGoogle = code === 'google';
      // not an admin on the Worker (or no Worker here): like «off», nothing to retry
      if (code === 'auth' || code === 'denied' || code === 'off') B.off = true;
      B.failed = B.needGoogle || B.off ? null : (error || new Error('unreachable'));
      if (!B.needGoogle) failedAt = Date.now();
      checking = null;
      if (entryShown()) addNav();
      paintLinks();
      return false;
    });
    return checking;
  };

  /* «جرّب تاني» after a Worker hiccup: ask again now */
  B.retry = function () {
    failedAt = 0;
    checking = null;
    B.off = false;
    return B.check();
  };

  /* all the events' new requests (the menu tab and the home card) */
  function pendingTotal() {
    return (B.events || []).reduce(function (sum, e) { return sum + (e.counts && e.counts.pending || 0); }, 0);
  }

  /*
   * «الحجوزات» in the menu with a NUMBER badge (bookings waiting for approval, all events),
   * on the sub-tab and on «الصفحات والفعاليات» itself (the phone's dock shows only areas).
   * Refreshed after every write, on each events answer, and every 60 s while the panel is in sight.
   */
  function addNav() {
    var area = A.AREAS.filter(function (a) { return a.key === 'pages'; })[0];
    if (!area || !area.subs) return;
    var sub = area.subs.filter(function (s) { return s.key === 'bookings'; })[0];
    var n = B.on ? pendingTotal() : 0;
    if (sub && sub.badge === n && area.badge === n) return;
    if (!sub) area.subs.push(sub = { key: 'bookings', label: 'الحجوزات' });
    if (!area.subs.some(function (s) { return s.key === 'finance'; })) area.subs.push({ key: 'finance', label: 'حسابات الخدام' });
    sub.badge = n;
    area.badge = n;
    A.renderNav();
  }

  setInterval(function () {
    if (B.on && document.visibilityState === 'visible' && !sheetOpen()) loadEvents();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (B.on && document.visibilityState === 'visible') loadEvents();
  });

  // asked once the panel is up (boot.js sets AdminWorker before A.start)
  var start = A.start;
  A.start = function () {
    var drawn = start.apply(this, arguments);
    Promise.resolve(drawn).then(function () { setTimeout(function () { B.check(); }, 300); });
    return drawn;
  };

  // admin pushes and emails link to /admin/#open/bookings/<eventId> (§7.3), and to the exact
  // booking: #open/booking/<bookingId>, its payments: #open/payments/<bookingId> (docs/EMAIL-DEEP-LINKS.md)
  var openLink = A.openLink;
  A.openLink = function (hash) {
    var one = /^#?open\/(booking|payments)\/(bkg-[a-z0-9]{4,40})$/.exec(String(hash || ''));
    if (one) {
      if (!W()) return Promise.resolve(false);
      return B.check().then(function (on) {
        if (!on && !B.needGoogle) return false;
        // the Worker checks the admin's access; a booking that is gone answers «مش لاقيين» in the sheet.
        // B.current outlives a closed sheet: forget it, or the same booking would not open again
        if (!sheetOpen()) B.current = null;
        return openBooking(one[2]).then(function () {
          var target = one[1] === 'payments' && document.querySelector('#sheet [data-anchor="payments"]');
          if (target && target.scrollIntoView) target.scrollIntoView({ block: 'start', behavior: 'smooth' });
          return true;
        });
      });
    }
    var m = /^#?open\/bookings(?:\/(evt-[a-z0-9]{4,40}))?$/.exec(String(hash || ''));
    if (!m) return openLink ? openLink.apply(this, arguments) : Promise.resolve(false);
    if (!W()) return Promise.resolve(false);
    return B.check().then(function (on) {
      if (!on && !B.needGoogle) return false;
      if (m[1]) B.eventId = m[1];
      return A.go('pages', 'bookings');
    });
  };

  /* the bookings screen of one event (from the events list, the editor, a push) */
  B.open = function (eventId) {
    B.eventId = eventId || B.eventId;
    B.filter = 'pending';
    B.q = '';
    return (sheetOpen() ? A.closeSheet() : Promise.resolve(true)).then(function (closed) {
      if (closed === false) return false;
      return A.go('pages', 'bookings');
    });
  };


  /* =======================================================
     THE EVENTS THE WORKER KNOWS (published event.json, re-read on demand)
  ======================================================= */

  var eventsWatchers = [];

  var loadEvents = A.latest(function () {
    return W().call('GET', '/v1/admin/book/events');
  }, function (reply) {
    B.events = (reply && reply.events) || [];
    paintLinks();
    eventsWatchers.slice().forEach(function (fn) { fn(null); });
  }, function (error) {
    eventsWatchers.slice().forEach(function (fn) { fn(error); });
  });

  function eventRow(id) {
    return (B.events || []).filter(function (e) { return e.id === id; })[0] || null;
  }

  function replaceEvent(row) {
    if (!row || !row.id || !B.events) return;
    var at = B.events.map(function (e) { return e.id; }).indexOf(row.id);
    if (at === -1) B.events.push(row);
    else B.events[at] = row;
    paintLinks();
  }

  /* «حدّث بيانات الفعالية»: the Worker reads the published event.json now (after a publish) */
  function refreshEvent(slug, button) {
    return A.withBusy(button, W().call('POST', '/v1/admin/book/events/' + enc(slug) + '/refresh', {})).then(function (reply) {
      replaceEvent(reply.event || reply.row || null);
      configs[slug] = null;
      A.toast('اتحدثت بيانات الفعالية ✓');
      loadEvents();
      return reply;
    });
  }


  /* =======================================================
     «الحجوزات (N جديد)» on each bookable event (AdminPages: list + editor)
  ======================================================= */

  var links = [];

  /*
   * ev: the Apps Script event (id, slug, booking, live). Hidden until the
   * module is on and the Worker knows it; nothing at all (null) when there
   * is no Worker here or it said the module is off.
   */
  B.eventLink = function (ev) {
    if (!W() || B.off) return null;
    var node = el('span', { class: 'book-link', hidden: true, 'data-event': ev.id });
    links.push({ ev: ev, node: node, at: Date.now() });
    if (B.on) {
      paintLink(links[links.length - 1]);
      if (!B.events) loadEvents();
    }
    else if (!B.checked) B.check();
    // asked already and not on: a device session / a hiccup may still show the way in
    else paintLink(links[links.length - 1]);
    return node;
  };

  function paintLinks() {
    links = links.filter(function (l) { return l.node.isConnected || Date.now() - l.at < 3000; });
    links.forEach(paintLink);
    if (B.on) addNav();
    paintCard();
  }

  function paintLink(link) {
    var ev = link.ev;
    if (!B.on) {
      // can't ask the Worker right now (a device session, a hiccup): the way in still shows on a live booking event
      if (!entryShown() || !ev.booking) {
        link.node.hidden = true;
        return;
      }
      link.node.hidden = false;
      A.fill(link.node, el('button', { class: 'btn btn--small', type: 'button', 'data-act': 'book-open', onclick: function () { B.open(ev.id); } },
        icon(B.needGoogle ? 'lock' : 'ticket'), 'الحجوزات'));
      return;
    }
    var row = eventRow(ev.id);
    if (!B.events || (!row && !(ev.booking && ev.live))) {
      link.node.hidden = true;
      return;
    }
    link.node.hidden = false;
    if (!row) {
      // live with booking, but the Worker hasn't read it yet: read it now
      A.fill(link.node, el('button', { class: 'btn btn--small btn--ghost', type: 'button', 'data-act': 'book-refresh', onclick: function (e) {
        refreshEvent(ev.slug, e.currentTarget).catch(function (error) { A.fail(error); });
      } }, icon('retry'), 'حدّث بيانات الفعالية'));
      return;
    }
    var fresh = row.counts && row.counts.pending || 0;
    A.fill(link.node, el('button', { class: 'btn btn--small' + (fresh ? ' book-link--new' : ''), type: 'button', 'data-act': 'book-open', onclick: function () { B.open(ev.id); } },
      icon('ticket'), 'الحجوزات' + (fresh ? ' (' + ar(fresh) + ' جديد)' : '')));
  }


  /* =======================================================
     THE SCREEN
  ======================================================= */

  A.views.bookings = function () {

    if (!window.AdminTransport) {
      return [A.card('من لوحة التحكم الرسمية بس', 'الحجوزات بتتراجع من لوحة التحكم الرسمية (/admin/). افتحها من Chrome وكمّل من هناك.')];
    }

    if (!B.on) {
      if (B.needGoogle) return [googleCard()];
      if (B.failed) return [retryCard()];
      var waiting = el('div', { class: 'skeleton skeleton--line' });
      B.check().then(function (on) {
        if (!waiting.isConnected) return;
        if (on || B.needGoogle || B.failed) A.render();
        else A.fill(waiting.parentNode, el('p', { class: 'note', text: 'الحجوزات مش متاحة دلوقتي.' }));
      });
      return [A.card('الحجوزات', '', waiting)];
    }

    return queueView();

  };

  /* the Worker didn't answer: say so, and «جرّب تاني» (B2: before, the bookings just vanished for a minute) */
  function retryCard() {
    var box = A.errorBox();
    var again = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'book-retry' }, icon('retry'), 'جرّب تاني');
    again.addEventListener('click', function () {
      box.hidden = true;
      A.withBusy(again, B.retry()).then(function (on) {
        if (A.area === 'pages' && A.sub.pages === 'bookings') {
          if (on || B.needGoogle) A.render();
          else if (B.failed) A.fail(B.failed, box);
          else A.render();
        }
      });
    });
    var card = A.card('الحجوزات مش بتحمّل دلوقتي', 'مش قادرين نوصل لسيرفر الحجوزات. ممكن النت ضعيف أو السيرفر مشغول لحظة. الحجوزات نفسها محفوظة.',
      el('div', { class: 'actions' }, again), box);
    if (B.failed) setTimeout(function () { if (box.isConnected) A.fail(B.failed, box); }, 0);
    return card;
  }


  /* =======================================================
     THE HOME CARD «مستنيين المراجعة» (AdminHome: A.bookCard)
  ======================================================= */

  var cardNode = null;

  A.bookCard = function () {
    cardNode = el('section', { class: 'card dash-card dash-book', id: 'dash-book', 'aria-labelledby': 'dash-book-title', hidden: true });
    paintCard();
    if (!B.checked && W()) B.check();
    return cardNode;
  };

  function paintCard() {
    if (!cardNode) return;
    if (!entryShown()) {
      cardNode.hidden = true;
      return;
    }
    cardNode.hidden = false;
    var head = el('div', { class: 'dash-card__head' },
      el('span', { class: 'dash-card__icon', 'aria-hidden': 'true' }, icon('ticket')),
      el('h2', { class: 'card__title', id: 'dash-book-title', text: 'الحجوزات' }));
    if (!B.on) {
      A.fill(cardNode, head,
        el('p', { class: 'card__hint', text: B.needGoogle ? 'الحجوزات والفلوس محتاجة دخول بحساب جوجل.' : 'سيرفر الحجوزات مش بيرد دلوقتي.' }),
        el('div', { class: 'actions' }, el('button', { class: 'btn btn--small', type: 'button', 'data-act': 'book-home', onclick: function () { B.open(''); } }, icon(B.needGoogle ? 'lock' : 'retry'), 'افتح الحجوزات')));
      return;
    }
    var waiting = (B.events || []).filter(function (e) { return e.counts && e.counts.pending; });
    var total = pendingTotal();
    A.fill(cardNode, head,
      el('p', { class: 'card__hint', text: !B.events ? 'بنجيب الحجوزات…' : total ? 'مستنيين المراجعة: ' + ar(total) + (total === 1 ? ' طلب' : ' طلبات') : 'مفيش طلبات حجز مستنية مراجعة ✓' }),
      waiting.length ? el('ul', { class: 'dash-book__list' }, waiting.slice(0, 5).map(function (e) {
        return el('li', {}, el('button', { class: 'btn btn--ghost btn--small', type: 'button', 'data-act': 'book-home-event', 'data-event': e.id, onclick: function () { B.open(e.id); } },
          el('bdi', { text: e.title }), ' (' + ar(e.counts.pending) + ' جديد)'));
      })) : null,
      el('div', { class: 'actions' }, el('button', { class: 'btn btn--small', type: 'button', 'data-act': 'book-home', onclick: function () { B.open(''); } }, icon('ticket'), 'كل الحجوزات')));
  }

  /* a device session (the installed app's remembered phone): Google itself, once */
  function googleCard() {
    var box = A.errorBox();
    var go = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'book-google' }, icon('user'), 'ادخل بحساب جوجل');
    go.addEventListener('click', function () {
      box.hidden = true;
      A.withBusy(go, W().google().then(function () { return B.check(); })).then(function () {
        if (A.area === 'pages' && A.sub.pages === 'bookings') A.render();
      }).catch(function (error) { A.fail(error, box); });
    });
    return A.card('الحجوزات محتاجة دخول بحساب جوجل', 'التطبيق داخل بالجهاز المتذكَّر. الحجوزات والفلوس محتاجة حساب جوجل نفسه: ادخل مرة وكمّل من مكانك.',
      el('div', { class: 'actions' }, go), box);
  }

  /* the last answers (memory only, this tab): a reopened screen draws at once, then refreshes quietly */
  var queue = { last: {}, counts: {}, target: null };

  function queueKey() {
    return B.eventId + '|' + B.filter + '|' + B.q;
  }

  var loadQueue = A.latest(function () {
    var key = queueKey();
    var paths = K.queuePaths(B.eventId, B.filter, B.q);
    return Promise.all(paths.map(function (path) { return W().call('GET', path); })).then(function (replies) {
      return {
        key: key,
        eventId: B.eventId,
        rows: K.mergeRows(replies.map(function (r) { return r.rows; })),
        counts: replies[0] && replies[0].counts || null,
        next: replies.map(function (r) { return r.next || ''; })
      };
    });
  }, function (result) {
    queue.last[result.key] = result;
    if (result.counts) queue.counts[result.eventId] = result.counts;
    if (queue.target && queue.target.isConnected()) queue.target.landed(result);
  }, function (error) {
    if (queue.target && queue.target.isConnected()) queue.target.failed(error);
  });

  /* after a write: the list and the event's counts, quietly */
  function afterWrite() {
    if (!B.on) return;
    loadQueue();
    loadEvents();
  }

  function queueView() {

    var box = A.errorBox();
    var head = el('div', { class: 'book-head' });
    var list = el('div', { class: 'comp-subs book-list', 'aria-live': 'polite' });
    var chips = el('div', { class: 'filter-chips book-chips', role: 'group', 'aria-label': 'الحالة' });
    var more = el('div', { class: 'actions', hidden: true });
    var search = el('input', { class: 'input', type: 'search', placeholder: 'دوّر برقم الحجز أو الاسم أو الموبايل…', 'aria-label': 'دوّر في الحجوزات', value: B.q });
    var timer = 0;

    search.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        B.q = search.value.trim();
        drawQueue(queue.last[queueKey()]);
        loadQueue();
      }, 250);
    });

    function pickEvent() {
      var events = (B.events || []).slice().sort(function (a, b) { return String(a.startAt) < String(b.startAt) ? -1 : 1; });
      if (!events.length) return null;
      if (!eventRow(B.eventId)) {
        var now = K.stamp(A.cairoNow());
        var ahead = events.filter(function (e) { return String(e.endAt || e.startAt) >= now; });
        B.eventId = ((ahead.filter(function (e) { return e.counts && e.counts.pending; })[0]) || ahead[0] || events[events.length - 1]).id;
      }
      return eventRow(B.eventId);
    }

    function drawHead() {
      var ev = pickEvent();
      if (!ev) {
        A.fill(head, el('div', { class: 'empty-state' },
          el('span', { class: 'empty-state__icon', 'aria-hidden': 'true' }, icon('ticket')),
          el('p', { class: 'empty-state__title', text: 'مفيش فعاليات فيها حجز لسه' }),
          el('p', { class: 'empty-state__text', text: 'الفعالية بتظهر هنا بعد ما تتنشر وفيها حجز. لو لسه ناشرها: من «الفعاليات» دوس «حدّث بيانات الفعالية».' })));
        return null;
      }
      var picker = el('select', { class: 'input', 'aria-label': 'الفعالية', 'data-act': 'book-event' }, (B.events || []).map(function (e) {

  /* =======================================================
     A MOVE (a form in the same sheet, «رجوع» to the booking)
  ======================================================= */

  /*
   * options: { title, intro, nodes, label, kind, prepare(extra) → { errors } | { path, body, key }, done(reply) }
   * extra: { force } after «سجّل برضه»; { override: { pay, cap, reason } } after «أكّد برضه».
   */
  function moveForm(options) {

    var box = A.errorBox();
    var extraBox = el('div', { class: 'book-warn', hidden: true, role: 'alert' });
    var submit = el('button', { class: 'btn btn--' + (options.kind || 'primary'), type: 'button', 'data-act': 'submit', text: options.label });
    var back = el('button', { class: 'btn btn--ghost', type: 'button', 'data-act': 'back', text: 'رجوع' });
    var owner = B.current;

    back.addEventListener('click', function () {
      A.confirmLeave().then(function (ok) {
        if (!ok) return;
        A.dirty = false;
        if (options.back) options.back();
        else if (owner) drawBooking(owner);
        else A.closeSheet();
      });
    });

    // «أكّد برضه» then «سجّل برضه» (or the other way round): both answers stand, until the form is changed
    var sticky = {};

    function send(extra, button) {
      box.hidden = true;
      var scope = document.getElementById('sheet');
      A.clearFieldErrors(scope);
      sticky = Object.assign({}, sticky, extra || {});
      var plan = options.prepare(sticky);
      if (plan.errors && plan.errors.length) {
        showErrors(plan.errors, box);
        return;
      }
      A.withBusy(button || submit, W().call('POST', plan.path, plan.body, { idempotencyKey: plan.key })).then(function (reply) {
        A.dirty = false;
        extraBox.hidden = true;
        options.done(reply);
        afterWrite();
      }).catch(function (error) {
        failed(error);
      });
    }

    function failed(error) {
      var code = error && error.code;
      var reply = (error && error.reply) || {};
      if (code === 'locked' && owner) {
        lockedOut(error, owner.booking.id);
        return;
      }
      if (code === 'conflict' && owner) {
        A.dirty = false;
        A.toast('حد عدّل الحجز ده، اتحدّث', 'info');
        openBooking(owner.booking.id, 'حد عدّل الحجز ده، اتحدّث. راجع وكمّل.');
        afterWrite();
        return;
      }
      if (code === 'warn') {
        var again = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'force' }, 'سجّل برضه');
        again.addEventListener('click', function () { send({ force: true }, again); });
        A.fill(extraBox,
          el('p', { class: 'book-warn__title', text: error.parsed.message || 'في ملاحظات قبل التسجيل.' }),
          warningList(reply.warnings),
          el('p', { class: 'field__hint', text: 'راجعها، ولو متأكد سجّل برضه.' }),
          el('div', { class: 'actions' }, again));
        extraBox.hidden = false;
        extraBox.scrollIntoView({ block: 'center', behavior: A.reducedMotion() ? 'auto' : 'smooth' });
        return;
      }
      if (code === 'needs_override') {
        var codes = (reply.warnings || []).map(function (w) { return String(w.code || ''); }).join(' ');
        var pay = /pay|paid|money/i.test(codes);
        var cap = /cap|full|seat|place/i.test(codes);
        var age = /age/i.test(codes);
        if (!pay && !cap && !age) { pay = true; cap = true; }
        var why = A.textInput('', { max: 200, placeholder: 'مثلاً: الباقي هيدفعه في الرحلة' });
        var force = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'override' }, 'أكّد برضه');
        force.addEventListener('click', function () {
          if (!why.value.trim()) {
            A.fail(new Error(JSON.stringify({ appError: 1, message: 'سبب التأكيد برضه: اكتب السبب' })), box);
            return;
          }
          send({ override: { pay: pay, cap: cap, age: age, reason: why.value.trim() } }, force);
        });
        A.fill(extraBox,
          el('p', { class: 'book-warn__title', text: error.parsed.message || 'الحجز مينفعش يتأكد كده.' }),
          warningList(reply.warnings),
          reply.left !== undefined && reply.left !== null ? el('p', { class: 'field__hint', text: 'فاضل ' + ar(Math.max(0, reply.left)) + ' مكان بس.' }) : null,
          A.field(age && !pay && !cap ? 'سبب تجاوز شرط السن' : 'سبب التأكيد برضه', why, age && !pay && !cap ? 'محتاج صلاحية «يدير · الحجوزات». السبب بيتسجل في سجل الحجز ويوصل كإشعار.' : pay ? 'زي «تأكيد من غير ما الدفع يكمل»: السبب بيتسجل مع التأكيد.' : 'السبب بيتسجل مع التأكيد فوق العدد.'),
          el('div', { class: 'actions' }, force));
        extraBox.hidden = false;
        extraBox.scrollIntoView({ block: 'center', behavior: A.reducedMotion() ? 'auto' : 'smooth' });
        return;
      }
      if (code === 'google') {
        A.fail(error, box);
        box.appendChild(el('div', { class: 'actions' }, el('button', { class: 'btn btn--small', type: 'button', onclick: function (e) {
          A.withBusy(e.currentTarget, W().google()).then(function () { box.hidden = true; }).catch(function (err) { A.fail(err, box); });
        } }, icon('user'), 'ادخل بحساب جوجل')));
        return;
      }
      if (code === 'full' && reply.left !== undefined) {
        A.fail(withField(error, 'actual', error.parsed.message + ' فاضل ' + ar(Math.max(0, reply.left)) + ' مكان.'), box);
        return;
      }
      if (error && error.field) {
        A.fail(withField(error, error.field, error.parsed.message), box);
        return;
      }
      A.fail(error, box);
    }

    submit.addEventListener('click', function () { send({}); });

    var form = el('div', { class: 'form' }, options.nodes);

    function changed() {
      sticky = {};
      extraBox.hidden = true;
    }

    form.addEventListener('input', changed);
    form.addEventListener('change', changed);

    A.dirty = false;
    A.openSheet(options.title, [
      box,
      options.intro ? el('p', { class: 'note', text: options.intro }) : null,
      form,
      extraBox

  }

  function withField(error, field, message) {
    var copy = new Error(message);

  /* ---------- form pieces ---------- */

  /* a proof image → WebP ≤ 1600 px, ≤ 600 KB (as the visitor's), then up to the Worker */
  function prepareProof(file) {

  /* the event's published booking settings: a booking's detail already read, else its event.json on the site */
  var configs = { byEvent: {} };

  function eventConfig(ev) {
    if (configs.byEvent[ev.id]) return Promise.resolve(configs.byEvent[ev.id]);
    if (!configs[ev.slug]) {
      configs[ev.slug] = fetch(new URL('../events/' + enc(ev.slug) + '/event.json', location.href).href, { cache: 'no-store', credentials: 'omit' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (json) {
          var bk = json && json.booking;
          if (!bk || !bk.pricing) throw new Error('no booking');
          return { id: ev.id, slug: ev.slug, title: json.title || ev.title, startAt: json.startAt, endAt: json.endAt, capacity: ev.capacity, taken: ev.taken, left: ev.left,
            perBookingMax: bk.perBookingMax || 10, collectNames: !!bk.collectNames, bookerAge: bk.bookerAge || null, ageStrict: !!bk.ageStrict, pricing: bk.pricing, payment: bk.payment || { mode: 'full' },
            methods: bk.methods || [], servants: (bk.servants || []).map(function (s) { return { id: s.id, name: s.name, methods: s.methods || [] }; }) };
        });
      configs[ev.slug].catch(function () { configs[ev.slug] = null; });
    }
    return configs[ev.slug];
  }

      nodes: [A.field('الاسم', name), A.field('الموبايل', phone, 'بأي شكل: 010… أو +20…'), counts.node, quoteLine,

        if (names) body.names = names.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        if (servant.value) body.servantId = servant.value;

          errors = errors.concat(K.checkConfirm({ pricing: pricing, perBookingMax: ev.perBookingMax, actual: c, amountDue: free ? '0' : due.value, dueReason: dueReason.value, quoted: quoted }).filter(function (e) { return e.field !== 'actual'; }));
          if (!free && conf.amountDue !== quoted) conf.dueReason = dueReason.value.trim();
          if (first && first.filled()) {
            var pay = first.value(extra.force);
            errors = errors.concat(first.check(pay));
            conf.payments = [pay];
          }
          if (extra.override) {
            if (extra.override.pay) conf.overridePay = true;
            if (extra.override.cap) conf.overrideCap = true;
            conf.reason = extra.override.reason;
          }
          body.confirm = conf;
        }
        else if (first && first.filled()) {
          // pending, with the money recorded now: whoever confirms later finds it counted

  function summarySheet(ev) {

    var xlsx = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'export' }, icon('download'), 'التقرير الكامل (Excel)');
    // shareable: names + booking refs only (confirmed), no phones, no money
    var roster = el('button', { class: 'btn', type: 'button', 'data-act': 'export-roster' }, icon('users'), 'قايمة الأفراد (للمشاركة)');
    roster.addEventListener('click', function () { downloadRoster(ev.id, roster, box); });

    function range() {
      var out = '';
      if (from.value()) out += '&from=' + enc(from.value() + 'T00:00');
      if (to.value()) out += '&to=' + enc(to.value() + 'T23:59');
      return out;
    }

    function load(button) {
      box.hidden = true;
      // the methods' words come with the event's settings (a booking read already, else its event.json)
      var run = Promise.all([
        W().call('GET', '/v1/admin/book/summary?eventId=' + enc(ev.id) + range()),
        eventConfig(ev).catch(function () { return null; })
      ]).then(function (got) {
        if (!got[0].event && got[1]) got[0].event = got[1];
        return got[0];
      });
      (button ? A.withBusy(button, run) : run).then(function (reply) {
        if (body.isConnected) drawSummary(reply);
      }).catch(function (error) {
        if (!body.isConnected) return;
        body.replaceChildren();
        A.fail(error, box);
      });
    }

    function drawSummary(r) {
      var o = r.overall || {};
      var bk = o.bookings || {};
      var m = o.money || {};
      var ps = o.payStatus || {};
      var s = o.seats || {};
      var p = o.people || {};
      var methods = Object.keys(m.byMethod || {});
      A.fill(body,
        el('p', { class: 'section-label', text: 'الحجوزات (كل الفعالية)' }),
        el('div', { class: 'comp-tiles' },
          tile('مستنية المراجعة', ar(bk.pending || 0), bk.pending ? 'gold' : ''), tile('مؤكدة', ar(bk.confirmed || 0)), tile('مرفوضة', ar(bk.rejected || 0)),
          tile('الزائر لغاها', ar(bk.withdrawn || 0)), tile('اتلغت', ar(bk.cancelled || 0)),
          tile('الأماكن', s.capacity === null || s.capacity === undefined ? ar(s.taken || 0) : ar(s.taken || 0) + ' / ' + ar(s.capacity)),
          tile('الأفراد المؤكدين', ar(p.total || 0))),
        el('p', { class: 'section-label', text: 'الفلوس' + (from.value() || to.value() ? ' (في الفترة دي)' : '') }),
        el('div', { class: 'comp-tiles' },
          tile('المستلم', money(m.received || 0)), tile('المرتجع', money(m.refunded || 0)), tile('الصافي', money(m.net || 0), 'gold'),
          tile('المطلوب', money(m.due || 0)), tile('الباقي على الناس', money(m.balance || 0)), tile('مرتجعات مطلوبة', money(m.refundsOwed || 0), m.refundsOwed ? 'gold' : '')),
        methods.length ? el('ul', { class: 'book-history' }, methods.map(function (k) {
          var x = m.byMethod[k];
          return el('li', { text: (K.methodLabel(r.event || configs.byEvent[ev.id] || {}, k) || 'من غير طريقة') + ': مستلم ' + money(x.received) + '، مرتجع ' + money(x.refunded) + '، صافي ' + money(x.net) });
        })) : null,
        el('p', { class: 'field__hint', text: 'حالة الدفع: مجاني ' + ar(ps.free || 0) + '، لسه مدفعش ' + ar(ps.unpaid || 0) + '، جزء ' + ar(ps.partial || 0) + '، كله ' + ar(ps.paid || 0) + '، زيادة ' + ar(ps.overpaid || 0) + '، متأخر ' + ar(ps.overdue || 0) }),
        o.pending ? el('p', { class: 'field__hint', text: 'طلبات لسه بتتراجع: ' + ar(o.pending.count || 0) + ' بقيمة ' + money(o.pending.quoted || 0) + ' (متوقع، مش فلوس)' }) : null,
        el('p', { class: 'section-label', text: 'حسابات الخدام' }),
        el('p', { class: 'field__hint', text: 'فلوس كل خادم حسب طريقة الدفع والتسليمات للخدمة بقت في صفحة لوحدها.' }),
        el('div', { class: 'actions' }, el('button', { class: 'btn btn--small', type: 'button', 'data-act': 'open-finance', onclick: function () { B.openFinance(ev.id); } }, 'افتح الحسابات المالية للخدام')));
    }

    show.addEventListener('click', function () { load(show); });

    xlsx.addEventListener('click', function () { downloadReport(ev.id, xlsx, box, range(), from.value(), to.value()); });

    A.dirty = false;
    A.openSheet('الملخص والحسابات: ' + ev.title, [
      box,
      el('p', { class: 'note', text: 'كل الفلوس هنا من الدفعات المسجلة بس (الملغية مبتتحسبش). الفترة بتفلتر الفلوس بوقت الاستلام؛ عدد الحجوزات دايمًا للفعالية كلها.' }),
      el('div', { class: 'row' }, A.field('من يوم', from.node), A.field('لحد يوم', to.node)),
      el('div', { class: 'actions' }, show),
      body
    ], [xlsx, roster, el('button', { class: 'btn btn--ghost', type: 'button', text: 'قفل', onclick: function () { A.closeSheet(); } })], { wide: true, className: 'book-sheet' });

    load();

  }


  /* =======================================================
     «الحسابات المالية للخدام» (its own page, next to «الحجوزات»)
     Filters: one event or all of them (GET /v1/admin/book/finance), and one
     servant or all. Summary tiles (total, by method, in custody, handed over,
     still held, pending verification, owed), then a card per servant with a
     line per payment method and the bookings behind it; handovers (one event,
     capped by what the servant holds BY that method — the Worker enforces it);
     reminders to participants who still owe (WhatsApp, logged, once a day);
     both Excel files.
     Phase 1: any admin. Phase 1.5: a servant sees only their own.
  ======================================================= */

  var finance = { eventId: 'all', servantId: '', last: {}, exports: {}, reminders: {} };
  var FIN_METHODS = [['cash', 'كاش'], ['instapay', 'إنستاباي'], ['wallet', 'محفظة']];

  B.openFinance = function (eventId) {
    finance.eventId = eventId || 'all';
    return (sheetOpen() ? A.closeSheet() : Promise.resolve(true)).then(function (closed) {
      if (closed === false) return false;
      return A.go('pages', 'finance');
    });
  };

  /* the two Excel files (also from «الملخص والحسابات») */
  function downloadRoster(eventId, button, box) {
    return A.withBusy(button, Promise.all([
      W().call('GET', '/v1/admin/book/export?eventId=' + enc(eventId)),
      import(new URL('xlsx.js', location.href).href)
    ]).then(function (got) {
      var made = K.rosterBook(got[0], { today: A.cairoNow().slice(0, 10) });
      var bytes = got[1].writeXlsx(made.book);
      B.lastDownload = { filename: made.filename, bytes: bytes };
      got[1].download(bytes, made.filename);
      return made;
    })).then(function (made) { A.toast('اتنزّل ' + made.filename); }).catch(function (error) { A.fail(error, box); });
  }

  function downloadReport(eventId, button, box, range, fromText, toText) {
    return A.confirm({ tone: 'warn', icon: 'phone', title: 'الملف فيه أرقام تليفونات، ماتبعتوش في جروبات', message: 'احفظه عندك أو ابعته للمسؤول بس. فيه أسماء وموبايلات وفلوس كل حجز.', confirmLabel: 'نزّل الملف', cancelLabel: 'رجوع' }).then(function (ok) {
      if (!ok) return;
      return A.withBusy(button, Promise.all([
        // download=1: the Worker records the download in «سجل النشاط» (Phase 1.5 step 8)
        W().call('GET', '/v1/admin/book/export?eventId=' + enc(eventId) + (range || '') + '&download=1'),
        import(new URL('xlsx.js', location.href).href)
      ]).then(function (got) {
        var made = K.bookingBook(got[0], { from: fromText || '', to: toText || '', today: A.cairoNow().slice(0, 10) });
        var bytes = got[1].writeXlsx(made.book);
        B.lastDownload = { filename: made.filename, bytes: bytes };
        got[1].download(bytes, made.filename);
        return made;
      })).then(function (made) { A.toast('اتنزّل ' + made.filename); }).catch(function (error) { A.fail(error, box); });
    });
  }

  /* one servant (or all of them) → the numbers the tiles show; methods by key */
  function finTotals(list) {
    var t = { net: 0, held: 0, handedOver: 0, toHandOver: 0, pendingQuoted: 0, pendingCount: 0, owed: 0, unreconciled: 0, byMethod: {} };
    list.forEach(function (sv) {
      ['net', 'held', 'handedOver', 'toHandOver', 'pendingQuoted', 'owed', 'unreconciled'].forEach(function (k) { t[k] += sv[k] || 0; });
      (sv.methods || []).forEach(function (m) {
        t.pendingCount += m.pendingCount || 0;
        t.byMethod[m.method] = (t.byMethod[m.method] || 0) + (m.net || 0);
      });
    });
    return t;
  }

  function stat(label, value, tone, hint) {
    return el('div', { class: 'fin-stat' + (tone ? ' fin-stat--' + tone : '') },
      el('span', { class: 'fin-stat__label', text: label }),
      el('strong', { class: 'fin-stat__value', text: value }),
      hint ? el('span', { class: 'fin-stat__hint', text: hint }) : null);
  }

  A.views.finance = function () {

    if (!window.AdminTransport) {
      return [A.card('من لوحة التحكم الرسمية بس', 'الحسابات بتتراجع من لوحة التحكم الرسمية (/admin/).')];
    }

    if (!B.on) {
      if (B.needGoogle) return [googleCard()];
      if (B.failed) return [retryCard()];
      var waiting = el('div', { class: 'skeleton skeleton--line' });
      B.check().then(function (on) {
        if (!waiting.isConnected) return;
        if (on || B.needGoogle || B.failed) A.render();
        else A.fill(waiting.parentNode, el('p', { class: 'note', text: 'الحسابات مش متاحة دلوقتي.' }));
      });
      return [A.card('الحسابات المالية للخدام', '', waiting)];
    }

    var box = A.errorBox();
    var body = el('div', { class: 'fin', 'aria-live': 'polite' });
    var picker = el('select', { class: 'input', id: 'fin-event', 'data-act': 'finance-event' },
      [el('option', { value: 'all', text: 'كل الفعاليات (مجمّع)' })].concat((B.events || []).map(function (e) {
        return el('option', { value: e.id, text: e.title });
      })));
    picker.value = (B.events || []).some(function (e) { return e.id === finance.eventId; }) ? finance.eventId : 'all';
    finance.eventId = picker.value;
    var who = el('select', { class: 'input', id: 'fin-servant', 'data-act': 'finance-servant' }, el('option', { value: '', text: 'كل الخدام' }));
    var roster = el('button', { class: 'btn', type: 'button', 'data-act': 'fin-roster' }, icon('users'), 'قايمة الأفراد (للمشاركة)');
    var report = el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'fin-report' }, icon('download'), 'التقرير المالي الكامل (Excel)');
    var exportHint = el('p', { class: 'fin-hint' });
    roster.addEventListener('click', function () { downloadRoster(finance.eventId, roster, box); });
    report.addEventListener('click', function () { downloadReport(finance.eventId, report, box); });
    picker.addEventListener('change', function () { finance.eventId = picker.value; load(); });
    who.addEventListener('change', function () { finance.servantId = who.value; if (finance.last[finance.eventId]) draw(finance.last[finance.eventId]); });

    function one() { return finance.eventId !== 'all'; }

    function paintExports() {
      roster.disabled = report.disabled = !one();
      exportHint.textContent = one()
        ? '«قايمة الأفراد» فيها الأسماء وأرقام الحجز بس (تتبعت في جروب). «التقرير المالي» فيه الموبايلات والفلوس: للمسؤولين بس.'
        : 'اختار فعالية علشان تنزّل ملفاتها.';
    }

    function load() {
      var id = finance.eventId;
      paintExports();
      // the bookings list (reminders, drill-down) is read fresh with the totals: never an older copy
      delete finance.exports[id];
      if (finance.last[id]) draw(finance.last[id]);
      else A.fill(body, el('div', { class: 'skeleton skeleton--line' }), el('div', { class: 'skeleton skeleton--line' }));
      box.hidden = true;
      var calls = [W().call('GET', '/v1/admin/book/finance?eventId=' + enc(id))];
      if (id !== 'all') {
        calls.push(W().call('GET', '/v1/admin/book/events/' + enc(id) + '/handovers').catch(function () { return { handovers: [] }; }));
        calls.push(W().call('GET', '/v1/admin/book/events/' + enc(id) + '/reminders').catch(function () { return { reminders: [], gapMs: 0 }; }));
        if (eventRow(id)) calls.push(eventConfig(eventRow(id)).catch(function () { return null; }));
      }
      Promise.all(calls).then(function (got) {
        var r = got[0];
        r.handoverRows = got[1] ? got[1].handovers || [] : [];
        finance.reminders[id] = got[2] || { reminders: [], gapMs: 0 };
        finance.last[id] = r;
        if (body.isConnected && finance.eventId === id) draw(r);
      }).catch(function (error) { if (body.isConnected) A.fail(error, box); });
    }

    function reload() {
      delete finance.last[finance.eventId];
      delete finance.exports[finance.eventId];
      load();
    }

    function label(key) {
      var ev = one() ? configs.byEvent[finance.eventId] : null;
      var found = ev ? K.methodLabel(ev, key) : '';
      if (found && found !== key) return found;
      var known = FIN_METHODS.filter(function (m) { return m[0] === key; })[0];
      return known ? known[1] : (key || 'من غير طريقة');
    }

    function exported() {
      var id = finance.eventId;
      return finance.exports[id] || (finance.exports[id] = W().call('GET', '/v1/admin/book/export?eventId=' + enc(id)).catch(function (error) { delete finance.exports[id]; throw error; }));
    }

    function draw(r) {
      var all = r.servants || [];
      // the servant filter: keep the choice while it exists in this scope
      var options = [el('option', { value: '', text: 'كل الخدام (' + ar(all.length) + ')' })].concat(all.map(function (sv) { return el('option', { value: sv.id, text: sv.name || sv.id }); }));
      who.replaceChildren.apply(who, options);
      if (!all.some(function (sv) { return sv.id === finance.servantId; })) finance.servantId = '';
      who.value = finance.servantId;
      var list = finance.servantId ? all.filter(function (sv) { return sv.id === finance.servantId; }) : all;
      var t = finTotals(list);
      var m = r.money || {};
      var whose = finance.servantId ? (list[0].name || list[0].id) : (one() ? 'كل الخدام' : 'كل الخدام في كل الفعاليات');

      var methodTiles = FIN_METHODS.map(function (mm) { return stat(label(mm[0]), money(t.byMethod[mm[0]] || 0)); });
      var others = Object.keys(t.byMethod).filter(function (k) { return !FIN_METHODS.some(function (mm) { return mm[0] === k; }); });
      others.forEach(function (k) { methodTiles.push(stat(label(k), money(t.byMethod[k]))); });

      A.fill(body,
        el('section', { class: 'fin-section', 'aria-labelledby': 'fin-sum-h' },
          el('h3', { class: 'fin-h', id: 'fin-sum-h', text: 'الملخص: ' + whose }),
          el('div', { class: 'fin-stats fin-stats--main' },
            stat('الإجمالي المتأكد', money(t.net), 'gold', 'دفعات سجّلها أدمن'),
            stat('لسه مع الخدام', money(t.toHandOver), t.toHandOver > 0 ? 'warn' : '', 'في العهدة − اللي اتسلّم'),
            stat('اتسلّم للخدمة', money(t.handedOver)),
            stat('في عهدة الخدام', money(t.held), '', 'كاش + تحويلات على أرقامهم')),
          el('div', { class: 'fin-stats' }, methodTiles),

          return { made: made, access: got[0].access || {} };
        })).then(function (r) {
          A.toast('اتنزّل ' + r.made.filename + (r.access.pii ? '' : ' (الموبايلات متخبية)') + (r.access.money ? '' : ' (من غير فلوس)'));
        }).catch(function (error) { A.fail(error, box); });
      });
    });

    var card = A.card('التقرير المجمّع', 'كل الفعاليات أو اللي تختارها في ملف Excel واحد: ملخص عام، حسب الفعالية، حسب الخادم، الحجوزات، الدفعات، والأقساط المتأخرة.',
      box,
      el('fieldset', { class: 'grants__group' }, el('legend', { text: 'الفعاليات' }), toggle,
        // the list scrolls inside the card (a long season stays one screen tall)
        el('div', { class: 'report-events' }, picks.length ? picks.map(function (p) { return p.node; }) : el('p', { class: 'note', text: B.events ? 'مفيش فعاليات.' : 'بنجيب الفعاليات…' }))),
      el('div', { class: 'fin-filters' }, A.field('من يوم', from), A.field('لحد يوم', to), A.field('الحالة', status), A.field('الخادم', servant), A.field('طريقة الدفع', method)),
      el('div', { class: 'actions' }, go),
      el('p', { class: 'fin-hint', text: 'الفلوس بتظهر بس لو عندك صلاحية «يشوف · الفلوس»، والموبايلات بس لو عندك «يصدّر بأرقام التليفونات».' })
    );
    card.classList.add('card--report');
    return card;

  }

})();
</script>
