<script>
/*
 * «المسابقات» → «حسابات الشباب» (docs/PHASE5-PLAN.md P5-5, P5-6; docs/YOUTH-ACCOUNTS-PLAN.md §12):
 * the accounts on the Worker. The list, «حسابات جديدة» (what looks odd), the person sheet with its
 * corrections, viewing and resetting the password (separate), points and seasons, the age range and the
 * support contact. Existing components only (the redesign is Phase 8). The tab shows once accounts are on.
 * A password is only ever on screen: never in storage, lists, URLs or history, and it goes by itself after 60 s.
 */
(function () {

  'use strict';

  var A = window.A;
  var el = A.el;
  var icon = A.icon;
  var C = A.comp;
  var ar = C.ar;

  var Y = A.compYouth = { view: 'list', id: '', q: '', state: '', offset: 0 };

  var FLAGS = {
    same_name_dob: 'نفس الاسم وتاريخ الميلاد في حساب تاني', same_name: 'نفس الاسم في حساب تاني', near_edge: 'تاريخ الميلاد قريب من حد السن',
    many_from_one_source: 'حسابات كتير من نفس المصدر في ساعة', after_guest_same_source: 'اتعمل بعد حساب ضيف من نفس المصدر'
  };
  var EMAIL_CHECKS = [['in_person_readback', 'قريته على الشخص قدامي'], ['member_typed', 'الشخص كتبه بنفسه'], ['confirmed_by_whatsapp', 'أكده على واتساب']];
  var SUPPORT_CHECKS = [['in_person', 'أعرفه شخصيًا / قدامي'], ['details_match', 'الاسم والميلاد والمجموعة مطابقين'], ['support_call', 'كلمته على الرقم اللي في الحساب']];
  var AUDIT = {
    register: 'اتعمل بنفسه', 'register.admin': 'اتعمل من الأدمن', 'email.change': 'تغيير الإيميل', 'phone.change': 'تغيير الموبايل', 'dob.correct': 'تصحيح تاريخ الميلاد', eligibility: 'تغيير الأهلية',
    block: 'إيقاف', unblock: 'رجوع', 'password.reset': 'باسورد جديد', 'password.reset.self': 'باسورد جديد بكود', 'password.reset.support': 'باسورد جديد من الدعم', 'password.view': 'عرض الباسورد',
    'profile.edit': 'تعديل البيانات', 'session.revoke': 'خروج من كل الأجهزة', transfer: 'نقل نقاط',
    'avatar.set': 'حط صورة', 'avatar.delete': 'مسح صورته', 'avatar.remove': 'الأدمن مسح صورته'
  };
  var LEDGER = { earn: 'نقاط مسابقة', competition: 'نقاط مسابقة', correction: 'تصحيح نتيجة', manual: 'تعديل يدوي', transfer: 'نقل', spend: 'طلب من المتجر', refund: 'رجوع نقاط' };
  var STATUS = { pending: 'قيد المراجعة', confirmed: 'مؤكد', rejected: 'مرفوض', cancelled: 'ملغي', withdrawn: 'اتسحب' };
  var MAIL = { queued: 'مستني', sending: 'بيتبعت', sent: 'اتبعت', failed: 'هيتعاد', dead: 'فشل', deferred: 'مؤجل', expired: 'انتهى', superseded: 'اتلغى', suppressed: 'اتمنع' };

  function api(method, path, body) { return window.AdminWorker.call(method, '/v1/admin/' + path, body, { quiet: true }); }
  function when(ms) { return ms ? new Date(ms).toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', dateStyle: 'medium', timeStyle: 'short' }) : '—'; }
  function newKey() { return (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g, ''); }

  function eligibilityChip(p, mark) {
    var e = p.eligibility || {};
    if (p.status === 'blocked' || e.state === 'blocked') return A.chip('موقوف', 'danger');
    if (e.state === 'guest') return A.chip('ضيف' + (e.source === 'override' ? ' (يدوي)' : ''), 'warn');
    var chip = A.chip('مؤهل' + (e.source === 'override' ? ' (يدوي)' : '') + (e.soon ? ' · قرب يخرج' : ''), e.soon ? 'gold' : 'ok');
    if (mark) chip.insertBefore(icon('check'), chip.firstChild);
    return chip;
  }

  function fact(label, value) {
    if (value === null || value === undefined || value === '') return null;
    return el('div', { class: 'comp-fact' }, el('dt', { text: label }), el('dd', { dir: 'auto' }, value));
  }

  function select(options, value, label) {
    return el('select', { class: 'input', 'aria-label': label }, options.map(function (o) {
      return el('option', { value: o[0], selected: o[0] === value ? 'selected' : null, text: o[1] });
    }));
  }

  /*
   * One small form in the editor: fields + reason, sent once; the server's answer redraws the sheet.
   * fields: [{ key, label, input (.value), hint }]. reason: the mandatory reason field.
   */
  function formSheet(options) {
    var box = A.errorBox();
    var reason = options.reason === false ? null : A.textInput('', { multiline: true, rows: 2, max: 300, placeholder: options.reasonHint || 'السبب بيتسجل في تاريخ الحساب' });
    var save = el('button', { class: 'btn btn--' + (options.kind || 'primary'), type: 'button', 'data-act': 'youth-save', text: options.label || 'حفظ' });
    save.addEventListener('click', function () {
      var body = options.extra ? options.extra() : {};
      options.fields.forEach(function (f) { body[f.key] = f.get ? f.get() : f.input.value; });
      if (reason) body.reason = reason.value.trim();
      A.withBusy(save, api('POST', options.path, body)).then(function (reply) {
        A.dirty = false;
        return A.closeSheet().then(function () {
          if (options.done) options.done(reply);
          else A.toast('اتحفظ ✓');
          if (A.onTab('comps', 'youth')) A.render();
        });
      }).catch(function (error) { A.fail(error, box, { fields: false }); });
    });
    A.dirty = false;
    A.openSheet(options.title, [
      box,
      options.intro ? el('p', { class: 'note', text: options.intro }) : null,
      el('div', { class: 'form' },
        options.fields.map(function (f) { return f.node || A.field(f.label, f.input, f.hint || ''); }),
        reason ? A.field('السبب', reason, '') : null)
    ], A.sheetFooter(save));
  }

  /* the password, on screen only; viewing changes nothing, a reset already did */
  function showPassword(title, password, note) {
    var text = el('p', { class: 'youth-password ltr', 'data-youth-password': '', text: password });
    var copy = el('button', { class: 'btn btn--primary', type: 'button', text: 'نسخ' });
    copy.addEventListener('click', function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(password).then(function () { A.toast('اتنسخ ✓'); }).catch(function () { A.toast('مقدرناش ننسخ', 'error'); });
    });
    var timer = setTimeout(function () { text.textContent = ''; A.closeSheet(); }, 60000);
    var close = el('button', { class: 'btn btn--ghost', type: 'button', text: 'قفل', onclick: function () { clearTimeout(timer); text.textContent = ''; A.closeSheet(); } });
    A.dirty = false;
    A.openSheet(title, [el('p', { class: 'note', text: note }), text], [copy, close]);
  }

  /* =======================================================
     THE LIST
  ======================================================= */

  /*
   * Phase 8 A6 (§22.1 item 20): a member as a card — the photo (or the first letter in Ruqaa), the full
   * name, the full phone and email (never cut; LTR, a tap copies), the chips. The whole card opens the
   * account. Photos come over this admin's session, only when the card is on screen.
   */
  var cardPhotos = typeof IntersectionObserver === 'function' ? new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var img = entry.target;
      cardPhotos.unobserve(img);
      window.AdminWorker.blob('/v1/admin/participants/' + encodeURIComponent(img.dataset.pid) + '/avatar').then(function (blob) {
        if (!img.isConnected) return;
        img.src = URL.createObjectURL(blob);
        img.addEventListener('load', function () { img.closest('.ycard__face').classList.add('has-photo'); URL.revokeObjectURL(img.src); }, { once: true });
      }).catch(function () { /* the letter stays */ });
    });
  }, { rootMargin: '120px' }) : null;

  // Phase 8B (youth-list.png): a card with the state's dot on the face, the chips under the name, then the phone and
  // the email as copy pills (cut with «…» when long; the full text is in the title and is what gets copied)
  function copyLine(text, label, cls, iconName) {
    return el('button', { class: 'ycard__copy ' + cls, type: 'button', 'aria-label': 'انسخ ' + label + ': ' + text, title: text, onclick: function (event) {
      event.stopPropagation();
      navigator.clipboard.writeText(text).then(function () { A.toast('اتنسخ ' + label + ' ✓'); }).catch(function () { A.toast('مقدرناش ننسخ', 'error'); });
    } }, el('span', { class: 'ycard__ic', 'aria-hidden': 'true' }, icon(iconName)), el('bdi', { class: 'ltr', text: text }), el('span', { class: 'ycard__ic ycard__ic--copy', 'aria-hidden': 'true' }, icon('copy')));
  }

  function stateOf(p) {
    var e = p.eligibility || {};
    return p.status === 'blocked' || e.state === 'blocked' ? 'blocked' : e.state === 'guest' ? 'guest' : 'eligible';
  }
  var TONE = { eligible: 'ok', guest: 'warn', blocked: 'danger' };

  /* the person: always on the «حسابات الشباب» tab (a card in «حسابات جديدة» opens there too) */
  function openPerson(id) {
    Y.view = 'person';
    Y.id = id;
    A.go('comps', 'youth');
  }

  function personRow(p) {
    var state = stateOf(p);
    var face = el('span', { class: 'ycard__face', 'aria-hidden': 'true' },
      el('span', { class: 'ycard__letter', text: String(p.name || '؟').trim().charAt(0) }),
      el('i', { class: 'ycard__dot ycard__dot--' + TONE[state] }));
    if (p.avatar && window.AdminWorker && cardPhotos) {
      var img = el('img', { class: 'ycard__photo', alt: '', width: '64', height: '64', 'data-youth-card-photo': '', 'data-pid': p.id });
      face.insertBefore(img, face.lastChild);
      cardPhotos.observe(img);
    }
    return el('article', { class: 'ycard' + (state === 'blocked' ? ' is-blocked' : ''), 'data-state': state },
      el('button', { class: 'ycard__open', type: 'button', 'data-youth': p.id, 'aria-label': 'افتح حساب ' + p.name, onclick: function () { openPerson(p.id); } }),
      face,
      el('div', { class: 'ycard__main' },
        el('bdi', { class: 'ycard__name', text: p.name }),
        el('span', { class: 'ycard__chips' },
          eligibilityChip(p),
          p.emailVerified ? null : A.chip('الإيميل مش متأكد', 'danger'),
          p.balance ? A.chip(ar(p.balance) + ' نقطة' + (p.eligibility.state === 'guest' ? ' · متجمد' : ''), p.eligibility.state === 'guest' ? 'off' : 'info') : null,
          (p.flags || []).map(function (f) { return A.chip(FLAGS[f] || f, 'gold'); })),
        p.phone ? copyLine(p.phone, 'الموبايل', 'ycard__phone', 'phone') : null,
        p.email ? copyLine(p.email, 'الإيميل', 'ycard__email', 'mail') : null),
      el('span', { class: 'ycard__go', 'aria-hidden': 'true' }, icon('chevron')));
  }

  /* the card's head: icon, title and line, then its buttons (p8-card) */
  function cardHead(iconName, title, hint, acts) {
    return el('div', { class: 'p8-card__head' },
      el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon(iconName)),
      el('div', { class: 'p8-card__titles' },
        el('h2', { class: 'card__title', text: title }),
        hint ? el('p', { class: 'card__hint', text: hint }) : null),
      acts || null);
  }

  function kpi(iconName, label, value) {
    return el('div', { class: 'kpi' }, el('small', {}, el('span', { class: 'ico-sm', 'aria-hidden': 'true' }, icon(iconName)), label), el('b', { text: value }));
  }

  var KPIS = [['users', 'كل الحسابات', 'all'], ['check', 'مؤهل', 'eligible'], ['user', 'ضيف', 'guest'], ['lock', 'موقوف', 'blocked']];

  function listView() {
    var box = A.errorBox();
    var kpis = el('div', { class: 'y8-kpis', 'data-youth-kpis': '' });
    function drawKpis(counts) {
      // the Worker's own counts (every account); a dash until they come, never a made-up number
      A.fill(kpis, KPIS.map(function (k) { return kpi(k[0], k[1], counts && counts[k[2]] != null ? ar(counts[k[2]]) : '—'); }));
    }
    drawKpis(null);
    var rows = el('div', { class: 'comp-list ycards', 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));
    var more = el('div', { class: 'y8-more' });
    var search = el('input', { class: 'p8-search__input', type: 'search', placeholder: 'دوّر بالاسم أو الإيميل أو الموبايل…', 'aria-label': 'بحث', value: Y.q });
    var name = A.uid('ystate');
    var state = el('div', { class: 'seg p8-filter y8-state', role: 'radiogroup', 'aria-label': 'الأهلية' }, [['', 'الكل'], ['eligible', 'مؤهل'], ['guest', 'ضيف'], ['blocked', 'موقوف']].map(function (o) {
      return el('label', { class: 'seg__opt' },
        el('input', { type: 'radio', name: name, value: o[0], checked: Y.state === o[0], onchange: function () { Y.state = o[0]; Y.offset = 0; load(); } }),
        el('span', { text: o[1] }));
    }));
    var tools = el('div', { class: 'p8-card__acts y8-acts' });

    function load() {
      var q = 'q=' + encodeURIComponent(Y.q) + '&offset=' + Y.offset + (Y.state === 'blocked' ? '&status=blocked' : Y.state ? '&state=' + Y.state : '');
      api('GET', 'participants?' + q).then(function (d) {
        rows.setAttribute('aria-busy', 'false');
        drawKpis(d.counts);
        A.fill(rows, d.people.length ? d.people.map(personRow) : el('div', { class: 'p8-empty' }, el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('users')), el('b', { text: Y.q ? 'مفيش نتايج.' : 'لسه مفيش حسابات.' })));
        A.fill(more, d.total > Y.offset + d.limit ? el('button', { class: 'btn btn--ghost', type: 'button', text: 'اللي بعدهم', onclick: function () { Y.offset += d.limit; load(); } }) : null);
        A.fill(tools,
          d.can.manage ? el('button', { class: 'btn', type: 'button', 'data-act': 'youth-settings', onclick: settingsForm }, icon('gear'), 'الإعدادات') : null,
          d.can.export ? el('button', { class: 'btn btn--ghost', type: 'button', 'data-act': 'youth-export', onclick: exportBook }, icon('download'), 'تصدير Excel') : null,
          d.can.add ? el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'youth-add', onclick: addForm }, icon('plus'), 'حساب جديد') : null);
      }).catch(function (error) {
        rows.setAttribute('aria-busy', 'false');
        A.fill(rows);
        A.fail(error, box);
      });
    }

    var typing = null;
    search.addEventListener('input', function () {
      clearTimeout(typing);
      typing = setTimeout(function () { Y.q = search.value.trim(); Y.offset = 0; load(); }, 300);
    });
    load();
    return [kpis, el('section', { class: 'card p8-card y8-list' },
      cardHead('users', 'حسابات الشباب', 'اضغط على أي كارت تفتح الحساب. الموبايل والإيميل بيتنسخوا بلمسة.', tools),
      box,
      el('div', { class: 'p8-card__filters y8-filters' }, el('label', { class: 'p8-search y8-search' }, icon('filter'), search), state),
      rows, more)];
  }

  function reviewView() {
    var box = A.errorBox();
    var rows = el('div', { class: 'comp-list ycards', 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));
    api('GET', 'participants/review').then(function (d) {
      rows.setAttribute('aria-busy', 'false');
      A.fill(rows, d.people.length ? d.people.map(personRow) : el('div', { class: 'p8-empty' }, el('span', { class: 'chipico', 'aria-hidden': 'true' }, icon('users')), el('b', { text: 'مفيش حسابات جديدة.' })));
    }).catch(function (error) { rows.setAttribute('aria-busy', 'false'); A.fill(rows); A.fail(error, box); });
    return [el('section', { class: 'card p8-card y8-list' }, cardHead('users', 'حسابات جديدة', 'اللي سجلوا بنفسهم، الأحدث الأول. العلامات للمراجعة بس، مش بتمنع حد.'), box, rows)];
  }

  function backButton() {
    return el('button', { class: 'btn btn--ghost btn--small y8-back', type: 'button', 'data-act': 'youth-back', onclick: function () { Y.view = 'list'; A.render(); } }, icon('arrow'), 'رجوع للحسابات');
  }

  function addForm() {
    var name = A.textInput('', { max: 80 });
    var email = A.textInput('', { ltr: true, max: 200 });
    var confirm = A.textInput('', { ltr: true, max: 200 });
    confirm.addEventListener('paste', function (event) { event.preventDefault(); });
    var phone = A.textInput('', { ltr: true, max: 20 });
    var birth = el('input', { class: 'input', type: 'date', 'aria-label': 'تاريخ الميلاد' });
    var check = select([['', 'اختار…']].concat(EMAIL_CHECKS), '', 'اتأكدت إزاي');
    formSheet({
      title: 'حساب جديد', label: 'اعمل الحساب', reason: false, path: 'participants',
      intro: 'الحساب بيتفعل على طول من غير كود. اقرا الإيميل للشخص، وهيوصله إشعار بالإنشاء.',
      fields: [
        { key: 'name', label: 'الاسم الثلاثي أو الرباعي', input: name }, { key: 'email', label: 'الإيميل', input: email },
        { key: 'emailConfirm', label: 'الإيميل تاني (من غير لصق)', input: confirm }, { key: 'checkMethod', label: 'اتأكدت من الإيميل إزاي؟', input: check },
        { key: 'phone', label: 'رقم الموبايل', input: phone }, { key: 'birthDate', label: 'تاريخ الميلاد', input: birth }
      ],
      done: function (reply) {
        Y.view = 'person';
        Y.id = reply.id;
        showPassword('الباسورد بتاع الحساب الجديد', reply.password, 'سلّمه للشخص قدامك أو على واتساب خاص. عمره ما بيتبعت بالإيميل.');
      }
    });
  }

  function settingsForm() {
    api('GET', 'participants/settings').then(function (s) {
      var min = A.textInput(String(s.ageMin), { ltr: true, max: 3 });
      var max = A.textInput(String(s.ageMax), { ltr: true, max: 3 });
      var warn = A.textInput(String(s.warnDays), { ltr: true, max: 3 });
      var contacts = (A.state && A.state.contacts) || [];
      var shown = s.support || s.supportDefault || {};
      var pick = select([['', 'من غير اختيار']].concat(contacts.map(function (c) { return [c.id, c.name]; })), s.support && s.support.id || '', 'اختار من جهات التواصل');
      var supportName = A.textInput(shown.name || '', { max: 60 });
      var supportPhone = A.textInput(shown.phone || '', { ltr: true, max: 20 });
      pick.addEventListener('change', function () {
        var c = contacts.filter(function (x) { return x.id === pick.value; })[0];
        if (c) { supportName.value = c.name; supportPhone.value = c.phone; }
      });
      formSheet({
        title: 'إعدادات الحسابات', reason: false, path: 'participants/settings',
        intro: 'النطاق العمري بيتطبق على طول على كل الحسابات. الدعم الفني بيظهر في صفحة الدخول وفي الإيميلات.',
        fields: [{ key: 'ageMin', label: 'السن من', input: min }, { key: 'ageMax', label: 'لحد', input: max }, { key: 'warnDays', label: 'ينبّه قبل الخروج من النطاق بكام يوم', input: warn },
          { key: 'support', node: el('div', {}, [A.field('الدعم الفني: اختار من جهات التواصل', pick, ''), A.field('اسم مسؤول الدعم الفني', supportName, 'بيظهر جنب لينك الواتساب.'), A.field('رقم واتساب الدعم الفني', supportPhone, '')]), get: function () {
            return { id: pick.value || null, name: supportName.value.trim(), phone: supportPhone.value.trim() };
          } }]
      });
    }).catch(function (error) { A.fail(error); });
  }

  function exportBook(event) {
    var run = Promise.all([api('GET', 'participants/export'), C.sheets()]).then(function (got) {
      var head = ['رقم المشترك', 'الاسم', 'الإيميل', 'اتأكد الإيميل', 'الموبايل', 'تاريخ الميلاد', 'السن', 'الأهلية', 'مصدرها', 'متجمد', 'الحالة', 'المجموعة', 'الكنيسة', 'الخادم المسؤول', 'ملاحظات'];
      var rows = got[0].rows.map(function (p) {
        return [p.id, p.name, p.email, p.emailVerified ? 'أيوه' : 'لأ', p.phone, p.birthDate, p.age, p.eligibility === 'guest' ? 'ضيف' : p.eligibility === 'blocked' ? 'موقوف' : 'مؤهل', p.eligibilitySource === 'override' ? 'يدوي' : 'تلقائي', p.frozen, p.status === 'blocked' ? 'موقوف' : 'نشط', p.group, p.church, p.servant, p.notes];
      });
      var book = { sheets: [{ name: 'الحسابات', rows: [head].concat(rows), rtl: true, header: true, filter: true, textColumns: [4, 5] }] };
      return C.download(got[1].xlsx.writeXlsx(book), 'حسابات-الشباب.xlsx');
    });
    A.withBusy(event.currentTarget, run).catch(function (error) { A.fail(error); });
  }

  /* =======================================================
     THE PERSON SHEET (§12.1) — Phase 8B youth.png: the profile card on the side, then the password,
     the actions, points + devices, and the history tabs
  ======================================================= */

  function personView() {
    var box = A.errorBox();
    var main = el('div', { class: 'y8-acct', 'aria-busy': 'true' }, el('p', { class: 'skeleton skeleton--line' }));
    api('GET', 'participants/' + encodeURIComponent(Y.id)).then(function (d) {
      main.setAttribute('aria-busy', 'false');
      A.fill(main, personBody(d));
    }).catch(function (error) { main.setAttribute('aria-busy', 'false'); A.fill(main); A.fail(error, box); });
    return [el('div', { class: 'y8-backrow' }, backButton()), box, main];
  }

  function emailForm(p, can) {
    var email = A.textInput('', { ltr: true, max: 200 });
    var confirm = A.textInput('', { ltr: true, max: 200 });
    confirm.addEventListener('paste', function (event) { event.preventDefault(); });
    var check = select([['', 'اختار…']].concat(EMAIL_CHECKS), '', 'اتأكدت إزاي');

      }).catch(function (error) { orders.setAttribute('aria-busy', 'false'); A.fail(error, box); });
    }
    api('GET', 'store/items').then(function (d) {
      items.setAttribute('aria-busy', 'false');
      A.fill(items,
        el('div', { class: 'actions' }, el('button', { class: 'btn btn--primary', type: 'button', 'data-act': 'item-add', onclick: function () { itemForm(null, d.seasonMax); } }, icon('plus'), 'جايزة جديدة')),
        d.seasonMax ? el('p', { class: 'field__hint', 'data-season-max': '', text: 'أقصى نقاط في الموسم الحالي: ' + ar(d.seasonMax) + '. النسبة بتوضح الجايزة بتساوي كام منها.' }) : null,
        el('ul', { class: 'admins' }, d.items.map(function (i) {
          var thumb = el('span', { class: 'item__thumb', 'aria-hidden': 'true' });
          if (i.image) A.mediaPreview(i.image).then(function (src) { if (src) thumb.appendChild(el('img', { src: src, alt: '' })); }).catch(function () {});
          return el('li', { class: 'admin', 'data-item': i.id }, thumb,
            el('div', { class: 'admin__body' }, el('p', { class: 'admin__name', dir: 'auto', text: i.name + ' · ' + ar(i.cost) + ' نقطة' }),
              el('p', { class: 'admin__email', text: (i.available === null ? 'من غير حد' : 'متاح ' + ar(i.available)) + ' · اتطلب ' + ar(i.redeemed || 0) }), i.active ? null : A.chip('مقفولة', 'off'),
              i.pctOfMax !== null && i.pctOfMax !== undefined ? A.chip(ar(i.pctOfMax) + '٪ من أقصى الموسم', 'gold') : null),
            el('button', { class: 'btn btn--small', type: 'button', 'data-item-edit': i.id, onclick: function () { itemForm(i, d.seasonMax); } }, 'تعديل'));
        })));
    }).catch(function (error) { items.setAttribute('aria-busy', 'false'); A.fail(error, box); });
    api('GET', 'store/schedule').then(function (s) {
      var mode = select([['auto', 'بالمواعيد'], ['open', 'مفتوح'], ['preview', 'للفرجة بس'], ['closed', 'مقفول']], s.mode, 'حالة المتجر');
      var opens = el('input', { class: 'input', type: 'datetime-local', value: s.opensAt || '', 'aria-label': 'يفتح' });
      var closes = el('input', { class: 'input', type: 'datetime-local', value: s.closesAt || '', 'aria-label': 'يقفل' });
      var cancel = A.checkbox('المشترك يقدر يلغي طلبه', s.allowCancel);
      var notify = s.notify || {};
      var ticks = STORE_NOTIFY.map(function (n) {
        var c = A.checkbox(n.label, !!notify[n.key]);
        c.node.dataset.notify = n.key;
        return { key: n.key, check: c };
      });
      A.fill(schedule, el('div', { class: 'row' }, A.field('الحالة', mode), A.field('يفتح', opens), A.field('يقفل', closes)), cancel.node,
        el('div', { class: 'form-group comp-notify' }, el('p', { class: 'section-label', text: 'إشعارات المتجر' }), ticks.map(function (t) { return t.check.node; }),
          el('p', { class: 'field__hint', text: 'بتتبعت push لوحدها في ميعادها. وبتظهر في جرس الموقع كمان بعد أول «راجع وانشر».' })),
        el('button', { class: 'btn btn--small', type: 'button', 'data-act': 'store-schedule', onclick: function (event) {
          var input = { mode: mode.value, opensAt: opens.value, closesAt: closes.value, allowCancel: cancel.input.checked, notify: {} };
          ticks.forEach(function (t) { input.notify[t.key] = t.check.input.checked; });
          A.withBusy(event.currentTarget, api('POST', 'store/schedule', input)).then(function () { A.toast('اتحفظ ✓'); loadSends(); }).catch(function (error) { A.fail(error, box); });
        } }, 'احفظ المواعيد'));
    }).catch(function (error) { A.fail(error, box); });

    /* the scheduled automatic pushes (§18.5), newest moment last; a pending one can be cancelled */
    function loadSends() {
      return A.call('apiPushSchedule').then(function (reply) {
        var list = ((reply && reply.entries) || []).filter(function (e) { return /^(shop|season)-/.test(e.kind); })
          .sort(function (a, b) { return String(a.sendAt).localeCompare(String(b.sendAt)); });
        A.fill(sends,
          el('p', { class: 'section-label', text: 'الإرسال المتجدول (' + ar(list.length) + ')' }),
          list.length ? el('ul', { class: 'list' }, list.map(function (e) {
            var st = SEND_STATUS[e.status] || SEND_STATUS.pending;
            var stop = e.status === 'pending' ? el('button', { class: 'btn btn--small btn--ghost', type: 'button', 'data-act': 'send-cancel', onclick: function (ev) {
              var button = ev.currentTarget;
              A.confirm({ tone: 'warn', title: 'تلغي الإرسال ده؟', message: 'الـpush بس هو اللي بيتلغى. لو الإشعار ظهر في الجرس بعد نشر، بيفضل.', confirmLabel: 'الغيه', cancelLabel: 'لأ' }).then(function (ok) {
                if (!ok) return;
                A.withBusy(button, A.call('apiPushScheduleCancel', e.id)).then(function () { A.toast('اتلغى ✓'); loadSends(); }).catch(function (error) { A.fail(error, box); });
              });
            } }, icon('close'), 'إلغاء') : null;
            var row = A.listItem({
              icon: 'bell',
              title: SEND_KINDS[e.kind] || e.kind,
              sub: C.when(String(e.sendAt).replace('T', ' ').slice(0, 16)) + (e.title ? ' — «' + e.title + '»' : ''),
              off: e.status !== 'pending',
              chips: [A.chip(st.label, st.kind), e.result ? A.chip(e.result, 'off') : null].filter(Boolean),
              controls: [el('span', { class: 'spacer' }), stop]
            });
            row.dataset.send = e.id;
            row.dataset.status = e.status;
            return row;
          })) : el('p', { class: 'empty', text: 'مفيش إرسال متجدول.' }));
      }).catch(function (error) { A.fail(error, box); });
    }
    loadSends();
    loadOrders();
    return [A.card('المتجر', 'الجوايز والطلبات والمواعيد.', box, schedule, sends), A.card('الجوايز', '', items), A.card('الطلبات', 'كل طلب محتاج أدمن يوافق عليه. الإلغاء بيرجّع النقط مرة واحدة.', orders)];
  }

  function only(build) {
    return function () {
      if (!window.AdminWorker) return [A.card('من لوحة التحكم الرسمية بس', 'الحسابات بتتراجع من لوحة التحكم على الموقع.')];
      return build();
    };
  }
  A.views.youth = only(function () { return Y.view === 'person' && Y.id ? personView() : listView(); });
  A.views['youth-review'] = only(reviewView);
  A.views['youth-results'] = only(resultsView);
  A.views['youth-store'] = only(storeView);
  A.views['youth-seasons'] = only(seasonsView);
  // Phase 8B (youth-list.png): the area's own tabs; data-act keeps the old buttons' names
  var YOUTH_TABS = [
    { key: 'youth', label: 'حسابات الشباب' },
    { key: 'youth-review', label: 'حسابات جديدة', act: 'youth-review' },
    { key: 'youth-results', label: 'النتايج', act: 'youth-results' },
    { key: 'youth-store', label: 'المتجر', act: 'youth-store' },
    { key: 'youth-seasons', label: 'المواسم', act: 'youth-seasons' }
  ];

  /* the tab appears when accounts are on (GET /v1/account/config); nothing changes for the panel before that */
  var tries = 0;
  function lookForAccounts() {
    if (tries++ > 40 || C.youthOn) return;
    var W = window.AdminWorker;
    if (!W || !A.AREAS) { setTimeout(lookForAccounts, 1500); return; }
    W.call('GET', '/v1/account/config', undefined, { quiet: true }).then(function (config) {
      if (config.mode !== 'on') return;
      C.youthOn = true;
      var area = A.AREAS.filter(function (a) { return a.key === 'comps'; })[0];
      if (!area || area.subs.some(function (s) { return s.key === 'youth'; })) return;
      // the old points / store screens read Apps Script: with accounts on, these tabs hold them
      for (var i = area.subs.length - 1; i >= 0; i--) if (['points', 'shop'].indexOf(area.subs[i].key) !== -1) area.subs.splice(i, 1);
      Array.prototype.splice.apply(area.subs, [Math.max(0, area.subs.length - 1), 0].concat(YOUTH_TABS.map(function (t) {
        return { key: t.key, label: t.label, act: t.act, again: t.key === 'youth' ? function () { if (Y.view !== 'list') { Y.view = 'list'; A.render(); } } : null };
      })));
      A.renderNav();
    }).catch(function () { setTimeout(lookForAccounts, 3000); });
  }
  lookForAccounts();

})();
</script>
