<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    /admin/ — THE ADMIN PANEL, served by GitHub Pages. You stay on this URL.

    Generated by tools/build-admin.mjs from apps-script/Admin*.html. Do not edit by hand: change apps-script/ and run `cd tools && npm run build-admin`.

    The panel itself is the same code as the Apps Script admin
    (apps-script/Admin*.html → admin-app.js, admin.css). Sign-in is "Sign in
    with Google" (boot.js); every call goes to the Apps Script API (doPost)
    with the Google ID token, which the server verifies and checks against
    the allowlist. Nothing secret is in these files: the API URL and the
    OAuth client ID are public by design (config.js).

    Security policy: our own files, Google's sign-in script, frame and style,
    and the Apps Script API. No inline code or styles, no eval. The preview
    frame (srcdoc) inherits this policy and runs the site's own files.
    GitHub Pages can't send headers: frame-ancestors is enforced by boot.js
    (it leaves any frame and refuses to start inside one).
  -->

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#020914">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <title>لوحة التحكم · أسرة البابا أثناسيوس</title>

  <link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32">
  <link rel="preload" href="../assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="gate.css">

  <!-- not deferred: after a reload, the gate starts compact («جاري استعادة الجلسة...») -->
  <script src="restore.js"></script>
  <script src="config.js" defer></script>
  <script src="admin-app.js" defer></script>
  <script src="boot.js" defer></script>
  <script src="layout-check.js" defer></script>

</head>

<body class="is-gated">

  <!-- before the panel: sign in, not configured, not allowed (boot.js) -->
  <main class="gate" id="gate">

    <div class="gate__glow" aria-hidden="true"></div>

    <div class="gate__arch" aria-hidden="true">
      <span class="gate__cross"></span>
      <span class="gate__ring"></span>
      <img class="gate__logo" src="../assets/img/logo-256.webp" width="128" height="128" alt="">
    </div>

    <h1 class="gate__title">لوحة التحكم</h1>
    <p class="gate__sub">أسرة البابا أثناسيوس – سفاجا</p>

    <section class="gate__panel" id="gate-panel" aria-live="polite">
      <p class="gate__status" role="status">
        <span class="gate__line" aria-hidden="true"><i></i></span>
        <span class="gate__boot">بنجهز لوحة التحكم…</span>
        <span class="gate__verify gate__boot-restore">جاري استعادة الجلسة...</span>
      </p>
      <noscript><p class="gate__note">لوحة التحكم محتاجة JavaScript. شغّله في المتصفح وافتح الصفحة تاني.</p></noscript>
    </section>

    <p class="gate__fallback" id="gate-fallback" hidden>
      مشكلة في الدخول؟ <a id="fallback-link" href="#" rel="noreferrer">لوحة الطوارئ (Apps Script)</a>
    </p>

  </main>

  <!-- the panel (shown after sign-in) -->
  <div class="shell" id="shell" hidden>

    <div class="app">

      <!-- wide screens: the navigation rail -->
      <aside class="rail" aria-label="التنقل">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"><span class="brand__cross"></span></span>
          <div class="brand__text">
            <p class="brand__title">لوحة التحكم</p>
            <p class="brand__sub">أسرة البابا أثناسيوس – سفاجا</p>
          </div>
        </div>
        <nav class="rail__nav" id="rail-nav" aria-label="أقسام لوحة التحكم"></nav>
        <div class="rail__foot" id="rail-foot"></div>
      </aside>

      <div class="app__main">

        <header class="topbar">
          <span class="topbar__mark" aria-hidden="true"><span class="brand__cross"></span></span>
          <div class="topbar__title">
            <p class="topbar__crumb" id="crumb"></p>
            <h1 class="topbar__heading" id="page-title">لوحة التحكم</h1>
            <!-- help for the screen on now (AdminHelp; shown once it can load) -->
            <button class="icon-btn help-btn" id="help-open" type="button" aria-label="مساعدة: إزاي أستخدم الجزء ده" hidden>؟</button>
          </div>
          <span class="status" id="status" role="status" aria-live="polite"><span class="status__dot" aria-hidden="true"></span><span class="status__text">جاري التحميل…</span></span>
          <!-- uploads still going (A.uploads), whatever the screen; a tap opens «الصور» -->
          <button class="uploads-pill" id="uploads" type="button" hidden><span class="uploads-pill__text"></span></button>
          <button class="btn btn--primary btn--publish" id="publish-open" type="button">
            <span class="btn__label">راجع وانشر</span>
          </button>
        </header>

        <!-- the other admins online right now (the official admin page only) -->
        <div class="presence" id="presence" aria-live="polite" hidden></div>

        <nav class="tabs" id="subtabs" aria-label="الأقسام الفرعية" hidden></nav>

        <main class="view" id="view" aria-busy="true">
          <div class="skeleton-page" aria-hidden="true">
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card skeleton--tall"></div>
            <div class="skeleton skeleton--card"></div>
          </div>
          <p class="visually-hidden">جاري التحميل…</p>
        </main>

      </div>

      <!-- phones: the bottom dock -->
      <nav class="dock" id="dock" aria-label="أقسام لوحة التحكم"></nav>

    </div>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

    <!-- messages: a popover, so they show above any open editor -->
    <div class="toasts" id="toasts" popover="manual" aria-live="polite"></div>
  </div>

</body>

</html>
